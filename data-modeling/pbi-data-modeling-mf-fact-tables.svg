<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Components of a data model</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="197" lengthAdjust="spacing">Fact tables</text>
  <rect x="265" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A fact table stores the events of a business process and the numbers you want to aggregate.</text>
  <rect x="60" y="170" width="460" height="380" fill="#FFFFFF"/>
  <text x="80" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">In the model</text>
  <text x="80" y="220" font-size="13" fill="#70706F" text-anchor="start">Sales in the middle, dimensions around it</text>
  <line x1="290" y1="270" x2="290" y2="380" stroke="#70706F" stroke-width="2"/>
  <line x1="440" y1="380" x2="290" y2="380" stroke="#70706F" stroke-width="2"/>
  <line x1="290" y1="490" x2="290" y2="380" stroke="#70706F" stroke-width="2"/>
  <line x1="140" y1="380" x2="290" y2="380" stroke="#70706F" stroke-width="2"/>
  <rect x="235" y="250" width="110" height="40" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="290" y="276" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">Date</text>
  <rect x="385" y="360" width="110" height="40" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="440" y="386" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">Product</text>
  <rect x="235" y="470" width="110" height="40" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="290" y="496" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">Customer</text>
  <rect x="85" y="360" width="110" height="40" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="140" y="386" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">Campaign</text>
  <rect x="230" y="355" width="120" height="50" fill="#FDE9DC" stroke="#F39454" stroke-width="2" filter="url(#card)"/>
  <text x="290" y="386" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">Sales</text>
  <text x="580" y="196" font-size="13" fill="#141421" font-weight="700" text-anchor="start">Fact · transactional table</text>
  <rect x="580" y="210" width="560" height="206" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="580" y="210" width="560" height="36" fill="#141421"/>
  <text x="594" y="234" font-size="15" fill="#F6F6F6" font-weight="700" text-anchor="start">Sales</text>
  <rect x="900" y="246" width="118" height="170" fill="#FDE9DC"/>
  <rect x="1016" y="246" width="118" height="170" fill="#FDE9DC"/>
  <text x="594" y="268" font-size="12" fill="#70706F" font-weight="700" text-anchor="start">Date</text>
  <text x="700" y="268" font-size="12" fill="#70706F" font-weight="700" text-anchor="start">Product Key</text>
  <text x="810" y="268" font-size="12" fill="#70706F" font-weight="700" text-anchor="start">Customer Key</text>
  <text x="1010" y="268" font-size="12" fill="#70706F" font-weight="700" text-anchor="end">Units</text>
  <text x="1126" y="268" font-size="12" fill="#70706F" font-weight="700" text-anchor="end">Sales Amount</text>
  <line x1="580" y1="280" x2="1140" y2="280" stroke="#D7D8D8"/>
  <text x="594" y="302" font-size="14" fill="#141421" text-anchor="start">1/1/2026</text>
  <text x="700" y="302" font-size="14" fill="#141421" text-anchor="start">12</text>
  <text x="810" y="302" font-size="14" fill="#141421" text-anchor="start">105</text>
  <text x="1010" y="302" font-size="14" fill="#141421" text-anchor="end">2</text>
  <text x="1126" y="302" font-size="14" fill="#141421" text-anchor="end">2,400</text>
  <line x1="580" y1="314" x2="1140" y2="314" stroke="#D7D8D8"/>
  <text x="594" y="336" font-size="14" fill="#141421" text-anchor="start">1/1/2026</text>
  <text x="700" y="336" font-size="14" fill="#141421" text-anchor="start">7</text>
  <text x="810" y="336" font-size="14" fill="#141421" text-anchor="start">231</text>
  <text x="1010" y="336" font-size="14" fill="#141421" text-anchor="end">1</text>
  <text x="1126" y="336" font-size="14" fill="#141421" text-anchor="end">45</text>
  <line x1="580" y1="348" x2="1140" y2="348" stroke="#D7D8D8"/>
  <text x="594" y="370" font-size="14" fill="#141421" text-anchor="start">2/1/2026</text>
  <text x="700" y="370" font-size="14" fill="#141421" text-anchor="start">12</text>
  <text x="810" y="370" font-size="14" fill="#141421" text-anchor="start">87</text>
  <text x="1010" y="370" font-size="14" fill="#141421" text-anchor="end">1</text>
  <text x="1126" y="370" font-size="14" fill="#141421" text-anchor="end">1,200</text>
  <line x1="580" y1="382" x2="1140" y2="382" stroke="#D7D8D8"/>
  <text x="594" y="404" font-size="14" fill="#141421" text-anchor="start">3/1/2026</text>
  <text x="700" y="404" font-size="14" fill="#141421" text-anchor="start">3</text>
  <text x="810" y="404" font-size="14" fill="#141421" text-anchor="start">105</text>
  <text x="1010" y="404" font-size="14" fill="#141421" text-anchor="end">4</text>
  <text x="1126" y="404" font-size="14" fill="#141421" text-anchor="end">180</text>
  <line x1="580" y1="416" x2="1140" y2="416" stroke="#D7D8D8"/>
  <path d="M586 424 L586 432 L800 432 L800 424" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="693.0" y="452" font-size="13" fill="#141421" font-weight="700" text-anchor="middle">foreign keys → dimensions</text>
  <path d="M860 424 L860 432 L1134 432 L1134 424" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="997.0" y="452" font-size="13" fill="#141421" font-weight="700" text-anchor="middle">numeric values → measures</text>
  <rect x="60" y="580" width="340" height="76" fill="#FFFFFF"/>
  <rect x="60" y="580" width="4" height="76" fill="#F39454"/>
  <circle cx="94" cy="618.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M89 618.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="120" y="612.0" font-size="17" font-weight="700" fill="#141421">Events of a process</text>
  <text x="120" y="636.0" font-size="13" fill="#70706F">One row per order line, per day, ...</text>
  <rect x="430" y="580" width="340" height="76" fill="#FFFFFF"/>
  <rect x="430" y="580" width="4" height="76" fill="#F39454"/>
  <circle cx="464" cy="618.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M459 618.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="490" y="612.0" font-size="17" font-weight="700" fill="#141421">Long and narrow</text>
  <text x="490" y="636.0" font-size="13" fill="#70706F">Many rows, few columns.</text>
  <rect x="800" y="580" width="340" height="76" fill="#FFFFFF"/>
  <rect x="800" y="580" width="4" height="76" fill="#F39454"/>
  <circle cx="834" cy="618.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M829 618.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="860" y="612.0" font-size="17" font-weight="700" fill="#141421">Sliceable</text>
  <text x="860" y="636.0" font-size="13" fill="#70706F">By month, by customer, by product.</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="706" x2="1140" y2="706" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="742" font-size="20" fill="#141421">Facts answer <tspan font-weight="700">what are you measuring?</tspan></text>
  <text x="1140" y="741" font-size="14" fill="#70706F" text-anchor="end">Facts are on the <tspan font-family="Arial, sans-serif">*</tspan>-side of relationships</text>
</svg>
