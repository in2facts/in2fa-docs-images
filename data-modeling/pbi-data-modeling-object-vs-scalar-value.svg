<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <!-- Apartment building: 3 x 4 windows + door -->
    <g id="building">
      <rect x="0" y="0" width="120" height="200" fill="#141421"/>
      <g fill="#70706F">
        <rect x="12" y="16" width="22" height="22"/><rect x="49" y="16" width="22" height="22"/><rect x="86" y="16" width="22" height="22"/>
        <rect x="12" y="52" width="22" height="22"/><rect x="49" y="52" width="22" height="22"/><rect x="86" y="52" width="22" height="22"/>
        <rect x="12" y="88" width="22" height="22"/><rect x="49" y="88" width="22" height="22"/><rect x="86" y="88" width="22" height="22"/>
        <rect x="12" y="124" width="22" height="22"/><rect x="49" y="124" width="22" height="22"/><rect x="86" y="124" width="22" height="22"/>
      </g>
      <rect x="47" y="164" width="26" height="36" fill="#D7D8D8"/>
    </g>
    <!-- Sales table body (rows only) -->
    <g id="table-header">
      <rect x="0" y="0" width="320" height="36" fill="#141421"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#F6F6F6">Order</text>
      <text x="110" y="23" font-size="14" font-weight="700" fill="#F6F6F6">Product</text>
      <text x="304" y="23" font-size="14" font-weight="700" fill="#F6F6F6" text-anchor="end">Order Quantity</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Object vs scalar value</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="372" lengthAdjust="spacing">Object vs scalar value</text>
  <rect x="440" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The same DAX expression returns a different result depending on the context it is evaluated in.</text>

  <line x1="600" y1="170" x2="600" y2="590" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== LEFT: object ==================== -->
  <text x="60" y="190" font-size="20" font-weight="700" fill="#141421">Outside the building <tspan font-size="14" font-weight="400" fill="#70706F">no row context</tspan></text>

  <use href="#building" x="80" y="216"/>
  <rect x="70" y="206" width="140" height="220" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="448" font-size="13" fill="#70706F" text-anchor="middle">You see the whole building</text>

  <use href="#table-header" x="230" y="210"/>
  <rect x="230" y="246" width="320" height="170" fill="#FFFFFF"/>
  <rect x="426" y="246" width="124" height="170" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="230" y1="280" x2="550" y2="280"/><line x1="230" y1="314" x2="550" y2="314"/>
    <line x1="230" y1="348" x2="550" y2="348"/><line x1="230" y1="382" x2="550" y2="382"/>
  </g>
  <g font-size="15" fill="#141421">
    <text x="246" y="268">SO-1001</text><text x="340" y="268">Bike</text><text x="534" y="268" text-anchor="end" font-weight="700">3</text>
    <text x="246" y="302">SO-1002</text><text x="340" y="302">Helmet</text><text x="534" y="302" text-anchor="end" font-weight="700">1</text>
    <text x="246" y="336">SO-1003</text><text x="340" y="336">Gloves</text><text x="534" y="336" text-anchor="end" font-weight="700">5</text>
    <text x="246" y="370">SO-1004</text><text x="340" y="370">Lights</text><text x="534" y="370" text-anchor="end" font-weight="700">2</text>
    <text x="246" y="404">SO-1005</text><text x="340" y="404">Bottle</text><text x="534" y="404" text-anchor="end" font-weight="700">4</text>
  </g>
  <rect x="426" y="210" width="124" height="206" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="550" y="448" font-size="13" fill="#70706F" text-anchor="end">The entire column</text>

  <rect x="60" y="470" width="490" height="44" fill="#141421"/>
  <text x="80" y="498" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#F6F6F6">'Sales'[Order Quantity]</text>

  <use href="#brand-arrow" x="60" y="532"/>
  <text x="86" y="548" font-size="17" font-weight="700" fill="#141421">Returns a column object</text>
  <text x="60" y="574" font-size="14" fill="#141421">{ 3, 1, 5, 2, 4 }: in a measure this needs an aggregation,</text>
  <text x="60" y="594" font-size="14" fill="#141421">e.g. SUM ( 'Sales'[Order Quantity] ) = 15</text>

  <!-- ==================== RIGHT: scalar ==================== -->
  <text x="650" y="190" font-size="20" font-weight="700" fill="#141421">Inside one apartment <tspan font-size="14" font-weight="400" fill="#70706F">row context</tspan></text>

  <use href="#building" x="650" y="216"/>
  <rect x="736" y="304" width="22" height="22" fill="#F39454"/>
  <text x="710" y="448" font-size="13" fill="#70706F" text-anchor="middle">Door closed: one room only</text>

  <path d="M762 315 C780 315, 780 331, 800 331" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4"/>

  <use href="#table-header" x="800" y="210"/>
  <rect x="800" y="246" width="320" height="170" fill="#FFFFFF"/>
  <rect x="800" y="314" width="320" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="800" y1="280" x2="1120" y2="280"/><line x1="800" y1="382" x2="1120" y2="382"/>
  </g>
  <g font-size="15" fill="#141421" fill-opacity="0.3">
    <text x="816" y="268">SO-1001</text><text x="910" y="268">Bike</text><text x="1104" y="268" text-anchor="end">3</text>
    <text x="816" y="302">SO-1002</text><text x="910" y="302">Helmet</text><text x="1104" y="302" text-anchor="end">1</text>
    <text x="816" y="370">SO-1004</text><text x="910" y="370">Lights</text><text x="1104" y="370" text-anchor="end">2</text>
    <text x="816" y="404">SO-1005</text><text x="910" y="404">Bottle</text><text x="1104" y="404" text-anchor="end">4</text>
  </g>
  <g font-size="15" fill="#141421">
    <text x="816" y="336">SO-1003</text><text x="910" y="336">Gloves</text>
  </g>
  <rect x="996" y="314" width="124" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="1104" y="337" font-size="17" font-weight="700" fill="#141421" text-anchor="end">5</text>
  <text x="1120" y="448" font-size="13" fill="#70706F" text-anchor="end">One cell of the current row</text>

  <rect x="650" y="470" width="470" height="44" fill="#141421"/>
  <text x="670" y="498" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#F6F6F6">'Sales'[Order Quantity]</text>

  <use href="#brand-arrow" x="650" y="532"/>
  <text x="676" y="548" font-size="17" font-weight="700" fill="#141421">Returns a scalar value</text>
  <text x="650" y="574" font-size="14" fill="#141421">5: the value of the current row only, no aggregation</text>
  <text x="650" y="594" font-size="14" fill="#141421">needed (calculated column or iterator such as SUMX).</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">Same expression. Different context. <tspan font-weight="700">Different result.</tspan></text>
</svg>
