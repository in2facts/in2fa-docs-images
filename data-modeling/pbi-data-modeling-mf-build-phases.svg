<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 718" width="1200" height="718" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="718" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Building a model</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="223" lengthAdjust="spacing">Build phases</text>
  <rect x="291" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Four phases. Knowing when each part is evaluated explains columns versus measures.</text>
  <circle cx="72" cy="190" r="12" fill="#F39454"/><text x="72" y="195" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="92" y="196" font-size="13" fill="#70706F" text-anchor="start">you</text>
  <rect x="60" y="214" width="252" height="208" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="60" y="214" width="252" height="36" fill="#141421"/>
  <text x="74" y="238" font-size="15" font-weight="700" fill="#F6F6F6">Get Data</text>
  <text x="74" y="276" font-size="14" fill="#70706F">Power Query (M)</text>
  <text x="74" y="300" font-size="14" fill="#141421">Connect to sources</text>
  <text x="74" y="324" font-size="14" fill="#141421">Define transformations</text>
  <line x1="74" y1="331" x2="298" y2="331" stroke="#D7D8D8" stroke-width="1"/>
  <circle cx="80.5" cy="348.5" r="5.7" fill="none" stroke="#141421" stroke-width="1.3"/><circle cx="80.5" cy="345.9" r="1" fill="#F39454"/><line x1="80.5" y1="347.9" x2="80.5" y2="351.6" stroke="#F39454" stroke-width="1.6" stroke-linecap="round"/><text x="94.0" y="354" font-size="13" fill="#70706F">Nothing stored in the model</text>
  <line x1="315" y1="232" x2="333" y2="232" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="348" cy="190" r="12" fill="#F39454"/><text x="348" y="195" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="368" y="196" font-size="13" fill="#70706F" text-anchor="start">automatic</text>
  <rect x="336" y="214" width="252" height="208" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="336" y="214" width="252" height="36" fill="#141421"/>
  <text x="350" y="238" font-size="15" font-weight="700" fill="#F6F6F6">Model Creation</text>
  <text x="350" y="276" font-size="14" fill="#70706F">Engine</text>
  <polygon points="358.4,287.6 352.2,294.8 356.4,294.8 355.3,300.4 361.8,292.9 357.6,292.9 359.0,287.6" fill="#F39454" stroke="#F39454" stroke-width="0.8" stroke-linejoin="round"/><text x="371.0" y="300" font-size="14" fill="#141421">Load and compress data</text>
  <rect x="350.5" y="311.5" width="13.0" height="13.0" rx="2.5" fill="#F39454"/><path d="M353.5 318.3 L356.0 320.8 L360.6 315.5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="371.0" y="324" font-size="14" fill="#141421">Detect relationships</text>
  <line x1="350" y1="331" x2="574" y2="331" stroke="#D7D8D8" stroke-width="1"/>
  <polygon points="357.8,342.5 352.1,349.3 356.0,349.3 354.9,354.5 360.9,347.5 357.0,347.5 358.3,342.5" fill="#F39454" stroke="#F39454" stroke-width="0.8" stroke-linejoin="round"/><text x="370.0" y="354" font-size="13" fill="#70706F">automatic ·</text><rect x="439.8" y="342.5" width="12.0" height="12.0" rx="2.5" fill="#F39454"/><path d="M442.6 348.8 L444.9 351.1 L449.2 346.2" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="459.3" y="354" font-size="13" fill="#70706F">optional</text>
  <line x1="591" y1="232" x2="609" y2="232" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="624" cy="190" r="12" fill="#F39454"/><text x="624" y="195" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="644" y="196" font-size="13" fill="#70706F" text-anchor="start">you</text>
  <rect x="612" y="214" width="252" height="208" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="612" y="214" width="252" height="36" fill="#141421"/>
  <text x="626" y="238" font-size="15" font-weight="700" fill="#F6F6F6">Model Enhancement</text>
  <text x="626" y="276" font-size="14" fill="#70706F">Semantic model (DAX)</text>
  <path d="M632.2 291.1 H629.5 A2.9 2.9 0 0 0 629.5 296.9 H632.2" fill="none" stroke="#141421" stroke-width="1.4" stroke-linecap="round"/><path d="M633.8 291.1 H636.5 A2.9 2.9 0 0 1 636.5 296.9 H633.8" fill="none" stroke="#141421" stroke-width="1.4" stroke-linecap="round"/><line x1="630.5" y1="294.0" x2="635.5" y2="294.0" stroke="#F39454" stroke-width="1.6" stroke-linecap="round"/><text x="647.0" y="300" font-size="14" fill="#141421">Relationships</text>
  <rect x="630.7" y="312.0" width="4.7" height="12.0" fill="#F39454"/><rect x="626.7" y="311.7" width="12.6" height="12.6" rx="2" fill="none" stroke="#141421" stroke-width="1.3"/><line x1="630.7" y1="312.0" x2="630.7" y2="324.0" stroke="#141421" stroke-width="1"/><line x1="635.3" y1="312.0" x2="635.3" y2="324.0" stroke="#141421" stroke-width="1"/><text x="647.0" y="324" font-size="14" fill="#141421">Calculated columns / tables</text>
  <rect x="627.4" y="335.6" width="11.2" height="12.8" rx="2" fill="none" stroke="#141421" stroke-width="1.3"/><rect x="629.4" y="337.2" width="7.2" height="2.4" rx="0.6" fill="#141421"/><rect x="629.4" y="341.2" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="632.1" y="341.2" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="634.8" y="341.2" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="629.4" y="343.5" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="632.1" y="343.5" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="634.8" y="343.5" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="629.4" y="345.9" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="632.1" y="345.9" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><rect x="634.8" y="345.9" width="1.9" height="1.9" rx="0.4" fill="#F39454"/><text x="647.0" y="348" font-size="14" fill="#141421">Measures</text>
  <line x1="626" y1="355" x2="850" y2="355" stroke="#D7D8D8" stroke-width="1"/>
  <rect x="630.3" y="367.0" width="4.3" height="11.0" fill="#F39454"/><rect x="626.7" y="366.7" width="11.6" height="11.6" rx="2" fill="none" stroke="#141421" stroke-width="1.3"/><line x1="630.3" y1="367.0" x2="630.3" y2="378.0" stroke="#141421" stroke-width="1"/><line x1="634.7" y1="367.0" x2="634.7" y2="378.0" stroke="#141421" stroke-width="1"/><text x="646.0" y="378" font-size="13" fill="#70706F">stored, sub-optimally compressed</text>
  <rect x="627.3" y="390.6" width="10.4" height="11.8" rx="2" fill="none" stroke="#141421" stroke-width="1.3"/><rect x="629.2" y="392.1" width="6.7" height="2.2" rx="0.6" fill="#141421"/><rect x="629.2" y="395.7" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="631.7" y="395.7" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="634.2" y="395.7" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="629.2" y="397.9" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="631.7" y="397.9" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="634.2" y="397.9" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="629.2" y="400.1" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="631.7" y="400.1" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><rect x="634.2" y="400.1" width="1.8" height="1.8" rx="0.4" fill="#F39454"/><text x="646.0" y="402" font-size="13" fill="#70706F">stored, not calculated yet</text>
  <line x1="867" y1="232" x2="885" y2="232" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="900" cy="190" r="12" fill="#F39454"/><text x="900" y="195" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="920" y="196" font-size="13" fill="#70706F" text-anchor="start">at query time</text>
  <rect x="888" y="214" width="252" height="208" fill="#FFFFFF" stroke="#F39454" stroke-width="2" filter="url(#card)"/>
  <rect x="888" y="214" width="252" height="36" fill="#141421"/>
  <text x="902" y="238" font-size="15" font-weight="700" fill="#F6F6F6">Visual Building</text>
  <text x="902" y="276" font-size="14" fill="#70706F">Report</text>
  <text x="902" y="300" font-size="14" fill="#141421">Build visuals</text>
  <text x="902" y="324" font-size="14" fill="#141421">Evaluate measures</text>
  <rect x="60" y="458" width="1080" height="36" fill="#141421"/>
  <text x="76" y="482" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="start">Object</text>
  <text x="436" y="482" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="start">Evaluated</text>
  <text x="796" y="482" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="start">Stored in the model</text>
  <rect x="60" y="494" width="1080" height="38" fill="#FFFFFF"/>
  <line x1="60" y1="532" x2="1140" y2="532" stroke="#D7D8D8"/>
  <text x="76" y="519" font-size="14" fill="#141421" font-weight="700" text-anchor="start">Power Query column</text>
  <text x="436" y="519" font-size="14" fill="#141421" text-anchor="start">during refresh, before load</text>
  <text x="796" y="519" font-size="14" fill="#141421" text-anchor="start">yes, compressed</text>
  <rect x="60" y="532" width="1080" height="38" fill="#FFFFFF"/>
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#D7D8D8"/>
  <text x="76" y="557" font-size="14" fill="#141421" font-weight="700" text-anchor="start">Calculated column / table</text>
  <text x="436" y="557" font-size="14" fill="#141421" text-anchor="start">during refresh, after load</text>
  <text x="796" y="557" font-size="14" fill="#141421" text-anchor="start">yes, sub-optimally compressed</text>
  <rect x="60" y="570" width="1080" height="38" fill="#FDE9DC"/>
  <line x1="60" y1="608" x2="1140" y2="608" stroke="#D7D8D8"/>
  <text x="76" y="595" font-size="14" fill="#141421" font-weight="700" text-anchor="start">Measure</text>
  <text x="436" y="595" font-size="14" fill="#141421" text-anchor="start">at query time, when a visual renders</text>
  <text x="796" y="595" font-size="14" fill="#141421" text-anchor="start">formula stored, not calculated</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="644" x2="1140" y2="644" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="680" font-size="20" fill="#141421">Calculated columns are stored at refresh; <tspan font-weight="700">measures run at query time.</tspan></text>
  <text x="1140" y="679" font-size="14" fill="#70706F" text-anchor="end"></text>
</svg>
