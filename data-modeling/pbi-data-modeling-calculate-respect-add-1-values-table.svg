  <rect x="570" y="360" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#141421" stroke-width="2"/>
  <text x="630" y="387" font-size="18" font-weight="700" fill="#141421" text-anchor="middle">TABLE</text>
  <rect x="760" y="170" width="380" height="406" fill="#FFFFFF" stroke="#D7D8D8"/>
  <use href="#brand-arrow" x="780" y="190"/>
  <text x="806" y="206" font-size="17" font-weight="700" fill="#141421">A single column</text>
  <g font-size="14" fill="#141421">
    <text x="780" y="236"><tspan fill="#F39454">✓</tspan>  a single-column table of <tspan font-weight="700">unique</tspan> values</text>
    <text x="780" y="260"><tspan fill="#F39454">✓</tspan>  <tspan font-weight="700">respects</tspan> the filter on that column</text>
    <text x="780" y="284"><tspan fill="#F39454">✓</tspan>  adds a <tspan font-weight="700">blank row</tspan> for orphan records</text>
    <text x="800" y="302" font-size="12" fill="#70706F">violation of referential integrity</text>
  </g>
  <line x1="780" y1="330" x2="1120" y2="330" stroke="#D7D8D8"/>
  <use href="#brand-arrow" x="780" y="346"/>
  <text x="806" y="362" font-size="17" font-weight="700" fill="#141421">A table</text>
  <g font-size="14" fill="#141421">
    <text x="780" y="392"><tspan fill="#F39454">✓</tspan>  the same columns, <tspan font-weight="700">duplicate rows</tspan> kept</text>
    <text x="780" y="416"><tspan fill="#F39454">✓</tspan>  filters are <tspan font-weight="700">respected</tspan></text>
    <text x="780" y="440"><tspan fill="#F39454">✓</tspan>  adds a <tspan font-weight="700">blank row</tspan> for orphan records</text>
  </g>
  <text x="780" y="490" font-size="13" fill="#70706F">Compare: ALL ignores the filter,</text>
  <text x="780" y="508" font-size="13" fill="#70706F">VALUES keeps it.</text>
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">VALUES <tspan font-weight="700">respects</tspan> the filter and returns a <tspan font-weight="700">table</tspan>.</text>
