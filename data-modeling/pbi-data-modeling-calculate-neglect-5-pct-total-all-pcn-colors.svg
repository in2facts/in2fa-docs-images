<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
  </defs>
  <rect width="1200" height="680" fill="#F6F6F6"/>
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Calculate – NEGLECT</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling · 5/5</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421">Neglect: % of Total (all colors)</text>
  <rect x="564" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Divide the revenue by the total of all product categories and all colors.</text>
  <rect x="60" y="170" width="580" height="300" fill="#FFFFFF" stroke="#D7D8D8"/>
  <rect x="60" y="170" width="580" height="44" fill="#C9DCE7"/>
  <text x="76" y="190" font-size="16" font-weight="700" fill="#141421">Neglect</text>
  <text x="76" y="207" font-size="12" fill="#70706F">Manipulation 1</text>
  <line x1="60" y1="258" x2="640" y2="258" stroke="#141421"/>
  <g font-size="14" font-weight="700" fill="#141421">
    <text x="76" y="242">Product Category</text>
    <text x="436" y="242" text-anchor="end">Revenue</text>
    <text x="624" y="234" text-anchor="end">as % of Total</text>
    <text x="624" y="251" text-anchor="end" font-weight="400" font-size="13">(all PCN - Colors)</text>
  </g>
  <text x="76" y="278" font-size="15" fill="#141421">Accessories</text>
  <text x="436" y="278" font-size="15" fill="#141421" text-anchor="end">31,176</text>
  <text x="624" y="278" font-size="15" fill="#141421" text-anchor="end" font-weight="700">0.3%</text>
  <line x1="60" y1="288" x2="640" y2="288" stroke="#D7D8D8"/>
  <text x="76" y="308" font-size="15" fill="#141421">Bikes</text>
  <text x="436" y="308" font-size="15" fill="#141421" text-anchor="end">3,775,240</text>
  <text x="624" y="308" font-size="15" fill="#141421" text-anchor="end" font-weight="700">38.6%</text>
  <line x1="60" y1="318" x2="640" y2="318" stroke="#D7D8D8"/>
  <text x="76" y="338" font-size="15" fill="#141421">Clothing</text>
  <text x="436" y="338" font-size="15" fill="#141421" text-anchor="end">44,674</text>
  <text x="624" y="338" font-size="15" fill="#141421" text-anchor="end" font-weight="700">0.5%</text>
  <line x1="60" y1="348" x2="640" y2="348" stroke="#141421"/>
  <text x="76" y="368" font-size="15" fill="#141421" font-weight="700">Total</text>
  <text x="436" y="368" font-size="15" fill="#141421" text-anchor="end" font-weight="700">3,851,091</text>
  <text x="624" y="368" font-size="15" fill="#141421" text-anchor="end" font-weight="700">39.3%</text>
  <line x1="452" y1="214" x2="452" y2="378" stroke="#D7D8D8"/>
  <line x1="280" y1="258" x2="280" y2="378" stroke="#D7D8D8"/>
  <rect x="452" y="214" width="188" height="164" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <rect x="670" y="170" width="190" height="300" fill="#FFFFFF" stroke="#D7D8D8"/>
  <rect x="670" y="170" width="190" height="44" fill="#F39454" fill-opacity="0.3"/>
  <text x="686" y="192" font-size="16" font-weight="700" fill="#141421">Order Date</text>
  <text x="686" y="208" font-size="12" fill="#70706F">Year</text>
  <rect x="686" y="230" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="708" y="241" font-size="14" fill="#141421">2005</text>
  <rect x="686" y="254" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="708" y="265" font-size="14" fill="#141421">2006</text>
  <rect x="686" y="278" width="12" height="12" fill="#141421" stroke="#70706F"/>
  <text x="708" y="289" font-size="14" fill="#141421" font-weight="700">2007</text>
  <rect x="686" y="302" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="708" y="313" font-size="14" fill="#141421">2008</text>
  <rect x="686" y="326" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="708" y="337" font-size="14" fill="#141421">2009</text>
  <rect x="686" y="350" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="708" y="361" font-size="14" fill="#141421">2010</text>
  <rect x="890" y="170" width="250" height="300" fill="#FFFFFF" stroke="#D7D8D8"/>
  <rect x="890" y="170" width="250" height="44" fill="#C9DCE7"/>
  <text x="906" y="192" font-size="16" font-weight="700" fill="#141421">Products</text>
  <text x="906" y="208" font-size="12" fill="#70706F">Color</text>
  <rect x="906" y="230" width="12" height="12" fill="#141421" stroke="#70706F"/>
  <text x="928" y="241" font-size="14" fill="#141421" font-weight="700">Black</text>
  <rect x="906" y="252" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="263" font-size="14" fill="#141421">Blue</text>
  <rect x="906" y="274" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="285" font-size="14" fill="#141421">Grey</text>
  <rect x="906" y="296" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="307" font-size="14" fill="#141421">Multi</text>
  <rect x="906" y="318" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="329" font-size="14" fill="#141421">NA</text>
  <rect x="906" y="340" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="351" font-size="14" fill="#141421">Red</text>
  <rect x="906" y="362" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="373" font-size="14" fill="#141421">Silver</text>
  <rect x="906" y="384" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="395" font-size="14" fill="#141421">Silver/Black</text>
  <rect x="906" y="406" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="417" font-size="14" fill="#141421">White</text>
  <rect x="906" y="428" width="12" height="12" fill="#FFFFFF" stroke="#70706F"/>
  <text x="928" y="439" font-size="14" fill="#141421">Yellow</text>
  <rect x="60" y="490" width="580" height="104" fill="#141421"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F6F6F6">
    <text x="80" y="511">Revenue as % of Total (all colors) =</text>
    <text x="80" y="529"><tspan fill="#F39454">DIVIDE</tspan> (</text>
    <text x="108" y="547">[Revenue],</text>
    <text x="420" y="547" fill="#70706F">-- 1</text>
    <text x="108" y="565">[Total Revenue (all PCN - Colors)]</text>
    <text x="420" y="565" fill="#70706F">-- 3</text>
    <text x="80" y="583">)</text>
  </g>
  <use href="#brand-arrow" x="670" y="490"/>
  <text x="696" y="506" font-size="17" font-weight="700" fill="#141421">Share of all colors</text>
  <text x="670" y="532" font-size="14" fill="#141421">Accessories: 31,176 ÷ 9,791,060 = 0.3%.</text>
  <text x="670" y="552" font-size="14" fill="#141421">Black products together represent 39.3%</text>
  <text x="670" y="572" font-size="14" fill="#141421">of all 2007 revenue.</text>
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">Each neglected filter <tspan font-weight="700">widens</tspan> the denominator.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Next: Calculate – NEGLECT + REPLACE</text>
</svg>
