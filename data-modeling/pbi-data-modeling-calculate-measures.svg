<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <path id="funnel" d="M0 0 H14 L9 6 V13 L5 11 V6 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">CALCULATE measures</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421">CALCULATE measures</text>
  <rect x="436" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The report filters the model before a measure calculates. CALCULATE lets you change those initial filters.</text>

  <!-- ==================== Step labels ==================== -->
  <g font-size="15" font-weight="700" fill="#141421">
    <circle cx="71" cy="190" r="11" fill="#F39454"/><text x="71" y="195" font-size="13" text-anchor="middle">1</text>
    <text x="90" y="195">Report sets the filter</text>
    <circle cx="411" cy="190" r="11" fill="#F39454"/><text x="411" y="195" font-size="13" text-anchor="middle">2</text>
    <text x="430" y="195">Filter propagates 1 → many</text>
    <circle cx="831" cy="190" r="11" fill="#F39454"/><text x="831" y="195" font-size="13" text-anchor="middle">3</text>
    <text x="850" y="195">Measure calculates</text>
  </g>

  <!-- ==================== 1. Report ==================== -->
  <rect x="60" y="214" width="280" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="76" y="237">Product Category</text>
    <text x="328" y="237" text-anchor="end">Revenue</text>
  </g>
  <rect x="60" y="250" width="280" height="136" fill="#FFFFFF"/>
  <rect x="60" y="284" width="280" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8"><line x1="60" y1="284" x2="340" y2="284"/><line x1="60" y1="318" x2="340" y2="318"/></g>
  <line x1="60" y1="352" x2="340" y2="352" stroke="#141421"/>
  <g font-size="15" fill="#141421">
    <text x="76" y="272">Accessories</text><text x="328" y="272" text-anchor="end">700,759</text>
    <text x="76" y="306" font-weight="700">Bikes</text><text x="328" y="306" text-anchor="end" font-weight="700">28,318,145</text>
    <text x="76" y="340">Clothing</text><text x="328" y="340" text-anchor="end">339,773</text>
    <text x="76" y="374" font-weight="700">Total</text><text x="328" y="374" text-anchor="end" font-weight="700">29,358,677</text>
  </g>
  <use href="#funnel" x="124" y="294" fill="#F39454"/>
  <rect x="60" y="284" width="280" height="34" fill="none" stroke="#F39454" stroke-width="2"/>

  <!-- 1 -> 2 -->
  <path d="M342 301 C372 301, 372 233, 398 233" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>

  <!-- ==================== 2. Model ==================== -->
  <rect x="400" y="214" width="150" height="38" fill="#141421"/>
  <text x="414" y="238" font-size="14" font-weight="700" fill="#F6F6F6">Categories</text>
  <use href="#funnel" x="526" y="226" fill="#F39454"/>
  <text x="562" y="238" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">= "Bikes"</text>

  <rect x="500" y="290" width="150" height="38" fill="#141421"/>
  <text x="514" y="314" font-size="14" font-weight="700" fill="#F6F6F6">Products</text>
  <use href="#funnel" x="626" y="302" fill="#F39454"/>

  <rect x="600" y="366" width="150" height="38" fill="#141421"/>
  <text x="614" y="390" font-size="14" font-weight="700" fill="#F6F6F6">Sales</text>
  <use href="#funnel" x="726" y="378" fill="#F39454"/>

  <path d="M430 254 V309 H496" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="436" y="270" font-size="13" font-weight="700" fill="#141421">1</text>
  <text x="484" y="303" font-size="15" font-weight="700" fill="#141421">*</text>
  <path d="M530 330 V385 H596" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="536" y="346" font-size="13" font-weight="700" fill="#141421">1</text>
  <text x="584" y="379" font-size="15" font-weight="700" fill="#141421">*</text>
  <text x="560" y="358" font-size="12" fill="#70706F">only Bikes rows left</text>

  <!-- 2 -> 3 -->
  <path d="M752 385 C790 385, 790 262, 818 262" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>

  <!-- ==================== 3. Measure ==================== -->
  <rect x="820" y="214" width="320" height="114" fill="#141421"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F6F6F6">
    <text x="838" y="236">Sales =</text>
    <text x="838" y="253"><tspan fill="#F39454">SUMX</tspan> (</text>
    <text x="866" y="270">Sales,</text>
    <text x="866" y="287"><tspan fill="#C9DCE7">Sales[OrderQuantity]</tspan></text>
    <text x="866" y="304">* <tspan fill="#C9DCE7">Sales[UnitPrice]</tspan></text>
    <text x="838" y="321">)</text>
  </g>
  <text x="820" y="362" font-size="28" font-weight="700" fill="#141421">28,318,145</text>
  <text x="820" y="382" font-size="13" fill="#70706F">on the Sales rows left after filtering</text>
  <text x="820" y="404" font-size="13" fill="#141421">Generic: the measure does not know</text>
  <text x="820" y="420" font-size="13" fill="#141421">it is calculating Bikes.</text>

  <!-- 3 -> 1 : result back in the cell -->
  <path d="M1100 426 V436 H200 V392" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>
  <text x="620" y="430" font-size="12" font-weight="700" fill="#F39454" text-anchor="middle">result shown in the cell</text>

  <!-- ==================== Manipulate? ==================== -->
  <rect x="60" y="452" width="250" height="148" fill="#141421"/>
  <text x="80" y="510" font-size="17" font-weight="700" fill="#F6F6F6">Manipulate the</text>
  <text x="80" y="532" font-size="17" font-weight="700" fill="#F6F6F6">initial report filters?</text>
  <path d="M310 474 H356" stroke="#70706F" stroke-width="1.5" fill="none"/>
  <path d="M310 560 H356" stroke="#F39454" stroke-width="2" fill="none" marker-end="url(#arrow-head)"/>

  <!-- No -->
  <rect x="360" y="452" width="780" height="44" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="376" y="479" font-size="15" fill="#141421"><tspan font-weight="700">No</tspan> <tspan fill="#70706F">(default)</tspan>  →  <tspan font-weight="700">Aggregation or iteration measure</tspan>: the filters are used as they are</text>

  <!-- Yes -->
  <rect x="360" y="508" width="780" height="92" fill="#FFFFFF" stroke="#F39454" stroke-width="2"/>
  <text x="376" y="532" font-size="15" fill="#141421"><tspan font-weight="700">Yes</tspan>  →  <tspan font-weight="700">CALCULATE measure</tspan>, with manipulation:</text>
  <g>
    <rect x="376" y="544" width="244" height="46" fill="#F39454" fill-opacity="0.18"/>
    <text x="388" y="563" font-size="14" font-weight="700" fill="#141421">Neglect</text>
    <text x="388" y="581" font-size="12" fill="#70706F">ALL product categories</text>
    <rect x="628" y="544" width="244" height="46" fill="#F39454" fill-opacity="0.18"/>
    <text x="640" y="563" font-size="14" font-weight="700" fill="#141421">Neglect + Replace</text>
    <text x="640" y="581" font-size="12" fill="#70706F">Bikes replaced by Accessories</text>
    <rect x="880" y="544" width="244" height="46" fill="#F39454" fill-opacity="0.18"/>
    <text x="892" y="563" font-size="14" font-weight="700" fill="#141421">Respect + Add</text>
    <text x="892" y="581" font-size="12" fill="#70706F">Bikes, narrowed to Road Bikes</text>
  </g>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">The report filters first. <tspan font-weight="700">CALCULATE</tspan> changes those filters before the measure calculates.</text>
</svg>
