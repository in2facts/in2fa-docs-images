<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Schemas</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="218" lengthAdjust="spacing">Star schema</text>
  <rect x="286" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">One fact table in the middle, surrounded by dimension tables with one-to-many relationships.</text>
  <line x1="380" y1="280" x2="380" y2="358" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="394" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="394" y="352" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <line x1="544" y1="400" x2="468" y2="400" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="536" y="390" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="end">1</text>
  <text x="476" y="392" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <line x1="380" y1="520" x2="380" y2="442" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="394" y="516" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="394" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <line x1="216" y1="400" x2="292" y2="400" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="224" y="390" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="284" y="392" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421" text-anchor="end">*</text>
  <rect x="310" y="226" width="140" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="380.0" y="247.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Date</text>
  <text x="380.0" y="268.0" font-size="13" fill="#70706F" text-anchor="middle">dimension</text>
  <rect x="550" y="376" width="140" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="620.0" y="397.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Product</text>
  <text x="620.0" y="418.0" font-size="13" fill="#70706F" text-anchor="middle">dimension</text>
  <rect x="310" y="526" width="140" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="380.0" y="547.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Customer</text>
  <text x="380.0" y="568.0" font-size="13" fill="#70706F" text-anchor="middle">dimension</text>
  <rect x="70" y="376" width="140" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="140.0" y="397.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Campaign</text>
  <text x="140.0" y="418.0" font-size="13" fill="#70706F" text-anchor="middle">dimension</text>
  <rect x="300" y="366" width="160" height="68" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="380.0" y="397.0" font-size="16" font-weight="700" fill="#F6F6F6" text-anchor="middle">Sales</text>
  <text x="380.0" y="418.0" font-size="13" fill="#A9AAAA" text-anchor="middle">fact table</text>
  <rect x="720" y="190" width="420" height="76" fill="#FFFFFF"/>
  <rect x="720" y="190" width="4" height="76" fill="#F39454"/>
  <circle cx="754" cy="228.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M749 228.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="780" y="222.0" font-size="17" font-weight="700" fill="#141421">Less memory</text>
  <text x="780" y="246.0" font-size="13" fill="#70706F">Attributes stored once in dimensions.</text>
  <rect x="720" y="278" width="420" height="76" fill="#FFFFFF"/>
  <rect x="720" y="278" width="4" height="76" fill="#F39454"/>
  <circle cx="754" cy="316.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M749 316.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="780" y="310.0" font-size="17" font-weight="700" fill="#141421">Simple filtering</text>
  <text x="780" y="334.0" font-size="13" fill="#70706F">Filters flow from dimensions to facts.</text>
  <rect x="720" y="366" width="420" height="76" fill="#FFFFFF"/>
  <rect x="720" y="366" width="4" height="76" fill="#F39454"/>
  <circle cx="754" cy="404.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M749 404.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="780" y="398.0" font-size="17" font-weight="700" fill="#141421">Simple DAX</text>
  <text x="780" y="422.0" font-size="13" fill="#70706F">Patterns assume a star schema.</text>
  <rect x="720" y="454" width="420" height="76" fill="#FFFFFF"/>
  <rect x="720" y="454" width="4" height="76" fill="#F39454"/>
  <circle cx="754" cy="492.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M749 492.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="780" y="486.0" font-size="17" font-weight="700" fill="#141421">Easy to understand</text>
  <text x="780" y="510.0" font-size="13" fill="#70706F">What to measure, how to slice.</text>
  <rect x="720" y="542" width="420" height="76" fill="#FFFFFF"/>
  <rect x="720" y="542" width="4" height="76" fill="#F39454"/>
  <circle cx="754" cy="580.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M749 580.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="780" y="574.0" font-size="17" font-weight="700" fill="#141421">Better AI answers</text>
  <text x="780" y="598.0" font-size="13" fill="#70706F">Recommended to prepare for Copilot.</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="646" x2="1140" y2="646" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="682" font-size="20" fill="#141421">Facts in the middle, <tspan font-weight="700">dimensions around them.</tspan></text>
  <text x="1140" y="681" font-size="14" fill="#70706F" text-anchor="end">The fact table is always on the <tspan font-family="Arial, sans-serif">*</tspan>-side</text>
</svg>
