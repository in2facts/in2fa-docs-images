  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="262" lengthAdjust="spacing">Three skill sets</text>
  <rect x="330" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">From external data to report pages: shape the data, model it, then visualize it.</text>

