<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Row vs filter context</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421">Row vs filter context</text>
  <rect x="424" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Two mechanisms decide what a DAX expression sees: the current row, or the set of visible rows.</text>

  <line x1="600" y1="170" x2="600" y2="590" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== LEFT: row context ==================== -->
  <text x="60" y="190" font-size="20" font-weight="700" fill="#141421">Row context <tspan font-size="14" font-weight="400" fill="#70706F">one row at a time</tspan></text>

  <!-- Sales table -->
  <rect x="80" y="210" width="470" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="96" y="233">Product</text>
    <text x="290" y="233" text-anchor="end">Qty</text>
    <text x="400" y="233" text-anchor="end">Unit Price</text>
    <text x="534" y="233" text-anchor="end">Line Amount</text>
  </g>
  <rect x="80" y="246" width="470" height="170" fill="#FFFFFF"/>
  <!-- calculated column -->
  <rect x="416" y="246" width="134" height="170" fill="#C9DCE7" fill-opacity="0.6"/>
  <!-- current row -->
  <rect x="80" y="314" width="470" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="80" y1="280" x2="550" y2="280"/><line x1="80" y1="314" x2="550" y2="314"/>
    <line x1="80" y1="348" x2="550" y2="348"/><line x1="80" y1="382" x2="550" y2="382"/>
  </g>
  <g font-size="15" fill="#141421">
    <text x="96" y="268">Bike</text><text x="290" y="268" text-anchor="end">2</text><text x="400" y="268" text-anchor="end">800</text><text x="534" y="268" text-anchor="end">1,600</text>
    <text x="96" y="302">Helmet</text><text x="290" y="302" text-anchor="end">1</text><text x="400" y="302" text-anchor="end">60</text><text x="534" y="302" text-anchor="end">60</text>
    <text x="96" y="336" font-weight="700">Gloves</text><text x="290" y="336" text-anchor="end" font-weight="700">5</text><text x="400" y="336" text-anchor="end" font-weight="700">20</text><text x="534" y="336" text-anchor="end" font-weight="700">100</text>
    <text x="96" y="370">Lights</text><text x="290" y="370" text-anchor="end">3</text><text x="400" y="370" text-anchor="end">25</text><text x="534" y="370" text-anchor="end">75</text>
    <text x="96" y="404">Bottle</text><text x="290" y="404" text-anchor="end">4</text><text x="400" y="404" text-anchor="end">10</text><text x="534" y="404" text-anchor="end">40</text>
  </g>
  <rect x="80" y="314" width="470" height="34" fill="none" stroke="#F39454" stroke-width="2"/>

  <!-- iteration: row pointer walking down the table -->
  <line x1="66" y1="254" x2="66" y2="404" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>
  <path d="M60 323 L74 331 L60 339 Z" fill="#F39454"/>

  <text x="80" y="448" font-size="13" fill="#70706F">Current row: 5 × 20 = 100</text>
  <text x="550" y="448" font-size="13" fill="#70706F" text-anchor="end">Evaluated once for every row</text>

  <rect x="60" y="470" width="490" height="44" fill="#141421"/>
  <text x="80" y="498" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#F6F6F6">Line Amount = 'Sales'[Qty] * 'Sales'[Unit Price]</text>

  <use href="#brand-arrow" x="60" y="532"/>
  <text x="86" y="548" font-size="17" font-weight="700" fill="#141421">Iterates: "which row am I on?"</text>
  <text x="60" y="574" font-size="14" fill="#141421">Created by calculated columns and iterators (SUMX, FILTER).</text>
  <text x="60" y="594" font-size="14" fill="#141421">It points at one row; it does not filter the model.</text>

  <!-- ==================== RIGHT: filter context ==================== -->
  <text x="650" y="190" font-size="20" font-weight="700" fill="#141421">Filter context <tspan font-size="14" font-weight="400" fill="#70706F">which rows are visible</tspan></text>

  <!-- Matrix visual -->
  <rect x="650" y="210" width="200" height="36" fill="#141421"/>
  <g font-size="13" font-weight="700" fill="#F6F6F6">
    <text x="662" y="233">Category</text>
    <text x="838" y="233" text-anchor="end">Sales Amount</text>
  </g>
  <rect x="650" y="246" width="200" height="136" fill="#FFFFFF"/>
  <rect x="650" y="280" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="650" y1="280" x2="850" y2="280"/><line x1="650" y1="314" x2="850" y2="314"/>
  </g>
  <line x1="650" y1="348" x2="850" y2="348" stroke="#141421" stroke-width="1"/>
  <g font-size="15" fill="#141421">
    <text x="662" y="268">Bikes</text><text x="838" y="268" text-anchor="end">1,600</text>
    <text x="662" y="302" font-weight="700">Accessories</text>
    <text x="662" y="336">Clothing</text><text x="838" y="336" text-anchor="end">100</text>
    <text x="662" y="370" font-weight="700">Total</text><text x="838" y="370" text-anchor="end" font-weight="700">1,875</text>
  </g>
  <rect x="764" y="280" width="86" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="838" y="303" font-size="17" font-weight="700" fill="#141421" text-anchor="end">175</text>

  <!-- filter propagates to the table -->
  <path d="M852 297 C866 297, 866 297, 878 297" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>

  <!-- Sales table, filtered -->
  <rect x="880" y="210" width="260" height="36" fill="#141421"/>
  <g font-size="13" font-weight="700" fill="#F6F6F6">
    <text x="892" y="233">Product</text>
    <text x="966" y="233">Category</text>
    <text x="1128" y="233" text-anchor="end">Line Amount</text>
  </g>
  <rect x="880" y="246" width="260" height="170" fill="#FFFFFF"/>
  <rect x="880" y="280" width="260" height="34" fill="#F39454" fill-opacity="0.18"/>
  <rect x="880" y="348" width="260" height="68" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="880" y1="280" x2="1140" y2="280"/><line x1="880" y1="314" x2="1140" y2="314"/>
    <line x1="880" y1="348" x2="1140" y2="348"/><line x1="880" y1="382" x2="1140" y2="382"/>
  </g>
  <g font-size="14" fill="#141421" fill-opacity="0.3">
    <text x="892" y="268">Bike</text><text x="966" y="268">Bikes</text><text x="1128" y="268" text-anchor="end">1,600</text>
    <text x="892" y="336">Gloves</text><text x="966" y="336">Clothing</text><text x="1128" y="336" text-anchor="end">100</text>
  </g>
  <g font-size="14" fill="#141421">
    <text x="892" y="302">Helmet</text><text x="966" y="302">Accessories</text><text x="1128" y="302" text-anchor="end" font-weight="700">60</text>
    <text x="892" y="370">Lights</text><text x="966" y="370">Accessories</text><text x="1128" y="370" text-anchor="end" font-weight="700">75</text>
    <text x="892" y="404">Bottle</text><text x="966" y="404">Accessories</text><text x="1128" y="404" text-anchor="end" font-weight="700">40</text>
  </g>

  <text x="650" y="448" font-size="13" fill="#70706F">Each cell has its own filters</text>
  <text x="1140" y="448" font-size="13" fill="#70706F" text-anchor="end">Only 3 rows are visible</text>

  <rect x="650" y="470" width="490" height="44" fill="#141421"/>
  <text x="670" y="498" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#F6F6F6">Sales Amount = SUM ( 'Sales'[Line Amount] )</text>

  <use href="#brand-arrow" x="650" y="532"/>
  <text x="676" y="548" font-size="17" font-weight="700" fill="#141421">Filters: "which rows can I see?"</text>
  <text x="650" y="574" font-size="14" fill="#141421">Created by visuals, slicers, filter panes and CALCULATE.</text>
  <text x="650" y="594" font-size="14" fill="#141421">Accessories: 60 + 75 + 40 = 175.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">Row context <tspan font-weight="700">iterates</tspan>. Filter context <tspan font-weight="700">filters</tspan>.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">CALCULATE turns row context into filter context (context transition).</text>
</svg>
