  <rect x="330" y="244" width="330" height="272" fill="#FFFFFF"/>
  <line x1="470" y1="244" x2="470" y2="516" stroke="#D7D8D8"/>
  <text x="346" y="266" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="266" font-size="15" fill="#A9AAAA">Mark</text>
  <line x1="330" y1="278" x2="660" y2="278" stroke="#D7D8D8"/>
  <rect x="330" y="278" width="330" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="346" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text><text x="486" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="330" y1="312" x2="660" y2="312" stroke="#D7D8D8"/>
  <text x="346" y="334" font-size="15" fill="#A9AAAA">Robert</text><text x="486" y="334" font-size="15" fill="#A9AAAA">Robert</text>
  <line x1="330" y1="346" x2="660" y2="346" stroke="#D7D8D8"/>
  <text x="346" y="368" font-size="15" fill="#A9AAAA">Luke</text><text x="486" y="368" font-size="15" fill="#A9AAAA">Luke</text>
  <line x1="330" y1="380" x2="660" y2="380" stroke="#D7D8D8"/>
  <text x="346" y="402" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="402" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="330" y1="414" x2="660" y2="414" stroke="#D7D8D8"/>
  <text x="346" y="436" font-size="15" fill="#A9AAAA">Robert</text><text x="486" y="436" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="330" y1="448" x2="660" y2="448" stroke="#D7D8D8"/>
  <text x="346" y="470" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="470" font-size="15" fill="#A9AAAA">Mark - Paul</text>
  <line x1="330" y1="482" x2="660" y2="482" stroke="#D7D8D8"/>
  <rect x="330" y="482" width="330" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="346" y="504" font-size="15" fill="#141421" font-weight="700">Paul</text><text x="486" y="504" font-size="15" fill="#141421" font-weight="700">Mark - Paul</text>
  <rect x="860" y="208" width="200" height="36" fill="#141421"/>
  <text x="876" y="231" font-size="14" font-weight="700" fill="#F6F6F6">Account</text>
  <text x="1100" y="231" font-size="12" font-weight="700" fill="#70706F" text-anchor="middle">COUNTROWS</text>
  <rect x="860" y="244" width="200" height="204" fill="#FFFFFF"/>
  <rect x="860" y="244" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="266" font-size="15" fill="#141421" font-weight="700">Mark</text>
  <rect x="1072" y="250" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="266" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <line x1="860" y1="278" x2="1060" y2="278" stroke="#D7D8D8"/>
  <rect x="860" y="278" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <rect x="1072" y="284" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="300" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <line x1="860" y1="312" x2="1060" y2="312" stroke="#D7D8D8"/>
  <rect x="860" y="312" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="334" font-size="15" fill="#141421" font-weight="700">Robert</text>
  <rect x="1072" y="318" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="334" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <line x1="860" y1="346" x2="1060" y2="346" stroke="#D7D8D8"/>
  <rect x="860" y="346" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="368" font-size="15" fill="#141421" font-weight="700">Luke</text>
  <rect x="1072" y="352" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="368" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <line x1="860" y1="380" x2="1060" y2="380" stroke="#D7D8D8"/>
  <rect x="860" y="380" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="402" font-size="15" fill="#141421" font-weight="700">Mark - Robert</text>
  <rect x="1072" y="386" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="402" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <line x1="860" y1="414" x2="1060" y2="414" stroke="#D7D8D8"/>
  <rect x="860" y="414" width="200" height="34" fill="#F39454" fill-opacity="0.18"/>
  <text x="876" y="436" font-size="15" fill="#141421" font-weight="700">Mark - Paul</text>
  <rect x="1072" y="420" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="436" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2 &gt; 0</text>
  <rect x="860" y="244" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="860" y="278" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="860" y="312" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="860" y="346" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="860" y="380" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="860" y="414" width="200" height="34" fill="none" stroke="#F39454" stroke-width="2"/>

  <!-- step 1: report filter, step 2: propagation to the bridge -->
  <path d="M234 295.0 H324" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M280 295.0 V499.0 H324" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="46" cy="295.0" r="11" fill="#F39454"/><text x="46" y="300.0" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="280" cy="390" r="11" fill="#F39454"/><text x="280" y="395" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>

  <!-- step 3: COUNTROWS in row context sees the same 2 rows for every account -->
  <path d="M668 380 C760 380 760 346.0 852 346.0" fill="none" stroke="#F39454" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#head-mango)"/>
  <rect x="682" y="408" width="156" height="46" fill="#FFFFFF" stroke="#F39454" stroke-width="1.5"/>
  <text x="760" y="427" font-size="12" fill="#70706F" text-anchor="middle">for every account</text>
  <text x="760" y="446" font-size="15" font-weight="700" fill="#141421" text-anchor="middle">COUNTROWS = 2</text>
  <circle cx="682" cy="408" r="11" fill="#F39454"/><text x="682" y="413" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>

  <!-- captions -->
  <g font-size="13" fill="#70706F">
    <text x="60" y="402">Report filter: Customer = Paul</text>
    <text x="330" y="538">2 rows visible in the filter context</text>
    <text x="860" y="470">All 6 accounts survive FILTER</text>
  </g>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="560" width="1080" height="44" fill="#141421"/>
  <text x="80" y="588" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F6F6F6" xml:space="preserve">FILTER ( VALUES ( Dim_Account[ID_Account] ), COUNTROWS ( Bridge_Account_Customer ) &gt; 0 )</text>

  <!-- ==================== Explanation ==================== -->
  <circle cx="71" cy="632" r="11" fill="#F39454"/><text x="71" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="90" y="638" font-size="17" font-weight="700" fill="#141421">Report filter</text>
  <text x="60" y="664" font-size="14" fill="#141421">The report filters Dim_Customer</text>
  <text x="60" y="683" font-size="14" fill="#141421">to a single customer: Paul.</text>
  <circle cx="441" cy="632" r="11" fill="#F39454"/><text x="441" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="460" y="638" font-size="17" font-weight="700" fill="#141421">Propagation</text>
  <text x="430" y="664" font-size="14" fill="#141421">The filter flows to the bridge:</text>
  <text x="430" y="683" font-size="14" fill="#141421">only Paul's 2 rows stay visible.</text>
  <circle cx="811" cy="632" r="11" fill="#F39454"/><text x="811" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="830" y="638" font-size="17" font-weight="700" fill="#141421">Row context</text>
  <text x="800" y="664" font-size="14" fill="#141421">COUNTROWS ignores the current</text>
  <text x="800" y="683" font-size="14" fill="#141421">account: always 2 &gt; 0, so every</text>
  <text x="800" y="702" font-size="14" fill="#141421">account survives.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="752" font-size="20" fill="#141421">A row context does not filter: <tspan font-weight="700">every account survives.</tspan></text>
  <text x="1140" y="751" font-size="14" fill="#70706F" text-anchor="end">Result: every customer shows the total 17,813</text>
</svg>
