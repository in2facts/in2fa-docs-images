<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Dynamic banding</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="298" lengthAdjust="spacing">Dynamic banding</text>
  <rect x="366" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A disconnected table drives the logic of a measure: it is filtered by the report, but never filters the model.</text>

  <!-- ==================== LEFT: the model ==================== -->
  <text x="60" y="190" font-size="20" font-weight="700" fill="#141421">The model <tspan font-size="14" font-weight="400" fill="#70706F">SalesBand is disconnected</tspan></text>

  <!-- OrderDate -->
  <rect x="60" y="210" width="130" height="36" fill="#141421"/>
  <text x="74" y="233" font-size="14" font-weight="700" fill="#F6F6F6">OrderDate</text>
  <rect x="60" y="246" width="130" height="52" fill="#FFFFFF"/>
  <line x1="60" y1="272" x2="190" y2="272" stroke="#D7D8D8"/>
  <g font-size="13" fill="#141421">
    <text x="74" y="264">Date</text>
    <text x="74" y="290" font-weight="700">Year</text>
  </g>

  <!-- Customers -->
  <rect x="60" y="330" width="130" height="36" fill="#141421"/>
  <text x="74" y="353" font-size="14" font-weight="700" fill="#F6F6F6">Customers</text>
  <rect x="60" y="366" width="130" height="52" fill="#FFFFFF"/>
  <line x1="60" y1="392" x2="190" y2="392" stroke="#D7D8D8"/>
  <g font-size="13" fill="#141421">
    <text x="74" y="384">Customer</text>
    <text x="74" y="410">City</text>
  </g>

  <!-- Sales -->
  <rect x="240" y="210" width="130" height="36" fill="#141421"/>
  <text x="254" y="233" font-size="14" font-weight="700" fill="#F6F6F6">Sales</text>
  <rect x="240" y="246" width="130" height="78" fill="#FFFFFF"/>
  <g stroke="#D7D8D8"><line x1="240" y1="272" x2="370" y2="272"/><line x1="240" y1="298" x2="370" y2="298"/></g>
  <g font-size="13" fill="#141421">
    <text x="254" y="264">OrderDate</text>
    <text x="254" y="290">Customer</text>
    <text x="254" y="316" font-weight="700">SalesAmount</text>
  </g>

  <!-- relationships -->
  <line x1="192" y1="228" x2="236" y2="228" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="196" y="221" font-size="13" font-weight="700" fill="#141421">1</text>
  <text x="228" y="222" font-size="15" font-weight="700" fill="#141421">*</text>
  <line x1="192" y1="348" x2="236" y2="300" stroke="#141421" stroke-width="1.5"/>
  <text x="196" y="366" font-size="13" font-weight="700" fill="#141421">1</text>
  <text x="226" y="322" font-size="15" font-weight="700" fill="#141421">*</text>

  <!-- no relationship -->
  <line x1="372" y1="285" x2="418" y2="285" stroke="#70706F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="395" cy="285" r="10" fill="#F6F6F6"/>
  <path d="M389 279 L401 291 M401 279 L389 291" stroke="#F39454" stroke-width="2"/>

  <!-- SalesBand -->
  <rect x="420" y="210" width="200" height="36" fill="#141421"/>
  <text x="434" y="233" font-size="14" font-weight="700" fill="#F6F6F6">SalesBand</text>
  <rect x="420" y="246" width="200" height="110" fill="#FFFFFF"/>
  <rect x="420" y="246" width="200" height="26" fill="#C9DCE7"/>
  <g font-size="12" font-weight="700" fill="#141421">
    <text x="432" y="264">Band</text>
    <text x="552" y="264" text-anchor="end">MinSales</text>
    <text x="608" y="264" text-anchor="end">MaxSales</text>
  </g>
  <rect x="420" y="300" width="200" height="28" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8"><line x1="420" y1="300" x2="620" y2="300"/><line x1="420" y1="328" x2="620" y2="328"/></g>
  <g font-size="13" fill="#141421">
    <text x="432" y="291">Low</text><text x="552" y="291" text-anchor="end">0</text><text x="608" y="291" text-anchor="end">1,000</text>
    <text x="432" y="319" font-weight="700">Medium</text><text x="552" y="319" text-anchor="end" font-weight="700">1,000</text><text x="608" y="319" text-anchor="end" font-weight="700">5,000</text>
    <text x="432" y="347">High</text><text x="552" y="347" text-anchor="end">5,000</text><text x="608" y="347" text-anchor="end">∞</text>
  </g>
  <rect x="420" y="210" width="200" height="146" fill="none" stroke="#70706F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="420" y="378" font-size="13" fill="#70706F">Filtered by the report,</text>
  <text x="420" y="396" font-size="13" fill="#70706F">but never propagates to Sales</text>

  <text x="60" y="440" font-size="13" fill="#70706F">The Year filter flows OrderDate → Sales</text>

  <!-- ==================== RIGHT: the report ==================== -->
  <text x="680" y="190" font-size="20" font-weight="700" fill="#141421">The report <tspan font-size="14" font-weight="400" fill="#70706F"># Customers per band</tspan></text>

  <rect x="680" y="210" width="460" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="696" y="233">Band</text>
    <text x="880" y="233" text-anchor="end">2025</text>
    <text x="990" y="233" text-anchor="end">2026</text>
    <text x="1128" y="233" text-anchor="end">Total</text>
  </g>
  <rect x="680" y="246" width="460" height="136" fill="#FFFFFF"/>
  <rect x="680" y="280" width="460" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="680" y1="280" x2="1140" y2="280"/><line x1="680" y1="314" x2="1140" y2="314"/>
  </g>
  <line x1="680" y1="348" x2="1140" y2="348" stroke="#141421" stroke-width="1"/>
  <g font-size="15" fill="#141421">
    <text x="696" y="268">Low</text><text x="880" y="268" text-anchor="end">14</text><text x="990" y="268" text-anchor="end">10</text><text x="1128" y="268" text-anchor="end">9</text>
    <text x="696" y="302" font-weight="700">Medium</text><text x="880" y="302" text-anchor="end">8</text><text x="1128" y="302" text-anchor="end">12</text>
    <text x="696" y="336">High</text><text x="880" y="336" text-anchor="end">3</text><text x="990" y="336" text-anchor="end">5</text><text x="1128" y="336" text-anchor="end">7</text>
  </g>
  <g font-size="15" font-weight="700" fill="#141421" fill-opacity="0.3">
    <text x="696" y="370">Total</text><text x="880" y="370" text-anchor="end">25</text><text x="990" y="370" text-anchor="end">26</text><text x="1128" y="370" text-anchor="end">28</text>
  </g>
  <rect x="900" y="280" width="100" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="990" y="303" font-size="17" font-weight="700" fill="#141421" text-anchor="end">11</text>
  <rect x="680" y="348" width="460" height="34" fill="none" stroke="#70706F" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- band filter to SalesBand -->
  <path d="M678 297 C650 297, 650 314, 624 314" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>

  <text x="680" y="404" font-size="13" fill="#141421"><tspan font-weight="700">Medium × 2026 = 11</tspan> customers with 1,000 ≤ sales &lt; 5,000</text>
  <text x="680" y="426" font-size="13" fill="#F39454" font-weight="700">⚠ Total row: all bands apply at once, the result is meaningless</text>

  <line x1="60" y1="456" x2="1140" y2="456" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="474" width="580" height="134" fill="#141421"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6">
    <text x="80" y="498"># Customers =</text>
    <text x="80" y="516"><tspan fill="#F39454">VAR</tspan> MinSales = <tspan fill="#F39454">MIN</tspan> ( <tspan fill="#C9DCE7">SalesBand[MinSales]</tspan> )</text>
    <text x="80" y="534"><tspan fill="#F39454">VAR</tspan> MaxSales = <tspan fill="#F39454">MAX</tspan> ( <tspan fill="#C9DCE7">SalesBand[MaxSales]</tspan> )</text>
    <text x="80" y="552"><tspan fill="#F39454">RETURN</tspan></text>
    <text x="108" y="570"><tspan fill="#F39454">COUNTROWS</tspan> ( <tspan fill="#F39454">FILTER</tspan> ( <tspan fill="#F39454">VALUES</tspan> ( <tspan fill="#C9DCE7">Customers[Customer]</tspan> ),</text>
    <text x="136" y="588">[Sales Amount] &gt;= MinSales &amp;&amp; [Sales Amount] &lt; MaxSales ) )</text>
  </g>

  <!-- ==================== Explanation ==================== -->
  <use href="#brand-arrow" x="680" y="474"/>
  <text x="706" y="490" font-size="17" font-weight="700" fill="#141421">A parameter table</text>
  <text x="680" y="514" font-size="14" fill="#141421">SalesBand has no relationship: filtering it never</text>
  <text x="680" y="532" font-size="14" fill="#141421">impacts Sales. fx only reads MinSales and MaxSales.</text>

  <use href="#brand-arrow" x="680" y="550"/>
  <text x="706" y="566" font-size="17" font-weight="700" fill="#141421">Two filters, two roles</text>
  <text x="680" y="590" font-size="14" fill="#141421">Year filters Sales through the relationships;</text>
  <text x="680" y="608" font-size="14" fill="#141421">Band only sets the boundaries of the test.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="630" x2="1140" y2="630" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="666" font-size="20" fill="#141421">Disconnected tables <tspan font-weight="700">drive the logic</tspan>, not the filter.</text>
  <text x="1140" y="665" font-size="14" fill="#70706F" text-anchor="end">Next: VALUES</text>
</svg>
