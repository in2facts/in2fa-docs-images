<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Calculated columns</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="337" lengthAdjust="spacing">Calculated columns</text>
  <rect x="405" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A calculated column computes a value for every row at refresh time and stores it in the model.</text>

  <!-- ==================== LEFT: Product (one side) ==================== -->
  <text x="60" y="200" font-size="20" font-weight="700" fill="#141421">Product <tspan font-size="14" font-weight="400" fill="#70706F">the one side</tspan></text>

  <rect x="60" y="230" width="340" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="76" y="253">ProductID</text>
    <text x="170" y="253">Product</text>
    <text x="388" y="253" text-anchor="end">ListPrice</text>
  </g>
  <rect x="60" y="266" width="340" height="102" fill="#FFFFFF"/>
  <rect x="60" y="334" width="340" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="60" y1="300" x2="400" y2="300"/><line x1="60" y1="334" x2="400" y2="334"/>
  </g>
  <g font-size="15" fill="#141421">
    <text x="76" y="288">P1</text><text x="170" y="288">Bike</text><text x="388" y="288" text-anchor="end">800</text>
    <text x="76" y="322">P2</text><text x="170" y="322">Helmet</text><text x="388" y="322" text-anchor="end">60</text>
    <text x="76" y="356" font-weight="700">P3</text><text x="170" y="356" font-weight="700">Gloves</text><text x="388" y="356" text-anchor="end" font-weight="700">20</text>
  </g>
  <rect x="300" y="334" width="100" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="300" y="390" font-size="13" font-weight="700" fill="#F39454">one value!</text>

  <!-- relationship 1 -> * -->
  <line x1="402" y1="248" x2="538" y2="248" stroke="#70706F" stroke-width="1.5"/>
  <text x="410" y="240" font-size="14" font-weight="700" fill="#141421">1</text>
  <text x="526" y="242" font-size="16" font-weight="700" fill="#141421">*</text>

  <!-- RELATED lookup: many -> one -->
  <path d="M538 317 C470 317, 470 351, 404 351" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#arrow-head)"/>
  <text x="470" y="300" font-size="13" font-weight="700" fill="#F39454" text-anchor="middle">RELATED</text>
  <text x="470" y="380" font-size="12" fill="#70706F" text-anchor="middle">many → 1</text>

  <!-- ==================== RIGHT: Sales (many side) ==================== -->
  <text x="540" y="200" font-size="20" font-weight="700" fill="#141421">Sales <tspan font-size="14" font-weight="400" fill="#70706F">the many side</tspan></text>
  <text x="1140" y="200" font-size="13" font-weight="700" fill="#141421" text-anchor="end"><tspan fill="#70706F" font-weight="400">new </tspan>calculated column</text>
  <line x1="1124" y1="208" x2="1124" y2="226" stroke="#70706F" stroke-width="1"/>

  <rect x="540" y="230" width="600" height="36" fill="#141421"/>
  <rect x="900" y="230" width="240" height="36" fill="#70706F"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="556" y="253">OrderID</text>
    <text x="680" y="253">ProductID</text>
    <text x="876" y="253" text-anchor="end">Units</text>
    <text x="1124" y="253" text-anchor="end">MSRP</text>
  </g>
  <rect x="540" y="266" width="600" height="170" fill="#FFFFFF"/>
  <rect x="900" y="266" width="240" height="170" fill="#C9DCE7" fill-opacity="0.6"/>
  <rect x="540" y="300" width="600" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="540" y1="300" x2="1140" y2="300"/><line x1="540" y1="334" x2="1140" y2="334"/>
    <line x1="540" y1="368" x2="1140" y2="368"/><line x1="540" y1="402" x2="1140" y2="402"/>
  </g>
  <g font-size="15" fill="#141421">
    <text x="556" y="288">SO-1001</text><text x="680" y="288">P1</text><text x="876" y="288" text-anchor="end">2</text><text x="1124" y="288" text-anchor="end">800</text>
    <text x="556" y="322" font-weight="700">SO-1002</text><text x="680" y="322" font-weight="700">P3</text><text x="876" y="322" text-anchor="end" font-weight="700">5</text><text x="1124" y="322" text-anchor="end" font-weight="700">20</text>
    <text x="556" y="356">SO-1003</text><text x="680" y="356">P1</text><text x="876" y="356" text-anchor="end">1</text><text x="1124" y="356" text-anchor="end">800</text>
    <text x="556" y="390">SO-1004</text><text x="680" y="390">P2</text><text x="876" y="390" text-anchor="end">1</text><text x="1124" y="390" text-anchor="end">60</text>
    <text x="556" y="424">SO-1005</text><text x="680" y="424">P3</text><text x="876" y="424" text-anchor="end">3</text><text x="1124" y="424" text-anchor="end">20</text>
  </g>
  <rect x="540" y="300" width="600" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="540" y="458" font-size="13" fill="#70706F">Current row: ProductID P3 → ListPrice 20</text>
  <text x="1140" y="458" font-size="13" fill="#70706F" text-anchor="end">Filled row by row, stored in the model</text>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="480" width="1080" height="40" fill="#141421"/>
  <text x="80" y="506" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#F6F6F6">MSRP = <tspan fill="#F39454">RELATED</tspan> ( <tspan fill="#C9DCE7">'Product'[ListPrice]</tspan> )   <tspan fill="#70706F">-- calculated column in the Sales table</tspan></text>

  <!-- ==================== Explanation ==================== -->
  <use href="#brand-arrow" x="60" y="536"/>
  <text x="86" y="552" font-size="17" font-weight="700" fill="#141421">RELATED ( &lt;ColumnName&gt; )</text>
  <text x="60" y="576" font-size="14" fill="#141421">Follows many-to-one relationships, needs a row context</text>
  <text x="60" y="594" font-size="14" fill="#141421">and returns a single value of any type.</text>

  <use href="#brand-arrow" x="650" y="536"/>
  <text x="676" y="552" font-size="17" font-weight="700" fill="#141421">A calculated column</text>
  <text x="650" y="576" font-size="14" fill="#141421">Computed at refresh, not by user activity. It is stored</text>
  <text x="650" y="594" font-size="14" fill="#141421">in the table and adds to the model size in RAM.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">One value from the one side, <tspan font-weight="700">for every row</tspan> of the many side.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">If possible, push it back to the source.</text>
</svg>
