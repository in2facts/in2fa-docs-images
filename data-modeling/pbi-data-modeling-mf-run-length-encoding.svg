<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="870" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Engine internals</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="350" lengthAdjust="spacing">Run length encoding</text>
  <rect x="418" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">After dictionary or value encoding, VertiPaq stores runs of repeating values instead of every value.</text>
  <rect x="60" y="170" width="340" height="470" fill="#FFFFFF"/>
  <text x="80" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">Encoded column</text>
  <text x="80" y="220" font-size="13" fill="#70706F" text-anchor="start">11 values, as stored row by row</text>
  <rect x="140" y="240" width="180" height="32" fill="#141421"/>
  <text x="230.0" y="261" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Color ID</text>
  <rect x="140" y="272" width="180" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="291.0" font-size="14" fill="#141421" text-anchor="middle">1  (Red)</text>
  <rect x="140" y="300" width="180" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="319.0" font-size="14" fill="#141421" text-anchor="middle">2  (Green)</text>
  <rect x="140" y="328" width="180" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="347.0" font-size="14" fill="#141421" text-anchor="middle">1  (Red)</text>
  <rect x="140" y="356" width="180" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="375.0" font-size="14" fill="#141421" text-anchor="middle">1  (Red)</text>
  <rect x="140" y="384" width="180" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="403.0" font-size="14" fill="#141421" text-anchor="middle">1  (Red)</text>
  <rect x="140" y="412" width="180" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="431.0" font-size="14" fill="#141421" text-anchor="middle">2  (Green)</text>
  <rect x="140" y="440" width="180" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="459.0" font-size="14" fill="#141421" text-anchor="middle">3  (Blue)</text>
  <rect x="140" y="468" width="180" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="487.0" font-size="14" fill="#141421" text-anchor="middle">3  (Blue)</text>
  <rect x="140" y="496" width="180" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="515.0" font-size="14" fill="#141421" text-anchor="middle">3  (Blue)</text>
  <rect x="140" y="524" width="180" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="543.0" font-size="14" fill="#141421" text-anchor="middle">3  (Blue)</text>
  <rect x="140" y="552" width="180" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="230.0" y="571.0" font-size="14" fill="#141421" text-anchor="middle">2  (Green)</text>
  <text x="230" y="612" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">11 values</text>
  <rect x="430" y="170" width="340" height="470" fill="#FFFFFF"/>
  <text x="450" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">Run length encoded</text>
  <text x="450" y="220" font-size="13" fill="#70706F" text-anchor="start">Value + how many times it repeats</text>
  <rect x="490" y="240" width="220" height="32" fill="#141421"/>
  <text x="545" y="261" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Value</text>
  <text x="655" y="261" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Count</text>
  <rect x="490" y="272" width="220" height="40" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="298" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">1</text>
  <text x="655" y="298" font-size="15" fill="#141421" text-anchor="middle">× 1</text>
  <rect x="490" y="312" width="220" height="40" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="338" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">2</text>
  <text x="655" y="338" font-size="15" fill="#141421" text-anchor="middle">× 1</text>
  <rect x="490" y="352" width="220" height="40" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="378" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">1</text>
  <text x="655" y="378" font-size="15" fill="#141421" text-anchor="middle">× 3</text>
  <rect x="490" y="392" width="220" height="40" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="418" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">2</text>
  <text x="655" y="418" font-size="15" fill="#141421" text-anchor="middle">× 1</text>
  <rect x="490" y="432" width="220" height="40" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="458" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">3</text>
  <text x="655" y="458" font-size="15" fill="#141421" text-anchor="middle">× 4</text>
  <rect x="490" y="472" width="220" height="40" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="498" font-size="16" fill="#141421" font-weight="700" text-anchor="middle">2</text>
  <text x="655" y="498" font-size="15" fill="#141421" text-anchor="middle">× 1</text>
  <text x="600" y="612" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">11 values → 6 runs</text>
  <rect x="800" y="170" width="340" height="470" fill="#FFFFFF"/>
  <text x="820" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">Sorted first</text>
  <text x="820" y="220" font-size="13" fill="#70706F" text-anchor="start">Equal values next to each other</text>
  <rect x="830" y="240" width="120" height="32" fill="#141421"/>
  <text x="890.0" y="261" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Color ID</text>
  <rect x="830" y="272" width="120" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="291.0" font-size="14" fill="#141421" text-anchor="middle">1</text>
  <rect x="830" y="300" width="120" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="319.0" font-size="14" fill="#141421" text-anchor="middle">1</text>
  <rect x="830" y="328" width="120" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="347.0" font-size="14" fill="#141421" text-anchor="middle">1</text>
  <rect x="830" y="356" width="120" height="28" fill="#FDE9DC" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="375.0" font-size="14" fill="#141421" text-anchor="middle">1</text>
  <rect x="830" y="384" width="120" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="403.0" font-size="14" fill="#141421" text-anchor="middle">2</text>
  <rect x="830" y="412" width="120" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="431.0" font-size="14" fill="#141421" text-anchor="middle">2</text>
  <rect x="830" y="440" width="120" height="28" fill="#C9DCE7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="459.0" font-size="14" fill="#141421" text-anchor="middle">2</text>
  <rect x="830" y="468" width="120" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="487.0" font-size="14" fill="#141421" text-anchor="middle">3</text>
  <rect x="830" y="496" width="120" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="515.0" font-size="14" fill="#141421" text-anchor="middle">3</text>
  <rect x="830" y="524" width="120" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="543.0" font-size="14" fill="#141421" text-anchor="middle">3</text>
  <rect x="830" y="552" width="120" height="28" fill="#D7D8D8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="890.0" y="571.0" font-size="14" fill="#141421" text-anchor="middle">3</text>
  <path d="M960 276 L968 276 L968 380 L960 380" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="980" y="333.0" font-size="15" fill="#141421" font-weight="700" text-anchor="start">1 × 4</text>
  <path d="M960 388 L968 388 L968 464 L960 464" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="980" y="431.0" font-size="15" fill="#141421" font-weight="700" text-anchor="start">2 × 3</text>
  <path d="M960 472 L968 472 L968 576 L960 576" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="980" y="529.0" font-size="15" fill="#141421" font-weight="700" text-anchor="start">3 × 4</text>
  <text x="970" y="612" font-size="15" fill="#141421" font-weight="700" text-anchor="middle">11 values → 3 runs</text>
  <line x1="404" y1="400" x2="424" y2="400" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <line x1="774" y1="400" x2="794" y2="400" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="60" y="670" width="520" height="76" fill="#FFFFFF"/>
  <rect x="60" y="670" width="4" height="76" fill="#F39454"/>
  <circle cx="94" cy="708.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M89 708.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="120" y="702.0" font-size="17" font-weight="700" fill="#141421">Few unique values</text>
  <text x="120" y="726.0" font-size="13" fill="#70706F">Long runs of the same value.</text>
  <rect x="620" y="670" width="520" height="76" fill="#FFFFFF"/>
  <rect x="620" y="670" width="4" height="76" fill="#F39454"/>
  <circle cx="654" cy="708.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M649 708.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="680" y="702.0" font-size="17" font-weight="700" fill="#141421">Sorted data</text>
  <text x="680" y="726.0" font-size="13" fill="#70706F">Equal values next to each other.</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="796" x2="1140" y2="796" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="832" font-size="20" fill="#141421">Sort well, <tspan font-weight="700">get longer runs.</tspan></text>
  <text x="1140" y="831" font-size="14" fill="#70706F" text-anchor="end">Segments: 1M rows, 8M with large format</text>
</svg>
