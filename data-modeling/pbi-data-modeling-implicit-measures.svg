<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <!-- measure (calculator) icon -->
    <g id="calc">
      <rect x="0" y="0" width="11" height="14" rx="1.5" fill="none" stroke="#141421" stroke-width="1.5"/>
      <rect x="2.5" y="2.5" width="6" height="3" fill="#141421"/>
      <g fill="#141421"><rect x="2.5" y="7.5" width="2" height="2"/><rect x="6.5" y="7.5" width="2" height="2"/><rect x="2.5" y="10.5" width="2" height="2"/><rect x="6.5" y="10.5" width="2" height="2"/></g>
    </g>
    <g id="wells">
      <text x="0" y="12" font-size="12" fill="#70706F">Rows</text>
      <rect x="0" y="18" width="230" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-dasharray="4 3"/>
      <text x="10" y="37" font-size="12" fill="#70706F">Add data fields here</text>
      <text x="0" y="64" font-size="12" fill="#70706F">Columns</text>
      <rect x="0" y="70" width="230" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-dasharray="4 3"/>
      <text x="10" y="89" font-size="12" fill="#70706F">Add data fields here</text>
      <text x="0" y="116" font-size="12" fill="#70706F">Values</text>
      <rect x="0" y="122" width="230" height="28" fill="#FFFFFF" stroke="#F39454" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Implicit measures</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421">Implicit measures</text>
  <rect x="336" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Drag a numeric column into a visual and Power BI silently applies its default summarization.</text>

  <line x1="600" y1="170" x2="600" y2="500" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== LEFT: implicit ==================== -->
  <text x="60" y="190" font-size="20" font-weight="700" fill="#141421">Implicit <tspan font-size="14" font-weight="400" fill="#70706F">Power BI decides</tspan></text>

  <!-- data pane -->
  <rect x="60" y="210" width="190" height="32" fill="#141421"/>
  <text x="74" y="231" font-size="14" font-weight="700" fill="#F6F6F6">Sales</text>
  <rect x="60" y="242" width="190" height="112" fill="#FFFFFF"/>
  <rect x="60" y="298" width="190" height="28" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8"><line x1="60" y1="270" x2="250" y2="270"/><line x1="60" y1="298" x2="250" y2="298"/><line x1="60" y1="326" x2="250" y2="326"/></g>
  <g font-size="14" fill="#141421">
    <text x="94" y="261">Date</text>
    <text x="94" y="289">ProductID</text>
    <text x="76" y="317" font-weight="700">Σ</text><text x="94" y="317" font-weight="700">Revenue</text>
    <text x="76" y="345">Σ</text><text x="94" y="345">Units</text>
  </g>

  <!-- drag -->
  <path d="M252 312 C290 312, 290 352, 316 352" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#arrow-head)"/>
  <text x="284" y="300" font-size="12" font-weight="700" fill="#F39454" text-anchor="middle">drag</text>

  <!-- field wells -->
  <use href="#wells" x="320" y="210"/>
  <rect x="328" y="337" width="152" height="20" rx="3" fill="#F39454" fill-opacity="0.18"/>
  <text x="336" y="352" font-size="13" font-weight="700" fill="#141421">Sum of Revenue ▾</text>

  <!-- result -->
  <rect x="60" y="378" width="490" height="40" fill="#141421"/>
  <text x="80" y="404" font-size="16" fill="#F6F6F6"><tspan fill="#F39454" font-weight="700">Σ</tspan>  Sum of Revenue</text>
  <text x="530" y="404" font-size="13" fill="#D7D8D8" text-anchor="end">no DAX, no name, no format</text>

  <g font-size="14" fill="#141421">
    <text x="60" y="450"><tspan fill="#F39454" font-weight="700">✗</tspan>  Power BI picks the summarization (SUM by default)</text>
    <text x="60" y="472"><tspan fill="#F39454" font-weight="700">✗</tspan>  Not reusable in other measures</text>
    <text x="60" y="494"><tspan fill="#F39454" font-weight="700">✗</tspan>  Accidental sums of numeric columns, e.g. a price or a year</text>
  </g>

  <!-- ==================== RIGHT: explicit ==================== -->
  <text x="650" y="190" font-size="20" font-weight="700" fill="#141421">Explicit <tspan font-size="14" font-weight="400" fill="#70706F">you decide</tspan></text>

  <!-- data pane -->
  <rect x="650" y="210" width="190" height="32" fill="#141421"/>
  <text x="664" y="231" font-size="14" font-weight="700" fill="#F6F6F6">Sales</text>
  <rect x="650" y="242" width="190" height="112" fill="#FFFFFF"/>
  <rect x="650" y="326" width="190" height="28" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8"><line x1="650" y1="270" x2="840" y2="270"/><line x1="650" y1="298" x2="840" y2="298"/><line x1="650" y1="326" x2="840" y2="326"/></g>
  <g font-size="14" fill="#141421">
    <text x="684" y="261">Date</text>
    <text x="684" y="289">ProductID</text>
    <text x="684" y="317" fill="#70706F">Revenue</text><text x="828" y="317" font-size="11" fill="#70706F" text-anchor="end">hidden</text>
    <text x="684" y="345" font-weight="700">Sales Amount</text>
  </g>
  <use href="#calc" x="666" y="333"/>

  <!-- drag -->
  <path d="M842 340 C870 340, 880 352, 906 352" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#arrow-head)"/>

  <!-- field wells -->
  <use href="#wells" x="910" y="210"/>
  <rect x="918" y="337" width="130" height="20" rx="3" fill="#F39454" fill-opacity="0.18"/>
  <text x="926" y="352" font-size="13" font-weight="700" fill="#141421">Sales Amount</text>

  <!-- result -->
  <rect x="650" y="378" width="490" height="40" fill="#141421"/>
  <text x="670" y="404" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#F6F6F6">Sales Amount = <tspan fill="#F39454">SUM</tspan> ( <tspan fill="#C9DCE7">'Sales'[Revenue]</tspan> )</text>

  <g font-size="14" fill="#141421">
    <text x="650" y="450"><tspan fill="#F39454" font-weight="700">✓</tspan>  You choose the logic and the name</text>
    <text x="650" y="472"><tspan fill="#F39454" font-weight="700">✓</tspan>  Reusable as a building block in other measures</text>
    <text x="650" y="494"><tspan fill="#F39454" font-weight="700">✓</tspan>  Format, description and display folder in one place</text>
  </g>

  <!-- ==================== Discourage implicit measures ==================== -->
  <line x1="60" y1="516" x2="1140" y2="516" stroke="#D7D8D8" stroke-width="1"/>
  <use href="#brand-arrow" x="60" y="528"/>
  <text x="86" y="544" font-size="17" font-weight="700" fill="#141421">Discourage implicit measures</text>
  <text x="1140" y="544" font-size="13" fill="#70706F" text-anchor="end">BPA rule "Do not summarize numeric columns": severity 3, important</text>

  <rect x="60" y="556" width="520" height="44" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="76" y="574" font-size="12" fill="#70706F">Per column · Model view › Properties › Advanced</text>
  <text x="76" y="592" font-size="14" fill="#141421"><tspan font-weight="700">Summarize By</tspan> = None</text>
  <rect x="620" y="556" width="520" height="44" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="636" y="574" font-size="12" fill="#70706F">Whole model · Tabular Editor</text>
  <text x="636" y="592" font-size="14" fill="#141421"><tspan font-weight="700">Discourage Implicit Measures</tspan> = True</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">Do not let Power BI decide: <tspan font-weight="700">write explicit measures</tspan>.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Next: Explicit measures</text>
</svg>
