<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Storage modes · Microsoft Fabric</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="202" lengthAdjust="spacing">Direct Lake</text>
  <rect x="270" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">VertiPaq reads Delta tables in OneLake directly: Import speed without copying the data at refresh.</text>
  <rect x="60" y="230" width="200" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="160.0" y="267.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Data preparation</text>
  <text x="160.0" y="288.0" font-size="13" fill="#70706F" text-anchor="middle">pipelines, notebooks, SQL</text>
  <rect x="370" y="230" width="220" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <ellipse cx="480.0" cy="230" rx="110.0" ry="8" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1"/>
  <text x="480.0" y="267.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Delta tables</text>
  <text x="480.0" y="288.0" font-size="13" fill="#70706F" text-anchor="middle">Parquet files in OneLake</text>
  <rect x="720" y="230" width="220" height="80" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="830.0" y="267.0" font-size="16" font-weight="700" fill="#F6F6F6" text-anchor="middle">Direct Lake model</text>
  <text x="830.0" y="288.0" font-size="13" fill="#A9AAAA" text-anchor="middle">VertiPaq engine</text>
  <rect x="1010" y="230" width="130" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="1075.0" y="267.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Report</text>
  <text x="1075.0" y="288.0" font-size="13" fill="#70706F" text-anchor="middle">visuals</text>
  <line x1="264" y1="270" x2="364" y2="270" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="288.5" y="237.0" width="51" height="26" fill="#F6F6F6"/>
  <text x="314.0" y="256.0" font-size="13" fill="#70706F" text-anchor="middle">write</text>
  <line x1="594" y1="250" x2="714" y2="250" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="621.5" y="211.0" width="65" height="26" fill="#F6F6F6"/>
  <text x="654.0" y="230.0" font-size="13" fill="#70706F" text-anchor="middle">framing</text>
  <line x1="594" y1="292" x2="714" y2="292" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="607.5" y="307.0" width="93" height="26" fill="#F6F6F6"/>
  <text x="654.0" y="326.0" font-size="13" fill="#70706F" text-anchor="middle">transcoding</text>
  <rect x="60" y="380" width="346" height="96" fill="#FFFFFF"/>
  <circle cx="88" cy="408" r="12" fill="#F39454"/><text x="88" y="413" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="108" y="414" font-size="16" fill="#141421" font-weight="700" text-anchor="start">Framing</text>
  <text x="76" y="442" font-size="13" fill="#141421" text-anchor="start">A refresh only reads the Delta log and points the</text>
  <text x="76" y="461" font-size="13" fill="#141421" text-anchor="start">model to the latest files. It takes seconds.</text>
  <rect x="427" y="380" width="346" height="96" fill="#FFFFFF"/>
  <circle cx="455" cy="408" r="12" fill="#F39454"/><text x="455" y="413" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="475" y="414" font-size="16" fill="#141421" font-weight="700" text-anchor="start">Transcoding</text>
  <text x="443" y="442" font-size="13" fill="#141421" text-anchor="start">Columns are loaded into memory on demand,</text>
  <text x="443" y="461" font-size="13" fill="#141421" text-anchor="start">the first time a query needs them.</text>
  <rect x="794" y="380" width="346" height="96" fill="#FFFFFF"/>
  <circle cx="822" cy="408" r="12" fill="#F39454"/><text x="822" y="413" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="842" y="414" font-size="16" fill="#141421" font-weight="700" text-anchor="start">Residency</text>
  <text x="810" y="442" font-size="13" fill="#141421" text-anchor="start">Used columns stay warm in memory. After framing,</text>
  <text x="810" y="461" font-size="13" fill="#141421" text-anchor="start">only changed data is reloaded.</text>
  <line x1="944" y1="270" x2="1004" y2="270" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="526" x2="1140" y2="526" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="562" font-size="20" fill="#141421">Import-like speed, <tspan font-weight="700">no data copy at refresh.</tspan></text>
  <text x="1140" y="561" font-size="14" fill="#70706F" text-anchor="end">Requires a Fabric capacity (F SKU)</text>
</svg>
