<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Aggregation after iteration</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="450" lengthAdjust="spacing">Aggregation after iteration</text>
  <rect x="518" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">SUMX first evaluates an expression row by row, then aggregates the results.</text>

  <!-- ==================== Step labels ==================== -->
  <g font-size="15" font-weight="700" fill="#141421">
    <circle cx="91" cy="195" r="11" fill="#F39454"/><text x="91" y="200" font-size="13" text-anchor="middle">1</text>
    <text x="110" y="200">Iterate row by row</text>
    <circle cx="491" cy="195" r="11" fill="#F39454"/><text x="491" y="200" font-size="13" text-anchor="middle">2</text>
    <text x="510" y="200">Evaluate expression</text>
    <circle cx="771" cy="195" r="11" fill="#F39454"/><text x="771" y="200" font-size="13" text-anchor="middle">3</text>
    <text x="790" y="200">Store in RAM</text>
    <circle cx="971" cy="195" r="11" fill="#F39454"/><text x="971" y="200" font-size="13" text-anchor="middle">4</text>
    <text x="990" y="200">Aggregate</text>
  </g>

  <!-- ==================== 1. Sales table ==================== -->
  <rect x="80" y="220" width="360" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="96" y="243">Product</text>
    <text x="320" y="243" text-anchor="end">Order Quantity</text>
    <text x="428" y="243" text-anchor="end">Unit Price</text>
  </g>
  <rect x="80" y="256" width="360" height="170" fill="#FFFFFF"/>
  <rect x="80" y="324" width="360" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="80" y1="290" x2="440" y2="290"/><line x1="80" y1="324" x2="440" y2="324"/>
    <line x1="80" y1="358" x2="440" y2="358"/><line x1="80" y1="392" x2="440" y2="392"/>
  </g>
  <g font-size="15" fill="#141421">
    <text x="96" y="278">Bike</text><text x="320" y="278" text-anchor="end">3</text><text x="428" y="278" text-anchor="end">€20</text>
    <text x="96" y="312">Helmet</text><text x="320" y="312" text-anchor="end">1</text><text x="428" y="312" text-anchor="end">€30</text>
    <text x="96" y="346" font-weight="700">Gloves</text><text x="320" y="346" text-anchor="end" font-weight="700">5</text><text x="428" y="346" text-anchor="end" font-weight="700">€10</text>
    <text x="96" y="380">Lights</text><text x="320" y="380" text-anchor="end">2</text><text x="428" y="380" text-anchor="end">€5</text>
    <text x="96" y="414">Bottle</text><text x="320" y="414" text-anchor="end">4</text><text x="428" y="414" text-anchor="end">€5</text>
  </g>
  <rect x="80" y="324" width="360" height="34" fill="none" stroke="#F39454" stroke-width="2"/>

  <!-- row pointer walking down the table -->
  <line x1="66" y1="264" x2="66" y2="414" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>
  <path d="M60 333 L74 341 L60 349 Z" fill="#F39454"/>

  <text x="80" y="448" font-size="13" fill="#70706F">Row context: one row at a time</text>

  <!-- ==================== 2. Evaluate ==================== -->
  <line x1="442" y1="341" x2="478" y2="341" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="590" y="294" font-size="13" fill="#70706F" text-anchor="middle">Order Quantity × Unit Price</text>
  <rect x="480" y="306" width="220" height="70" fill="#FFFFFF" stroke="#F39454" stroke-width="2"/>
  <text x="590" y="326" font-size="12" fill="#70706F" text-anchor="middle">Current row: Gloves</text>
  <text x="590" y="358" font-size="22" font-weight="700" fill="#141421" text-anchor="middle">5 × €10 = €50</text>
  <text x="590" y="448" font-size="13" fill="#70706F" text-anchor="middle">One scalar value per row</text>

  <!-- ==================== 3. Temporary column ==================== -->
  <line x1="702" y1="341" x2="758" y2="341" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <rect x="760" y="220" width="140" height="36" fill="#C9DCE7"/>
  <text x="776" y="243" font-size="14" font-weight="700" fill="#141421">Temp (RAM)</text>
  <rect x="760" y="256" width="140" height="170" fill="#C9DCE7" fill-opacity="0.35"/>
  <rect x="760" y="324" width="140" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="760" y1="290" x2="900" y2="290"/><line x1="760" y1="324" x2="900" y2="324"/>
    <line x1="760" y1="358" x2="900" y2="358"/><line x1="760" y1="392" x2="900" y2="392"/>
  </g>
  <g font-size="15" fill="#141421" text-anchor="end">
    <text x="884" y="278">€60</text>
    <text x="884" y="312">€30</text>
    <text x="884" y="346" font-weight="700">€50</text>
    <text x="884" y="380">€10</text>
    <text x="884" y="414">€20</text>
  </g>
  <rect x="760" y="324" width="140" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="760" y="220" width="140" height="206" fill="none" stroke="#70706F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="830" y="448" font-size="13" fill="#70706F" text-anchor="middle">Temporary column</text>

  <!-- ==================== 4. Aggregate ==================== -->
  <path d="M906 258 H918 V424 H906" fill="none" stroke="#F39454" stroke-width="2"/>
  <line x1="918" y1="341" x2="958" y2="341" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <rect x="960" y="296" width="180" height="90" fill="#141421"/>
  <text x="980" y="324" font-size="13" font-weight="700" fill="#F39454">SUM</text>
  <text x="980" y="368" font-size="36" font-weight="700" fill="#F6F6F6">€170</text>
  <text x="1140" y="448" font-size="13" fill="#70706F" text-anchor="end">60 + 30 + 50 + 10 + 20</text>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="470" width="1080" height="44" fill="#141421"/>
  <text x="80" y="498" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#F6F6F6">Sales Amount = <tspan fill="#F39454">SUMX</tspan> ( Sales, Sales[Order Quantity] * Sales[Unit Price] )</text>

  <!-- ==================== Explanation ==================== -->
  <use href="#brand-arrow" x="60" y="532"/>
  <text x="86" y="548" font-size="17" font-weight="700" fill="#141421">Iteration <tspan font-size="14" font-weight="400" fill="#70706F">steps 1 to 3</tspan></text>
  <text x="60" y="574" font-size="14" fill="#141421">SUMX walks the Sales table in row context and evaluates the</text>
  <text x="60" y="594" font-size="14" fill="#141421">expression for every row, setting each result aside in RAM.</text>

  <use href="#brand-arrow" x="650" y="532"/>
  <text x="676" y="548" font-size="17" font-weight="700" fill="#141421">Aggregation <tspan font-size="14" font-weight="400" fill="#70706F">step 4</tspan></text>
  <text x="650" y="574" font-size="14" fill="#141421">Only when every row has been iterated, the temporary column</text>
  <text x="650" y="594" font-size="14" fill="#141421">is summed up. The X in SUMX stands for the iterator.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">First iterate, <tspan font-weight="700">then aggregate.</tspan></text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">The same applies to AVERAGEX, MINX, MAXX and COUNTX.</text>
</svg>
