<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Model best practices</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="464" lengthAdjust="spacing">Bi-directional relationships</text>
  <rect x="532" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Every relationship set to Both lets filters travel in unexpected directions.</text>
  <rect x="60" y="170" width="520" height="380" fill="#FFFFFF"/>
  <text x="80" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">All relationships set to Both</text>
  <text x="80" y="220" font-size="13" fill="#70706F" text-anchor="start">Filters travel through every table</text>
  <rect x="80" y="300" width="80" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="120" y="329" font-size="14" fill="#141421" font-weight="700" text-anchor="middle">Customer</text>
  <rect x="216" y="300" width="80" height="48" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="256" y="329" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Sales</text>
  <rect x="352" y="300" width="80" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="392" y="329" font-size="14" fill="#141421" font-weight="700" text-anchor="middle">Product</text>
  <rect x="488" y="300" width="80" height="48" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="528" y="329" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Budget</text>
  <line x1="164" y1="324" x2="212" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="212,324 203,319 203,329" fill="#F39454"/>
  <polygon points="164,324 173,319 173,329" fill="#F39454"/>
  <text x="188.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Both</text>
  <line x1="300" y1="324" x2="348" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="348,324 339,319 339,329" fill="#F39454"/>
  <polygon points="300,324 309,319 309,329" fill="#F39454"/>
  <text x="324.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Both</text>
  <line x1="436" y1="324" x2="484" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="484,324 475,319 475,329" fill="#F39454"/>
  <polygon points="436,324 445,319 445,329" fill="#F39454"/>
  <text x="460.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Both</text>
  <path d="M120 352 C120 430 528 430 528 356" fill="none" stroke="#141421" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head-sand)"/>
  <text x="320" y="446" font-size="13" fill="#141421" font-weight="700" text-anchor="middle">a Customer filter reaches Budget</text>
  <text x="320" y="464" font-size="13" fill="#70706F" text-anchor="middle">through Sales and Product</text>
  <circle cx="94" cy="518" r="11" fill="#F6F6F6" stroke="#141421" stroke-width="2"/><path d="M89.5 513.5 l9 9 m0 -9 l-9 9" stroke="#141421" stroke-width="2.5"/>
  <text x="116" y="523" font-size="13" fill="#141421" font-weight="700" text-anchor="start">slower, ambiguous, slicers filter each other</text>
  <rect x="620" y="170" width="520" height="380" fill="#FFFFFF"/>
  <text x="640" y="200" font-size="17" fill="#141421" font-weight="700" text-anchor="start">Single direction by default</text>
  <text x="640" y="220" font-size="13" fill="#70706F" text-anchor="start">Both only inside one measure</text>
  <rect x="640" y="300" width="80" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="680" y="329" font-size="14" fill="#141421" font-weight="700" text-anchor="middle">Customer</text>
  <rect x="776" y="300" width="80" height="48" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="816" y="329" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Sales</text>
  <rect x="912" y="300" width="80" height="48" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="952" y="329" font-size="14" fill="#141421" font-weight="700" text-anchor="middle">Product</text>
  <rect x="1048" y="300" width="80" height="48" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="1088" y="329" font-size="14" fill="#F6F6F6" font-weight="700" text-anchor="middle">Budget</text>
  <line x1="724" y1="324" x2="772" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="772,324 763,319 763,329" fill="#F39454"/>
  <line x1="860" y1="324" x2="908" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="860,324 869,319 869,329" fill="#F39454"/>
  <line x1="996" y1="324" x2="1044" y2="324" stroke="#F39454" stroke-width="2"/>
  <polygon points="1044,324 1035,319 1035,329" fill="#F39454"/>
  <text x="748.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Single</text>
  <text x="884.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Single</text>
  <text x="1020.0" y="316" font-size="12" fill="#70706F" text-anchor="middle">Single</text>
  <rect x="640" y="380" width="480" height="104" fill="#141421"/>
  <text x="656" y="402" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F39454" xml:space="preserve">Customers with Sales =</text>
  <text x="656" y="420" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F6F6F6" xml:space="preserve">CALCULATE (</text>
  <text x="656" y="438" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F6F6F6" xml:space="preserve">    DISTINCTCOUNT ( Customer[Customer Key] ),</text>
  <text x="656" y="456" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F6F6F6" xml:space="preserve">    CROSSFILTER ( Sales[Customer Key],</text>
  <text x="656" y="474" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F6F6F6" xml:space="preserve">        Customer[Customer Key], BOTH ) )</text>
  <circle cx="654" cy="518" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M649 518 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="676" y="523" font-size="13" fill="#141421" font-weight="700" text-anchor="start">fast, predictable, Both only where needed</text>
  <rect x="60" y="580" width="520" height="76" fill="#FFFFFF"/>
  <rect x="60" y="580" width="4" height="76" fill="#F39454"/>
  <circle cx="94" cy="618.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M89 618.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="120" y="612.0" font-size="17" font-weight="700" fill="#141421">Bridge tables in many-to-many</text>
  <text x="120" y="636.0" font-size="13" fill="#70706F">A valid reason for Both.</text>
  <rect x="620" y="580" width="520" height="76" fill="#FFFFFF"/>
  <rect x="620" y="580" width="4" height="76" fill="#F39454"/>
  <circle cx="654" cy="618.0" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M649 618.0 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="680" y="612.0" font-size="17" font-weight="700" fill="#141421">Security filter in both directions</text>
  <text x="680" y="636.0" font-size="13" fill="#70706F">A separate option for row-level security.</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="706" x2="1140" y2="706" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="742" font-size="20" fill="#141421">Single direction by default, <tspan font-weight="700">CROSSFILTER when needed.</tspan></text>
  <text x="1140" y="741" font-size="14" fill="#70706F" text-anchor="end">Filters flow from 1 to <tspan font-family="Arial, sans-serif">*</tspan> by design</text>
</svg>
