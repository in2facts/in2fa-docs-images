<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-iron" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B5B6B6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="770" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Many-to-many: M2M v1 (correct)</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="520" lengthAdjust="spacing">Context transition in FILTER</text>
  <rect x="588" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">CALCULATE turns the current row of FILTER into a filter on Dim_Account: only Paul remains visible.</text>

  <!-- ==================== Tables ==================== -->
  <g font-size="13" font-weight="700" fill="#70706F">
    <text x="60" y="196">Dim_Customer</text>
    <text x="330" y="196">Bridge_Account_Customer</text>
    <text x="860" y="196">Dim_Account</text>
  </g>
  <rect x="60" y="208" width="170" height="36" fill="#141421"/>
  <text x="76" y="231" font-size="14" font-weight="700" fill="#F6F6F6">Customer</text>
  <rect x="60" y="244" width="170" height="136" fill="#FFFFFF"/>
  <text x="76" y="266" font-size="15" fill="#141421">Mark</text>
  <line x1="60" y1="278" x2="230" y2="278" stroke="#D7D8D8"/>
  <rect x="60" y="278" width="170" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="76" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="60" y1="312" x2="230" y2="312" stroke="#D7D8D8"/>
  <text x="76" y="334" font-size="15" fill="#141421">Robert</text>
  <line x1="60" y1="346" x2="230" y2="346" stroke="#D7D8D8"/>
  <text x="76" y="368" font-size="15" fill="#141421">Luke</text>
  <rect x="330" y="208" width="330" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6"><text x="346" y="231">Customer</text><text x="486" y="231">Account</text></g>
  <rect x="330" y="244" width="330" height="272" fill="#FFFFFF"/>
  <line x1="470" y1="244" x2="470" y2="516" stroke="#D7D8D8"/>
  <text x="346" y="266" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="266" font-size="15" fill="#A9AAAA">Mark</text>
  <line x1="330" y1="278" x2="660" y2="278" stroke="#D7D8D8"/>
  <rect x="330" y="278" width="330" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="346" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text><text x="486" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="330" y1="312" x2="660" y2="312" stroke="#D7D8D8"/>
  <text x="346" y="334" font-size="15" fill="#A9AAAA">Robert</text><text x="486" y="334" font-size="15" fill="#A9AAAA">Robert</text>
  <line x1="330" y1="346" x2="660" y2="346" stroke="#D7D8D8"/>
  <text x="346" y="368" font-size="15" fill="#A9AAAA">Luke</text><text x="486" y="368" font-size="15" fill="#A9AAAA">Luke</text>
  <line x1="330" y1="380" x2="660" y2="380" stroke="#D7D8D8"/>
  <text x="346" y="402" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="402" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="330" y1="414" x2="660" y2="414" stroke="#D7D8D8"/>
  <text x="346" y="436" font-size="15" fill="#A9AAAA">Robert</text><text x="486" y="436" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="330" y1="448" x2="660" y2="448" stroke="#D7D8D8"/>
  <text x="346" y="470" font-size="15" fill="#A9AAAA">Mark</text><text x="486" y="470" font-size="15" fill="#A9AAAA">Mark - Paul</text>
  <line x1="330" y1="482" x2="660" y2="482" stroke="#D7D8D8"/>
  <rect x="330" y="482" width="330" height="34" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="672" y="497" font-size="12" fill="#70706F">removed by the</text><text x="672" y="511" font-size="12" fill="#70706F">Dim_Account filter</text>
  <text x="346" y="504" font-size="15" fill="#A9AAAA">Paul</text><text x="486" y="504" font-size="15" fill="#A9AAAA">Mark - Paul</text>
  <rect x="860" y="208" width="200" height="36" fill="#141421"/>
  <text x="876" y="231" font-size="14" font-weight="700" fill="#F6F6F6">Account</text>
  <text x="1100" y="231" font-size="12" font-weight="700" fill="#70706F" text-anchor="middle">COUNTROWS</text>
  <path d="M1030 219 h16 l-6 7 v7 l-4 -2 v-5 z" fill="#F39454"/>
  <rect x="860" y="244" width="200" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="876" y="266" font-size="15" font-weight="700" fill="#141421">Paul</text>
  <rect x="1072" y="250" width="56" height="22" rx="11" fill="#F39454"/><text x="1100" y="266" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1 &gt; 0</text>
  <text x="860" y="300" font-size="13" fill="#70706F">Filter: Account = Paul (current row)</text>
  <text x="860" y="342" font-size="13" font-weight="700" fill="#141421">All 6 iterations of FILTER</text>
  <line x1="860" y1="350" x2="1128" y2="350" stroke="#D7D8D8"/>
  <text x="860" y="370" font-size="13" fill="#A9AAAA">Mark</text><text x="1100" y="370" font-size="13" fill="#A9AAAA" text-anchor="middle">0</text>
  <text x="860" y="390" font-size="13" fill="#141421" font-weight="700">Paul</text><text x="1100" y="390" font-size="13" fill="#141421" font-weight="700" text-anchor="middle">1</text>
  <text x="860" y="410" font-size="13" fill="#A9AAAA">Robert</text><text x="1100" y="410" font-size="13" fill="#A9AAAA" text-anchor="middle">0</text>
  <text x="860" y="430" font-size="13" fill="#A9AAAA">Luke</text><text x="1100" y="430" font-size="13" fill="#A9AAAA" text-anchor="middle">0</text>
  <text x="860" y="450" font-size="13" fill="#A9AAAA">Mark - Robert</text><text x="1100" y="450" font-size="13" fill="#A9AAAA" text-anchor="middle">0</text>
  <text x="860" y="470" font-size="13" fill="#141421" font-weight="700">Mark - Paul</text><text x="1100" y="470" font-size="13" fill="#141421" font-weight="700" text-anchor="middle">1</text>

  <!-- step 1: report filter, step 2: propagation to the bridge -->
  <path d="M234 295.0 H324" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M280 295.0 V499.0 H324" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="46" cy="295.0" r="11" fill="#F39454"/><text x="46" y="300.0" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="280" cy="390" r="11" fill="#F39454"/><text x="280" y="395" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>

  <!-- step 3: the Dim_Account filter (Paul) flows to the bridge -->
  <path d="M856 261.0 C790 261.0 730 295.0 666 295.0" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <circle cx="760" cy="230" r="11" fill="#F39454"/><text x="760" y="235" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="778" y="235" font-size="12" font-weight="700" fill="#141421">CALCULATE</text>

  <!-- captions -->
  <g font-size="13" fill="#70706F">
    <text x="60" y="402">Report filter: Customer = Paul</text>
    <text x="330" y="538">1 row visible: Customer = Paul and Account = Paul</text>
    <text x="860" y="496">2 of 6 accounts survive FILTER</text>
  </g>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="560" width="1080" height="44" fill="#141421"/>
  <text x="80" y="588" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F6F6F6" xml:space="preserve">FILTER ( VALUES ( Dim_Account[ID_Account] ), <tspan fill="#F39454">CALCULATE</tspan> ( COUNTROWS ( Bridge_Account_Customer ) ) &gt; 0 )</text>

  <!-- ==================== Explanation ==================== -->
  <circle cx="71" cy="632" r="11" fill="#F39454"/><text x="71" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="90" y="638" font-size="17" font-weight="700" fill="#141421">Report filter</text>
  <text x="60" y="664" font-size="14" fill="#141421">The report filters Dim_Customer</text>
  <text x="60" y="683" font-size="14" fill="#141421">to a single customer: Paul.</text>
  <circle cx="441" cy="632" r="11" fill="#F39454"/><text x="441" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="460" y="638" font-size="17" font-weight="700" fill="#141421">Propagation</text>
  <text x="430" y="664" font-size="14" fill="#141421">The filter flows to the bridge:</text>
  <text x="430" y="683" font-size="14" fill="#141421">only Paul's 2 rows stay visible.</text>
  <circle cx="811" cy="632" r="11" fill="#F39454"/><text x="811" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="830" y="638" font-size="17" font-weight="700" fill="#141421">Context transition</text>
  <text x="800" y="664" font-size="14" fill="#141421">CALCULATE turns the current row into a</text>
  <text x="800" y="683" font-size="14" fill="#141421">filter on Dim_Account (Paul): 1 bridge</text>
  <text x="800" y="702" font-size="14" fill="#141421">row remains, so 1 &gt; 0.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="752" font-size="20" fill="#141421">CALCULATE inside FILTER: <tspan font-weight="700">row context becomes filter context.</tspan></text>
  <text x="1140" y="751" font-size="14" fill="#70706F" text-anchor="end">Result: Paul = 7,308 + 150 = 7,458</text>
</svg>
