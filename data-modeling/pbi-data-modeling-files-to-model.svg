<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#141421"/>
    </marker>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="730" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Exercise model</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="330" lengthAdjust="spacing">From files to model</text>
  <rect x="398" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">One workbook delivers the dimensions, eight sales files are appended into one fact table.</text>

  <!-- column titles -->
  <g font-size="13" font-weight="700" fill="#70706F">
    <text x="60" y="178">1 · Source files</text>
    <text x="410" y="178">2 · Power Query</text>
    <text x="640" y="178">3 · Semantic model</text>
  </g>

  <!-- ==================== Sources ==================== -->
  <path d="M60 196 h10 l4 4 h14 v16 h-28 z" fill="#F39454"/>
  <text x="98" y="212" font-size="17" font-weight="700" fill="#141421">USSales</text>
  <path d="M80 232 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="242" width="14" height="6" fill="#C9DCE7"/>
  <text x="106" y="247" font-size="14" fill="#141421">bi_dimensions.xlsx</text>
  <path d="M80 262 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="272" width="14" height="6" fill="#F39454"/>
  <text x="106" y="277" font-size="14" fill="#141421">Sales.csv</text>
  <rect x="246" y="230" width="84" height="22" rx="11" fill="#C9DCE7"/><text x="288" y="245" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">Dimensions</text>
  <rect x="246" y="260" width="84" height="22" rx="11" fill="#F39454"/><text x="288" y="275" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">Fact</text>
  <path d="M60 324 h10 l4 4 h14 v16 h-28 z" fill="#F39454"/>
  <text x="98" y="340" font-size="17" font-weight="700" fill="#141421">InternationalSales</text>
  <path d="M80 360 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="370" width="14" height="6" fill="#F39454"/>
  <text x="106" y="375" font-size="14" fill="#141421">Australia.csv</text>
  <path d="M80 390 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="400" width="14" height="6" fill="#F39454"/>
  <text x="106" y="405" font-size="14" fill="#141421">Canada.csv</text>
  <path d="M80 420 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="430" width="14" height="6" fill="#F39454"/>
  <text x="106" y="435" font-size="14" fill="#141421">Germany.csv</text>
  <path d="M80 450 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="460" width="14" height="6" fill="#F39454"/>
  <text x="106" y="465" font-size="14" fill="#141421">Japan.csv</text>
  <path d="M80 480 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="490" width="14" height="6" fill="#F39454"/>
  <text x="106" y="495" font-size="14" fill="#141421">Mexico.csv</text>
  <path d="M80 510 h11 l5 5 v15 h-16 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.3" stroke-linejoin="round"/><rect x="77" y="520" width="14" height="6" fill="#F39454"/>
  <text x="106" y="525" font-size="14" fill="#141421">Nigeria.csv</text>
  <path d="M236 362 h8 v172 h-8" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="246" y="437" width="84" height="22" rx="11" fill="#F39454"/><text x="288" y="452" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">Fact</text>

  <!-- ==================== Power Query ==================== -->
  <rect x="410" y="206" width="190" height="104" fill="#FFFFFF"/>
  <rect x="410" y="206" width="4" height="104" fill="#C9DCE7"/>
  <text x="426" y="230" font-size="15" font-weight="700" fill="#141421">Import sheets</text>
  <text x="426" y="252" font-size="12.5" fill="#141421">bi_dimensions.xlsx</text>
  <text x="426" y="270" font-size="12.5" fill="#141421">→ Manufacturer, Product,</text>
  <text x="426" y="288" font-size="12.5" fill="#141421">   Geography</text>
  <rect x="410" y="392" width="190" height="112" fill="#FFFFFF"/>
  <rect x="410" y="392" width="4" height="112" fill="#F39454"/>
  <text x="426" y="416" font-size="15" font-weight="700" fill="#141421">Append</text>
  <text x="426" y="438" font-size="12.5" fill="#141421">Sales.csv + 6 country files</text>
  <text x="426" y="456" font-size="12.5" fill="#141421">→ 1 Sales table</text>
  <text x="426" y="474" font-size="12.5" fill="#141421">Same columns in every file</text>
  <path d="M334 241 H404" fill="none" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>
  <path d="M334 271 C370 271 370 430 404 430" fill="none" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>
  <path d="M334 448 H404" fill="none" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>

  <!-- ==================== Semantic model ==================== -->
  <rect x="640" y="196" width="200" height="88" fill="#FFFFFF"/>
  <rect x="640" y="196" width="200" height="32" fill="#141421"/>
  <text x="654" y="217" font-size="14" font-weight="700" fill="#F6F6F6">Manufacturer</text>
  <text x="654" y="248" font-size="13" fill="#141421">ManufacturerID</text>
  <text x="654" y="272" font-size="13" fill="#141421">Manufacturer</text>
  <rect x="640" y="324" width="200" height="112" fill="#FFFFFF"/>
  <rect x="640" y="324" width="200" height="32" fill="#141421"/>
  <text x="654" y="345" font-size="14" font-weight="700" fill="#F6F6F6">Product</text>
  <text x="654" y="376" font-size="13" fill="#141421">ProductID</text>
  <text x="654" y="400" font-size="13" fill="#141421">Product</text>
  <text x="654" y="424" font-size="13" fill="#141421">ManufacturerID</text>
  <rect x="640" y="520" width="200" height="112" fill="#FFFFFF"/>
  <rect x="640" y="520" width="200" height="32" fill="#141421"/>
  <text x="654" y="541" font-size="14" font-weight="700" fill="#F6F6F6">Calendar</text>
  <text x="830" y="540" font-size="11" fill="#D7D8D8" text-anchor="end">created in Power BI</text>
  <text x="654" y="572" font-size="13" fill="#141421">Date</text>
  <text x="654" y="596" font-size="13" fill="#141421">Year</text>
  <text x="654" y="620" font-size="13" fill="#141421">Month</text>
  <rect x="940" y="196" width="200" height="88" fill="#FFFFFF"/>
  <rect x="940" y="196" width="200" height="32" fill="#141421"/>
  <text x="954" y="217" font-size="14" font-weight="700" fill="#F6F6F6">Geography</text>
  <text x="954" y="248" font-size="13" fill="#141421">ZIP - Country</text>
  <text x="954" y="272" font-size="13" fill="#141421">Country</text>
  <rect x="940" y="340" width="200" height="136" fill="#FFFFFF" stroke="#F39454" stroke-width="2"/>
  <rect x="940" y="340" width="200" height="32" fill="#F39454"/>
  <text x="954" y="361" font-size="14" font-weight="700" fill="#141421">Sales</text>
  <g transform="translate(1114 346) scale(0.55)"><rect width="28" height="36" rx="4" fill="#141421"/><rect x="4" y="4" width="20" height="8" rx="1.5" fill="#F6F6F6"/><rect x="4.0" y="16.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="11.3" y="16.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="18.6" y="16.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="4.0" y="22.5" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="11.3" y="22.5" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="18.6" y="22.5" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="4.0" y="29.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="11.3" y="29.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/><rect x="18.6" y="29.0" width="5" height="4.5" rx="1" fill="#F6F6F6"/></g>
  <text x="954" y="392" font-size="13" fill="#70706F">ProductID</text>
  <path d="M1112 388 q7 -6 14 0 q-7 6 -14 0 z" fill="none" stroke="#A9AAAA" stroke-width="1.3"/><line x1="1113" y1="393" x2="1125" y2="383" stroke="#A9AAAA" stroke-width="1.3"/>
  <text x="954" y="416" font-size="13" fill="#70706F">Date</text>
  <path d="M1112 412 q7 -6 14 0 q-7 6 -14 0 z" fill="none" stroke="#A9AAAA" stroke-width="1.3"/><line x1="1113" y1="417" x2="1125" y2="407" stroke="#A9AAAA" stroke-width="1.3"/>
  <text x="954" y="440" font-size="13" fill="#70706F">ZIP - Country</text>
  <path d="M1112 436 q7 -6 14 0 q-7 6 -14 0 z" fill="none" stroke="#A9AAAA" stroke-width="1.3"/><line x1="1113" y1="441" x2="1125" y2="431" stroke="#A9AAAA" stroke-width="1.3"/>
  <text x="954" y="464" font-size="13" fill="#70706F">Amount</text>
  <path d="M1112 460 q7 -6 14 0 q-7 6 -14 0 z" fill="none" stroke="#A9AAAA" stroke-width="1.3"/><line x1="1113" y1="465" x2="1125" y2="455" stroke="#A9AAAA" stroke-width="1.3"/>
  <path d="M604 236 H634" fill="none" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>
  <path d="M604 460 H934" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <!-- relationships -->
  <line x1="740" y1="286" x2="740" y2="320" stroke="#141421" stroke-width="2" marker-end="url(#head)"/>
  <text x="748" y="298" font-size="14" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="748" y="321" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <text x="766" y="308.0" font-size="11" fill="#70706F">snowflake</text>
  <path d="M842 376 H890.0 V392 H936" fill="none" stroke="#141421" stroke-width="2" marker-end="url(#head)"/>
  <text x="850" y="370" font-size="14" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="930" y="391" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="end">*</text>
  <line x1="1040" y1="286" x2="1040" y2="336" stroke="#141421" stroke-width="2" marker-end="url(#head)"/>
  <text x="1048" y="298" font-size="14" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="1048" y="337" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <path d="M842 572 H1000 V480" fill="none" stroke="#141421" stroke-width="2" marker-end="url(#head)"/>
  <text x="850" y="566" font-size="14" font-weight="700" fill="#141421" text-anchor="start">1</text>
  <text x="1008" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="start">*</text>
  <text x="1026" y="498" font-size="12" fill="#70706F">hidden columns:</text>
  <text x="1026" y="514" font-size="12" fill="#70706F">Sales = measure table</text>

  <!-- legend -->
  <g font-size="13" fill="#141421">
    <rect x="60" y="626" width="14" height="14" fill="#C9DCE7"/><text x="82" y="638">dimension source</text>
    <rect x="210" y="626" width="14" height="14" fill="#F39454"/><text x="232" y="638">fact source</text>
    <text x="340" y="638">Relationships: 1 → <tspan font-family="Arial, sans-serif" font-weight="700">*</tspan>, filters flow from the dimensions to Sales</text>
  </g>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="660" x2="1140" y2="660" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="696" font-size="20" fill="#141421">Many files, <tspan font-weight="700">one star schema.</tspan></text>
  <text x="1140" y="695" font-size="14" fill="#70706F" text-anchor="end">4 dimensions · 1 fact table</text>
</svg>
