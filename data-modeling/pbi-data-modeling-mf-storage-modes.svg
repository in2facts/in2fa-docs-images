<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Storage modes</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="259" lengthAdjust="spacing">Storage modes</text>
  <rect x="327" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Each table decides where its data lives and which engine answers the query.</text>
  <rect x="60" y="300" width="170" height="64" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="145.0" y="329.0" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">Report</text>
  <text x="145.0" y="350.0" font-size="13" fill="#70706F" text-anchor="middle">visuals</text>
  <rect x="330" y="290" width="200" height="84" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="430.0" y="329.0" font-size="16" font-weight="700" fill="#F6F6F6" text-anchor="middle">Semantic model</text>
  <text x="430.0" y="350.0" font-size="13" fill="#A9AAAA" text-anchor="middle">tables in modes</text>
  <line x1="234" y1="332" x2="324" y2="332" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="236.0" y="367.0" width="86" height="46" fill="#F6F6F6"/>
  <text x="279" y="386.0" font-size="13" fill="#70706F" text-anchor="middle">live</text>
  <text x="279" y="406.0" font-size="13" fill="#70706F" text-anchor="middle">connection</text>
  <line x1="534" y1="332" x2="640" y2="220" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="650" y="180" width="490" height="80" fill="#FFFFFF" stroke="#F39454" stroke-width="2" filter="url(#card)"/>
  <rect x="650" y="180" width="160" height="80" fill="#141421"/>
  <text x="730" y="227" font-size="17" fill="#F6F6F6" font-weight="700" text-anchor="middle">Import</text>
  <text x="830" y="214" font-size="14" fill="#141421" text-anchor="start">Data: copied, compressed</text>
  <text x="830" y="238" font-size="14" fill="#70706F" text-anchor="start">Query: VertiPaq · in memory</text>
  <line x1="534" y1="332" x2="640" y2="320" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="650" y="280" width="490" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="650" y="280" width="160" height="80" fill="#141421"/>
  <text x="730" y="327" font-size="17" fill="#F6F6F6" font-weight="700" text-anchor="middle">DirectQuery</text>
  <text x="830" y="314" font-size="14" fill="#141421" text-anchor="start">Data: stays in the source</text>
  <text x="830" y="338" font-size="14" fill="#70706F" text-anchor="start">Query: SQL / KQL on the source</text>
  <line x1="534" y1="332" x2="640" y2="420" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="650" y="380" width="490" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="650" y="380" width="160" height="80" fill="#141421"/>
  <text x="730" y="427" font-size="17" fill="#F6F6F6" font-weight="700" text-anchor="middle">Dual</text>
  <text x="830" y="414" font-size="14" fill="#141421" text-anchor="start">Data: imported and DirectQuery</text>
  <text x="830" y="438" font-size="14" fill="#70706F" text-anchor="start">Query: decided per query</text>
  <line x1="534" y1="332" x2="640" y2="520" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="650" y="480" width="490" height="80" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="650" y="480" width="160" height="80" fill="#141421"/>
  <text x="730" y="527" font-size="17" fill="#F6F6F6" font-weight="700" text-anchor="middle">Direct Lake</text>
  <text x="830" y="514" font-size="14" fill="#141421" text-anchor="start">Data: Delta tables in OneLake</text>
  <text x="830" y="538" font-size="14" fill="#70706F" text-anchor="start">Query: VertiPaq · on demand</text>
  <text x="60" y="440" font-size="13" fill="#141421" font-weight="700" text-anchor="start">Composite model</text>
  <text x="60" y="462" font-size="13" fill="#70706F" text-anchor="start">Mixes storage modes, or several</text>
  <text x="60" y="482" font-size="13" fill="#70706F" text-anchor="start">DirectQuery sources, in one model.</text>
  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="606" x2="1140" y2="606" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="642" font-size="20" fill="#141421">Import first, <tspan font-weight="700">Direct Lake for Fabric, DirectQuery for real time.</tspan></text>
  <text x="1140" y="641" font-size="14" fill="#70706F" text-anchor="end">Properties › Advanced › Storage mode</text>
</svg>
