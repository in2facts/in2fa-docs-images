<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="axis-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <!-- broken time axis with ticks; Feb 2016 = 200..520, Feb 2017 = 760..1080 -->
    <g id="axis">
      <line x1="200" y1="0" x2="526" y2="0" stroke="#70706F" stroke-width="1.5"/>
      <line x1="754" y1="0" x2="1130" y2="0" stroke="#70706F" stroke-width="1.5" marker-end="url(#axis-head)"/>
      <path d="M528 8 L540 -8 M536 8 L548 -8" stroke="#70706F" stroke-width="1.5"/>
      <path d="M734 8 L746 -8 M742 8 L754 -8" stroke="#70706F" stroke-width="1.5"/>
      <text x="640" y="5" font-size="12" fill="#70706F" text-anchor="middle">12 months later</text>
      <g stroke="#70706F" stroke-width="1.5">
        <line x1="200" y1="-6" x2="200" y2="6"/><line x1="520" y1="-6" x2="520" y2="6"/>
        <line x1="760" y1="-6" x2="760" y2="6"/><line x1="1080" y1="-6" x2="1080" y2="6"/>
      </g>
      <g font-size="12" fill="#70706F" text-anchor="middle">
        <text x="200" y="22">01-Feb-2016</text><text x="520" y="22">29-Feb-2016</text>
        <text x="760" y="22">01-Feb-2017</text><text x="1080" y="22">28-Feb-2017</text>
      </g>
      <text x="1140" y="-8" font-size="12" fill="#70706F" text-anchor="end">time</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Time intelligence offsets</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="581" lengthAdjust="spacing">DATEADD vs PARALLELPERIOD</text>
  <rect x="649" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Same arguments, different behavior: DATEADD only shifts, PARALLELPERIOD extends first and then shifts.</text>

  <!-- ==================== DATEADD ==================== -->
  <text x="60" y="194" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#141421"><tspan fill="#F39454" font-weight="700">DATEADD</tspan> ( DATE ( 2017, 2, 28 ), -12, MONTH )</text>
  <rect x="1010" y="176" width="130" height="26" rx="13" fill="#C9DCE7"/>
  <text x="1075" y="194" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">only shifts</text>
  <text x="60" y="220" font-size="13" fill="#70706F">-12 MONTH, -4 QUARTER and -1 YEAR all return the same date.</text>

  <path d="M1074 322 C1074 250, 503 250, 503 320" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-head)"/>
  <text x="790" y="262" font-size="14" font-weight="700" fill="#F39454" text-anchor="middle">shift -12 MONTH</text>
  <use href="#axis" x="0" y="330"/>
  <circle cx="1074" cy="330" r="6" fill="#141421"/>
  <circle cx="503" cy="330" r="7" fill="#F39454" stroke="#141421" stroke-width="1.5"/>
  <text x="490" y="314" font-size="13" font-weight="700" fill="#141421" text-anchor="end">result: 28-Feb-2016</text>
  <text x="1068" y="314" font-size="12" fill="#141421" text-anchor="end">28-Feb-2017</text>

  <line x1="60" y1="384" x2="1140" y2="384" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== PARALLELPERIOD ==================== -->
  <text x="60" y="414" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#141421"><tspan fill="#F39454" font-weight="700">PARALLELPERIOD</tspan> ( DATE ( 2017, 2, 28 ), -12, MONTH )</text>
  <rect x="990" y="396" width="150" height="26" rx="13" fill="#F39454" fill-opacity="0.3"/>
  <text x="1065" y="414" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">extend + shift</text>
  <text x="60" y="440" font-size="13" fill="#70706F">The 3rd argument decides the extension: MONTH ≠ QUARTER ≠ YEAR.</text>

  <!-- step 2: extended month -->
  <rect x="760" y="520" width="320" height="14" fill="#F39454" fill-opacity="0.35" stroke="#F39454" stroke-width="1.5"/>
  <!-- step 3: shifted month -->
  <rect x="200" y="520" width="320" height="14" fill="#F39454"/>
  <path d="M780 516 C780 466, 440 466, 440 514" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-head)"/>
  <use href="#axis" x="0" y="540"/>
  <circle cx="1074" cy="540" r="6" fill="#141421"/>

  <g font-size="13" font-weight="700" fill="#141421">
    <circle cx="1002" cy="476" r="9" fill="#141421"/><text x="1002" y="480" fill="#F6F6F6" text-anchor="middle" font-size="11">1</text>
    <text x="1016" y="481">min – max: 28-Feb</text>
    <circle cx="846" cy="506" r="9" fill="#141421"/><text x="846" y="510" fill="#F6F6F6" text-anchor="middle" font-size="11">2</text>
    <text x="860" y="511">extend to the entire MONTH</text>
    <circle cx="560" cy="466" r="9" fill="#141421"/><text x="560" y="470" fill="#F6F6F6" text-anchor="middle" font-size="11">3</text>
    <text x="574" y="471" fill="#F39454">shift -12 MONTH</text>
  </g>
  <text x="200" y="510" font-size="13" font-weight="700" fill="#141421">result: 01-Feb-2016 → 29-Feb-2016</text>

  <text x="60" y="596" font-size="13" fill="#70706F">PARALLELPERIOD always returns full periods: with QUARTER it would return the whole Q1 2016, with YEAR the whole of 2016.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">DATEADD <tspan font-weight="700">shifts</tspan>. PARALLELPERIOD <tspan font-weight="700">extends</tspan>, then shifts.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Next: Rolling 12 months</text>
</svg>
