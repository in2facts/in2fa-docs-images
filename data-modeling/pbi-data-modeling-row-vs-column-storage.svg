<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="860" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Storage engines</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="392" lengthAdjust="spacing">Row vs column storage</text>
  <rect x="460" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The same table, stored in two ways. The query SUM ( Price ) shows why analytics prefers columns.</text>

  <!-- ==================== Row oriented ==================== -->
  <rect x="60" y="170" width="520" height="330" fill="#FFFFFF"/>
  <text x="80" y="200" font-size="17" font-weight="700" fill="#141421">SQL Server Database Engine</text>
  <text x="80" y="220" font-size="13" fill="#70706F">Row oriented: 1 block per row</text>
  <rect x="140" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="190.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Date</text>
  <rect x="240" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="290.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Product</text>
  <rect x="340" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="390.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Customer</text>
  <rect x="440" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="490.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Price</text>
  <text x="80" y="301" font-size="12" fill="#70706F">block 1</text>
  <rect x="140" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="190.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">01-01</text>
  <rect x="240" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="290.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="340" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="390.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">Paul</text>
  <rect x="440" y="280" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="490.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="140" y="280" width="400" height="32" fill="#F39454" fill-opacity="0.12" stroke="#F39454" stroke-width="2"/>
  <text x="80" y="343" font-size="12" fill="#70706F">block 2</text>
  <rect x="140" y="322" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="190.0" y="343.0" font-size="14" fill="#141421" text-anchor="middle">01-01</text>
  <rect x="240" y="322" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="290.0" y="343.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="340" y="322" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="390.0" y="343.0" font-size="14" fill="#141421" text-anchor="middle">Mark</text>
  <rect x="440" y="322" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="490.0" y="343.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="140" y="322" width="400" height="32" fill="#F39454" fill-opacity="0.12" stroke="#F39454" stroke-width="2"/>
  <text x="80" y="385" font-size="12" fill="#70706F">block 3</text>
  <rect x="140" y="364" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="190.0" y="385.0" font-size="14" fill="#141421" text-anchor="middle">02-01</text>
  <rect x="240" y="364" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="290.0" y="385.0" font-size="14" fill="#141421" text-anchor="middle">Helmet</text>
  <rect x="340" y="364" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="390.0" y="385.0" font-size="14" fill="#141421" text-anchor="middle">Paul</text>
  <rect x="440" y="364" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="490.0" y="385.0" font-size="14" fill="#141421" text-anchor="middle">30</text>
  <rect x="140" y="364" width="400" height="32" fill="#F39454" fill-opacity="0.12" stroke="#F39454" stroke-width="2"/>
  <text x="80" y="427" font-size="12" fill="#70706F">block 4</text>
  <rect x="140" y="406" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="190.0" y="427.0" font-size="14" fill="#141421" text-anchor="middle">02-01</text>
  <rect x="240" y="406" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="290.0" y="427.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="340" y="406" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="390.0" y="427.0" font-size="14" fill="#141421" text-anchor="middle">Luke</text>
  <rect x="440" y="406" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="490.0" y="427.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="140" y="406" width="400" height="32" fill="#F39454" fill-opacity="0.12" stroke="#F39454" stroke-width="2"/>
  <text x="80" y="486" font-size="14" fill="#141421"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13">SUM ( Price )</tspan> reads <tspan font-weight="700">4 blocks × 4 columns = 16 values</tspan></text>

  <!-- ==================== Column oriented ==================== -->
  <rect x="620" y="170" width="520" height="330" fill="#FFFFFF"/>
  <text x="640" y="200" font-size="17" font-weight="700" fill="#141421">SQL Server Analysis Services <tspan font-weight="400" fill="#70706F">(SSAS)</tspan></text>
  <text x="640" y="220" font-size="13" fill="#70706F">Column oriented: 1 block per column</text>
  <rect x="640" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="690.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Date</text>
  <rect x="640" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="690.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">01-01</text>
  <rect x="640" y="312" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="690.0" y="333.0" font-size="14" fill="#141421" text-anchor="middle">01-01</text>
  <rect x="640" y="344" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="690.0" y="365.0" font-size="14" fill="#141421" text-anchor="middle">02-01</text>
  <rect x="640" y="376" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="690.0" y="397.0" font-size="14" fill="#141421" text-anchor="middle">02-01</text>
  <rect x="640" y="280" width="100" height="128" fill="none" stroke="#70706F" stroke-width="1.5"/>
  <text x="690.0" y="426" font-size="12" fill="#70706F" text-anchor="middle">block 1</text>
  <rect x="760" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="810.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Product</text>
  <rect x="760" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="810.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="760" y="312" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="810.0" y="333.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="760" y="344" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="810.0" y="365.0" font-size="14" fill="#141421" text-anchor="middle">Helmet</text>
  <rect x="760" y="376" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="810.0" y="397.0" font-size="14" fill="#141421" text-anchor="middle">Bike</text>
  <rect x="760" y="280" width="100" height="128" fill="none" stroke="#70706F" stroke-width="1.5"/>
  <text x="810.0" y="426" font-size="12" fill="#70706F" text-anchor="middle">block 2</text>
  <rect x="880" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="930.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Customer</text>
  <rect x="880" y="280" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="930.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">Paul</text>
  <rect x="880" y="312" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="930.0" y="333.0" font-size="14" fill="#141421" text-anchor="middle">Mark</text>
  <rect x="880" y="344" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="930.0" y="365.0" font-size="14" fill="#141421" text-anchor="middle">Paul</text>
  <rect x="880" y="376" width="100" height="32" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1.5"/><text x="930.0" y="397.0" font-size="14" fill="#141421" text-anchor="middle">Luke</text>
  <rect x="880" y="280" width="100" height="128" fill="none" stroke="#70706F" stroke-width="1.5"/>
  <text x="930.0" y="426" font-size="12" fill="#70706F" text-anchor="middle">block 3</text>
  <rect x="1000" y="236" width="100" height="32" fill="#141421" stroke="#141421" stroke-width="1.5"/><text x="1050.0" y="257.0" font-size="14" fill="#F6F6F6" text-anchor="middle" font-weight="700">Price</text>
  <rect x="1000" y="280" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="1050.0" y="301.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="1000" y="312" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="1050.0" y="333.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="1000" y="344" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="1050.0" y="365.0" font-size="14" fill="#141421" text-anchor="middle">30</text>
  <rect x="1000" y="376" width="100" height="32" fill="#F39454" stroke="#D7D8D8" stroke-width="1.5"/><text x="1050.0" y="397.0" font-size="14" fill="#141421" text-anchor="middle">100</text>
  <rect x="1000" y="280" width="100" height="128" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="1050.0" y="426" font-size="12" fill="#70706F" text-anchor="middle">block 4</text>
  <text x="640" y="460" font-size="12" fill="#70706F">Product: Bike ×3, Helmet ×1 → only 2 distinct values, so the column compresses well.</text>
  <text x="640" y="486" font-size="14" fill="#141421"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13">SUM ( Price )</tspan> reads <tspan font-weight="700">1 column = 4 values</tspan></text>

  <!-- ==================== SQL Server family ==================== -->
  <rect x="60" y="534" width="1080" height="30" fill="#141421"/>
  <text x="76" y="554" font-size="15" font-weight="700" fill="#F6F6F6">SQL Server <tspan font-weight="400" fill="#D7D8D8">components and their Power BI counterpart</tspan></text>
  <rect x="60" y="574" width="230" height="200" fill="#FFFFFF"/>
  <circle cx="84" cy="600" r="12" fill="#F39454"/><text x="84" y="605" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="106" y="606" font-size="17" font-weight="700" fill="#141421">DB Engine</text>
  <text x="76" y="632" font-size="12" fill="#70706F">SQL Server Database Engine</text>
  <text x="76" y="660" font-size="13" fill="#141421">Row oriented (OLTP): stores</text>
  <text x="76" y="679" font-size="13" fill="#141421">and updates transactions.</text>
  <rect x="60" y="734" width="230" height="40" fill="#C9DCE7"/>
  <text x="76" y="759" font-size="13" fill="#141421">≈ Power BI: <tspan font-weight="700">data source</tspan></text>
  <rect x="310" y="574" width="230" height="200" fill="#FFFFFF"/>
  <circle cx="334" cy="600" r="12" fill="#F39454"/><text x="334" y="605" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="356" y="606" font-size="17" font-weight="700" fill="#141421">SSIS</text>
  <text x="326" y="632" font-size="12" fill="#70706F">SQL Server Integration Services</text>
  <text x="326" y="660" font-size="13" fill="#141421">ETL: extract, transform and</text>
  <text x="326" y="679" font-size="13" fill="#141421">load the data.</text>
  <rect x="310" y="734" width="230" height="40" fill="#C9DCE7"/>
  <text x="326" y="759" font-size="13" fill="#141421">≈ Power BI: <tspan font-weight="700">Power Query</tspan></text>
  <rect x="560" y="574" width="230" height="200" fill="#FFFFFF"/>
  <circle cx="584" cy="600" r="12" fill="#F39454"/><text x="584" y="605" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="606" y="606" font-size="17" font-weight="700" fill="#141421">SSRS</text>
  <text x="576" y="632" font-size="12" fill="#70706F">SQL Server Reporting Services</text>
  <text x="576" y="660" font-size="13" fill="#141421">Reports built on top of</text>
  <text x="576" y="679" font-size="13" fill="#141421">the data.</text>
  <rect x="560" y="734" width="230" height="40" fill="#C9DCE7"/>
  <text x="576" y="759" font-size="13" fill="#141421">≈ Power BI: <tspan font-weight="700">report pages (Desktop)</tspan></text>
  <rect x="810" y="574" width="330" height="200" fill="#FFFFFF"/>
  <circle cx="834" cy="600" r="12" fill="#F39454"/><text x="834" y="605" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="856" y="606" font-size="17" font-weight="700" fill="#141421">SSAS</text>
  <text x="826" y="632" font-size="12" fill="#70706F">SQL Server Analysis Services</text>
  <g transform="translate(828 646) scale(0.72)">
  <path d="M0 12 l22 -12 l22 12 l-22 12 z" fill="#C9DCE7" stroke="#141421" stroke-width="1.5"/><path d="M0 12 v26 l22 12 v-26 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.5"/><path d="M44 12 v26 l-22 12 v-26 z" fill="#D7D8D8" stroke="#141421" stroke-width="1.5"/>
  </g>
  <text x="874" y="660" font-size="14" fill="#141421"><tspan font-weight="700">4.1  MDX</tspan> · SSAS\OLAP cubes</text>
  <text x="874" y="678" font-size="12" fill="#70706F">multidimensional</text>
  <rect x="818" y="688" width="314" height="44" fill="#F39454" fill-opacity="0.18"/>
  <g transform="translate(828 692) scale(0.72)">
  <rect x="0" y="0" width="30" height="28" fill="#FFFFFF" stroke="#141421" stroke-width="1.5"/><rect x="0" y="0" width="30" height="7" fill="#F39454"/><line x1="15" y1="7" x2="15" y2="28" stroke="#141421" stroke-width="1"/>
  <rect x="16" y="14" width="30" height="28" fill="#FFFFFF" stroke="#141421" stroke-width="1.5"/><rect x="16" y="14" width="30" height="7" fill="#F39454"/><line x1="31" y1="21" x2="31" y2="42" stroke="#141421" stroke-width="1"/>
  </g>
  <text x="874" y="706" font-size="14" fill="#141421"><tspan font-weight="700">4.2  DAX</tspan> · SSAS\Tabular</text>
  <text x="874" y="724" font-size="12" fill="#70706F">2D: dim &amp; fact tables with relationships</text>
  <rect x="810" y="734" width="330" height="40" fill="#C9DCE7"/>
  <text x="826" y="759" font-size="13" fill="#141421">≈ Power BI: <tspan font-weight="700">semantic model (Tabular)</tspan></text>
  <rect x="810" y="574" width="330" height="200" fill="none" stroke="#F39454" stroke-width="2"/>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="800" x2="1140" y2="800" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="836" font-size="20" fill="#141421">Analytics reads few columns of many rows: <tspan font-weight="700">column storage wins.</tspan></text>
  <text x="1140" y="835" font-size="14" fill="#70706F" text-anchor="end">Power BI = Tabular + VertiPaq</text>
</svg>
