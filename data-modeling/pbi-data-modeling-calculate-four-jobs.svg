<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Calculate measures</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="500" lengthAdjust="spacing">The four jobs of CALCULATE</text>
  <rect x="568" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">One function, four jobs. The cards below follow the order in which CALCULATE executes them.</text>

  <!-- Formula -->
  <rect x="341.3" y="162" width="517.4" height="36" fill="#141421"/>
  <text x="361.3" y="185" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" textLength="477.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#F39454">Revenue Red =</tspan> CALCULATE ( [Revenue], Products[Color] = &quot;Red&quot; )</text>
  <circle cx="596.1" cy="214" r="9" fill="#F39454"/><text x="596.1" y="218.0" font-size="11" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="734.8" cy="214" r="9" fill="#F39454"/><text x="734.8" y="218.0" font-size="11" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="878.7" y="178" font-size="12" font-weight="700" fill="#141421">3 only in a row context</text>
  <text x="878.7" y="194" font-size="12" fill="#70706F">4 always, without extra code</text>

  <!-- ==================== Step 1: job 3 ==================== -->
  <rect x="60" y="240" width="255" height="350" fill="#FFFFFF"/>
  <circle cx="90.0" cy="272" r="14" fill="#F39454"/><text x="90.0" y="277.4" font-size="15" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="112" y="277" font-size="16" font-weight="700" fill="#141421">Context transition</text>
  <text x="299" y="262" font-size="11" fill="#A9AAAA" text-anchor="end">step 1</text>
  <text x="76" y="306" font-size="12" fill="#70706F">In a row context, the current row</text>
  <text x="76" y="322" font-size="12" fill="#70706F">is turned into a filter context.</text>
  <rect x="76" y="492" width="223" height="30" fill="#141421"/>
  <text x="88" y="512" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F6F6F6" xml:space="preserve">CALCULATE ( [Revenue] )</text>
  <text x="76" y="550" font-size="13" font-weight="700" fill="#141421">Every column becomes a filter.</text>
  <text x="76" y="568" font-size="12" fill="#70706F">A measure reference does this implicitly.</text>
  <line x1="317" y1="415" x2="331" y2="415" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="76" y="346" font-size="10.5" font-weight="700" fill="#A9AAAA">ROW CONTEXT: ONE ROW OF PRODUCTS</text>
  <rect x="76" y="354" width="92" height="24" fill="#F6F6F6" stroke="#141421" stroke-width="1"/>
  <text x="122.0" y="370" font-size="11" fill="#141421" text-anchor="middle">Mountain-100</text>
  <rect x="170" y="354" width="62" height="24" fill="#F6F6F6" stroke="#141421" stroke-width="1"/>
  <text x="201.0" y="370" font-size="11" fill="#141421" text-anchor="middle">Black</text>
  <rect x="234" y="354" width="65" height="24" fill="#F6F6F6" stroke="#141421" stroke-width="1"/>
  <text x="266.5" y="370" font-size="11" fill="#141421" text-anchor="middle">Bikes</text>
  <line x1="187" y1="382" x2="187" y2="408" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="197" y="399.0" font-size="11" font-weight="700" fill="#F39454">transition</text>
  <text x="76" y="424" font-size="10.5" font-weight="700" fill="#A9AAAA">FILTER CONTEXT</text>
  <rect x="76" y="432" width="140" height="22" fill="#FBD3B8"/>
  <path d="M83 438 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="99" y="447" font-size="11" font-weight="700" fill="#141421">Name = Mountain-100</text>
  <rect x="76" y="458" width="105" height="22" fill="#FBD3B8"/>
  <path d="M83 464 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="99" y="473" font-size="11" font-weight="700" fill="#141421">Color = Black</text>
  <rect x="185" y="458" width="114" height="22" fill="#FBD3B8"/>
  <path d="M192 464 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="208" y="473" font-size="11" font-weight="700" fill="#141421">Category = Bikes</text>

  <!-- ==================== Step 2: job 2 ==================== -->
  <rect x="335" y="240" width="255" height="350" fill="#FFFFFF"/>
  <circle cx="365.0" cy="272" r="14" fill="#F39454"/><text x="365.0" y="277.4" font-size="15" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="387" y="277" font-size="16" font-weight="700" fill="#141421">Manipulate</text>
  <text x="574" y="262" font-size="11" fill="#A9AAAA" text-anchor="end">step 2</text>
  <text x="351" y="306" font-size="12" fill="#70706F">The filter arguments change the</text>
  <text x="351" y="322" font-size="12" fill="#70706F">filter context before calculating.</text>
  <rect x="351" y="492" width="223" height="30" fill="#141421"/>
  <text x="363" y="512" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F6F6F6" xml:space="preserve">Products[Color] = "Red"</text>
  <text x="351" y="550" font-size="13" font-weight="700" fill="#141421">Neglect, replace or add.</text>
  <text x="351" y="568" font-size="12" fill="#70706F">Filters on other columns stay untouched.</text>
  <line x1="592" y1="415" x2="606" y2="415" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="351" y="346" font-size="10.5" font-weight="700" fill="#A9AAAA">BEFORE: FILTERS FROM THE REPORT</text>
  <rect x="351" y="354" width="105" height="22" fill="#FBD3B8"/>
  <path d="M358 360 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="374" y="369" font-size="11" font-weight="700" fill="#141421">Color = Blue</text>
  <rect x="462" y="354" width="112" height="22" fill="#FBD3B8"/>
  <path d="M469 360 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="485" y="369" font-size="11" font-weight="700" fill="#141421">Year = 2025</text>
  <line x1="403" y1="382" x2="403" y2="408" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="413" y="399.0" font-size="11" font-weight="700" fill="#F39454">replace</text>
  <line x1="518" y1="382" x2="518" y2="408" stroke="#A9AAAA" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="528" y="399" font-size="11" font-weight="700" fill="#70706F">respect</text>
  <text x="351" y="424" font-size="10.5" font-weight="700" fill="#A9AAAA">AFTER: FILTERS FOR THE CALCULATION</text>
  <rect x="351" y="432" width="105" height="22" fill="#F39454"/>
  <path d="M358 438 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="374" y="447" font-size="11" font-weight="700" fill="#141421">Color = Red</text>
  <rect x="462" y="432" width="112" height="22" fill="#FBD3B8"/>
  <path d="M469 438 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="485" y="447" font-size="11" font-weight="700" fill="#141421">Year = 2025</text>

  <!-- ==================== Step 3: job 4 ==================== -->
  <rect x="610" y="240" width="255" height="350" fill="#FFFFFF"/>
  <circle cx="640.0" cy="272" r="14" fill="#F39454"/><text x="640.0" y="277.4" font-size="15" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="662" y="277" font-size="16" font-weight="700" fill="#141421">Propagate</text>
  <text x="849" y="262" font-size="11" fill="#A9AAAA" text-anchor="end">step 3</text>
  <text x="626" y="306" font-size="12" fill="#70706F">The new filter context flows through</text>
  <text x="626" y="322" font-size="12" fill="#70706F">the relationships to every many-side.</text>
  <rect x="626" y="492" width="223" height="30" fill="#141421"/>
  <text x="638" y="512" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F6F6F6" xml:space="preserve">USERELATIONSHIP, CROSSFILTER</text>
  <text x="626" y="550" font-size="13" font-weight="700" fill="#141421">From the one-side to the many-side.</text>
  <text x="626" y="568" font-size="12" fill="#70706F">Optionally via another path or direction.</text>
  <line x1="867" y1="415" x2="881" y2="415" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="680" y="342" width="135" height="28" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="747.5" y="361" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">Categories</text>
  <line x1="747.5" y1="373" x2="747.5" y2="390" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="680" y="392" width="135" height="28" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <text x="747.5" y="411" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">Products</text>
  <line x1="747.5" y1="423" x2="747.5" y2="440" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="680" y="442" width="135" height="28" fill="#141421" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <text x="747.5" y="461" font-size="13" font-weight="700" fill="#F6F6F6" text-anchor="middle">Sales</text>
  <circle cx="658" cy="356" r="6" fill="#F39454"/>
  <text x="658" y="380" font-size="10.5" font-weight="700" fill="#F39454" text-anchor="middle">filter</text>
  <text x="747.5" y="486" font-size="11" fill="#70706F" text-anchor="middle">only the rows of Red products are left</text>

  <!-- ==================== Step 4: job 1 ==================== -->
  <rect x="885" y="240" width="255" height="350" fill="#FFFFFF"/>
  <circle cx="915.0" cy="272" r="14" fill="#F39454"/><text x="915.0" y="277.4" font-size="15" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="937" y="277" font-size="16" font-weight="700" fill="#141421">Calculate</text>
  <text x="1124" y="262" font-size="11" fill="#A9AAAA" text-anchor="end">step 4</text>
  <text x="901" y="306" font-size="12" fill="#70706F">The expression is evaluated last,</text>
  <text x="901" y="322" font-size="12" fill="#70706F">on the rows that are left in Sales.</text>
  <rect x="901" y="492" width="223" height="30" fill="#141421"/>
  <text x="913" y="512" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F6F6F6" xml:space="preserve">[Revenue]</text>
  <text x="901" y="550" font-size="13" font-weight="700" fill="#141421">The result of the measure.</text>
  <text x="901" y="568" font-size="12" fill="#70706F">Same formula, new filter context.</text>
  <text x="901" y="346" font-size="10.5" font-weight="700" fill="#A9AAAA">SALES AFTER FILTERING</text>
  <rect x="901" y="354" width="130" height="16" fill="#F6F6F6"/>
  <rect x="901" y="374" width="130" height="16" fill="#F39454"/>
  <rect x="901" y="394" width="130" height="16" fill="#F6F6F6"/>
  <rect x="901" y="414" width="130" height="16" fill="#F6F6F6"/>
  <rect x="901" y="434" width="130" height="16" fill="#F39454"/>
  <rect x="901" y="454" width="130" height="16" fill="#F6F6F6"/>
  <line x1="1037" y1="412" x2="1061" y2="412" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="1067" y="388" width="57" height="48" fill="#141421"/>
  <text x="1095.5" y="422" font-size="26" font-weight="700" fill="#F39454" text-anchor="middle">Σ</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="636" x2="1140" y2="636" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="672" font-size="20" fill="#141421">Transition, manipulate, propagate, <tspan font-weight="700">then calculate.</tspan></text>
  <text x="1140" y="671" font-size="14" fill="#70706F" text-anchor="end">Order of execution: 3 → 2 → 4 → 1</text>
</svg>
