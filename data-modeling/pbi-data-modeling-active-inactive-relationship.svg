<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A9AAAA"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Components of a data model</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="560" lengthAdjust="spacing">Active and inactive relationships</text>
  <rect x="628" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Two tables can share several relationships, but only one of them can be active at a time.</text>

  <!-- ==================== Left panel: model view ==================== -->
  <rect x="60" y="170" width="520" height="380" fill="#FFFFFF"/>
  <text x="80" y="202" font-size="18" fill="#141421" font-weight="700">In the model view</text>
  <text x="80" y="224" font-size="14" fill="#70706F">Date filters Sales through Order Date by default</text>

  <!-- Date table (dimension) -->
  <g filter="url(#card)">
    <rect x="100" y="296" width="150" height="148" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1"/>
  </g>
  <text x="116" y="322" font-size="16" font-weight="700" fill="#141421">Date</text>
  <line x1="100" y1="336" x2="250" y2="336" stroke="#D7D8D8" stroke-width="1"/>
  <rect x="100" y="336" width="4" height="36" fill="#F39454"/>
  <text x="116" y="359" font-size="14" font-weight="700" fill="#141421">Date</text>
  <text x="116" y="395" font-size="14" fill="#70706F">Year</text>
  <text x="116" y="431" font-size="14" fill="#70706F">Month</text>

  <!-- Sales table (fact) -->
  <g filter="url(#card)">
    <rect x="400" y="260" width="150" height="184" fill="#FFFFFF" stroke="#141421" stroke-width="1"/>
  </g>
  <rect x="400" y="260" width="150" height="40" fill="#141421"/>
  <text x="416" y="286" font-size="16" font-weight="700" fill="#F6F6F6">Sales</text>
  <text x="416" y="323" font-size="14" font-weight="700" fill="#141421">Order Date</text>
  <text x="416" y="359" font-size="14" fill="#70706F">Customer Key</text>
  <line x1="400" y1="372" x2="550" y2="372" stroke="#D7D8D8" stroke-width="1"/>
  <text x="416" y="395" font-size="14" font-weight="700" fill="#141421">Ship Date</text>
  <text x="416" y="431" font-size="14" fill="#70706F">Amount</text>
  <line x1="400" y1="336" x2="550" y2="336" stroke="#D7D8D8" stroke-width="1"/>
  <line x1="400" y1="408" x2="550" y2="408" stroke="#D7D8D8" stroke-width="1"/>

  <!-- Active relationship: Date[Date] -> Sales[Order Date] -->
  <path d="M250 348 C 320 348, 330 318, 394 318" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <text x="262" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#141421">1</text>
  <text x="384" y="310" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#141421" text-anchor="end">*</text>

  <!-- Inactive relationship: Date[Date] -> Sales[Ship Date] -->
  <path d="M250 360 C 320 360, 330 390, 394 390" fill="none" stroke="#A9AAAA" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head-sand)"/>
  <text x="262" y="382" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#70706F">1</text>
  <text x="384" y="414" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#70706F" text-anchor="end">*</text>

  <!-- Legend -->
  <line x1="80" y1="486" x2="124" y2="486" stroke="#F39454" stroke-width="2.5"/>
  <text x="140" y="491" font-size="14" font-weight="700" fill="#141421">Active</text>
  <text x="214" y="491" font-size="14" fill="#70706F">solid line, filters every visual and measure</text>
  <line x1="80" y1="518" x2="124" y2="518" stroke="#A9AAAA" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="140" y="523" font-size="14" font-weight="700" fill="#141421">Inactive</text>
  <text x="214" y="523" font-size="14" fill="#70706F">dashed line, filters nothing until activated</text>

  <!-- ==================== Right panel: activate in a measure ==================== -->
  <rect x="620" y="170" width="520" height="380" fill="#FFFFFF"/>
  <text x="640" y="202" font-size="18" fill="#141421" font-weight="700">Activate it in a measure</text>
  <text x="640" y="224" font-size="14" fill="#70706F">USERELATIONSHIP switches the path for one calculation</text>

  <rect x="640" y="248" width="480" height="168" fill="#141421"/>
  <text x="658" y="276" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F39454" xml:space="preserve">Sales by Ship Date =</text>
  <text x="658" y="296" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">CALCULATE (</text>
  <text x="658" y="316" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">    [Sales],</text>
  <text x="658" y="336" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">    <tspan fill="#F39454" font-weight="700">USERELATIONSHIP</tspan> (</text>
  <text x="658" y="356" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">        Sales[Ship Date], 'Date'[Date]</text>
  <text x="658" y="376" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">    )</text>
  <text x="658" y="396" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#F6F6F6" xml:space="preserve">)</text>

  <circle cx="654" cy="456" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M649 456 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="676" y="452" font-size="14" font-weight="700" fill="#141421">Ship Date takes over inside this measure</text>
  <text x="676" y="470" font-size="13" fill="#70706F">Order Date is switched off for its evaluation only.</text>
  <circle cx="654" cy="510" r="11" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M649 510 l3.5 4 l6.5 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="676" y="506" font-size="14" font-weight="700" fill="#141421">All other measures keep using Order Date</text>
  <text x="676" y="524" font-size="13" fill="#70706F">The model itself does not change.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="606" x2="1140" y2="606" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="642" font-size="20" fill="#141421">One active path, <tspan font-weight="700">USERELATIONSHIP for the others.</tspan></text>
  <text x="1140" y="641" font-size="14" fill="#70706F" text-anchor="end">Solid = active · dashed = inactive</text>
</svg>
