  <text x="176" y="433" font-size="14" fill="#141421">15-Aug-2024</text>
  <rect x="300.0" y="419" width="523.3" height="20" rx="3" fill="#F39454"/>
  <text x="831.3" y="433" font-size="12" font-weight="700" fill="#141421">01-Jan → 15-Aug</text>
  <rect x="821.8" y="416" width="3" height="26" fill="#141421"/>
  <text x="176" y="461" font-size="14" fill="#141421">Aug-2024</text>
  <rect x="300.0" y="447" width="560.0" height="20" rx="3" fill="#F39454"/>
  <text x="868.0" y="461" font-size="12" font-weight="700" fill="#141421">01-Jan → 31-Aug</text>
  <rect x="858.5" y="444" width="3" height="26" fill="#141421"/>
  <text x="176" y="489" font-size="14" fill="#141421">2024</text>
  <rect x="300.0" y="475" width="840.0" height="20" rx="3" fill="#F39454"/>
  <text x="308.0" y="489" font-size="12" font-weight="700" fill="#141421">01-Jan → 31-Dec</text>
  <rect x="1138.5" y="472" width="3" height="26" fill="#141421"/>
  <text x="60" y="460" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#141421">DATESYTD</text>
  <text x="60" y="476" font-size="12" fill="#70706F">year to date</text>
  <g font-size="12" fill="#70706F">
    <rect x="300" y="512" width="22" height="12" rx="2" fill="#F39454"/><text x="330" y="522">dates kept by the filter</text>
    <rect x="490" y="510" width="3" height="16" fill="#141421"/><text x="502" y="522">last date of the selected period</text>
  </g>
  <use href="#brand-arrow" x="60" y="540"/>
  <text x="86" y="556" font-size="17" font-weight="700" fill="#141421">Filters, not calculations</text>
  <text x="60" y="580" font-size="14" fill="#141421">They start at the beginning of the month, quarter or year</text>
  <text x="60" y="598" font-size="14" fill="#141421">and end at the last date of the selection.</text>
  <rect x="650" y="540" width="490" height="60" fill="#141421"/>
  <text x="670" y="566" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F6F6F6">Revenue YTD = <tspan fill="#F39454">CALCULATE</tspan> ( [Revenue],</text>
  <text x="698" y="586" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F6F6F6"><tspan fill="#F39454">DATESYTD</tspan> ( <tspan fill="#C9DCE7">OrderDate[FullDate]</tspan> ) )</text>
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">From the start of the period <tspan font-weight="700">up to the last selected date</tspan>.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Next: Time intelligence offsets</text>
