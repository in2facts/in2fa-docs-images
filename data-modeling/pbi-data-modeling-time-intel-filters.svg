  <rect x="1138.5" y="272" width="3" height="26" fill="#141421"/>
  <text x="60" y="260" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#141421">DATESMTD</text>
  <text x="60" y="276" font-size="12" fill="#70706F">month to date</text>
