  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="281" lengthAdjust="spacing">Time intel filters</text>
  <rect x="349" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">They do not calculate: they only filter the calendar table, based on the period selected in the report.</text>
