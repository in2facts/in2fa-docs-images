  <text x="176" y="333" font-size="14" fill="#141421">15-Aug-2024</text>
  <rect x="717.7" y="319" width="105.6" height="20" rx="3" fill="#F39454"/>
  <text x="831.3" y="333" font-size="12" font-weight="700" fill="#141421">01-Jul → 15-Aug</text>
  <rect x="821.8" y="316" width="3" height="26" fill="#141421"/>
  <text x="176" y="361" font-size="14" fill="#141421">Aug-2024</text>
