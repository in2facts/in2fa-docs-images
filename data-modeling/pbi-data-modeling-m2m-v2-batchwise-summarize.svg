<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="770" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Many-to-many: M2M v2 (batchwise)</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="452" lengthAdjust="spacing">Batchwise with SUMMARIZE</text>
  <rect x="520" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">SUMMARIZE collects the filtered accounts from the bridge once, and CALCULATE applies them as one filter.</text>

  <!-- ==================== Tables ==================== -->
  <g font-size="13" font-weight="700" fill="#70706F">
    <text x="60" y="196">Dim_Customer</text>
    <text x="290" y="196">Bridge_Account_Customer</text>
    <text x="650" y="196">SUMMARIZE (RAM)</text>
    <text x="900" y="196">Dim_Account</text>
  </g>

  <!-- Dim_Customer -->
  <rect x="60" y="208" width="150" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6"><text x="76" y="231">Customer</text></g>
  <rect x="60" y="244" width="150" height="136" fill="#FFFFFF"/>
  <text x="76" y="266" font-size="15" fill="#A9AAAA">Mark</text>
  <line x1="60" y1="278" x2="210" y2="278" stroke="#D7D8D8"/>
  <rect x="60" y="278" width="150" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="76" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="60" y1="312" x2="210" y2="312" stroke="#D7D8D8"/>
  <text x="76" y="334" font-size="15" fill="#A9AAAA">Robert</text>
  <line x1="60" y1="346" x2="210" y2="346" stroke="#D7D8D8"/>
  <text x="76" y="368" font-size="15" fill="#A9AAAA">Luke</text>

  <!-- Bridge -->
  <rect x="290" y="208" width="300" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6"><text x="306" y="231">Customer</text><text x="436" y="231">Account</text></g>
  <rect x="290" y="244" width="300" height="272" fill="#FFFFFF"/>
  <line x1="420" y1="244" x2="420" y2="516" stroke="#D7D8D8"/>
  <text x="306" y="266" font-size="15" fill="#A9AAAA">Mark</text><text x="436" y="266" font-size="15" fill="#A9AAAA">Mark</text>
  <line x1="290" y1="278" x2="590" y2="278" stroke="#D7D8D8"/>
  <rect x="290" y="278" width="300" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="306" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text><text x="436" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="290" y1="312" x2="590" y2="312" stroke="#D7D8D8"/>
  <text x="306" y="334" font-size="15" fill="#A9AAAA">Robert</text><text x="436" y="334" font-size="15" fill="#A9AAAA">Robert</text>
  <line x1="290" y1="346" x2="590" y2="346" stroke="#D7D8D8"/>
  <text x="306" y="368" font-size="15" fill="#A9AAAA">Luke</text><text x="436" y="368" font-size="15" fill="#A9AAAA">Luke</text>
  <line x1="290" y1="380" x2="590" y2="380" stroke="#D7D8D8"/>
  <text x="306" y="402" font-size="15" fill="#A9AAAA">Mark</text><text x="436" y="402" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="290" y1="414" x2="590" y2="414" stroke="#D7D8D8"/>
  <text x="306" y="436" font-size="15" fill="#A9AAAA">Robert</text><text x="436" y="436" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="290" y1="448" x2="590" y2="448" stroke="#D7D8D8"/>
  <text x="306" y="470" font-size="15" fill="#A9AAAA">Mark</text><text x="436" y="470" font-size="15" fill="#A9AAAA">Mark - Paul</text>
  <line x1="290" y1="482" x2="590" y2="482" stroke="#D7D8D8"/>
  <rect x="290" y="482" width="300" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="306" y="504" font-size="15" fill="#141421" font-weight="700">Paul</text><text x="436" y="504" font-size="15" fill="#141421" font-weight="700">Mark - Paul</text>

  <!-- SUMMARIZE: distinct ID_Account of the visible bridge rows -->
  <rect x="650" y="208" width="160" height="36" fill="#C9DCE7"/>
  <g font-size="14" font-weight="700" fill="#141421"><text x="666" y="231">ID_Account</text></g>
  <rect x="650" y="244" width="160" height="68" fill="#FFFFFF"/>
  <rect x="650" y="244" width="160" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="666" y="266" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="650" y1="278" x2="810" y2="278" stroke="#D7D8D8"/>
  <rect x="650" y="278" width="160" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="666" y="300" font-size="15" fill="#141421" font-weight="700">Mark - Paul</text>
  <rect x="650" y="208" width="160" height="104" fill="none" stroke="#70706F" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Dim_Account -->
  <rect x="900" y="208" width="180" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6"><text x="916" y="231">Account</text></g>
  <rect x="900" y="244" width="180" height="204" fill="#FFFFFF"/>
  <text x="916" y="266" font-size="15" fill="#A9AAAA">Mark</text>
  <line x1="900" y1="278" x2="1080" y2="278" stroke="#D7D8D8"/>
  <rect x="900" y="278" width="180" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="916" y="300" font-size="15" fill="#141421" font-weight="700">Paul</text>
  <line x1="900" y1="312" x2="1080" y2="312" stroke="#D7D8D8"/>
  <text x="916" y="334" font-size="15" fill="#A9AAAA">Robert</text>
  <line x1="900" y1="346" x2="1080" y2="346" stroke="#D7D8D8"/>
  <text x="916" y="368" font-size="15" fill="#A9AAAA">Luke</text>
  <line x1="900" y1="380" x2="1080" y2="380" stroke="#D7D8D8"/>
  <text x="916" y="402" font-size="15" fill="#A9AAAA">Mark - Robert</text>
  <line x1="900" y1="414" x2="1080" y2="414" stroke="#D7D8D8"/>
  <rect x="900" y="414" width="180" height="34" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="2"/>
  <text x="916" y="436" font-size="15" fill="#141421" font-weight="700">Mark - Paul</text>
  <path d="M1050 219 h16 l-6 7 v7 l-4 -2 v-5 z" fill="#F39454"/>

  <!-- step 1: report filter, step 2: propagation to the bridge -->
  <path d="M214 295.0 H284" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M250.0 295.0 V499.0 H284" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="46" cy="295.0" r="11" fill="#F39454"/><text x="46" y="300.0" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="250.0" cy="390" r="11" fill="#F39454"/><text x="250.0" y="395" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>

  <!-- step 3: SUMMARIZE collects the accounts of the visible bridge rows -->
  <path d="M594 295.0 C624 295.0 616 261.0 644 261.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M594 499.0 C624 499.0 616 295.0 644 295.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="636" cy="186" r="11" fill="#F39454"/><text x="636" y="191" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>

  <!-- step 4: CALCULATE applies the summary table as one filter on Dim_Account -->
  <path d="M814 278.0 H850" fill="none" stroke="#F39454" stroke-width="4"/>
  <path d="M850 278.0 C870 278.0 874 295.0 894 295.0" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <path d="M850 278.0 C870 278.0 874 431.0 894 431.0" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <circle cx="850" cy="252.0" r="11" fill="#F39454"/><text x="850" y="257.0" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="650" y="334" font-size="13" fill="#70706F">One table, one filter:</text>
  <text x="650" y="352" font-size="13" fill="#70706F">no row-by-row iteration</text>

  <!-- result -->
  <line x1="990.0" y1="450" x2="990.0" y2="464" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <rect x="900" y="466" width="180" height="68" fill="#141421"/>
  <text x="916" y="488" font-size="12" font-weight="700" fill="#F39454">[TransactionAmount]</text>
  <text x="916" y="521" font-size="28" font-weight="700" fill="#F6F6F6">7,458</text>

  <!-- captions -->
  <g font-size="13" fill="#70706F">
    <text x="60" y="402">Report filter: Customer = Paul</text>
    <text x="290" y="538">2 rows visible in the filter context</text>
  </g>

  <!-- ==================== Code ==================== -->
  <rect x="60" y="560" width="1080" height="44" fill="#141421"/>
  <text x="80" y="588" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F6F6F6" xml:space="preserve">M2M v2 = CALCULATE ( [TransactionAmount], <tspan fill="#F39454">SUMMARIZE</tspan> ( Bridge_Account_Customer, Dim_Account[ID_Account] ) )</text>

  <!-- ==================== Explanation ==================== -->
  <circle cx="71" cy="632" r="11" fill="#F39454"/><text x="71" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="90" y="638" font-size="17" font-weight="700" fill="#141421">Report filter</text>
  <text x="60" y="664" font-size="14" fill="#141421">The report filters Dim_Customer</text>
  <text x="60" y="683" font-size="14" fill="#141421">to a single customer: Paul.</text>
  <circle cx="346" cy="632" r="11" fill="#F39454"/><text x="346" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="365" y="638" font-size="17" font-weight="700" fill="#141421">Propagation</text>
  <text x="335" y="664" font-size="14" fill="#141421">The filter flows to the bridge:</text>
  <text x="335" y="683" font-size="14" fill="#141421">only Paul's 2 rows stay visible.</text>
  <circle cx="621" cy="632" r="11" fill="#F39454"/><text x="621" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="640" y="638" font-size="17" font-weight="700" fill="#141421">SUMMARIZE</text>
  <text x="610" y="664" font-size="14" fill="#141421">Collects the distinct ID_Account</text>
  <text x="610" y="683" font-size="14" fill="#141421">values of the visible bridge rows.</text>
  <circle cx="896" cy="632" r="11" fill="#F39454"/><text x="896" y="637" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="915" y="638" font-size="17" font-weight="700" fill="#141421">One batch</text>
  <text x="885" y="664" font-size="14" fill="#141421">CALCULATE filters Dim_Account</text>
  <text x="885" y="683" font-size="14" fill="#141421">with that table, all at once.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="752" font-size="20" fill="#141421">Same result as M2M v1, <tspan font-weight="700">without iterating the accounts.</tspan></text>
  <text x="1140" y="751" font-size="14" fill="#70706F" text-anchor="end">Result: Paul = 7,308 + 150 = 7,458</text>
</svg>
