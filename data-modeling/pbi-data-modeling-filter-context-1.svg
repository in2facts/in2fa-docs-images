<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="brand-arrow">
      <path d="M1 15 L12 4 M4 4 H12 V12" fill="none" stroke="#F39454" stroke-width="2.5"/>
      <rect x="15" y="3" width="2.5" height="13" fill="#F39454"/>
    </g>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Filter context</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421">Filter context</text>
  <rect x="304" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A filter set by the report flows through the relationships, from the one side to the many side.</text>

  <!-- ==================== Step labels ==================== -->
  <g font-size="15" font-weight="700" fill="#141421">
    <circle cx="71" cy="195" r="11" fill="#F39454"/><text x="71" y="200" font-size="13" text-anchor="middle">1</text>
    <text x="90" y="200">Report sets a filter</text>
    <circle cx="461" cy="195" r="11" fill="#F39454"/><text x="461" y="200" font-size="13" text-anchor="middle">2</text>
    <text x="480" y="200">Filter propagates from 1 to many</text>
  </g>

  <!-- ==================== 1. Report matrix ==================== -->
  <rect x="60" y="210" width="340" height="36" fill="#141421"/>
  <g font-size="14" font-weight="700" fill="#F6F6F6">
    <text x="76" y="233">Category</text>
    <text x="290" y="233" text-anchor="end">Revenue</text>
    <text x="388" y="233" text-anchor="end">% of Total</text>
  </g>
  <rect x="60" y="246" width="340" height="136" fill="#FFFFFF"/>
  <rect x="60" y="280" width="340" height="34" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="60" y1="280" x2="400" y2="280"/><line x1="60" y1="314" x2="400" y2="314"/>
  </g>
  <line x1="60" y1="348" x2="400" y2="348" stroke="#141421" stroke-width="1"/>
  <g font-size="15" fill="#141421">
    <text x="76" y="268">Bikes</text><text x="290" y="268" text-anchor="end">1,600</text><text x="388" y="268" text-anchor="end">80.0%</text>
    <text x="76" y="302" font-weight="700">Accessories</text><text x="290" y="302" text-anchor="end" font-weight="700">250</text><text x="388" y="302" text-anchor="end" font-weight="700">12.5%</text>
    <text x="76" y="336">Clothing</text><text x="290" y="336" text-anchor="end">150</text><text x="388" y="336" text-anchor="end">7.5%</text>
    <text x="76" y="370" font-weight="700">Total</text><text x="290" y="370" text-anchor="end" font-weight="700">2,000</text><text x="388" y="370" text-anchor="end" font-weight="700">100.0%</text>
  </g>
  <rect x="60" y="280" width="340" height="34" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="60" y="420" font-size="13" fill="#70706F">Each row of the visual has its own filter context</text>

  <!-- report row to Categories -->
  <path d="M402 297 C426 297, 426 291, 448 291" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-head)"/>

  <!-- ==================== 2. Model: Categories ==================== -->
  <rect x="450" y="210" width="170" height="36" fill="#141421"/>
  <text x="466" y="233" font-size="14" font-weight="700" fill="#F6F6F6">Categories</text>
  <rect x="450" y="246" width="170" height="90" fill="#FFFFFF"/>
  <rect x="450" y="276" width="170" height="30" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="450" y1="276" x2="620" y2="276"/><line x1="450" y1="306" x2="620" y2="306"/>
  </g>
  <g font-size="14" fill="#141421" fill-opacity="0.3">
    <text x="466" y="266">Bikes</text>
    <text x="466" y="326">Clothing</text>
  </g>
  <text x="466" y="296" font-size="14" font-weight="700" fill="#141421">Accessories</text>
  <rect x="450" y="350" width="170" height="28" fill="#FFFFFF" stroke="#F39454" stroke-width="2"/>
  <text x="535" y="369" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421" text-anchor="middle">= "Accessories"</text>
  <text x="535" y="420" font-size="13" fill="#70706F" text-anchor="middle">Filter on ProductCategoryName</text>

  <!-- relationship Categories 1 -> * Products -->
  <line x1="622" y1="228" x2="686" y2="228" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="628" y="220" font-size="14" font-weight="700" fill="#141421">1</text>
  <text x="678" y="222" font-size="16" font-weight="700" fill="#141421">*</text>

  <!-- ==================== Model: Products ==================== -->
  <rect x="690" y="210" width="190" height="36" fill="#141421"/>
  <text x="706" y="233" font-size="14" font-weight="700" fill="#F6F6F6">Products</text>
  <rect x="690" y="246" width="190" height="150" fill="#FFFFFF"/>
  <rect x="690" y="276" width="190" height="30" fill="#F39454" fill-opacity="0.18"/>
  <rect x="690" y="336" width="190" height="60" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="690" y1="276" x2="880" y2="276"/><line x1="690" y1="306" x2="880" y2="306"/>
    <line x1="690" y1="336" x2="880" y2="336"/><line x1="690" y1="366" x2="880" y2="366"/>
  </g>
  <g font-size="14" fill="#141421" fill-opacity="0.3">
    <text x="706" y="266">Bike</text><text x="868" y="266" font-size="12" text-anchor="end">Bikes</text>
    <text x="706" y="326">Gloves</text><text x="868" y="326" font-size="12" text-anchor="end">Clothing</text>
  </g>
  <g font-size="14" fill="#141421">
    <text x="706" y="296">Helmet</text><text x="868" y="296" font-size="12" fill="#70706F" text-anchor="end">Accessories</text>
    <text x="706" y="356">Lights</text><text x="868" y="356" font-size="12" fill="#70706F" text-anchor="end">Accessories</text>
    <text x="706" y="386">Bottle</text><text x="868" y="386" font-size="12" fill="#70706F" text-anchor="end">Accessories</text>
  </g>
  <text x="785" y="420" font-size="13" fill="#70706F" text-anchor="middle">3 products remain</text>

  <!-- relationship Products 1 -> * Sales -->
  <line x1="882" y1="228" x2="946" y2="228" stroke="#F39454" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="888" y="220" font-size="14" font-weight="700" fill="#141421">1</text>
  <text x="938" y="222" font-size="16" font-weight="700" fill="#141421">*</text>

  <!-- ==================== Model: Sales ==================== -->
  <rect x="950" y="210" width="190" height="36" fill="#141421"/>
  <text x="966" y="233" font-size="14" font-weight="700" fill="#F6F6F6">Sales</text>
  <text x="1128" y="233" font-size="12" fill="#D7D8D8" text-anchor="end">Revenue</text>
  <rect x="950" y="246" width="190" height="150" fill="#FFFFFF"/>
  <rect x="950" y="276" width="190" height="30" fill="#F39454" fill-opacity="0.18"/>
  <rect x="950" y="336" width="190" height="60" fill="#F39454" fill-opacity="0.18"/>
  <g stroke="#D7D8D8" stroke-width="1">
    <line x1="950" y1="276" x2="1140" y2="276"/><line x1="950" y1="306" x2="1140" y2="306"/>
    <line x1="950" y1="336" x2="1140" y2="336"/><line x1="950" y1="366" x2="1140" y2="366"/>
  </g>
  <g font-size="14" fill="#141421" fill-opacity="0.3">
    <text x="966" y="266">Bike</text><text x="1128" y="266" text-anchor="end">1,600</text>
    <text x="966" y="326">Gloves</text><text x="1128" y="326" text-anchor="end">150</text>
  </g>
  <g font-size="14" fill="#141421">
    <text x="966" y="296">Helmet</text><text x="1128" y="296" text-anchor="end" font-weight="700">120</text>
    <text x="966" y="356">Lights</text><text x="1128" y="356" text-anchor="end" font-weight="700">80</text>
    <text x="966" y="386">Bottle</text><text x="1128" y="386" text-anchor="end" font-weight="700">50</text>
  </g>
  <text x="1140" y="420" font-size="13" fill="#70706F" text-anchor="end">120 + 80 + 50 = 250</text>

  <line x1="60" y1="446" x2="1140" y2="446" stroke="#D7D8D8" stroke-width="1"/>

  <!-- ==================== 3. Break out with ALL ==================== -->
  <rect x="60" y="470" width="590" height="116" fill="#141421"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6">
    <text x="80" y="494">% of Total =</text>
    <text x="80" y="512"><tspan fill="#F39454">DIVIDE</tspan> (</text>
    <text x="108" y="530">[Revenue],</text>
    <text x="108" y="548"><tspan fill="#F39454">CALCULATE</tspan> ( [Revenue], <tspan fill="#F39454">ALL</tspan> ( <tspan fill="#C9DCE7">'Categories'[ProductCategoryName]</tspan> ) )</text>
    <text x="80" y="566">)</text>
  </g>

  <use href="#brand-arrow" x="680" y="470"/>
  <text x="706" y="486" font-size="17" font-weight="700" fill="#141421">ALL breaks out of the filter context</text>
  <text x="680" y="512" font-size="14" fill="#141421">Numerator: current filter context, Accessories only</text>
  <text x="1140" y="512" font-size="14" font-weight="700" fill="#141421" text-anchor="end">250</text>
  <text x="680" y="536" font-size="14" fill="#141421">Denominator: ALL ignores the category filter</text>
  <text x="1140" y="536" font-size="14" font-weight="700" fill="#141421" text-anchor="end">2,000</text>
  <line x1="680" y1="550" x2="1140" y2="550" stroke="#D7D8D8" stroke-width="1"/>
  <text x="680" y="580" font-size="22" font-weight="700" fill="#141421">250 / 2,000 = <tspan fill="#F39454">12.5%</tspan></text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="616" x2="1140" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">Filters flow from <tspan font-weight="700">1 to many</tspan>. ALL lets you <tspan font-weight="700">break out</tspan>.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Filter context is invisible, but always there.</text>
</svg>
