  <circle cx="752" cy="586" r="9" fill="#F39454"/><text x="752" y="590" font-size="11" font-weight="700" fill="#141421" text-anchor="middle">2</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="726" x2="1140" y2="726" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="762" font-size="20" fill="#141421">① filters Sales through a relationship, <tspan font-weight="700">② is only read by the measure.</tspan></text>
  <text x="1140" y="761" font-size="14" fill="#70706F" text-anchor="end">MEDIUM × 2007 = 888 customers</text>
</svg>
