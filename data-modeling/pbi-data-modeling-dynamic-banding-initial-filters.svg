<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A9AAAA"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="790" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Dynamic banding</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="650" lengthAdjust="spacing">Initial filters on a disconnected table</text>
  <rect x="718" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">One cell, MEDIUM × 2007: the Year filter propagates to Sales, the Band filter stays in SalesBand and is only read by the measure.</text>

  <rect x="60" y="170" width="1080" height="530" fill="#FFFFFF"/>
  <text x="84" y="198" font-size="12" font-weight="700" fill="#70706F">SEMANTIC MODEL</text>
  <rect x="100" y="220" width="240" height="90" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <line x1="100" y1="254" x2="340" y2="254" stroke="#D7D8D8" stroke-width="1"/>
  <text x="116" y="243" font-size="15" font-weight="700" fill="#141421">OrderDate</text>
  <text x="116" y="276" font-size="13" fill="#70706F">OrderDateKey</text>
  <text x="116" y="300" font-size="13" fill="#70706F">Year</text>
  <rect x="160" y="284" width="120" height="24" fill="#FBD3B8"/>
  <path d="M167 291 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="183" y="300" font-size="12" font-weight="700" fill="#141421">Year = 2007</text>
  <circle cx="294" cy="296" r="9" fill="#F39454"/><text x="294" y="300" font-size="11" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <rect x="480" y="250" width="240" height="138" fill="#FFFFFF" stroke="#141421" stroke-width="1" filter="url(#card)"/>
  <rect x="480" y="250" width="240" height="34" fill="#141421"/>
  <text x="496" y="273" font-size="15" font-weight="700" fill="#F6F6F6">Sales</text>
  <text x="496" y="306" font-size="13" fill="#70706F">CustomerKey</text>
  <text x="496" y="330" font-size="13" fill="#70706F">OrderDateKey</text>
  <text x="496" y="354" font-size="13" fill="#70706F">ProductKey</text>
  <text x="496" y="378" font-size="13" fill="#70706F">OrderQuantity × UnitPrice</text>
  <rect x="860" y="220" width="240" height="66" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <line x1="860" y1="254" x2="1100" y2="254" stroke="#D7D8D8" stroke-width="1"/>
  <text x="876" y="243" font-size="15" font-weight="700" fill="#141421">Customers</text>
  <text x="876" y="276" font-size="13" fill="#70706F">CustomerKey</text>
  <rect x="744" y="226" width="96" height="24" fill="#141421"/>
  <text x="792" y="242" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#F39454" text-anchor="middle">COUNTROWS</text>
  <line x1="842" y1="238" x2="854" y2="238" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="792" y="266" font-size="11" fill="#70706F" text-anchor="middle">counts the customers</text>
  <rect x="861" y="258" width="238" height="24" fill="#FDE7D8"/>
  <text x="876" y="276" font-size="13" font-weight="700" fill="#141421">CustomerKey</text>
  <path d="M1082 271 A8 8 0 1 1 1074 263" fill="none" stroke="#F39454" stroke-width="2.2" marker-end="url(#head-mango)"/>
  <text x="1056" y="275" font-size="11" font-weight="700" fill="#F39454" text-anchor="end">row by row</text>
  <path d="M874 388 A6 6 0 1 1 868 382" fill="none" stroke="#F39454" stroke-width="2.2" marker-end="url(#head-mango)"/>
  <path d="M220 310 V340 H474" fill="none" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <text x="228" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#141421">1</text>
  <text x="464" y="334" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#141421" text-anchor="end">*</text>
  <text x="340" y="360" font-size="12" font-weight="700" fill="#F39454" text-anchor="middle">the Year filter propagates</text>
  <path d="M980 282 V340 H726" fill="none" stroke="#A9AAAA" stroke-width="2.5" marker-end="url(#head-sand)"/>
  <text x="988" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#141421">1</text>
  <text x="738" y="334" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#141421">*</text>
  <text x="853" y="360" font-size="12" fill="#70706F" text-anchor="middle">not filtered by the report</text>
  <text x="882" y="392" font-size="12" font-weight="700" fill="#141421">The measure iterates every customer:</text>
  <text x="882" y="410" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#141421">VALUES ( Customers[CustomerKey] )</text>
  <path d="M470 452 L560 392" fill="none" stroke="#A9AAAA" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="515" cy="422" r="10" fill="#F6F6F6" stroke="#141421" stroke-width="2"/><path d="M511 418 l8 8 m0 -8 l-8 8" stroke="#141421" stroke-width="2.2"/>
  <text x="534" y="446" font-size="12" font-weight="700" fill="#70706F">no relationship</text>
  <rect x="100" y="452" width="470" height="240" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" stroke-dasharray="6 4" filter="url(#card)"/>
  <text x="116" y="478" font-size="15" font-weight="700" fill="#141421">SalesBand</text>
  <text x="196" y="478" font-size="12" fill="#70706F">disconnected table</text>
  <rect x="390" y="462" width="140" height="24" fill="#FBD3B8"/>
  <path d="M397 469 h10 l-4 5 v5 l-2 1.5 v-6.5 z" fill="#141421"/>
  <text x="413" y="478" font-size="12" font-weight="700" fill="#141421">Band = MEDIUM</text>
  <circle cx="544" cy="474" r="9" fill="#F39454"/><text x="544" y="478" font-size="11" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <rect x="116" y="496" width="438" height="24" fill="#141421"/>
  <text x="124" y="512" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="start">BandCode</text>
  <text x="228" y="512" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="start">Band</text>
  <text x="432" y="512" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="end">MinSales</text>
  <text x="546" y="512" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="end">MaxSales</text>
  <text x="124" y="536" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">1</text>
  <text x="228" y="536" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">VERY LOW</text>
  <text x="432" y="536" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">1</text>
  <text x="546" y="536" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">500</text>
  <line x1="116" y1="544" x2="554" y2="544" stroke="#D7D8D8" stroke-width="1"/>
  <text x="124" y="560" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">2</text>
  <text x="228" y="560" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">LOW</text>
  <text x="432" y="560" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">500</text>
  <text x="546" y="560" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">1,000</text>
  <line x1="116" y1="568" x2="554" y2="568" stroke="#D7D8D8" stroke-width="1"/>
  <rect x="116" y="568" width="438" height="24" fill="#F39454"/>
  <text x="124" y="584" font-size="12" font-weight="700" fill="#141421" text-anchor="start">3</text>
  <text x="228" y="584" font-size="12" font-weight="700" fill="#141421" text-anchor="start">MEDIUM</text>
  <text x="432" y="584" font-size="12" font-weight="700" fill="#141421" text-anchor="end">1,000</text>
  <text x="546" y="584" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2,000</text>
  <line x1="116" y1="592" x2="554" y2="592" stroke="#D7D8D8" stroke-width="1"/>
  <text x="124" y="608" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">4</text>
  <text x="228" y="608" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">HIGH</text>
  <text x="432" y="608" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">2,000</text>
  <text x="546" y="608" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">3,000</text>
  <line x1="116" y1="616" x2="554" y2="616" stroke="#D7D8D8" stroke-width="1"/>
  <text x="124" y="632" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">5</text>
  <text x="228" y="632" font-size="12" font-weight="400" fill="#70706F" text-anchor="start">VERY HIGH</text>
  <text x="432" y="632" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">3,000</text>
  <text x="546" y="632" font-size="12" font-weight="400" fill="#70706F" text-anchor="end">9,999,999</text>
  <line x1="116" y1="640" x2="554" y2="640" stroke="#D7D8D8" stroke-width="1"/>
  <text x="116" y="662" font-size="13" fill="#141421">A customer is counted when</text>
  <text x="116" y="680" font-size="13" font-weight="700" fill="#141421">1,000 ≤ [Revenue] of the customer in 2007 &lt; 2,000</text>
  <text x="640" y="440" font-size="12" font-weight="700" fill="#70706F">REPORT</text>
  <rect x="640" y="452" width="470" height="240" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1" filter="url(#card)"/>
  <rect x="640" y="452" width="470" height="44" fill="#F6F6F6"/>
  <text x="656" y="472" font-size="15" font-weight="700" fill="#141421">Dynamic Banding</text>
  <text x="656" y="489" font-size="12" fill="#70706F">Customers (#) per band and year</text>
  <rect x="940" y="502" width="78" height="168" fill="#FDE7D8"/>
  <rect x="656" y="574" width="438" height="24" fill="#FDE7D8"/>
  <text x="656" y="518" font-size="12" font-weight="700" fill="#141421" text-anchor="start">Band</text>
  <text x="850" y="518" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2005</text>
  <text x="930" y="518" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2006</text>
  <text x="1010" y="518" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2007</text>
  <text x="1094" y="518" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2008</text>
  <line x1="656" y1="526" x2="1094" y2="526" stroke="#A9AAAA" stroke-width="1"/>
  <text x="656" y="542" font-size="12" font-weight="400" fill="#141421" text-anchor="start">VERY LOW</text>
  <text x="850" y="542" font-size="12" font-weight="400" fill="#141421" text-anchor="end"></text>
  <text x="930" y="542" font-size="12" font-weight="400" fill="#141421" text-anchor="end"></text>
  <text x="1010" y="542" font-size="12" font-weight="400" fill="#141421" text-anchor="end">4,425</text>
  <text x="1094" y="542" font-size="12" font-weight="400" fill="#141421" text-anchor="end">5,906</text>
  <text x="656" y="566" font-size="12" font-weight="400" fill="#141421" text-anchor="start">LOW</text>
  <text x="850" y="566" font-size="12" font-weight="400" fill="#141421" text-anchor="end">113</text>
  <text x="930" y="566" font-size="12" font-weight="400" fill="#141421" text-anchor="end">401</text>
  <text x="1010" y="566" font-size="12" font-weight="400" fill="#141421" text-anchor="end">1,190</text>
  <text x="1094" y="566" font-size="12" font-weight="400" fill="#141421" text-anchor="end">1,673</text>
  <rect x="942" y="576" width="74" height="20" fill="#F39454"/>
  <text x="656" y="590" font-size="12" font-weight="400" fill="#141421" text-anchor="start">MEDIUM</text>
  <text x="850" y="590" font-size="12" font-weight="400" fill="#141421" text-anchor="end"></text>
  <text x="930" y="590" font-size="12" font-weight="400" fill="#141421" text-anchor="end">146</text>
  <text x="1010" y="590" font-size="12" font-weight="700" fill="#141421" text-anchor="end">888</text>
  <text x="1094" y="590" font-size="12" font-weight="400" fill="#141421" text-anchor="end">1,396</text>
  <text x="656" y="614" font-size="12" font-weight="400" fill="#141421" text-anchor="start">HIGH</text>
  <text x="850" y="614" font-size="12" font-weight="400" fill="#141421" text-anchor="end"></text>
  <text x="930" y="614" font-size="12" font-weight="400" fill="#141421" text-anchor="end">1,083</text>
  <text x="1010" y="614" font-size="12" font-weight="400" fill="#141421" text-anchor="end">2,305</text>
  <text x="1094" y="614" font-size="12" font-weight="400" fill="#141421" text-anchor="end">2,086</text>
  <text x="656" y="638" font-size="12" font-weight="400" fill="#141421" text-anchor="start">VERY HIGH</text>
  <text x="850" y="638" font-size="12" font-weight="400" fill="#141421" text-anchor="end">900</text>
  <text x="930" y="638" font-size="12" font-weight="400" fill="#141421" text-anchor="end">1,047</text>
  <text x="1010" y="638" font-size="12" font-weight="400" fill="#141421" text-anchor="end">501</text>
  <text x="1094" y="638" font-size="12" font-weight="400" fill="#141421" text-anchor="end">316</text>
  <text x="656" y="662" font-size="12" font-weight="700" fill="#141421" text-anchor="start">Total</text>
  <text x="850" y="662" font-size="12" font-weight="700" fill="#141421" text-anchor="end">1,013</text>
  <text x="930" y="662" font-size="12" font-weight="700" fill="#141421" text-anchor="end">2,677</text>
  <text x="1010" y="662" font-size="12" font-weight="700" fill="#141421" text-anchor="end">9,309</text>
  <text x="1094" y="662" font-size="12" font-weight="700" fill="#141421" text-anchor="end">11,377</text>
  <line x1="656" y1="646" x2="1094" y2="646" stroke="#A9AAAA" stroke-width="1"/>
