<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Query execution</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="450" lengthAdjust="spacing">Single vs multi-threaded</text>
  <rect x="518" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A Sales table of 8 million rows is stored in 8 segments. How many cores can work on them at the same time?</text>


  <!-- ==================== Single-threaded ==================== -->
  <rect x="60" y="170" width="520" height="430" fill="#FFFFFF"/>
  <rect x="60" y="170" width="4" height="430" fill="#141421"/>
  <text x="84" y="202" font-size="18" font-weight="700" fill="#141421">Single-threaded</text>
  <text x="84" y="224" font-size="14" fill="#70706F">Formula engine: one core does all the work, step by step</text>
  <text x="84" y="264" font-size="12" font-weight="700" fill="#141421">Core 1</text>
  <rect x="150" y="246" width="400" height="26" fill="#F6F6F6"/>
  <rect x="152" y="248" width="46" height="22" fill="#141421"/>
  <text x="175.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S1</text>
  <rect x="202" y="248" width="46" height="22" fill="#141421"/>
  <text x="225.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S2</text>
  <rect x="252" y="248" width="46" height="22" fill="#141421"/>
  <text x="275.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S3</text>
  <rect x="302" y="248" width="46" height="22" fill="#141421"/>
  <text x="325.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S4</text>
  <rect x="352" y="248" width="46" height="22" fill="#141421"/>
  <text x="375.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S5</text>
  <rect x="402" y="248" width="46" height="22" fill="#141421"/>
  <text x="425.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S6</text>
  <rect x="452" y="248" width="46" height="22" fill="#141421"/>
  <text x="475.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S7</text>
  <rect x="502" y="248" width="46" height="22" fill="#141421"/>
  <text x="525.0" y="264" font-size="12" font-weight="700" fill="#F6F6F6" text-anchor="middle">S8</text>
  <text x="84" y="296" font-size="12" font-weight="400" fill="#A9AAAA">Core 2</text>
  <rect x="150" y="278" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="296" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="328" font-size="12" font-weight="400" fill="#A9AAAA">Core 3</text>
  <rect x="150" y="310" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="328" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="360" font-size="12" font-weight="400" fill="#A9AAAA">Core 4</text>
  <rect x="150" y="342" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="360" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="392" font-size="12" font-weight="400" fill="#A9AAAA">Core 5</text>
  <rect x="150" y="374" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="392" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="424" font-size="12" font-weight="400" fill="#A9AAAA">Core 6</text>
  <rect x="150" y="406" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="424" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="456" font-size="12" font-weight="400" fill="#A9AAAA">Core 7</text>
  <rect x="150" y="438" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="456" font-size="12" fill="#A9AAAA">idle</text>
  <text x="84" y="488" font-size="12" font-weight="400" fill="#A9AAAA">Core 8</text>
  <rect x="150" y="470" width="400" height="26" fill="#F6F6F6"/>
  <text x="160" y="488" font-size="12" fill="#A9AAAA">idle</text>
  <line x1="150" y1="510" x2="564" y2="510" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>
  <text x="150" y="528" font-size="12" fill="#70706F">time →</text>
  <line x1="550" y1="244" x2="550" y2="516" stroke="#141421" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="544" y="528" font-size="12" font-weight="700" fill="#141421" text-anchor="end">done after 8 steps</text>
  <text x="84" y="560" font-size="16" font-weight="700" fill="#141421">8 segments, 1 core: 8 steps</text>
  <text x="84" y="580" font-size="13" fill="#70706F">The other 7 cores stay idle: extra cores do not help.</text>

  <!-- ==================== Multi-threaded ==================== -->
  <rect x="620" y="170" width="520" height="430" fill="#FFFFFF"/>
  <rect x="620" y="170" width="4" height="430" fill="#F39454"/>
  <text x="644" y="202" font-size="18" font-weight="700" fill="#141421">Multi-threaded</text>
  <text x="644" y="224" font-size="14" fill="#70706F">Storage engine: every core scans one segment in parallel</text>
  <text x="644" y="264" font-size="12" font-weight="700" fill="#141421">Core 1</text>
  <rect x="710" y="246" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="248" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="264" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S1</text>
  <text x="644" y="296" font-size="12" font-weight="700" fill="#141421">Core 2</text>
  <rect x="710" y="278" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="280" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="296" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S2</text>
  <text x="644" y="328" font-size="12" font-weight="700" fill="#141421">Core 3</text>
  <rect x="710" y="310" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="312" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="328" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S3</text>
  <text x="644" y="360" font-size="12" font-weight="700" fill="#141421">Core 4</text>
  <rect x="710" y="342" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="344" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="360" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S4</text>
  <text x="644" y="392" font-size="12" font-weight="700" fill="#141421">Core 5</text>
  <rect x="710" y="374" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="376" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="392" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S5</text>
  <text x="644" y="424" font-size="12" font-weight="700" fill="#141421">Core 6</text>
  <rect x="710" y="406" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="408" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="424" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S6</text>
  <text x="644" y="456" font-size="12" font-weight="700" fill="#141421">Core 7</text>
  <rect x="710" y="438" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="440" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="456" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S7</text>
  <text x="644" y="488" font-size="12" font-weight="700" fill="#141421">Core 8</text>
  <rect x="710" y="470" width="400" height="26" fill="#F6F6F6"/>
  <rect x="712" y="472" width="46" height="22" fill="#F39454"/>
  <text x="735.0" y="488" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">S8</text>
  <line x1="710" y1="510" x2="1124" y2="510" stroke="#70706F" stroke-width="1.5" marker-end="url(#head-sand)"/>
  <text x="710" y="528" font-size="12" fill="#70706F">time →</text>
  <line x1="760" y1="244" x2="760" y2="516" stroke="#F39454" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="766" y="528" font-size="12" font-weight="700" fill="#141421">done after 1 step</text>
  <text x="644" y="560" font-size="16" font-weight="700" fill="#141421">8 segments, 8 cores: 1 step</text>
  <text x="644" y="580" font-size="13" fill="#70706F">Up to 8 times faster than a single core.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="636" x2="1140" y2="636" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="672" font-size="20" fill="#141421">More cores only speed up the <tspan font-weight="700">storage engine.</tspan></text>
  <text x="1140" y="671" font-size="14" fill="#70706F" text-anchor="end">1 segment ≈ 1 million rows</text>
</svg>
