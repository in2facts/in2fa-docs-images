<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Pareto analysis</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data modeling</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="356" lengthAdjust="spacing">Reverse engineering</text>
  <rect x="424" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Take the whalebone curve apart: every visual element needs its own measures, 13 in total.</text>

  <!-- ==================== Chart ==================== -->
  <rect x="60" y="176" width="580" height="36" fill="#C9DCE7"/>
  <text x="96" y="200" font-size="15" fill="#141421"><tspan font-weight="700">2</tspan> of <tspan font-weight="700">17</tspan> subcategories (<tspan font-weight="700">12%</tspan>) generate at least <tspan font-weight="700">80%</tspan> of revenue.</text>
  <circle cx="78" cy="194" r="11" fill="#F39454"/><text x="78" y="199" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">6</text>
  <g stroke="#D7D8D8" stroke-width="1"><line x1="110" y1="500.4" x2="620" y2="500.4"/><line x1="110" y1="440.8" x2="620" y2="440.8"/><line x1="110" y1="381.20000000000005" x2="620" y2="381.20000000000005"/><line x1="110" y1="262.0" x2="620" y2="262.0"/></g>
  <line x1="110" y1="560" x2="620" y2="560" stroke="#70706F" stroke-width="1"/>
  <g font-size="11" fill="#70706F"><text x="628" y="564">0%</text><text x="628" y="504.4">20%</text><text x="628" y="444.8">40%</text><text x="628" y="385.20000000000005">60%</text><text x="628" y="266.0">100%</text></g>
  <text x="628" y="325.6" font-size="12" font-weight="700" fill="#141421">80%</text>
  <path d="M110 560 L110 438.4 L125.0 438.4 L155.0 318.3 L170 318.3 L170 560 Z" fill="#F39454" fill-opacity="0.3"/>
  <rect x="119.0" y="262.0" width="12" height="298.0" fill="#F39454"/>
  <rect x="149.0" y="265.0" width="12" height="295.0" fill="#F39454"/>
  <rect x="179.0" y="456.4" width="12" height="103.6" fill="#D7D8D8"/>
  <rect x="209.0" y="552.5" width="12" height="7.5" fill="#D7D8D8"/>
  <rect x="239.0" y="553.3" width="12" height="6.7" fill="#D7D8D8"/>
  <rect x="269.0" y="554.8" width="12" height="5.2" fill="#D7D8D8"/>
  <rect x="299.0" y="557.0" width="12" height="3.0" fill="#D7D8D8"/>
  <rect x="329.0" y="557.8" width="12" height="2.2" fill="#D7D8D8"/>
  <rect x="359.0" y="558.5" width="12" height="1.5" fill="#D7D8D8"/>
  <rect x="389.0" y="558.5" width="12" height="1.5" fill="#D7D8D8"/>
  <rect x="419.0" y="558.5" width="12" height="1.5" fill="#D7D8D8"/>
  <rect x="449.0" y="558.5" width="12" height="1.5" fill="#D7D8D8"/>
  <rect x="479.0" y="558.5" width="12" height="1.5" fill="#D7D8D8"/>
  <rect x="509.0" y="558.8" width="12" height="1.2" fill="#D7D8D8"/>
  <rect x="539.0" y="558.8" width="12" height="1.2" fill="#D7D8D8"/>
  <rect x="569.0" y="558.8" width="12" height="1.2" fill="#D7D8D8"/>
  <rect x="599.0" y="558.8" width="12" height="1.2" fill="#D7D8D8"/>
  <line x1="110" y1="321.6" x2="620" y2="321.6" stroke="#70706F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="125.0,438.4 155.0,318.3 185.0,276.0 215.0,273.0 245.0,270.3 275.0,268.3 305.0,267.1 335.0,266.2 365.0,265.6 395.0,265.0 425.0,264.4 455.0,263.8 485.0,263.2 515.0,262.6 545.0,262.3 575.0,262.1 605.0,262.0" fill="none" stroke="#141421" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="155.0" y1="324.322" x2="155.0" y2="560" stroke="#141421" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="155.0" cy="318.322" r="5.5" fill="#141421" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="185.0" cy="438.445" r="11" fill="#F39454"/><text x="185.0" y="443.445" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="365.0" cy="245.57600000000002" r="11" fill="#F39454"/><text x="365.0" y="250.57600000000002" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <circle cx="515.0" cy="341.6" r="11" fill="#F39454"/><text x="515.0" y="346.6" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <circle cx="177.0" cy="302.322" r="11" fill="#F39454"/><text x="177.0" y="307.322" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <circle cx="90" cy="500" r="11" fill="#F39454"/><text x="90" y="505" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">5</text>
  <text x="110" y="582" font-size="13" fill="#70706F">17 product subcategories, ranked by revenue</text>

  <!-- ==================== Components and measures ==================== -->
  <text x="690" y="190" font-size="15" font-weight="700" fill="#141421">Chart element <tspan fill="#70706F" font-weight="400">→</tspan> measures</text>
  <rect x="690" y="206" width="450" height="70" fill="#FFFFFF"/>
  <circle cx="710" cy="225" r="11" fill="#F39454"/><text x="710" y="230" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="730" y="230" font-size="15" font-weight="700" fill="#141421">Bars</text>
  <text x="1126" y="230" font-size="12" fill="#70706F" text-anchor="end">3 measures</text>
  <text x="730" y="250" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Revenue]   [Revenue Unique]</text>
  <text x="730" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[PSC Rank]</text>
  <rect x="690" y="282" width="450" height="70" fill="#FFFFFF"/>
  <circle cx="710" cy="301" r="11" fill="#F39454"/><text x="710" y="306" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="730" y="306" font-size="15" font-weight="700" fill="#141421">Cumulative line</text>
  <text x="1126" y="306" font-size="12" fill="#70706F" text-anchor="end">3 measures</text>
  <text x="730" y="326" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Revenue Cusum]   [Revenue Pareto GT]</text>
  <text x="730" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Revenue Cusum (%)]</text>
  <rect x="690" y="358" width="450" height="50" fill="#FFFFFF"/>
  <circle cx="710" cy="377" r="11" fill="#F39454"/><text x="710" y="382" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="730" y="382" font-size="15" font-weight="700" fill="#141421">Target</text>
  <text x="1126" y="382" font-size="12" fill="#70706F" text-anchor="end">1 measure</text>
  <text x="730" y="402" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Pareto Target]</text>
  <rect x="690" y="414" width="450" height="70" fill="#FFFFFF"/>
  <circle cx="710" cy="433" r="11" fill="#F39454"/><text x="710" y="438" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="730" y="438" font-size="15" font-weight="700" fill="#141421">Intersection</text>
  <text x="1126" y="438" font-size="12" fill="#70706F" text-anchor="end">4 measures</text>
  <text x="730" y="458" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Pareto Intersection]   [Pareto 80 pct match]</text>
  <text x="730" y="478" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Pareto 20 pct (#)]   [Pareto All (#)]</text>
  <rect x="690" y="490" width="450" height="50" fill="#FFFFFF"/>
  <circle cx="710" cy="509" r="11" fill="#F39454"/><text x="710" y="514" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">5</text>
  <text x="730" y="514" font-size="15" font-weight="700" fill="#141421">Visual formatting</text>
  <text x="1126" y="514" font-size="12" fill="#70706F" text-anchor="end">1 measure</text>
  <text x="730" y="534" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Color Selector]</text>
  <rect x="690" y="546" width="450" height="50" fill="#FFFFFF"/>
  <circle cx="710" cy="565" r="11" fill="#F39454"/><text x="710" y="570" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">6</text>
  <text x="730" y="570" font-size="15" font-weight="700" fill="#141421">Conclusion</text>
  <text x="1126" y="570" font-size="12" fill="#70706F" text-anchor="end">1 measure</text>
  <text x="730" y="590" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#141421" xml:space="preserve">[Pareto Conclusion]</text>
  <text x="1140" y="614" font-size="13" font-weight="700" fill="#141421" text-anchor="end">13 measures in total</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="640" x2="1140" y2="640" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="676" font-size="20" fill="#141421">Reverse engineer the chart: <tspan font-weight="700">every visual element is a measure.</tspan></text>
  <text x="1140" y="675" font-size="14" fill="#70706F" text-anchor="end">Next: Pareto Measures</text>
</svg>
