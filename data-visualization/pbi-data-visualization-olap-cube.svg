  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data visualization</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="190" lengthAdjust="spacing">OLAP cube</text>
  <rect x="258" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The data model behaves as a cube: a member expression points from table to column to one member.</text>

