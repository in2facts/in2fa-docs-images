<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
    <g id="mspct">
      <text x="120" y="26" font-size="13" fill="#141421" text-anchor="middle">What is the Market Share %</text>
      <text x="120" y="44" font-size="13" fill="#141421" text-anchor="middle">for 2016?</text>
      <circle cx="120" cy="150" r="56" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      <path d="M120 94 A56 56 0 0 1 152.9 195.3" fill="none" stroke="#F39454" stroke-width="14"/>
      <text x="120" y="158" font-size="22" font-weight="300" fill="#141421" text-anchor="middle">40%</text>
      <line x1="186" y1="104" x2="174" y2="122" stroke="#70706F"/><text x="188" y="100" font-size="11" fill="#70706F">40%</text>
      <line x1="54" y1="198" x2="66" y2="180" stroke="#70706F"/><text x="34" y="212" font-size="11" fill="#70706F">60%</text>
      <rect x="44" y="262" width="9" height="9" fill="#F39454"/><text x="58" y="271" font-size="11" fill="#141421">Van Arsdel</text>
      <rect x="132" y="262" width="9" height="9" fill="#FFFFFF" stroke="#A9AAAA"/><text x="146" y="271" font-size="11" fill="#141421">Competitors</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="740" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Market Share %</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data visualization</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="210" lengthAdjust="spacing">Camera tool</text>
  <rect x="278" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The camera takes a live picture of a range and shows it on the dashboard, like a television.</text>

  <!-- ==================== Headings ==================== -->
  <circle cx="72" cy="194" r="12" fill="#F39454"/><text x="72" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="92" y="200" font-size="16" font-weight="700" fill="#141421">SELECTED RANGE <tspan font-size="13" font-weight="400" fill="#70706F">· the source</tspan></text>
  <circle cx="512" cy="194" r="12" fill="#F39454"/><text x="512" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="532" y="200" font-size="16" font-weight="700" fill="#141421">CAMERA TOOL <tspan font-size="13" font-weight="400" fill="#70706F">· live picture</tspan></text>
  <circle cx="842" cy="194" r="12" fill="#F39454"/><text x="842" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="862" y="200" font-size="16" font-weight="700" fill="#141421">TELEVISION <tspan font-size="13" font-weight="400" fill="#70706F">· the dashboard</tspan></text>

  <!-- ==================== 1 · Selected range ==================== -->
  <rect x="60" y="214" width="340" height="358" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="60" y="214" width="340" height="22" fill="#F6F6F6"/>
  <rect x="60" y="214" width="28" height="358" fill="#F6F6F6"/>
  <line x1="88" y1="214" x2="88" y2="572" stroke="#D7D8D8"/>
  <text x="108.0" y="229" font-size="11" fill="#70706F" text-anchor="middle">A</text>
  <line x1="128" y1="214" x2="128" y2="572" stroke="#D7D8D8"/>
  <text x="168.0" y="229" font-size="11" fill="#70706F" text-anchor="middle">B</text>
  <line x1="208" y1="214" x2="208" y2="572" stroke="#D7D8D8"/>
  <text x="248.0" y="229" font-size="11" fill="#70706F" text-anchor="middle">C</text>
  <line x1="288" y1="214" x2="288" y2="572" stroke="#D7D8D8"/>
  <text x="328.0" y="229" font-size="11" fill="#70706F" text-anchor="middle">D</text>
  <line x1="368" y1="214" x2="368" y2="572" stroke="#D7D8D8"/>
  <text x="384.0" y="229" font-size="11" fill="#70706F" text-anchor="middle">E</text>
  <line x1="60" y1="236" x2="400" y2="236" stroke="#D7D8D8"/>
  <text x="74.0" y="251" font-size="10" fill="#70706F" text-anchor="middle">1</text>
  <line x1="60" y1="257" x2="400" y2="257" stroke="#D7D8D8"/>
  <text x="74.0" y="272" font-size="10" fill="#70706F" text-anchor="middle">2</text>
  <line x1="60" y1="278" x2="400" y2="278" stroke="#D7D8D8"/>
  <text x="74.0" y="293" font-size="10" fill="#70706F" text-anchor="middle">3</text>
  <line x1="60" y1="299" x2="400" y2="299" stroke="#D7D8D8"/>
  <text x="74.0" y="314" font-size="10" fill="#70706F" text-anchor="middle">4</text>
  <line x1="60" y1="320" x2="400" y2="320" stroke="#D7D8D8"/>
  <text x="74.0" y="335" font-size="10" fill="#70706F" text-anchor="middle">5</text>
  <line x1="60" y1="341" x2="400" y2="341" stroke="#D7D8D8"/>
  <text x="74.0" y="356" font-size="10" fill="#70706F" text-anchor="middle">6</text>
  <line x1="60" y1="362" x2="400" y2="362" stroke="#D7D8D8"/>
  <text x="74.0" y="377" font-size="10" fill="#70706F" text-anchor="middle">7</text>
  <line x1="60" y1="383" x2="400" y2="383" stroke="#D7D8D8"/>
  <text x="74.0" y="398" font-size="10" fill="#70706F" text-anchor="middle">8</text>
  <line x1="60" y1="404" x2="400" y2="404" stroke="#D7D8D8"/>
  <text x="74.0" y="419" font-size="10" fill="#70706F" text-anchor="middle">9</text>
  <line x1="60" y1="425" x2="400" y2="425" stroke="#D7D8D8"/>
  <text x="74.0" y="440" font-size="10" fill="#70706F" text-anchor="middle">10</text>
  <line x1="60" y1="446" x2="400" y2="446" stroke="#D7D8D8"/>
  <text x="74.0" y="461" font-size="10" fill="#70706F" text-anchor="middle">11</text>
  <line x1="60" y1="467" x2="400" y2="467" stroke="#D7D8D8"/>
  <text x="74.0" y="482" font-size="10" fill="#70706F" text-anchor="middle">12</text>
  <line x1="60" y1="488" x2="400" y2="488" stroke="#D7D8D8"/>
  <text x="74.0" y="503" font-size="10" fill="#70706F" text-anchor="middle">13</text>
  <line x1="60" y1="509" x2="400" y2="509" stroke="#D7D8D8"/>
  <text x="74.0" y="524" font-size="10" fill="#70706F" text-anchor="middle">14</text>
  <line x1="60" y1="530" x2="400" y2="530" stroke="#D7D8D8"/>
  <text x="74.0" y="545" font-size="10" fill="#70706F" text-anchor="middle">15</text>
  <line x1="60" y1="551" x2="400" y2="551" stroke="#D7D8D8"/>
  <text x="74.0" y="566" font-size="10" fill="#70706F" text-anchor="middle">16</text>
  <rect x="128" y="257" width="240" height="294" fill="#D7D8D8"/>
  <use href="#mspct" x="128" y="257"/>
  <rect x="128" y="257" width="240" height="294" fill="none" stroke="#F39454" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="368" y="251" font-size="11" font-weight="700" fill="#F39454" text-anchor="end">B2:D15</text>
  <rect x="88" y="572" width="96" height="22" fill="#FFFFFF" stroke="#A9AAAA"/>
  <rect x="88" y="591" width="96" height="3" fill="#F39454"/>
  <text x="136" y="587" font-size="11" fill="#141421" text-anchor="middle">Market Share</text>

  <!-- ==================== 2 · Camera tool ==================== -->
  <polygon points="374,257 554,378 554,398 374,551" fill="#C9DCE7" fill-opacity="0.55"/>
  <g fill="none" stroke="#141421" stroke-width="3" stroke-linejoin="round">
    <path d="M560 370 L582 380 V396 L560 406 Z"/>
    <rect x="582" y="366" width="84" height="48" rx="6"/>
    <circle cx="606" cy="344" r="20"/>
    <circle cx="650" cy="344" r="20"/>
    <path d="M666 382 h10 v12 h-10"/>
  </g>
  <circle cx="606" cy="344" r="4" fill="#F39454"/><circle cx="650" cy="344" r="4" fill="#F39454"/>
  <circle cx="594" cy="404" r="3" fill="#141421"/>
  <path d="M690 388 L822 388" fill="none" stroke="#F39454" stroke-width="3" marker-end="url(#head-mango)"/>
  <text x="756.0" y="376" font-size="13" font-weight="700" fill="#F39454" text-anchor="middle">output</text>

  <!-- ==================== 3 · Television ==================== -->
  <rect x="830" y="222" width="290" height="336" rx="6" fill="#141421"/>
  <rect x="844" y="236" width="262" height="308" fill="#D7D8D8"/>
  <use href="#mspct" x="855.0" y="243.0"/>
  <rect x="955.0" y="558" width="40" height="26" fill="#141421"/>
  <rect x="905.0" y="584" width="140" height="12" rx="4" fill="#141421"/>
  <text x="1120" y="214" font-size="11" font-weight="700" fill="#F39454" text-anchor="end">Dashboard!B3:B16</text>

  <!-- ==================== Captions ==================== -->
  <text x="60" y="636" font-size="13" fill="#141421"><tspan font-weight="700">Select</tspan> the range B2:D15.</text>
  <text x="500" y="636" font-size="13" fill="#141421"><tspan font-weight="700">Click</tspan> the Camera tool once.</text>
  <text x="830" y="636" font-size="13" fill="#141421"><tspan font-weight="700">Click</tspan> in the Dashboard and place it on B3:B16.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="664" x2="1140" y2="664" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="702" font-size="20" fill="#141421">A <tspan font-weight="700">live picture</tspan> of a range: change the source, the dashboard follows.</text>
  <text x="1140" y="701" font-size="14" fill="#70706F" text-anchor="end">Quick Access Toolbar ❭ Camera</text>
</svg>
