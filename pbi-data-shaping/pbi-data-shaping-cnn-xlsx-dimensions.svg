<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 730" width="1200" height="730" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-sand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70706F"/>
    </marker>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
    <!-- connection (plug) -->
    <g id="ico-cnn" fill="none" stroke="#70706F" stroke-width="1.5">
      <line x1="3" y1="0" x2="3" y2="4"/><line x1="9" y1="0" x2="9" y2="4"/><path d="M0 4 h12 v4 a6 6 0 0 1 -12 0 z"/><line x1="6" y1="14" x2="6" y2="17"/>
    </g>
    <!-- staging (list) -->
    <g id="ico-stg">
      <circle cx="2" cy="2" r="1.8" fill="#70706F"/><line x1="6" y1="2" x2="15" y2="2" stroke="#70706F" stroke-width="1.5"/>
      <circle cx="2" cy="7" r="1.8" fill="#70706F"/><line x1="6" y1="7" x2="15" y2="7" stroke="#70706F" stroke-width="1.5"/>
      <circle cx="2" cy="12" r="1.8" fill="#70706F"/><line x1="6" y1="12" x2="11" y2="12" stroke="#70706F" stroke-width="1.5"/>
    </g>
    <!-- loaded table -->
    <g id="ico-load" fill="none" stroke="#F39454">
      <line x1="7" y1="0" x2="7" y2="7" stroke-width="1.5"/><path d="M4 4.5 l3 3 l3 -3" stroke-width="1.5"/><rect x="0" y="9" width="14" height="7" stroke-width="1.5"/><line x1="0" y1="12" x2="14" y2="12" stroke-width="1"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="730" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Connections</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="425" lengthAdjust="spacing">Connect to the dimensions</text>
  <rect x="493" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">One connection extracts the workbook on refresh, staging queries shape it into business tables.</text>

  <!-- ==================== Layer titles ==================== -->
  <text x="60" y="200" font-size="16" font-weight="700" fill="#141421">SOURCE</text>
  <text x="60" y="222" font-size="13" fill="#70706F">Excel workbook</text>

  <circle cx="262" cy="194" r="12" fill="#F39454"/><text x="262" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="282" y="200" font-size="16" font-weight="700" fill="#141421">RAW <tspan font-size="13" font-weight="400" fill="#70706F">· connection</tspan></text>
  <text x="250" y="222" font-size="13" font-style="italic" fill="#70706F">cnn<tspan fill="#A9AAAA"> | </tspan>xxx<tspan fill="#A9AAAA"> | </tspan>yyy</text>

  <circle cx="572" cy="194" r="12" fill="#F39454"/><text x="572" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="592" y="200" font-size="16" font-weight="700" fill="#141421">STANDARDIZED <tspan font-size="13" font-weight="400" fill="#70706F">· stagings</tspan></text>
  <text x="560" y="222" font-size="13" font-style="italic" fill="#70706F">stg<tspan fill="#A9AAAA"> | </tspan>yyy<tspan fill="#A9AAAA"> | </tspan>zzz</text>

  <circle cx="932" cy="194" r="12" fill="#F39454"/><text x="932" y="199" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="952" y="200" font-size="16" font-weight="700" fill="#141421">CURATED <tspan font-size="13" font-weight="400" fill="#70706F">· business</tspan></text>
  <text x="920" y="222" font-size="13" fill="#70706F">Final Business Name (zzz)</text>

  <!-- Naming segments -->
  <g font-size="12" fill="#70706F">
    <text x="250" y="244"><tspan font-style="italic">xxx</tspan> = file type</text>
    <text x="250" y="260"><tspan font-style="italic">yyy</tspan> = content of the file</text>
    <text x="560" y="244"><tspan font-style="italic">yyy</tspan> = table type: dim or fact</text>
    <text x="560" y="260"><tspan font-style="italic">zzz</tspan> = singular for dim, plural for fact</text>
  </g>

  <g transform="translate(0,40)">
  <!-- ==================== Layer frames ==================== -->
  <rect x="250" y="234" width="260" height="320" fill="none" stroke="#A9AAAA" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="560" y="234" width="330" height="320" fill="none" stroke="#A9AAAA" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="920" y="234" width="220" height="320" fill="none" stroke="#A9AAAA" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ==================== Source ==================== -->
  <path d="M60 372 h22 l10 10 v32 h-32 z" fill="#FFFFFF" stroke="#141421" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M82 372 v10 h10" fill="none" stroke="#141421" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="54" y="388" width="28" height="14" fill="#C9DCE7"/>
  <text x="68" y="399" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">XLSX</text>
  <text x="60" y="440" font-size="14" font-weight="700" fill="#141421">bi_dimensions.xlsx</text>
  <text x="60" y="458" font-size="12" fill="#70706F">C:\temp\pbi-essentials\</text>
  <g font-size="12" fill="#70706F">
    <rect x="60" y="484" width="6" height="6" fill="#C9DCE7"/><text x="74" y="491"><tspan fill="#141421">Product</tspan> · table</text>
    <rect x="60" y="502" width="6" height="6" fill="#C9DCE7"/><text x="74" y="509"><tspan fill="#141421">Manufacturer</tspan> · sheet</text>
    <rect x="60" y="520" width="6" height="6" fill="#C9DCE7"/><text x="74" y="527"><tspan fill="#141421">Geography</tspan> · sheet</text>
  </g>

  <!-- ==================== RAW: connection ==================== -->
  <rect x="266" y="358" width="228" height="72" fill="#FFFFFF" stroke="#F39454" stroke-width="2" filter="url(#card)"/>
  <rect x="266" y="358" width="228" height="36" fill="#141421"/>
  <text x="280" y="382" font-size="14" font-weight="700" fill="#F6F6F6">cnn<tspan fill="#A9AAAA"> | </tspan>xlsx<tspan fill="#A9AAAA"> | </tspan>dimensions</text>
  <use xlink:href="#ico-cnn" x="281" y="403"/>
  <text x="302" y="417" font-size="13" font-style="italic" fill="#70706F">Load disabled</text>

  <!-- ==================== STANDARDIZED: stagings ==================== -->
  <rect x="576" y="252" width="298" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="576" y="252" width="298" height="36" fill="#141421"/>
  <text x="590" y="276" font-size="14" font-weight="700" fill="#F6F6F6">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>geography</text>
  <use xlink:href="#ico-stg" x="590" y="299"/>
  <text x="614" y="311" font-size="13" font-style="italic" fill="#70706F">Load disabled</text>

  <rect x="576" y="358" width="298" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="576" y="358" width="298" height="36" fill="#141421"/>
  <text x="590" y="382" font-size="14" font-weight="700" fill="#F6F6F6">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>manufacturer</text>
  <use xlink:href="#ico-stg" x="590" y="405"/>
  <text x="614" y="417" font-size="13" font-style="italic" fill="#70706F">Load disabled</text>

  <rect x="576" y="464" width="298" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="576" y="464" width="298" height="36" fill="#141421"/>
  <text x="590" y="488" font-size="14" font-weight="700" fill="#F6F6F6">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>product</text>
  <use xlink:href="#ico-stg" x="590" y="511"/>
  <text x="614" y="523" font-size="13" font-style="italic" fill="#70706F">Load disabled</text>

  <!-- ==================== CURATED: business tables ==================== -->
  <rect x="936" y="252" width="188" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="936" y="252" width="188" height="36" fill="#141421"/>
  <text x="950" y="276" font-size="14" font-weight="700" fill="#F6F6F6">Geography</text>
  <use xlink:href="#ico-load" x="950" y="297"/>
  <text x="974" y="311" font-size="13" fill="#141421">Loaded</text>

  <rect x="936" y="358" width="188" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="936" y="358" width="188" height="36" fill="#141421"/>
  <text x="950" y="382" font-size="14" font-weight="700" fill="#F6F6F6">Manufacturer</text>
  <use xlink:href="#ico-load" x="950" y="403"/>
  <text x="974" y="417" font-size="13" fill="#141421">Loaded</text>

  <rect x="936" y="464" width="188" height="72" fill="#FFFFFF" stroke="#A9AAAA" stroke-width="1" filter="url(#card)"/>
  <rect x="936" y="464" width="188" height="36" fill="#141421"/>
  <text x="950" y="488" font-size="14" font-weight="700" fill="#F6F6F6">Product</text>
  <use xlink:href="#ico-load" x="950" y="509"/>
  <text x="974" y="523" font-size="13" fill="#141421">Loaded</text>

  <!-- ==================== Flow ==================== -->
  <path d="M100 394 L262 394" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <text x="176" y="386" font-size="11" font-weight="700" fill="#F39454" text-anchor="middle">extract</text>
  <path d="M498 394 C535 394 535 288 572 288" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <path d="M498 394 L572 394" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <path d="M498 394 C535 394 535 500 572 500" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <text x="535" y="386" font-size="11" font-weight="700" fill="#70706F" text-anchor="middle">cleanse</text>
  <path d="M878 288 L932 288" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <path d="M878 394 L932 394" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <path d="M878 500 L932 500" fill="none" stroke="#70706F" stroke-width="2" marker-end="url(#head-sand)"/>
  <text x="905" y="280" font-size="11" font-weight="700" fill="#70706F" text-anchor="middle">shape</text>

  <!-- ==================== Captions ==================== -->
  <text x="60" y="584" font-size="13" fill="#141421"><tspan font-weight="700">1 workbook</tspan>, 3 dimensions.</text>
  <text x="250" y="584" font-size="13" fill="#141421"><tspan font-weight="700">1 connection</tspan> to the workbook.</text>
  <text x="560" y="584" font-size="13" fill="#141421"><tspan font-weight="700">3 staging queries</tspan> to cleanse each dimension.</text>
  <text x="920" y="584" font-size="13" fill="#141421"><tspan font-weight="700">3 dimensions</tspan> for the business.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="614" x2="1140" y2="614" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="652" font-size="20" fill="#141421">The <tspan font-weight="700">connection</tspan> extracts the raw data on refresh, without any changes.</text>
  <text x="1140" y="651" font-size="14" fill="#70706F" text-anchor="end">Data ❭ Get Data ❭ From Excel Workbook</text>
  </g>
</svg>
