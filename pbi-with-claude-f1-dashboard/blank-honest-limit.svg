<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <title>The honest limit: the checks only know the 34 rules somebody wrote; an unknown trap gives the same blank and no finding</title>
  <rect width="1200" height="700" fill="#f6f6f6"/>

  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#151722"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2955a"/>
    </marker>
  </defs>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="44" font-size="15" letter-spacing="1" fill="#6e6e6e">1.8 WHEN IT GOES BLANK: THE HONEST LIMIT</text>
    <text x="60" y="76" font-size="22" font-weight="700" fill="#151722">The checks only know the rules somebody wrote into them.</text>

    <!-- the checker in the middle -->
    <rect x="470" y="150" width="260" height="290" rx="10" fill="#151722"/>
    <text x="600" y="190" font-size="13" letter-spacing="1" fill="#f2955a" text-anchor="middle">THE CHECKING TOOLS</text>
    <text x="600" y="222" font-size="15" fill="#ffffff" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">tmdl_lint · pbir_lint</text>
    <!-- rule tiles: 34 = 2 rows of 17? draw 34 small squares, 7 x 5 grid minus one -->
    <g fill="#f2955a">
      <rect x="503" y="244" width="22" height="22" rx="3"/><rect x="531" y="244" width="22" height="22" rx="3"/><rect x="559" y="244" width="22" height="22" rx="3"/><rect x="587" y="244" width="22" height="22" rx="3"/><rect x="615" y="244" width="22" height="22" rx="3"/><rect x="643" y="244" width="22" height="22" rx="3"/><rect x="671" y="244" width="22" height="22" rx="3"/>
      <rect x="503" y="272" width="22" height="22" rx="3"/><rect x="531" y="272" width="22" height="22" rx="3"/><rect x="559" y="272" width="22" height="22" rx="3"/><rect x="587" y="272" width="22" height="22" rx="3"/><rect x="615" y="272" width="22" height="22" rx="3"/><rect x="643" y="272" width="22" height="22" rx="3"/><rect x="671" y="272" width="22" height="22" rx="3"/>
      <rect x="503" y="300" width="22" height="22" rx="3"/><rect x="531" y="300" width="22" height="22" rx="3"/><rect x="559" y="300" width="22" height="22" rx="3"/><rect x="587" y="300" width="22" height="22" rx="3"/><rect x="615" y="300" width="22" height="22" rx="3"/><rect x="643" y="300" width="22" height="22" rx="3"/><rect x="671" y="300" width="22" height="22" rx="3"/>
      <rect x="503" y="328" width="22" height="22" rx="3"/><rect x="531" y="328" width="22" height="22" rx="3"/><rect x="559" y="328" width="22" height="22" rx="3"/><rect x="587" y="328" width="22" height="22" rx="3"/><rect x="615" y="328" width="22" height="22" rx="3"/><rect x="643" y="328" width="22" height="22" rx="3"/><rect x="671" y="328" width="22" height="22" rx="3"/>
      <rect x="503" y="356" width="22" height="22" rx="3"/><rect x="531" y="356" width="22" height="22" rx="3"/><rect x="559" y="356" width="22" height="22" rx="3"/><rect x="587" y="356" width="22" height="22" rx="3"/><rect x="615" y="356" width="22" height="22" rx="3"/><rect x="643" y="356" width="22" height="22" rx="3"/>
    </g>
    <rect x="671" y="356" width="22" height="22" rx="3" fill="none" stroke="#6e6e6e" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="600" y="414" font-size="15" fill="#ffffff" text-anchor="middle">34 rules, from one build</text>

    <!-- known trap -->
    <text x="60" y="130" font-size="13" letter-spacing="1" fill="#6e6e6e">A KNOWN TRAP</text>
    <rect x="60" y="150" width="340" height="120" rx="8" fill="#ffffff" stroke="#151722" stroke-width="2"/>
    <text x="84" y="186" font-size="16" font-weight="700" fill="#151722">A field well with a name</text>
    <text x="84" y="208" font-size="16" font-weight="700" fill="#151722">the visual does not have</text>
    <text x="84" y="244" font-size="14" fill="#6e6e6e">Canvas: a blank visual</text>
    <line x1="402" y1="210" x2="466" y2="210" stroke="#151722" stroke-width="3" marker-end="url(#arrowDark)"/>

    <rect x="800" y="150" width="340" height="120" rx="8" fill="#ffffff" stroke="#151722" stroke-width="3"/>
    <text x="824" y="182" font-size="13" letter-spacing="1" fill="#6e6e6e">RESULT</text>
    <text x="824" y="214" font-size="15" fill="#151722" font-family="Consolas, 'Courier New', monospace">WARN  well.unknown</text>
    <text x="824" y="242" font-size="14" fill="#151722">A finding: rule, file, object.</text>
    <line x1="734" y1="210" x2="796" y2="210" stroke="#151722" stroke-width="3" marker-end="url(#arrowDark)"/>

    <!-- unknown trap -->
    <text x="60" y="318" font-size="13" letter-spacing="1" fill="#6e6e6e">A TRAP NOBODY HAS MET YET</text>
    <rect x="60" y="338" width="340" height="120" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="84" y="374" font-size="16" font-weight="700" fill="#151722">Something new, with no rule</text>
    <text x="84" y="396" font-size="16" font-weight="700" fill="#151722">written for it</text>
    <text x="84" y="432" font-size="14" fill="#6e6e6e">Canvas: the same blank visual</text>
    <line x1="402" y1="398" x2="466" y2="398" stroke="#f2955a" stroke-width="3" marker-end="url(#arrowOrange)"/>

    <rect x="800" y="338" width="340" height="120" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="3"/>
    <text x="824" y="370" font-size="13" letter-spacing="1" fill="#6e6e6e">RESULT</text>
    <text x="824" y="402" font-size="15" fill="#151722" font-family="Consolas, 'Courier New', monospace">0 error(s), 0 warning(s)</text>
    <text x="824" y="430" font-size="14" font-weight="700" fill="#f2955a">No finding at all.</text>
    <line x1="734" y1="398" x2="796" y2="398" stroke="#f2955a" stroke-width="3" marker-end="url(#arrowOrange)"/>

    <!-- what clean means -->
    <rect x="60" y="490" width="1080" height="84" rx="8" fill="#151722"/>
    <text x="84" y="522" font-size="13" letter-spacing="1" fill="#f2955a">READ A CLEAN RESULT CORRECTLY</text>
    <text x="84" y="554" font-size="19" fill="#ffffff">"Clean" means <tspan font-weight="700" fill="#f2955a">none of the known traps</tspan>. It does not mean correct.</text>

    <!-- closing the gap -->
    <rect x="60" y="594" width="1080" height="66" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="3"/>
    <text x="84" y="624" font-size="16" font-weight="700" fill="#151722">Closing the gap is the next chapter's job.</text>
    <text x="84" y="646" font-size="15" fill="#151722">Turn a trap you met into a rule, and the tools catch it next time: the dashed square becomes the 35th.</text>

    <text x="600" y="688" font-size="14" fill="#6e6e6e" text-anchor="middle">Over-trusting a tool is its own failure mode.</text>
  </g>
</svg>
