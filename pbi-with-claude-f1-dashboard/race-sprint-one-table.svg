<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <title>Race and sprint results in one table, told apart by a Session column that is a two-row lookup</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f6f6f6"/>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ============ 1. one table ============ -->
    <text x="60" y="58" font-size="15" letter-spacing="1" fill="#6e6e6e">1 · RACE AND SPRINT RESULTS: ONE TABLE, TOLD APART BY A COLUMN</text>

    <!-- sources -->
    <rect x="60" y="86" width="300" height="96" rx="8" fill="#c8dce8"/>
    <text x="80" y="116" font-size="16" font-weight="700" fill="#151722" font-family="Consolas, 'Courier New', monospace">results</text>
    <text x="80" y="140" font-size="13" fill="#3b4150" font-family="Consolas, 'Courier New', monospace">Races › Results</text>
    <text x="80" y="166" font-size="14" fill="#3b4150">Position · Points · Grid · Status</text>

    <rect x="60" y="204" width="300" height="96" rx="8" fill="#c8dce8"/>
    <text x="80" y="234" font-size="16" font-weight="700" fill="#151722" font-family="Consolas, 'Courier New', monospace">sprint</text>
    <text x="80" y="258" font-size="13" fill="#3b4150" font-family="Consolas, 'Courier New', monospace">Races › SprintResults</text>
    <text x="80" y="284" font-size="14" fill="#3b4150">Position · Points · Grid · Status</text>

    <text x="60" y="326" font-size="14" fill="#6e6e6e">identical fields in the source</text>

    <line x1="366" y1="134" x2="412" y2="160" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="366" y1="252" x2="412" y2="226" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Session Result -->
    <rect x="420" y="86" width="420" height="214" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="440" y="326" font-size="14" fill="#2f8f5b" font-weight="700">✓ <tspan font-family="Consolas, 'Courier New', monospace">Session Result.csv</tspan>: every measure written once</text>
    <rect x="626" y="96" width="104" height="188" rx="4" fill="#f2955a" fill-opacity="0.18"/>
    <g font-size="14" fill="#6e6e6e">
      <text x="440" y="118">Race Key</text>
      <text x="548" y="118">Driver</text>
      <text x="638" y="118" fill="#151722" font-weight="700">Session</text>
      <text x="756" y="118">Points</text>
    </g>
    <line x1="436" y1="130" x2="824" y2="130" stroke="#d9dadb" stroke-width="1.5"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722">
      <text x="440" y="158">2026-02</text><text x="548" y="158">NOR</text><text x="638" y="158">Race</text><text x="756" y="158">25</text>
      <text x="440" y="190">2026-02</text><text x="548" y="190">NOR</text><text x="638" y="190" fill="#f2955a" font-weight="700">Sprint</text><text x="756" y="190">8</text>
      <text x="440" y="222">2026-02</text><text x="548" y="222">VER</text><text x="638" y="222">Race</text><text x="756" y="222">18</text>
      <text x="440" y="254">2026-02</text><text x="548" y="254">VER</text><text x="638" y="254" fill="#f2955a" font-weight="700">Sprint</text><text x="756" y="254">7</text>
      <text x="440" y="280" fill="#9a9da6">…</text>
    </g>

    <!-- the alternative -->
    <rect x="880" y="86" width="260" height="214" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="900" y="118" font-size="17" font-weight="700" fill="#151722">Split into two</text>
    <text x="1120" y="118" font-size="18" font-weight="700" fill="#c0392b" text-anchor="end">✗</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#151722">
      <rect x="900" y="136" width="220" height="34" rx="4" fill="#f6f6f6" stroke="#d9dadb"/>
      <text x="914" y="158">Race Result.csv</text>
      <rect x="900" y="180" width="220" height="34" rx="4" fill="#f6f6f6" stroke="#d9dadb"/>
      <text x="914" y="202">Sprint Result.csv</text>
    </g>
    <text x="900" y="248" font-size="14" fill="#c0392b" font-weight="700">two tables, two copies</text>
    <text x="900" y="270" font-size="14" fill="#c0392b" font-weight="700">of every calculation</text>

    <!-- ============ 2. what Session is ============ -->
    <text x="60" y="378" font-size="15" letter-spacing="1" fill="#6e6e6e">2 · AND SAY WHAT SESSION IS, BECAUSE IT READS TWO WAYS</text>

    <!-- two-row lookup -->
    <rect x="60" y="396" width="520" height="180" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="84" y="428" font-size="18" font-weight="700" fill="#151722">A two-row lookup</text>
    <text x="556" y="428" font-size="18" font-weight="700" fill="#2f8f5b" text-anchor="end">✓</text>
    <rect x="84" y="446" width="150" height="92" rx="6" fill="#c8dce8"/>
    <text x="100" y="470" font-size="13" fill="#3b4150" font-family="Consolas, 'Courier New', monospace">Session</text>
    <line x1="96" y1="480" x2="222" y2="480" stroke="#ffffff" stroke-width="1.5"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722">
      <text x="100" y="504">Race</text>
      <text x="100" y="528">Sprint</text>
    </g>
    <line x1="240" y1="492" x2="318" y2="492" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>
    <text x="279" y="482" font-size="13" fill="#6e6e6e" text-anchor="middle">1 → many</text>
    <rect x="326" y="470" width="200" height="44" rx="6" fill="#151722"/>
    <text x="426" y="498" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Session Result</text>
    <text x="84" y="562" font-size="14" fill="#2f8f5b" font-weight="700">what the report chapter's generator expects</text>

    <!-- log of sessions -->
    <rect x="620" y="396" width="520" height="180" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="644" y="428" font-size="18" font-weight="700" fill="#151722">One row per session that happened</text>
    <text x="1116" y="428" font-size="18" font-weight="700" fill="#c0392b" text-anchor="end">✗</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#151722">
      <g fill="#6e6e6e"><text x="644" y="462">Race Key</text><text x="764" y="462">Session</text><text x="874" y="462">Date</text></g>
      <text x="644" y="486">2026-01</text><text x="764" y="486">Race</text><text x="874" y="486">…</text>
      <text x="644" y="508">2026-02</text><text x="764" y="508">Sprint</text><text x="874" y="508">…</text>
      <text x="644" y="530">2026-02</text><text x="764" y="530">Race</text><text x="874" y="530">…</text>
    </g>
    <text x="644" y="562" font-size="14" fill="#c0392b" font-weight="700">richer, reasonable, and not what the generator expects</text>

    <!-- rule -->
    <text x="60" y="614" font-size="15" fill="#3b4150">Left unsaid, an agent will reasonably build the second. Say "two-row lookup" in the prompt.</text>
  </g>
</svg>
