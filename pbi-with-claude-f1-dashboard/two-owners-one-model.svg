<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1046" width="1200" height="1046">
<title>Two owners, one model: editing the files while Desktop has the project open, and the next save overwrites the edit</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f8f5b"/></marker></defs>
<rect width="1200" height="1046" fill="#f6f6f6"/>
<g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="50" y="44" font-size="15" fill="#6e6e6e" letter-spacing="1">RISK · TWO OWNERS, ONE MODEL</text>
<text x="50" y="76" font-size="22" fill="#151722" font-weight="700">Don't edit the files while Desktop has the project open.</text>
<text x="50" y="118" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">1  ·  THE COLLISION</text>
<circle cx="270" cy="150" r="12" fill="#151722"/>
<text x="270" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="290" y="155" font-size="14" fill="#151722" font-weight="700">Desktop opens the PBIP</text>
<text x="290" y="176" font-size="11.5" fill="#6e6e6e">loads the model into its</text>
<text x="290" y="192" font-size="11.5" fill="#6e6e6e">own engine: the truth</text>
<circle cx="470" cy="150" r="12" fill="#151722"/>
<text x="470" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="490" y="155" font-size="14" fill="#151722" font-weight="700">Claude changes the files</text>
<text x="490" y="176" font-size="11.5" fill="#6e6e6e">a script, a direct edit, or the MCP server:</text>
<text x="490" y="192" font-size="11.5" fill="#6e6e6e">ConnectFolder, edit, ExportToTmdlFolder</text>
<circle cx="770" cy="150" r="12" fill="#c0392b"/>
<text x="770" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="790" y="155" font-size="14" fill="#c0392b" font-weight="700">Desktop doesn't see it</text>
<text x="790" y="176" font-size="11.5" fill="#6e6e6e">it never watches the folder</text>
<text x="790" y="192" font-size="11.5" fill="#6e6e6e">and shows the old model</text>
<circle cx="970" cy="150" r="12" fill="#c0392b"/>
<text x="970" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="990" y="155" font-size="14" fill="#c0392b" font-weight="700">Save overwrites it</text>
<text x="990" y="176" font-size="11.5" fill="#6e6e6e">Ctrl+S, or yes to</text>
<text x="990" y="192" font-size="11.5" fill="#6e6e6e">“save changes?” on close</text>
<rect x="50" y="220" width="1100" height="62" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="70" y="248" font-size="15" fill="#151722" font-weight="700">Desktop's memory</text>
<text x="70" y="267" font-size="12" fill="#6e6e6e">what you see</text>
<rect x="50" y="322" width="1100" height="62" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="70" y="350" font-size="15" fill="#151722" font-weight="700">Files on disk</text>
<text x="70" y="369" font-size="12" fill="#6e6e6e">what git sees</text>
<rect x="50" y="424" width="1100" height="62" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="70" y="452" font-size="15" fill="#151722" font-weight="700">MCP server's memory</text>
<text x="70" y="471" font-size="11.5" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace">powerbi-modeling-mcp</text>
<line x1="450" y1="136" x2="450" y2="494" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="750" y1="136" x2="750" y2="494" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="950" y1="136" x2="950" y2="494" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="302" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="350" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="552" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="600" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="802" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="850" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="1002" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="1050" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="302" y="335" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="350" y="358" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="552" y="335" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="600" y="358" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="802" y="335" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="850" y="358" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="1002" y="335" width="96" height="36" rx="7" fill="#f9ebe9" stroke="#c0392b" stroke-width="2"/>
<text x="1050" y="358" font-size="14" fill="#c0392b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="302" y="437" width="96" height="36" rx="7" fill="none" stroke="#9a9da6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="350" y="459" font-size="11.5" fill="#6e6e6e" text-anchor="middle">not loaded</text>
<rect x="552" y="437" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="600" y="460" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="802" y="437" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="850" y="460" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="1002" y="437" width="96" height="36" rx="7" fill="#fff3ea" stroke="#f2955a" stroke-width="2"/>
<text x="1050" y="460" font-size="14" fill="#b5651d" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<text x="1106" y="460" font-size="12" fill="#b5651d" font-weight="700">stale</text>
<text x="656" y="460" font-size="11.5" fill="#2f8f5b" font-weight="700">Claude's edit</text>
<line x1="350" y1="333" x2="350" y2="273" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="360" y="306" font-size="11.5" fill="#6e6e6e">loads</text>
<rect x="658" y="339" width="62" height="28" rx="6" fill="#151722"/>
<text x="689" y="358" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Claude</text>
<line x1="656" y1="353" x2="652" y2="353" stroke="#2f8f5b" stroke-width="2.5" marker-end="url(#ahg)"/>
<line x1="572" y1="373" x2="572" y2="433" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="564" y="408" font-size="11" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="end">ConnectFolder</text>
<line x1="628" y1="435" x2="628" y2="375" stroke="#2f8f5b" stroke-width="3" marker-end="url(#ahg)"/>
<text x="636" y="408" font-size="10.5" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace">ExportToTmdlFolder</text>
<line x1="850" y1="333" x2="850" y2="273" stroke="#9a9da6" stroke-width="2" stroke-dasharray="4 4"/>
<g transform="translate(850 302)"><circle r="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="866" y="306" font-size="11.5" fill="#c0392b">not seen</text>
<g transform="translate(916 247)"><path d="M-14 0 Q0 -11 14 0 Q0 11 -14 0 Z" fill="#ffffff" stroke="#151722" stroke-width="2"/><circle r="4" fill="#151722"/></g>
<text x="916" y="273" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">old</text>
<line x1="1050" y1="271" x2="1050" y2="331" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<text x="1060" y="306" font-size="12" fill="#c0392b" font-weight="700" font-family="Consolas, 'Courier New', monospace">Ctrl+S</text>
<text x="1104" y="358" font-size="11.5" fill="#c0392b" font-weight="700">v2 lost</text>
<text x="758" y="514" font-size="12.5" fill="#c0392b">You conclude the edit failed,</text>
<text x="758" y="531" font-size="12.5" fill="#c0392b">or worse, that it worked.</text>
<text x="958" y="514" font-size="12.5" fill="#c0392b">Claude's edit disappears;</text>
<text x="958" y="531" font-size="12.5" fill="#c0392b">git diff shows it reverted.</text>
<text x="70" y="514" font-size="12.5" fill="#6e6e6e">Tempting, because the course's rhythm</text>
<text x="70" y="531" font-size="12.5" fill="#6e6e6e">invites it: Desktop open, spot, ask, edit.</text>
<rect x="50" y="552" width="1100" height="36" rx="8" fill="#f9ebe9" stroke="#c0392b" stroke-width="1.5"/>
<g transform="translate(74 570)"><circle r="10" fill="#c0392b"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></g>
<text x="94" y="575" font-size="13.5" fill="#c0392b" font-weight="700">No link from the MCP server to Desktop.</text>
<text x="382" y="575" font-size="13.5" fill="#151722">The export only changes the files, and Desktop reads them only when it opens.</text>
<rect x="50" y="596" width="1100" height="36" rx="8" fill="#fff3ea" stroke="#f2955a" stroke-width="1.5"/>
<g transform="translate(74 614)"><circle r="10" fill="#f2955a"/><text y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">!</text></g>
<text x="94" y="619" font-size="13.5" fill="#b5651d" font-weight="700">v2 in the server goes stale.</text>
<text x="300" y="619" font-size="13.5" fill="#151722">It never re-reads the files, and exporting it again writes v2 over newer ones. Export, then Disconnect.</text>
<g transform="translate(0 194)">
<text x="50" y="478" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">2  ·  PICK ONE OWNER AT A TIME</text>
<rect x="50" y="494" width="540" height="196" rx="10" fill="#ffffff" stroke="#2f8f5b" stroke-width="3"/>
<text x="74" y="530" font-size="19" fill="#151722" font-weight="700">Files own it</text>
<rect x="416" y="512" width="150" height="26" rx="13" fill="#eaf4ef"/>
<text x="491.0" y="530" font-size="12.5" fill="#2f8f5b" font-weight="700" text-anchor="middle">the course's route</text>
<circle cx="84" cy="557" r="10" fill="#2f8f5b"/>
<text x="84" y="562" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="562" font-size="13.5" fill="#151722">Close Desktop.</text>
<circle cx="84" cy="578" r="10" fill="#2f8f5b"/>
<text x="84" y="583" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="104" y="583" font-size="13.5" fill="#151722">Claude edits the files, or ConnectFolder</text>
<text x="104" y="604" font-size="13.5" fill="#151722">+ ExportToTmdlFolder.</text>
<circle cx="84" cy="620" r="10" fill="#2f8f5b"/>
<text x="84" y="625" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="104" y="625" font-size="13.5" fill="#151722">Run the fast checks, without Desktop.</text>
<circle cx="84" cy="641" r="10" fill="#2f8f5b"/>
<text x="84" y="646" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="104" y="646" font-size="13.5" fill="#151722">Reopen Desktop for the final look:</text>
<text x="104" y="667" font-size="13.5" fill="#151722">one cold start, at the end.</text>
<rect x="610" y="494" width="540" height="196" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="3"/>
<text x="634" y="530" font-size="19" fill="#151722" font-weight="700">Desktop owns it</text>
<rect x="983" y="512" width="143" height="26" rx="13" fill="#e8f1f8"/>
<text x="1054.5" y="530" font-size="12.5" fill="#2f6fa8" font-weight="700" text-anchor="middle">the live instance</text>
<circle cx="644" cy="557" r="10" fill="#2f6fa8"/>
<text x="644" y="562" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="664" y="562" font-size="13.5" fill="#151722">Keep Desktop open.</text>
<circle cx="644" cy="578" r="10" fill="#2f6fa8"/>
<text x="644" y="583" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="664" y="583" font-size="13.5" fill="#151722">Claude connects to the live model:</text>
<text x="664" y="604" font-size="13.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">ListLocalInstances → Connect.</text>
<circle cx="644" cy="620" r="10" fill="#2f6fa8"/>
<text x="644" y="625" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="664" y="625" font-size="13.5" fill="#151722">Edits happen inside Desktop's model.</text>
<circle cx="644" cy="641" r="10" fill="#2f6fa8"/>
<text x="644" y="646" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="664" y="646" font-size="13.5" fill="#151722">Save in Desktop to write them to disk.</text>
<rect x="50" y="704" width="1100" height="40" rx="8" fill="#f9ebe9" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(78 724)"><circle r="11" fill="#c0392b"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="100" y="729" font-size="15" fill="#c0392b" font-weight="700">Never both at once.</text>
<text x="262" y="729" font-size="14" fill="#151722">Two programs holding the same model is the collision above.</text>
<rect x="50" y="758" width="1100" height="74" rx="10" fill="#151722"/>
<text x="74" y="788" font-size="15.5" fill="#ffffff" font-weight="700">The common thread: the model lives in more than one place at once, in memory and on disk.</text>
<text x="74" y="814" font-size="13.5" fill="#d9dadb">Export to move memory to disk, don't trust a load for more than it checks, and never let two programs hold the same model.</text>
</g>
</g></svg>
