<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230">
  <title>/exit - back at the PowerShell prompt</title>
  <rect width="840" height="230" fill="#f6f6f6"/>
  <rect width="5" height="230" fill="#f39454"/>

  <!-- terminal tab bar -->
  <rect x="5" y="0" width="835" height="44" fill="#ffffff"/>
  <line x1="5" y1="44" x2="840" y2="44" stroke="#d6d7d8" stroke-width="1.5"/>
  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#151722">
    <text x="28" y="28">Terminal</text>
    <text x="104" y="29" font-size="20">+</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722" xml:space="preserve">
    <!-- leaving Claude Code -->
    <rect x="5" y="62" width="835" height="28" fill="#ececec"/>
    <text x="22" y="81"><tspan fill="#6e6e6e">❯ </tspan><tspan font-weight="700">/exit</tspan></text>

    <!-- what Claude Code prints on the way out -->
    <text x="22" y="124" fill="#6e6e6e">Resume this session with:</text>
    <text x="22" y="146" fill="#6e6e6e">claude --resume a6a1df22-ba41-44bd-88b7-234dcb435dc7</text>

    <!-- back in PowerShell, in the course folder -->
    <text x="22" y="182">PS C:\training\in2fa-matl-pbi-with-claude&gt; </text>
    <rect x="374" y="167" width="10" height="20" fill="#2f6fd6"/>
  </g>
</svg>
