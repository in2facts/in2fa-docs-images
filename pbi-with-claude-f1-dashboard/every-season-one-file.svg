<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <title>Every season in one file: adding a season means re-running the script, never editing it</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f6f6f6"/>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ============ 1. the flow ============ -->
    <g font-size="15" letter-spacing="1" fill="#6e6e6e">
      <text x="60" y="58">IN · data/</text>
      <text x="400" y="58">THE SCRIPT</text>
      <text x="800" y="58">OUT · powerbi/data/Race.csv</text>
    </g>

    <!-- inputs -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722">
      <rect x="60" y="86" width="270" height="50" rx="8" fill="#c8dce8"/>
      <text x="80" y="117">raw-2025.json</text>
      <rect x="60" y="148" width="270" height="50" rx="8" fill="#c8dce8"/>
      <text x="80" y="179">raw-2026.json</text>
      <rect x="61" y="211" width="268" height="48" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="80" y="241">raw-2027.json</text>
    </g>
    <text x="215" y="241" font-size="13" fill="#f2955a" font-weight="700">← next season</text>
    <text x="60" y="290" font-size="14" fill="#6e6e6e">adding a season: drop in one more file</text>

    <line x1="338" y1="172" x2="392" y2="172" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>

    <!-- script -->
    <rect x="400" y="96" width="340" height="152" rx="8" fill="#151722"/>
    <text x="424" y="132" font-size="19" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-weight="700">export_csv.py</text>
    <g font-size="15" fill="#e6e7ea">
      <text x="424" y="166">• loops over every raw-*.json</text>
      <text x="424" y="194">• no season written in the code</text>
      <text x="424" y="222">• <tspan fill="#f2955a" font-weight="700">re-run</tspan>, never edited</text>
    </g>

    <line x1="748" y1="172" x2="792" y2="172" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>

    <!-- output: one file, every season -->
    <rect x="800" y="80" width="340" height="226" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <g font-size="14" fill="#6e6e6e">
      <text x="822" y="108">Race Key</text>
      <text x="942" y="108">Season</text>
      <text x="1042" y="108">Round</text>
    </g>
    <line x1="816" y1="118" x2="1124" y2="118" stroke="#d9dadb" stroke-width="1.5"/>
    <rect x="812" y="242" width="316" height="54" rx="4" fill="#f2955a" fill-opacity="0.18"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722">
      <text x="822" y="144">2025-01</text><text x="942" y="144">2025</text><text x="1042" y="144">01</text>
      <text x="822" y="168" fill="#9a9da6">…</text>
      <text x="822" y="192">2026-01</text><text x="942" y="192">2026</text><text x="1042" y="192">01</text>
      <text x="822" y="216">2026-14</text><text x="942" y="216">2026</text><text x="1042" y="216">14</text>
      <text x="822" y="262">2027-01</text><text x="942" y="262">2027</text><text x="1042" y="262">01</text>
      <text x="822" y="286">2027-02</text><text x="942" y="286">2027</text><text x="1042" y="286">02</text>
    </g>
    <text x="800" y="330" font-size="14" fill="#6e6e6e">next season arrives as <tspan fill="#f2955a" font-weight="700">more rows</tspan>, in the same file</text>

    <!-- ============ 2. the comparison ============ -->
    <text x="60" y="378" font-size="15" letter-spacing="1" fill="#6e6e6e">WHAT A NEW SEASON COSTS YOU</text>

    <!-- one file per season -->
    <rect x="60" y="396" width="520" height="180" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="84" y="428" font-size="18" font-weight="700" fill="#151722">One file per season</text>
    <text x="556" y="428" font-size="18" font-weight="700" fill="#c0392b" text-anchor="end">✗</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#151722">
      <text x="84" y="462">Race-2025.csv</text>
      <text x="234" y="462">Race-2026.csv</text>
      <text x="84" y="486">Driver-2025.csv</text>
      <text x="234" y="486">Driver-2026.csv</text>
      <text x="84" y="510" fill="#9a9da6">… × 6 tables</text>
      <text x="234" y="510" fill="#9a9da6">…</text>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#c0392b">
      <rect x="384" y="447" width="170" height="70" rx="4" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="396" y="470">Race-2027.csv</text>
      <text x="396" y="494">Driver-2027.csv</text>
    </g>
    <text x="84" y="552" font-size="14" fill="#c0392b" font-weight="700">six new files to wire into the script and the model, by hand</text>

    <!-- every season in one file -->
    <rect x="620" y="396" width="520" height="180" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="644" y="428" font-size="18" font-weight="700" fill="#151722">Every season in one file</text>
    <text x="1116" y="428" font-size="18" font-weight="700" fill="#2f8f5b" text-anchor="end">✓</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#151722">
      <text x="644" y="462">Race.csv</text>
      <text x="814" y="462">Session.csv</text>
      <text x="644" y="486">Driver.csv</text>
      <text x="814" y="486">Session Result.csv</text>
      <text x="644" y="510">Team.csv</text>
      <text x="814" y="510">Qualifying Result.csv</text>
    </g>
    <text x="644" y="552" font-size="14" fill="#2f8f5b" font-weight="700">the same six files, every year: nothing to edit downstream</text>

    <!-- rule -->
    <text x="60" y="614" font-size="15" fill="#3b4150">Adding a season should mean re-running the script, never editing it.</text>
  </g>
</svg>
