<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
  <title>Two checking tools run all day</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d6d7d8"/>
    </marker>
  </defs>

  <rect width="1200" height="570" fill="#f6f6f6"/>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- column headings -->
    <g font-size="15" letter-spacing="1" fill="#6e6e6e">
      <text x="60" y="58">WHAT YOU BUILD</text>
      <text x="450" y="58">THE CHECK</text>
      <text x="880" y="58">THE PASS MARK</text>
    </g>

    <!-- row 1: the semantic model -->
    <rect x="60" y="80" width="320" height="96" rx="8" fill="#d9dadb"/>
    <text x="84" y="122" font-size="23" fill="#151722">Semantic model</text>
    <text x="84" y="152" font-size="16" fill="#6e6e6e">TMDL files</text>

    <line x1="392" y1="128" x2="438" y2="128" stroke="#d6d7d8" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="450" y="80" width="370" height="96" rx="8" fill="#151722"/>
    <text x="474" y="122" font-size="21" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">tmdl_lint.py</text>
    <text x="474" y="152" font-size="15" fill="#b9bcc4">tables · relationships · DAX · naming</text>

    <line x1="832" y1="128" x2="868" y2="128" stroke="#d6d7d8" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="880" y="98" width="260" height="60" rx="8" fill="#c8dce8"/>
    <text x="1010" y="135" font-size="18" fill="#151722" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0 error(s)</text>

    <!-- row 2: the report -->
    <rect x="60" y="210" width="320" height="96" rx="8" fill="#d9dadb"/>
    <text x="84" y="252" font-size="23" fill="#151722">Report</text>
    <text x="84" y="282" font-size="16" fill="#6e6e6e">PBIR JSON</text>

    <line x1="392" y1="258" x2="438" y2="258" stroke="#d6d7d8" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="450" y="210" width="370" height="96" rx="8" fill="#151722"/>
    <text x="474" y="252" font-size="21" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">pbir_lint.py</text>
    <text x="474" y="282" font-size="15" fill="#b9bcc4">schema · bindings · visual frame</text>

    <line x1="832" y1="258" x2="868" y2="258" stroke="#d6d7d8" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="880" y="228" width="260" height="60" rx="8" fill="#c8dce8"/>
    <text x="1010" y="265" font-size="18" fill="#151722" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0 error(s)</text>

    <!-- what "lint" means: a dryer lint trap, its fluff in orange like findings -->
    <g transform="translate(450,330)">
      <rect x="29" y="0" width="28" height="9" rx="4" fill="#9a9da6"/>
      <rect x="0" y="6" width="86" height="54" rx="9" fill="#ffffff" stroke="#9a9da6" stroke-width="2.5"/>
      <g stroke="#d6d7d8" stroke-width="1.2">
        <line x1="6" y1="18" x2="80" y2="18"/><line x1="6" y1="27" x2="80" y2="27"/><line x1="6" y1="36" x2="80" y2="36"/><line x1="6" y1="45" x2="80" y2="45"/>
        <line x1="17" y1="11" x2="17" y2="55"/><line x1="30" y1="11" x2="30" y2="55"/><line x1="43" y1="11" x2="43" y2="55"/><line x1="56" y1="11" x2="56" y2="55"/><line x1="69" y1="11" x2="69" y2="55"/>
      </g>
      <g fill="#f2955a">
        <circle cx="20" cy="24" r="6"/><circle cx="27" cy="20" r="5"/><circle cx="28" cy="28" r="4.5"/><circle cx="15" cy="30" r="3.5"/>
        <circle cx="60" cy="40" r="5.5"/><circle cx="66" cy="35" r="4.5"/><circle cx="67" cy="44" r="4"/>
        <circle cx="42" cy="47" r="3"/><circle cx="46" cy="45" r="2.4"/>
      </g>
    </g>
    <text x="556" y="356" font-size="17" fill="#6e6e6e"><tspan font-weight="700" fill="#151722">lint</tspan> — a tool that reads files without running them and reports what is wrong.</text>
    <text x="556" y="382" font-size="15" fill="#9a9da6">Named after the fluff a dryer's lint trap catches: small, easy to miss, cheap to remove.</text>

    <!-- takeaway -->
    <line x1="60" y1="430" x2="1140" y2="430" stroke="#d6d7d8" stroke-width="1.5"/>
    <text x="60" y="482" font-size="24" fill="#151722">Each chapter ends when its check comes back clean.</text>
    <text x="1140" y="482" font-size="24" fill="#f2955a" text-anchor="end">Not when it looks like anyone else's.</text>
    <text x="600" y="530" font-size="17" fill="#6e6e6e" text-anchor="middle">🎓 Multiple people build different models. Every one of them still has to pass.</text>
  </g>
</svg>
