<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <title>Reset rather than grind: commit your work, then check out the next checkpoint</title>
  <rect width="1200" height="640" fill="#f6f6f6"/>

  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2955a"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#151722"/>
    </marker>
  </defs>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="44" font-size="15" letter-spacing="1" fill="#6e6e6e">RESET RATHER THAN GRIND</text>
    <text x="60" y="76" font-size="22" font-weight="700" fill="#151722">Twenty minutes stuck, and the checking tools say nothing? Rejoin at a checkpoint.</text>

    <!-- the checkpoint chain -->
    <text x="60" y="124" font-size="13" letter-spacing="1" fill="#6e6e6e">THE COURSE'S CHECKPOINTS</text>
    <line x1="140" y1="170" x2="1060" y2="170" stroke="#d6d7d8" stroke-width="3"/>
    <circle cx="140"  cy="170" r="12" fill="#d9dadb"/>
    <circle cx="370"  cy="170" r="12" fill="#d9dadb"/>
    <circle cx="600"  cy="170" r="16" fill="#f2955a"/>
    <circle cx="830"  cy="170" r="12" fill="#d9dadb"/>
    <circle cx="1060" cy="170" r="12" fill="#d9dadb"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722" text-anchor="middle">
      <text x="140"  y="148">start</text>
      <text x="370"  y="148">after-data</text>
      <text x="600"  y="144" font-weight="700">after-html</text>
      <text x="830"  y="148">after-model</text>
      <text x="1060" y="148">after-report</text>
    </g>

    <!-- your branch -->
    <text x="60" y="246" font-size="13" letter-spacing="1" fill="#6e6e6e">YOUR WORK</text>
    <path d="M140,182 C140,230 180,262 230,262 L400,262" fill="none" stroke="#151722" stroke-width="3"/>
    <rect x="96" y="276" width="64" height="26" rx="13" fill="#151722"/>
    <text x="128" y="294" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">main</text>
    <circle cx="300" cy="262" r="10" fill="#151722"/>
    <circle cx="400" cy="262" r="13" fill="#ffffff" stroke="#151722" stroke-width="4"/>
    <text x="300" y="296" font-size="13" fill="#6e6e6e" text-anchor="middle">chapter 1.3</text>
    <text x="400" y="296" font-size="13" font-weight="700" fill="#151722" text-anchor="middle">"my work so far"</text>

    <!-- the jump -->
    <path d="M414,254 C470,232 560,222 592,190" fill="none" stroke="#f2955a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowOrange)"/>
    <text x="640" y="234" font-size="15" font-weight="700" fill="#151722">a known-good starting state</text>
    <text x="640" y="256" font-size="14" fill="#6e6e6e">for the next chapter, whatever went wrong in this one</text>

    <!-- left panel: commit first -->
    <rect x="60" y="334" width="520" height="214" rx="8" fill="#151722"/>
    <text x="84" y="366" font-size="13" letter-spacing="1" fill="#f2955a">COMMIT FIRST, THEN CHECK OUT</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#ffffff">
      <text x="84" y="400"><tspan fill="#f2955a">1</tspan>  git add -A; git commit -m "my work so far"</text>
      <text x="84" y="428"><tspan fill="#f2955a">2</tspan>  git checkout after-html</text>
    </g>
    <line x1="84" y1="448" x2="556" y2="448" stroke="#3a3d4a" stroke-width="1"/>
    <g font-size="15" fill="#ffffff">
      <text x="84" y="476">&#10003;  The switch is clean. Git warns "detached HEAD": harmless.</text>
      <text x="84" y="502">&#10003;  Your own work is safe on main.</text>
      <text x="84" y="528">&#10003;  Back to it any time with <tspan font-family="Consolas, 'Courier New', monospace">git checkout main</tspan></text>
    </g>

    <!-- right panel: skip the commit -->
    <rect x="620" y="334" width="520" height="214" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="3"/>
    <text x="644" y="366" font-size="13" letter-spacing="1" fill="#151722">SKIP THE COMMIT, AND THE CHECKOUT REFUSES</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#151722">
      <text x="644" y="400">error: The following untracked working tree</text>
      <text x="644" y="420">files would be overwritten by checkout</text>
    </g>
    <text x="644" y="452" font-size="15" fill="#151722">Your files sit at the same paths as the checkpoint's,</text>
    <text x="644" y="474" font-size="15" fill="#151722">and git will not overwrite work it has no copy of.</text>
    <line x1="644" y1="490" x2="1116" y2="490" stroke="#d9dadb" stroke-width="1"/>
    <text x="644" y="516" font-size="15" font-weight="700" fill="#151722">Git then suggests you "move or remove them".</text>
    <text x="644" y="538" font-size="15" fill="#151722">That deletes the chapter you just finished. Commit instead.</text>

    <!-- the point -->
    <text x="600" y="594" font-size="18" font-weight="700" fill="#151722" text-anchor="middle">Every chapter has a checkpoint. Using one is the design, not a failure.</text>
    <text x="600" y="620" font-size="15" fill="#6e6e6e" text-anchor="middle">The checkpoints exist so nobody loses an afternoon to a morning.</text>
  </g>
</svg>
