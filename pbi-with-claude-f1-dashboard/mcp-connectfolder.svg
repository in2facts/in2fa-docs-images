<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830">
<title>ConnectFolder: one of three ways the Power BI Modeling MCP server connects to a semantic model, what it does, and where it sits in the loop</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f2955a"/></marker></defs>
<rect width="1200" height="830" fill="#f6f6f6"/>
<g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="50" y="44" font-size="15" fill="#6e6e6e" letter-spacing="1">POWER BI MODELING MCP SERVER · CONNECTFOLDER</text>
<text x="50" y="76" font-size="22" fill="#151722" font-weight="700">Three ways in. ConnectFolder is the one that needs no Desktop.</text>
<text x="50" y="118" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">1  ·  THREE WAYS IN, ALL IN connection_operations</text>
<rect x="50" y="176" width="160" height="88" rx="10" fill="#151722"/>
<text x="130" y="214" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Claude Code</text>
<text x="130" y="238" font-size="12.5" fill="#b9bcc4" text-anchor="middle">asks in plain English</text>
<line x1="214" y1="220" x2="252" y2="220" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="258" y="140" width="250" height="160" rx="10" fill="#ffffff" stroke="#151722" stroke-width="2"/>
<text x="383" y="180" font-size="16" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">powerbi-modeling-mcp</text>
<text x="383" y="202" font-size="12.5" fill="#6e6e6e" text-anchor="middle">the MCP server</text>
<rect x="282" y="226" width="202" height="46" rx="6" fill="#f6f6f6" stroke="#d9dadb"/>
<text x="383" y="254" font-size="14" fill="#151722" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">connection_operations</text>
<text x="838" y="132" font-size="11" fill="#9a9da6" font-weight="700" letter-spacing="1">WHAT IT CONNECTS TO</text>
<text x="1110" y="132" font-size="11" fill="#9a9da6" font-weight="700" text-anchor="middle" letter-spacing="1">DESKTOP?</text>
<path d="M508 220 C536 220 536 166 560 166" fill="none" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="566" y="142" width="584" height="48" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<rect x="580" y="155" width="24" height="16" rx="2" fill="none" stroke="#151722" stroke-width="2"/><path d="M588 177 h8 M592 171 v6" stroke="#151722" stroke-width="2"/>
<text x="614" y="171" font-size="13" fill="#151722" font-family="Consolas, 'Courier New', monospace">ListLocalInstances → Connect</text>
<text x="838" y="171" font-size="13" fill="#151722">A model open in Power BI Desktop</text>
<rect x="1084" y="154" width="52" height="24" rx="12" fill="#f9ebe9"/>
<text x="1110" y="171" font-size="13" fill="#c0392b" font-weight="700" text-anchor="middle">Yes</text>
<path d="M508 220 C536 220 536 222 560 222" fill="none" stroke="#f2955a" stroke-width="3" marker-end="url(#aho)"/>
<rect x="566" y="198" width="584" height="48" rx="8" fill="#fff3ea" stroke="#f2955a" stroke-width="3"/>
<path d="M580 213 h9 l3 3 h12 v15 h-24 z" fill="#f2955a" stroke="#151722" stroke-width="2" stroke-linejoin="round"/>
<text x="614" y="227" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace">ConnectFolder</text>
<text x="838" y="227" font-size="13" fill="#151722">A PBIP/TMDL folder on disk</text>
<rect x="1084" y="210" width="52" height="24" rx="12" fill="#eaf4ef"/>
<text x="1110" y="227" font-size="13" fill="#2f8f5b" font-weight="700" text-anchor="middle">No</text>
<path d="M508 220 C536 220 536 278 560 278" fill="none" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="566" y="254" width="584" height="48" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<path d="M586 287 a6 6 0 0 1 0-12 a8 8 0 0 1 15 -2 a6 6 0 0 1 3 14 z" fill="#c8dce8" stroke="#151722" stroke-width="2" stroke-linejoin="round"/>
<text x="614" y="283" font-size="14" fill="#151722" font-family="Consolas, 'Courier New', monospace">ConnectFabric</text>
<text x="838" y="283" font-size="13" fill="#151722">A semantic model in a Fabric workspace</text>
<rect x="1084" y="266" width="52" height="24" rx="12" fill="#eaf4ef"/>
<text x="1110" y="283" font-size="13" fill="#2f8f5b" font-weight="700" text-anchor="middle">No</text>
<text x="50" y="352" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">2  ·  WHAT ConnectFolder DOES</text>
<path d="M50 384 h110 l14 14 h196 v186 h-320 z" fill="#ffffff" stroke="#d9dadb" stroke-width="2" stroke-linejoin="round"/>
<path d="M50 384 h110 l14 14 h196 v26 h-320 z" fill="#f2955a" fill-opacity="0.25"/>
<text x="66" y="416" font-size="12.5" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace">Ultimate F1 Dashboard.SemanticModel</text>
<text x="70" y="446" font-size="12" fill="#151722" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">definition\</text>
<text x="70" y="465" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  model.tmdl</text>
<text x="70" y="484" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  database.tmdl</text>
<text x="70" y="503" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  relationships.tmdl</text>
<text x="70" y="522" font-size="12" fill="#151722" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  tables\</text>
<text x="70" y="541" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    Driver.tmdl  Race.tmdl</text>
<text x="70" y="560" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    Session Result.tmdl  …</text>
<text x="210" y="606" font-size="12" fill="#6e6e6e" text-anchor="middle">the model's TMDL folder, the .SemanticModel part of the PBIP</text>
<line x1="378" y1="484" x2="442" y2="484" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="410" y="470" font-size="11.5" fill="#6e6e6e" text-anchor="middle">reads every</text>
<text x="410" y="506" font-size="11.5" fill="#6e6e6e" text-anchor="middle">file</text>
<rect x="448" y="384" width="320" height="200" rx="10" fill="#ffffff" stroke="#151722" stroke-width="2" stroke-dasharray="7 5"/>
<text x="608" y="410" font-size="15" fill="#151722" font-weight="700" text-anchor="middle">the model, built in memory</text>
<line x1="518" y1="442" x2="520" y2="442" stroke="#151722" stroke-width="2"/>
<rect x="520" y="428" width="56" height="28" rx="4" fill="#d9dadb"/>
<text x="548" y="447" font-size="10" fill="#151722" text-anchor="middle">Race</text>
<rect x="578" y="428" width="56" height="28" rx="4" fill="#d9dadb"/>
<text x="606" y="447" font-size="10" fill="#151722" text-anchor="middle">Driver</text>
<rect x="636" y="428" width="56" height="28" rx="4" fill="#d9dadb"/>
<text x="664" y="447" font-size="10" fill="#151722" text-anchor="middle">Team</text>
<rect x="694" y="428" width="56" height="28" rx="4" fill="#d9dadb"/>
<text x="722" y="447" font-size="10" fill="#151722" text-anchor="middle">Session</text>
<rect x="462" y="428" width="56" height="28" rx="4" fill="#c8dce8"/>
<text x="490" y="447" font-size="10" fill="#151722" text-anchor="middle">Calendar</text>
<line x1="548" y1="456" x2="576" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="606" y1="456" x2="576" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="664" y1="456" x2="576" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="722" y1="456" x2="576" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="548" y1="456" x2="696" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="606" y1="456" x2="696" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="664" y1="456" x2="696" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<line x1="722" y1="456" x2="696" y2="502" stroke="#d9dadb" stroke-width="1.2"/>
<rect x="516" y="502" width="120" height="30" rx="4" fill="#151722"/>
<text x="576" y="522" font-size="11" fill="#ffffff" text-anchor="middle">Session Result</text>
<rect x="636" y="502" width="120" height="30" rx="4" fill="#151722"/>
<text x="696" y="522" font-size="11" fill="#ffffff" text-anchor="middle">Qualifying Result</text>
<text x="608" y="562" font-size="12.5" fill="#6e6e6e" text-anchor="middle">tables · columns · measures · relationships</text>
<line x1="776" y1="484" x2="840" y2="484" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="808" y="470" font-size="11.5" fill="#6e6e6e" text-anchor="middle">Claude</text>
<text x="808" y="506" font-size="11.5" fill="#6e6e6e" text-anchor="middle">works on it</text>
<text x="848" y="400" font-size="12.5" fill="#6e6e6e">the same operations as on a live</text>
<text x="848" y="416" font-size="12.5" fill="#6e6e6e">Desktop model:</text>
<rect x="848" y="428" width="230" height="24" rx="5" fill="#ffffff" stroke="#d9dadb"/>
<text x="860" y="445" font-size="12.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">table_operations</text>
<rect x="848" y="458" width="230" height="24" rx="5" fill="#ffffff" stroke="#d9dadb"/>
<text x="860" y="475" font-size="12.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">column_operations</text>
<rect x="848" y="488" width="230" height="24" rx="5" fill="#ffffff" stroke="#d9dadb"/>
<text x="860" y="505" font-size="12.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">measure_operations</text>
<rect x="848" y="518" width="230" height="24" rx="5" fill="#ffffff" stroke="#d9dadb"/>
<text x="860" y="535" font-size="12.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">relationship_operations</text>
<rect x="848" y="548" width="230" height="24" rx="5" fill="#ffffff" stroke="#d9dadb"/>
<text x="860" y="565" font-size="12.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">dax_query_operations</text>
<rect x="848" y="584" width="302" height="40" rx="6" fill="#c8dce8"/>
<text x="860" y="600" font-size="12" fill="#151722">Edits stay in memory until</text>
<text x="860" y="616" font-size="12" fill="#151722" font-weight="700">ExportToTmdlFolder writes them back.</text>
<text x="50" y="660" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">3  ·  WHERE IT SITS IN THE LOOP</text>
<rect x="50" y="672" width="336" height="118" rx="10" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<circle cx="76" cy="696" r="13" fill="#151722"/>
<text x="76" y="701" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="98" y="702" font-size="16" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace">tmdl_lint.py</text>
<text x="70" y="724" font-size="12" fill="#151722">reads the files as text, against</text>
<text x="70" y="739" font-size="12" fill="#151722">rules: syntax, naming, structure</text>
<text x="70" y="778" font-size="12" fill="#c0392b" font-weight="700">does not build the model</text>
<line x1="390" y1="731" x2="428" y2="731" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="432" y="672" width="336" height="118" rx="10" fill="#fff3ea" stroke="#f2955a" stroke-width="3"/>
<circle cx="458" cy="696" r="13" fill="#f2955a"/>
<text x="458" y="701" font-size="14" fill="#151722" font-weight="700" text-anchor="middle">2</text>
<text x="480" y="702" font-size="16" fill="#151722" font-weight="700">ConnectFolder</text>
<text x="452" y="724" font-size="12" fill="#151722">loads the model, the way an engine would:</text>
<text x="452" y="739" font-size="12" fill="#151722">a syntax error, unknown keyword or</text>
<text x="452" y="754" font-size="12" fill="#151722">broken reference fails the load</text>
<text x="452" y="778" font-size="12" fill="#2f8f5b" font-weight="700">seconds, no Desktop cold start</text>
<line x1="772" y1="731" x2="810" y2="731" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="814" y="672" width="336" height="118" rx="10" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<circle cx="840" cy="696" r="13" fill="#151722"/>
<text x="840" y="701" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="862" y="702" font-size="16" fill="#151722" font-weight="700">Power BI Desktop</text>
<text x="834" y="724" font-size="12" fill="#151722">opens the project and renders</text>
<text x="834" y="739" font-size="12" fill="#151722">every visual</text>
<text x="834" y="778" font-size="12" fill="#6e6e6e" font-weight="700">the final check</text>
<path d="M54 806 v-6 M764 806 v-6 M54 806 H764" fill="none" stroke="#f2955a" stroke-width="2"/>
<text x="409" y="822" font-size="12" fill="#6e6e6e" text-anchor="middle">the fast inner loop: both run in seconds, without Desktop</text>
<path d="M818 806 v-6 M1146 806 v-6 M818 806 H1146" fill="none" stroke="#9a9da6" stroke-width="2"/>
<text x="982" y="822" font-size="12" fill="#6e6e6e" text-anchor="middle">once, at the end</text>
</g></svg>
