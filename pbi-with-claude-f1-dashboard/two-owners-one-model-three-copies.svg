<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1148" width="1200" height="1148">
<title>Two owners, one model: editing the files while Desktop has the project open, and the next save overwrites the edit</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f8f5b"/></marker></defs>
<rect width="1200" height="1148" fill="#f6f6f6"/>
<g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="50" y="44" font-size="15" fill="#6e6e6e" letter-spacing="1">RISK · TWO OWNERS, ONE MODEL</text>
<text x="50" y="76" font-size="22" fill="#151722" font-weight="700">Don't edit the files while Desktop has the project open.</text>
<text x="50" y="118" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">1  ·  THE COLLISION</text>
<circle cx="270" cy="150" r="12" fill="#151722"/>
<text x="270" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="290" y="155" font-size="14.5" fill="#151722" font-weight="700">Desktop opens the project</text>
<text x="290" y="176" font-size="12" fill="#6e6e6e">loads the model into its own</text>
<text x="290" y="192" font-size="12" fill="#6e6e6e">engine and treats that as the truth</text>
<circle cx="495" cy="150" r="12" fill="#151722"/>
<text x="495" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="515" y="155" font-size="14.5" fill="#151722" font-weight="700">Claude changes the files</text>
<text x="515" y="176" font-size="12" fill="#6e6e6e">a script, a direct edit, or</text>
<text x="515" y="192" font-size="12" fill="#6e6e6e">ConnectFolder + ExportToTmdlFolder</text>
<circle cx="720" cy="150" r="12" fill="#c0392b"/>
<text x="720" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="740" y="155" font-size="14.5" fill="#c0392b" font-weight="700">Desktop doesn't see it</text>
<text x="740" y="176" font-size="12" fill="#6e6e6e">it never watches the folder,</text>
<text x="740" y="192" font-size="12" fill="#6e6e6e">so it still shows the old model</text>
<circle cx="945" cy="150" r="12" fill="#c0392b"/>
<text x="945" y="155" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="965" y="155" font-size="14.5" fill="#c0392b" font-weight="700">The next save overwrites it</text>
<text x="965" y="176" font-size="12" fill="#6e6e6e">Ctrl+S, or yes to</text>
<text x="965" y="192" font-size="12" fill="#6e6e6e">“save changes?” on close</text>
<rect x="50" y="220" width="1100" height="62" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="70" y="248" font-size="15" fill="#151722" font-weight="700">Desktop's memory</text>
<text x="70" y="267" font-size="12" fill="#6e6e6e">what you see</text>
<rect x="50" y="322" width="1100" height="62" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="70" y="350" font-size="15" fill="#151722" font-weight="700">Files on disk</text>
<text x="70" y="369" font-size="12" fill="#6e6e6e">what git sees</text>
<line x1="475" y1="214" x2="475" y2="392" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="700" y1="214" x2="700" y2="392" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="925" y1="214" x2="925" y2="392" stroke="#d9dadb" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="314" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="362" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="539" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="587" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="764" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="812" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="989" y="233" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="1037" y="256" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="314" y="335" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="362" y="358" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<rect x="539" y="335" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="587" y="358" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="764" y="335" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="812" y="358" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<rect x="989" y="335" width="96" height="36" rx="7" fill="#f9ebe9" stroke="#c0392b" stroke-width="2"/>
<text x="1037" y="358" font-size="14" fill="#c0392b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<line x1="362" y1="333" x2="362" y2="273" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="372" y="306" font-size="11.5" fill="#6e6e6e">loads</text>
<rect x="645" y="339" width="62" height="28" rx="6" fill="#151722"/>
<text x="676" y="358" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Claude</text>
<line x1="643" y1="353" x2="639" y2="353" stroke="#2f8f5b" stroke-width="2.5" marker-end="url(#ahg)"/>
<text x="647" y="306" font-size="11.5" fill="#2f8f5b">writes v2</text>
<line x1="812" y1="333" x2="812" y2="273" stroke="#9a9da6" stroke-width="2" stroke-dasharray="4 4"/>
<g transform="translate(812 302)"><circle r="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="828" y="306" font-size="11.5" fill="#c0392b">not seen</text>
<g transform="translate(882 251)"><path d="M-14 0 Q0 -11 14 0 Q0 11 -14 0 Z" fill="#ffffff" stroke="#151722" stroke-width="2"/><circle r="4" fill="#151722"/></g>
<text x="902" y="256" font-size="11.5" fill="#c0392b" font-weight="700">old</text>
<line x1="1037" y1="271" x2="1037" y2="331" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<text x="1047" y="306" font-size="12" fill="#c0392b" font-weight="700" font-family="Consolas, 'Courier New', monospace">Ctrl+S</text>
<text x="1095" y="358" font-size="12" fill="#c0392b" font-weight="700">v2 lost</text>
<text x="708" y="414" font-size="12.5" fill="#c0392b">You conclude the edit failed, or worse,</text>
<text x="708" y="431" font-size="12.5" fill="#c0392b">that it worked.</text>
<text x="933" y="414" font-size="12.5" fill="#c0392b">Claude's edit disappears silently;</text>
<text x="933" y="431" font-size="12.5" fill="#c0392b">git diff shows it reverted.</text>
<text x="70" y="414" font-size="12.5" fill="#6e6e6e">Tempting, because the course's rhythm</text>
<text x="70" y="431" font-size="12.5" fill="#6e6e6e">invites it: Desktop open, spot, ask, edit.</text>
<text x="50" y="478" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">2  ·  WHERE ConnectFolder + ExportToTmdlFolder FIT: THREE COPIES, NOT TWO</text>
<rect x="50" y="500" width="230" height="104" rx="10" fill="#fff3ea" stroke="#f2955a" stroke-width="2.5"/>
<text x="165" y="532" font-size="15.5" fill="#151722" font-weight="700" text-anchor="middle">MCP server's memory</text>
<text x="165" y="552" font-size="12" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">powerbi-modeling-mcp</text>
<rect x="485" y="500" width="230" height="104" rx="10" fill="#ffffff" stroke="#151722" stroke-width="2.5"/>
<text x="600" y="532" font-size="15.5" fill="#151722" font-weight="700" text-anchor="middle">Files on disk</text>
<text x="600" y="552" font-size="12" fill="#6e6e6e" text-anchor="middle">the TMDL folder</text>
<rect x="920" y="500" width="230" height="104" rx="10" fill="#ffffff" stroke="#9ab8cc" stroke-width="2.5"/>
<text x="1035" y="532" font-size="15.5" fill="#151722" font-weight="700" text-anchor="middle">Desktop's memory</text>
<text x="1035" y="552" font-size="12" fill="#6e6e6e" text-anchor="middle">Power BI Desktop</text>
<rect x="117" y="562" width="96" height="36" rx="7" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="165" y="585" font-size="14" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v2</text>
<text x="225" y="585" font-size="11" fill="#2f8f5b" font-weight="700">edited</text>
<rect x="552" y="562" width="96" height="36" rx="7" fill="#ffffff" stroke="#9a9da6" stroke-width="2"/>
<text x="600" y="585" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1 → v2</text>
<rect x="987" y="562" width="96" height="36" rx="7" fill="#c8dce8" stroke="#9ab8cc" stroke-width="2"/>
<text x="1035" y="585" font-size="14" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">v1</text>
<line x1="483" y1="528" x2="288" y2="528" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="385" y="518" font-size="13" fill="#151722" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">ConnectFolder</text>
<text x="385" y="544" font-size="11.5" fill="#6e6e6e" text-anchor="middle">reads every file into memory</text>
<line x1="282" y1="578" x2="477" y2="578" stroke="#2f8f5b" stroke-width="3" marker-end="url(#ahg)"/>
<text x="385" y="568" font-size="13" fill="#2f8f5b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">ExportToTmdlFolder</text>
<text x="385" y="596" font-size="11.5" fill="#2f8f5b" text-anchor="middle">the only way edits reach disk</text>
<line x1="717" y1="528" x2="912" y2="528" stroke="#9a9da6" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="817" y="518" font-size="13" fill="#151722" font-weight="700" text-anchor="middle">opens</text>
<text x="817" y="544" font-size="11.5" fill="#6e6e6e" text-anchor="middle">loads once, never re-reads</text>
<line x1="918" y1="578" x2="723" y2="578" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<text x="817" y="568" font-size="13" fill="#c0392b" font-weight="700" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">Ctrl+S</text>
<text x="817" y="596" font-size="11.5" fill="#c0392b" text-anchor="middle">writes its copy over the files</text>
<path d="M165 606 Q165 640 300 640 H900 Q1035 640 1035 606" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
<g transform="translate(600 640)"><rect x="-224" y="-12" width="448" height="24" rx="12" fill="#f6f6f6"/><circle cx="-208" r="10" fill="#c0392b"/><path d="M-212 -4 L-204 4 M-204 -4 L-212 4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></g>
<text x="406" y="645" font-size="13" fill="#c0392b" font-weight="700">No link: Desktop never hears about ConnectFolder or the export.</text>
<rect x="50" y="664" width="354" height="76" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
<text x="68" y="688" font-size="14" fill="#6e6e6e" font-weight="700">Export never called</text>
<text x="68" y="708" font-size="12.5" fill="#151722">The edit stays in the server's memory.</text>
<text x="68" y="725" font-size="12.5" fill="#151722">Disk and Desktop never see it.</text>
<rect x="423" y="664" width="354" height="76" rx="8" fill="#f9ebe9" stroke="#c0392b" stroke-width="2"/>
<text x="441" y="688" font-size="14" fill="#c0392b" font-weight="700">Desktop open</text>
<text x="441" y="708" font-size="12.5" fill="#151722">The export lands on disk, Desktop keeps</text>
<text x="441" y="725" font-size="12.5" fill="#151722">showing v1, and Ctrl+S overwrites it.</text>
<rect x="796" y="664" width="354" height="76" rx="8" fill="#eaf4ef" stroke="#2f8f5b" stroke-width="2"/>
<text x="814" y="688" font-size="14" fill="#2f8f5b" font-weight="700">Desktop closed</text>
<text x="814" y="708" font-size="12.5" fill="#151722">Export, then reopen Desktop:</text>
<text x="814" y="725" font-size="12.5" fill="#151722">it loads the exported version.</text>
<g transform="translate(0 298)">
<text x="50" y="478" font-size="13" fill="#6e6e6e" font-weight="700" letter-spacing="1.5">3  ·  PICK ONE OWNER AT A TIME</text>
<rect x="50" y="494" width="540" height="196" rx="10" fill="#ffffff" stroke="#2f8f5b" stroke-width="3"/>
<text x="74" y="530" font-size="19" fill="#151722" font-weight="700">Files own it</text>
<rect x="416" y="512" width="150" height="26" rx="13" fill="#eaf4ef"/>
<text x="491.0" y="530" font-size="12.5" fill="#2f8f5b" font-weight="700" text-anchor="middle">the course's route</text>
<circle cx="84" cy="557" r="10" fill="#2f8f5b"/>
<text x="84" y="562" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="562" font-size="13.5" fill="#151722">Close Desktop.</text>
<circle cx="84" cy="578" r="10" fill="#2f8f5b"/>
<text x="84" y="583" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="104" y="583" font-size="13.5" fill="#151722">Claude edits the files, or ConnectFolder</text>
<text x="104" y="604" font-size="13.5" fill="#151722">+ ExportToTmdlFolder.</text>
<circle cx="84" cy="620" r="10" fill="#2f8f5b"/>
<text x="84" y="625" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="104" y="625" font-size="13.5" fill="#151722">Run the fast checks, without Desktop.</text>
<circle cx="84" cy="641" r="10" fill="#2f8f5b"/>
<text x="84" y="646" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="104" y="646" font-size="13.5" fill="#151722">Reopen Desktop for the final look:</text>
<text x="104" y="667" font-size="13.5" fill="#151722">one cold start, at the end.</text>
<rect x="610" y="494" width="540" height="196" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="3"/>
<text x="634" y="530" font-size="19" fill="#151722" font-weight="700">Desktop owns it</text>
<rect x="983" y="512" width="143" height="26" rx="13" fill="#e8f1f8"/>
<text x="1054.5" y="530" font-size="12.5" fill="#2f6fa8" font-weight="700" text-anchor="middle">the live instance</text>
<circle cx="644" cy="557" r="10" fill="#2f6fa8"/>
<text x="644" y="562" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="664" y="562" font-size="13.5" fill="#151722">Keep Desktop open.</text>
<circle cx="644" cy="578" r="10" fill="#2f6fa8"/>
<text x="644" y="583" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="664" y="583" font-size="13.5" fill="#151722">Claude connects to the live model:</text>
<text x="664" y="604" font-size="13.5" fill="#151722" font-family="Consolas, 'Courier New', monospace">ListLocalInstances → Connect.</text>
<circle cx="644" cy="620" r="10" fill="#2f6fa8"/>
<text x="644" y="625" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="664" y="625" font-size="13.5" fill="#151722">Edits happen inside Desktop's model.</text>
<circle cx="644" cy="641" r="10" fill="#2f6fa8"/>
<text x="644" y="646" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="664" y="646" font-size="13.5" fill="#151722">Save in Desktop to write them to disk.</text>
<rect x="50" y="704" width="1100" height="40" rx="8" fill="#f9ebe9" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(78 724)"><circle r="11" fill="#c0392b"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="100" y="729" font-size="15" fill="#c0392b" font-weight="700">Never both at once.</text>
<text x="262" y="729" font-size="14" fill="#151722">Two programs holding the same model is the collision above.</text>
<rect x="50" y="758" width="1100" height="74" rx="10" fill="#151722"/>
<text x="74" y="788" font-size="15.5" fill="#ffffff" font-weight="700">The common thread: the model lives in more than one place at once, in memory and on disk.</text>
<text x="74" y="814" font-size="13.5" fill="#d9dadb">Export to move memory to disk, don't trust a load for more than it checks, and never let two programs hold the same model.</text>
</g>
</g></svg>
