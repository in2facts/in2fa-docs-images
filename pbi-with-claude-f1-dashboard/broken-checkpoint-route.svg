<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880">
  <title>Reaching the broken checkpoint: commit, bookmark your work as my-work, jump to after-report-bug, point the data folder at your machine</title>
  <rect width="1200" height="880" fill="#f6f6f6"/>

  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#151722"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2955a"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="44" font-size="15" letter-spacing="1" fill="#6e6e6e">1.8 WHEN IT GOES BLANK</text>
    <text x="60" y="76" font-size="22" font-weight="700" fill="#151722">Four lines to the broken checkpoint, and your own work stays where you left it.</text>

    <!-- ===== the history ===== -->
    <text x="60" y="122" font-size="13" letter-spacing="1" fill="#6e6e6e">TWO HISTORIES FROM ONE START</text>

    <!-- start -->
    <circle cx="110" cy="290" r="14" fill="#ffffff" stroke="#151722" stroke-width="3"/>
    <text x="110" y="330" font-size="14" font-weight="700" fill="#151722" text-anchor="middle">start</text>

    <!-- your chapters (top line) -->
    <path d="M122,282 C160,215 175,205 215,205" fill="none" stroke="#151722" stroke-width="3"/>
    <line x1="215" y1="205" x2="905" y2="205" stroke="#151722" stroke-width="3"/>
    <text x="215" y="160" font-size="13" letter-spacing="1" fill="#151722">YOUR CHAPTERS</text>
    <g font-size="12" fill="#6e6e6e" text-anchor="middle">
      <circle cx="260" cy="205" r="11" fill="#ffffff" stroke="#151722" stroke-width="3"/>
      <text x="260" y="236">1.3</text>
      <circle cx="420" cy="205" r="11" fill="#ffffff" stroke="#151722" stroke-width="3"/>
      <text x="420" y="236">1.4</text>
      <circle cx="580" cy="205" r="11" fill="#ffffff" stroke="#151722" stroke-width="3"/>
      <text x="580" y="236">1.5</text>
      <circle cx="740" cy="205" r="11" fill="#ffffff" stroke="#151722" stroke-width="3"/>
      <text x="740" y="236">1.6</text>
    </g>
    <circle cx="900" cy="205" r="15" fill="#151722"/>
    <text x="900" y="244" font-size="13" font-weight="700" fill="#151722" text-anchor="middle">1.7</text>
    <!-- labels on your last commit -->
    <rect x="935" y="160" width="74" height="26" rx="13" fill="#151722"/>
    <text x="972" y="178" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">main</text>
    <rect x="1018" y="160" width="100" height="26" rx="13" fill="#ffffff" stroke="#151722" stroke-width="2"/>
    <text x="1068" y="178" font-size="13" font-weight="700" fill="#151722" text-anchor="middle">my-work</text>
    <text x="935" y="210" font-size="13" fill="#6e6e6e">your way back</text>

    <!-- course checkpoints (bottom line) -->
    <path d="M122,298 C160,365 175,375 215,375" fill="none" stroke="#6e6e6e" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="215" y1="375" x2="905" y2="375" stroke="#6e6e6e" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="215" y="420" font-size="13" letter-spacing="1" fill="#6e6e6e">THE COURSE'S CHECKPOINTS (TAGS)</text>
    <g font-size="12" fill="#6e6e6e" text-anchor="middle">
      <circle cx="300" cy="375" r="11" fill="#ffffff" stroke="#6e6e6e" stroke-width="3"/>
      <text x="300" y="356">after-data</text>
      <circle cx="450" cy="375" r="11" fill="#ffffff" stroke="#6e6e6e" stroke-width="3"/>
      <text x="450" y="356">after-html</text>
      <circle cx="600" cy="375" r="11" fill="#ffffff" stroke="#6e6e6e" stroke-width="3"/>
      <text x="600" y="356">after-model</text>
      <circle cx="750" cy="375" r="11" fill="#ffffff" stroke="#6e6e6e" stroke-width="3"/>
      <text x="750" y="356">after-report</text>
    </g>
    <circle cx="900" cy="375" r="15" fill="#f2955a"/>
    <text x="900" y="408" font-size="13" font-weight="700" fill="#151722" text-anchor="middle">after-report-bug</text>

    <!-- HEAD -->
    <rect x="1010" y="360" width="80" height="30" rx="6" fill="#f2955a"/>
    <text x="1050" y="380" font-size="14" font-weight="700" fill="#151722" text-anchor="middle">HEAD</text>
    <line x1="1008" y1="375" x2="922" y2="375" stroke="#f2955a" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <text x="1050" y="412" font-size="13" fill="#6e6e6e" text-anchor="middle">detached: on a</text>
    <text x="1050" y="430" font-size="13" fill="#6e6e6e" text-anchor="middle">commit, no branch</text>
    <!-- the jump -->
    <path d="M900,224 C860,280 860,310 893,355" fill="none" stroke="#f2955a" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowOrange)"/>
    <text x="842" y="296" font-size="13" font-weight="700" fill="#f2955a" text-anchor="end">step 3: the jump</text>

    <!-- ===== the four steps ===== -->
    <text x="60" y="482" font-size="13" letter-spacing="1" fill="#6e6e6e">THE FOUR LINES, IN ORDER (DESKTOP CLOSED)</text>

    <!-- step 1 -->
    <rect x="60" y="500" width="255" height="230" rx="8" fill="#ffffff" stroke="#151722" stroke-width="2"/>
    <circle cx="88" cy="530" r="16" fill="#151722"/>
    <text x="88" y="536" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="114" y="536" font-size="16" font-weight="700" fill="#151722">Commit</text>
    <rect x="76" y="556" width="223" height="52" rx="4" fill="#151722"/>
    <text x="86" y="577" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">git add -A; git commit</text>
    <text x="86" y="596" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">-m "chapter 1.7: …"</text>
    <text x="76" y="634" font-size="14" fill="#151722">Saves 1.7 as a commit.</text>
    <text x="76" y="656" font-size="14" fill="#151722">Already done at the end</text>
    <text x="76" y="678" font-size="14" fill="#151722">of 1.7? Then it just says</text>
    <text x="76" y="700" font-size="14" fill="#151722">so. Not a failure.</text>

    <!-- step 2 -->
    <rect x="335" y="500" width="255" height="230" rx="8" fill="#ffffff" stroke="#151722" stroke-width="2"/>
    <circle cx="363" cy="530" r="16" fill="#151722"/>
    <text x="363" y="536" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="389" y="536" font-size="16" font-weight="700" fill="#151722">Bookmark it</text>
    <rect x="351" y="556" width="223" height="52" rx="4" fill="#151722"/>
    <text x="361" y="587" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">git switch -c my-work</text>
    <text x="351" y="634" font-size="14" fill="#151722">A new branch on the same</text>
    <text x="351" y="656" font-size="14" fill="#151722">commit. Nothing moves; it</text>
    <text x="351" y="678" font-size="14" fill="#151722">is a name to come back to.</text>
    <text x="351" y="712" font-size="13" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace">Switched to a new branch</text>

    <!-- step 3 -->
    <rect x="610" y="500" width="255" height="230" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="3"/>
    <circle cx="638" cy="530" r="16" fill="#f2955a"/>
    <text x="638" y="536" font-size="16" font-weight="700" fill="#151722" text-anchor="middle">3</text>
    <text x="664" y="536" font-size="16" font-weight="700" fill="#151722">Jump</text>
    <rect x="626" y="556" width="223" height="52" rx="4" fill="#151722"/>
    <text x="636" y="577" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">git switch --detach</text>
    <text x="636" y="596" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">after-report-bug</text>
    <text x="626" y="634" font-size="14" fill="#151722">Your folder becomes the</text>
    <text x="626" y="656" font-size="14" fill="#151722">course's broken commit.</text>
    <text x="626" y="678" font-size="14" fill="#151722">No branch follows you here.</text>
    <text x="626" y="712" font-size="13" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace">HEAD is now at … after-report-bug</text>

    <!-- step 4 -->
    <rect x="885" y="500" width="255" height="230" rx="8" fill="#ffffff" stroke="#151722" stroke-width="2"/>
    <circle cx="913" cy="530" r="16" fill="#151722"/>
    <text x="913" y="536" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="939" y="536" font-size="16" font-weight="700" fill="#151722">Your data folder</text>
    <rect x="901" y="556" width="223" height="52" rx="4" fill="#151722"/>
    <text x="911" y="577" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">python scripts/</text>
    <text x="911" y="596" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">set_data_folder.py</text>
    <text x="901" y="634" font-size="14" fill="#151722">The checkpoint carries the</text>
    <text x="901" y="656" font-size="14" fill="#151722">author's path. This points</text>
    <text x="901" y="678" font-size="14" fill="#151722">it at your CSVs again.</text>
    <text x="901" y="712" font-size="13" fill="#6e6e6e" font-family="Consolas, 'Courier New', monospace">Parameter_DataFolder updated</text>

    <!-- step arrows -->
    <line x1="317" y1="615" x2="333" y2="615" stroke="#151722" stroke-width="3" marker-end="url(#arrowDark)"/>
    <line x1="592" y1="615" x2="608" y2="615" stroke="#151722" stroke-width="3" marker-end="url(#arrowDark)"/>
    <line x1="867" y1="615" x2="883" y2="615" stroke="#151722" stroke-width="3" marker-end="url(#arrowDark)"/>

    <!-- where you are now -->
    <rect x="60" y="756" width="1080" height="84" rx="8" fill="#151722"/>
    <text x="84" y="788" font-size="13" letter-spacing="1" fill="#f2955a">WHERE YOU ARE NOW</text>
    <text x="84" y="818" font-size="16" fill="#ffffff">HEAD is on <tspan font-weight="700" fill="#f2955a">after-report-bug</tspan>, the course's broken report. <tspan font-weight="700">my-work</tspan> still points at your 1.7 commit.</text>

    <text x="600" y="866" font-size="14" fill="#6e6e6e" text-anchor="middle">Nothing you built is lost or changed: the jump only changes which commit your folder shows.</text>
  </g>
</svg>
