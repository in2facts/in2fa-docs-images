<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790">
  <title>Reading a field reference: table, field, header</title>

  <defs>
    <filter id="lift" x="-8%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#151722" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/>
    </marker>
  </defs>

  <rect width="1200" height="790" fill="#f6f6f6"/>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="60" y="54" font-size="30" fill="#151722">Reading a field reference</text>
    <text x="60" y="82" font-size="16" fill="#6e6e6e">Every column and measure in the generator is named the same way. Three arguments, and the third is optional.</text>

    <!-- ── the call. textLength fixes each run's width so the bars line up in any font ── -->
    <rect x="60" y="106" width="1080" height="80" rx="8" fill="#ffffff"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="26"
       fill="#151722" lengthAdjust="spacing">
      <text x="90"  y="156" textLength="70">pcol(</text>
      <text x="160" y="156" textLength="112" fill="#f2955a">"Driver"</text>
      <text x="272" y="156" textLength="14">,</text>
      <text x="300" y="156" textLength="182" fill="#f2955a">"Driver Name"</text>
      <text x="482" y="156" textLength="14">,</text>
      <text x="510" y="156" textLength="112" fill="#f2955a">"Driver"</text>
      <text x="622" y="156" textLength="28">),</text>
    </g>

    <rect x="160" y="166" width="112" height="3" fill="#f2955a"/>
    <rect x="300" y="166" width="182" height="3" fill="#f2955a"/>
    <rect x="510" y="166" width="112" height="3" fill="#f2955a"/>

    <path d="M 216 169 L 216 200 L 180 200 L 180 224" fill="none" stroke="#d6d7d8" stroke-width="2"/>
    <path d="M 391 169 L 391 200 L 510 200 L 510 224" fill="none" stroke="#d6d7d8" stroke-width="2"/>
    <path d="M 566 169 L 566 200 L 860 200 L 860 224" fill="none" stroke="#d6d7d8" stroke-width="2"/>

    <!-- ── the three arguments ────────────────────────────────── -->
    <rect x="60" y="224" width="300" height="124" rx="8" fill="#ffffff"/>
    <circle cx="92" cy="256" r="14" fill="#252d3b"/>
    <text x="92" y="261" font-size="14" fill="#ffffff" text-anchor="middle">1</text>
    <text x="118" y="261" font-size="13" letter-spacing="1" fill="#6e6e6e">THE TABLE</text>
    <text x="88" y="296" font-size="17" fill="#151722">Where the field lives,</text>
    <text x="88" y="322" font-size="17" fill="#151722">as your model spells it.</text>

    <rect x="390" y="224" width="300" height="124" rx="8" fill="#ffffff"/>
    <circle cx="422" cy="256" r="14" fill="#252d3b"/>
    <text x="422" y="261" font-size="14" fill="#ffffff" text-anchor="middle">2</text>
    <text x="448" y="261" font-size="13" letter-spacing="1" fill="#6e6e6e">THE FIELD</text>
    <text x="418" y="296" font-size="17" fill="#151722">The column or measure.</text>
    <text x="418" y="322" font-size="17" fill="#151722">Layer 3 resolves this.</text>

    <rect x="720" y="224" width="420" height="124" rx="8" fill="#ffffff"/>
    <circle cx="752" cy="256" r="14" fill="#f2955a"/>
    <text x="752" y="261" font-size="14" fill="#151722" text-anchor="middle">3</text>
    <text x="778" y="261" font-size="13" letter-spacing="1" fill="#f2955a">THE HEADER, OPTIONAL</text>
    <text x="748" y="296" font-size="17" fill="#151722">What the reader sees. Leave it out</text>
    <text x="748" y="322" font-size="17" fill="#151722">and the field names itself.</text>

    <!-- ── where each argument points ─────────────────────────── -->
    <text x="60" y="396" font-size="13" letter-spacing="1" fill="#6e6e6e">WHERE EACH ONE POINTS</text>

    <!-- the model -->
    <rect x="60" y="412" width="460" height="226" rx="8" fill="#ffffff" stroke="#e8ecf3"/>
    <text x="84" y="440" font-size="13" letter-spacing="1" fill="#9a9da6">YOUR SEMANTIC MODEL</text>

    <circle cx="98" cy="472" r="13" fill="#252d3b"/>
    <text x="98" y="477" font-size="13" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="478" font-size="21" fill="#151722">Driver</text>
    <text x="196" y="478" font-size="14" fill="#9a9da6">table</text>

    <line x1="84" y1="496" x2="496" y2="496" stroke="#e8ecf3" stroke-width="1"/>

    <circle cx="98" cy="528" r="13" fill="#252d3b"/>
    <text x="98" y="533" font-size="13" fill="#ffffff" text-anchor="middle">2</text>
    <text x="122" y="534" font-size="18" fill="#151722">Driver Name</text>
    <text x="268" y="534" font-size="14" fill="#9a9da6">column</text>

    <rect x="122" y="548" width="374" height="1" fill="#e8ecf3"/>
    <text x="122" y="574" font-size="16" fill="#5f6b7f">Lando Norris</text>
    <text x="122" y="600" font-size="16" fill="#5f6b7f">Max Verstappen</text>
    <text x="122" y="626" font-size="16" fill="#5f6b7f">Oscar Piastri</text>
    <text x="330" y="626" font-size="14" fill="#9a9da6">its rows</text>

    <!-- the arrow -->
    <line x1="530" y1="528" x2="660" y2="528" stroke="#9a9da6" stroke-width="2" marker-end="url(#arw)"/>
    <text x="595" y="516" font-size="14" fill="#6e6e6e" text-anchor="middle">pcol(…)</text>

    <!-- the visual -->
    <rect x="680" y="412" width="460" height="226" rx="8" fill="#ffffff"
          stroke="#f2955a" stroke-width="1.5" filter="url(#lift)"/>
    <text x="704" y="440" font-size="13" letter-spacing="1" fill="#9a9da6">THE TABLE VISUAL IN THE REPORT</text>

    <circle cx="718" cy="528" r="13" fill="#f2955a"/>
    <text x="718" y="533" font-size="13" fill="#151722" text-anchor="middle">3</text>
    <text x="742" y="534" font-size="18" fill="#151722">Driver</text>
    <text x="830" y="534" font-size="14" fill="#9a9da6">the header, renamed</text>

    <rect x="742" y="548" width="374" height="1" fill="#e8ecf3"/>
    <text x="742" y="574" font-size="16" fill="#5f6b7f">Lando Norris</text>
    <text x="742" y="600" font-size="16" fill="#5f6b7f">Max Verstappen</text>
    <text x="742" y="626" font-size="16" fill="#5f6b7f">Oscar Piastri</text>
    <text x="950" y="626" font-size="14" fill="#9a9da6">unchanged</text>

    <!-- ── the contrast ───────────────────────────────────────── -->
    <rect x="60" y="668" width="1080" height="58" rx="8" fill="#e8ecf3"/>
    <text x="84" y="694" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#151722">pmeas("Session Result", "Points (pts)")</text>
    <text x="470" y="694" font-size="16" fill="#5f6b7f">no third argument, so the header reads</text>
    <text x="790" y="694" font-size="17" fill="#151722">Points (pts)</text>
    <text x="930" y="694" font-size="16" fill="#5f6b7f">— the field's own name.</text>
    <text x="84" y="716" font-size="14" fill="#5f6b7f">Only the label differs. The rows are the same either way.</text>

    <text x="60" y="762" font-size="15" fill="#151722">🎓 Arguments 1 and 2 must match your model or the visual renders blank, silently. Argument 3 is yours, and changes nothing but the label.</text>
  </g>
</svg>
