<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <title>Two loops: checks 1 and 2 are a fast inner loop without Desktop, check 3 is one Desktop cold start at the end</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9da6"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f2955a"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f8f5b"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f6f6f6"/>

  <g font-family="Gilroy, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="60" y="58" font-size="15" letter-spacing="1" fill="#6e6e6e">TWO LOOPS: ITERATE OFFLINE, PAY FOR DESKTOP ONCE</text>

    <!-- ============ outer loop: return path ============ -->
    <path d="M740 364 V150 Q740 120 710 120 H350 Q320 120 320 150 V164" fill="none" stroke="#f2955a" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-o)"/>
    <text x="530" y="108" font-size="14" font-weight="700" fill="#f2955a" text-anchor="middle">wrong number → back into the inner loop</text>
    <text x="756" y="250" font-size="15" font-weight="700" letter-spacing="1" fill="#f2955a">OUTER LOOP</text>
    <text x="756" y="272" font-size="14" fill="#6e6e6e">once, at the end</text>

    <!-- ============ inner loop: ring ============ -->
    <circle cx="320" cy="350" r="150" fill="none" stroke="#c8dce8" stroke-width="14"/>
    <!-- direction chevrons (counter-clockwise: prompt → 1 → 2 → prompt) -->
    <g fill="#7fa7c0">
      <path d="M-9 -9 L9 0 L-9 9 Z" transform="translate(190 275) rotate(120)"/>
      <path d="M-9 -9 L9 0 L-9 9 Z" transform="translate(320 500) rotate(0)"/>
      <path d="M-9 -9 L9 0 L-9 9 Z" transform="translate(450 275) rotate(-120)"/>
    </g>

    <text x="320" y="300" font-size="15" font-weight="700" letter-spacing="1" fill="#3b4150" text-anchor="middle">INNER LOOP</text>
    <text x="320" y="324" font-size="14" fill="#6e6e6e" text-anchor="middle">no Desktop · ~1 s each</text>
    <text x="320" y="346" font-size="14" fill="#6e6e6e" text-anchor="middle">as often as you like</text>

    <!-- prompt -->
    <rect x="210" y="172" width="220" height="56" rx="8" fill="#151722"/>
    <text x="320" y="197" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt Claude</text>
    <text x="320" y="217" font-size="13" fill="#c8dce8" text-anchor="middle">describe or change the model</text>

    <!-- check 1 -->
    <rect x="80" y="385" width="220" height="80" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <circle cx="106" cy="411" r="14" fill="#c8dce8"/>
    <text x="106" y="416" font-size="15" font-weight="700" fill="#151722" text-anchor="middle">1</text>
    <text x="130" y="417" font-size="16" font-weight="700" fill="#151722">Lint the TMDL</text>
    <text x="96" y="448" font-size="13" fill="#3b4150" font-family="Consolas, 'Courier New', monospace">tmdl_lint.py → 0 error(s)</text>

    <!-- check 2 -->
    <rect x="340" y="385" width="220" height="80" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <circle cx="366" cy="411" r="14" fill="#c8dce8"/>
    <text x="366" y="416" font-size="15" font-weight="700" fill="#151722" text-anchor="middle">2</text>
    <text x="390" y="417" font-size="16" font-weight="700" fill="#151722">Model loads</text>
    <text x="356" y="448" font-size="13" fill="#3b4150">checker lists tables, measures</text>

    <!-- 2 → 3 -->
    <line x1="566" y1="425" x2="632" y2="425" stroke="#9a9da6" stroke-width="2" marker-end="url(#ah)"/>
    <text x="599" y="414" font-size="13" fill="#6e6e6e" text-anchor="middle">both pass</text>

    <!-- check 3 -->
    <rect x="640" y="370" width="200" height="110" rx="8" fill="#ffffff" stroke="#f2955a" stroke-width="2"/>
    <circle cx="664" cy="396" r="14" fill="#f2955a"/>
    <text x="664" y="401" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="688" y="402" font-size="16" font-weight="700" fill="#151722">Desktop check</text>
    <text x="656" y="430" font-size="14" fill="#3b4150">one cold start: open,</text>
    <text x="656" y="450" font-size="14" fill="#3b4150">refresh, and one driver's</text>
    <text x="656" y="470" font-size="14" fill="#3b4150">number right</text>

    <!-- done -->
    <line x1="740" y1="486" x2="740" y2="528" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ah-g)"/>
    <text x="740" y="554" font-size="14" font-weight="700" fill="#2f8f5b" text-anchor="middle">✓ right: on to the report</text>

    <!-- ============ what not to do ============ -->
    <rect x="880" y="150" width="260" height="150" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="900" y="182" font-size="17" font-weight="700" fill="#151722">Desktop per edit</text>
    <text x="1120" y="182" font-size="18" font-weight="700" fill="#c0392b" text-anchor="end">✗</text>
    <text x="900" y="214" font-size="14" fill="#3b4150">close, edit, reopen, wait</text>
    <text x="900" y="236" font-size="14" fill="#3b4150">through a splash screen,</text>
    <text x="900" y="258" font-size="14" fill="#3b4150">after every prompt</text>
    <text x="900" y="284" font-size="14" font-weight="700" fill="#c0392b">this is where the time goes</text>

    <rect x="880" y="330" width="260" height="150" rx="8" fill="#ffffff" stroke="#d9dadb" stroke-width="2"/>
    <text x="900" y="362" font-size="17" font-weight="700" fill="#151722">Skip check 3</text>
    <text x="1120" y="362" font-size="18" font-weight="700" fill="#c0392b" text-anchor="end">✗</text>
    <text x="900" y="394" font-size="14" fill="#3b4150">checks 1 + 2 inspect names,</text>
    <text x="900" y="416" font-size="14" fill="#3b4150">folders and placement,</text>
    <text x="900" y="438" font-size="14" fill="#3b4150">never the arithmetic</text>
    <text x="900" y="464" font-size="14" font-weight="700" fill="#c0392b">a wrong model passes both</text>

    <!-- footer -->
    <line x1="60" y1="586" x2="1140" y2="586" stroke="#d9dadb" stroke-width="1.5"/>
    <text x="60" y="614" font-size="15" fill="#6e6e6e">Iterate on the structure without Desktop; pay for one cold start, at the end, to check the numbers.</text>
  </g>
</svg>
