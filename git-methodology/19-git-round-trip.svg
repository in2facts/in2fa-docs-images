<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Git in one picture</title>
  <desc id="d">On your PC, files move from the VS Code workspace to the staging area with git add, back with git restore --staged, and into the local repository with git commit. The local repository sends commits to the remote repository on GitHub or GitLab with git push and receives them with git fetch. git pull brings the remote changes straight into your workspace. A panel compares the two: fetch only downloads to the local repository and leaves your files untouched, while pull is fetch plus merge and also updates your files.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7C3AED"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0D9488"/></marker>
    <marker id="m-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1E3A5F"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563EB"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16A34A"/></marker>
  </defs>
  <rect width="960" height="664" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Git in one picture</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">From VS Code to the team and back: compose, frame, snap, share</text>

  <!-- location frames -->
  <g fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="18" y="102" width="924" height="270" rx="16"/>
    <rect x="724" y="430" width="218" height="212" rx="16"/>
  </g>
  <rect x="36" y="92" width="82" height="20" fill="#F8FAFC"/>
  <text x="42" y="107" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7280">YOUR PC</text>
  <rect x="870" y="420" width="64" height="20" fill="#F8FAFC"/>
  <text x="874" y="435" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7280">ONLINE</text>

  <!-- cards -->
  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="32" y="126" width="190" height="226" rx="14"/>
    <rect x="385" y="126" width="190" height="226" rx="14"/>
    <rect x="738" y="126" width="190" height="226" rx="14"/>
    <rect x="738" y="454" width="190" height="172" rx="14"/>
  </g>

  <!-- 1 Workspace -->
  <circle cx="68" cy="164" r="22" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
  <path transform="translate(55.4 151.4) scale(1.05)" fill="#007ACC" d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/>
  <text x="98" y="163" font-size="17" font-weight="700" fill="#1F2937">Workspace</text>
  <text x="98" y="181" font-size="12" fill="#6B7280">working directory</text>
  <text x="48" y="212" font-size="13" font-style="italic" fill="#1D4ED8">"the scene in front of you"</text>
  <!-- file tree -->
  <path d="M53 240 v60 M53 252 h6 M53 267 h6 M53 282 h6 M53 297 h6" fill="none" stroke="#E5E7EB" stroke-width="1.2"/>
  <g font-size="11.5" font-family="Cascadia Code, Consolas, Menlo, monospace" fill="#4B5563">
    <path d="M48 228 h4 l1.5 1.5 h4.5 v6.5 h-10z" fill="#E5E7EB"/><text x="63" y="236" fill="#9CA3AF">.git</text>
    <path d="M62 245 h4 l1.5 1.5 h4.5 v6.5 h-10z" fill="#93C5FD"/><text x="77" y="253">Sales.Report</text>
    <path d="M62 260 h4 l1.5 1.5 h4.5 v6.5 h-10z" fill="#93C5FD"/><text x="77" y="268">Sales.SemanticModel</text>
    <path d="M63 275 h5 l3 3 v6 h-8z" fill="none" stroke="#9CA3AF"/><text x="77" y="283">Sales.pbip</text>
    <path d="M63 290 h5 l3 3 v6 h-8z" fill="none" stroke="#9CA3AF"/><text x="77" y="298">README.md</text>
  </g>
  <rect x="44" y="316" width="166" height="24" rx="12" fill="#EFF6FF"/>
  <text x="127" y="332" text-anchor="middle" font-size="11.5" fill="#1D4ED8">VS Code: Explorer · Changes</text>

  <!-- 2 Staging area -->
  <circle cx="421" cy="164" r="22" fill="#7C3AED"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M409 159 l12 -6 l12 6 v12 l-12 6 l-12 -6z"/><path d="M409 159 l12 6 l12 -6 M421 165 v12"/>
  </g>
  <text x="451" y="163" font-size="17" font-weight="700" fill="#1F2937">Staging area</text>
  <text x="451" y="181" font-size="12" fill="#6B7280">index</text>
  <text x="401" y="212" font-size="13" font-style="italic" fill="#6D28D9">"framing the shot"</text>
  <!-- stacked pages -->
  <g stroke="#C4B5FD" stroke-width="1.5">
    <rect x="462" y="226" width="52" height="64" rx="4" fill="#F5F3FF"/>
    <rect x="455" y="232" width="52" height="64" rx="4" fill="#F5F3FF"/>
    <rect x="448" y="238" width="52" height="64" rx="4" fill="#FFFFFF" stroke="#7C3AED"/>
  </g>
  <path d="M457 252 h28 M457 262 h34 M457 272 h22 M457 282 h30 M457 292 h18" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round"/>
  <circle cx="500" cy="298" r="10" fill="#7C3AED"/>
  <path d="M500 293 v10 M495 298 h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="397" y="316" width="166" height="24" rx="12" fill="#F5F3FF"/>
  <text x="480" y="332" text-anchor="middle" font-size="11.5" fill="#6D28D9">VS Code: Staged Changes</text>

  <!-- 3 Local repository -->
  <circle cx="774" cy="164" r="22" fill="#0D9488"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="763" y="153" width="22" height="15" rx="2"/>
    <path d="M759 171 h30 l-2.5 3.5 h-25z"/>
    <path d="M768 160.5 h12" stroke-width="1.6"/>
  </g>
  <g fill="#0D9488" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="768" cy="160.5" r="2.2"/><circle cx="774" cy="160.5" r="2.2"/><circle cx="780" cy="160.5" r="2.2"/>
  </g>
  <text x="804" y="163" font-size="17" font-weight="700" fill="#1F2937">Local repo</text>
  <text x="804" y="181" font-size="12" fill="#6B7280">.git folder on your PC</text>
  <text x="754" y="212" font-size="13" font-style="italic" fill="#0F766E">"your camera roll"</text>
  <!-- database -->
  <g stroke="#0D9488" stroke-width="1.8">
    <path d="M797 238 v52 a36 9 0 0 0 72 0 v-52" fill="#CCFBF1"/>
    <ellipse cx="833" cy="238" rx="36" ry="9" fill="#F0FDFA"/>
    <path d="M797 255.5 a36 9 0 0 0 72 0 M797 273 a36 9 0 0 0 72 0" fill="none"/>
  </g>
  <g fill="#0D9488"><circle cx="855" cy="254" r="3"/><circle cx="855" cy="271.5" r="3"/><circle cx="855" cy="289" r="3"/></g>
  <rect x="750" y="316" width="166" height="24" rx="12" fill="#F0FDFA"/>
  <text x="833" y="332" text-anchor="middle" font-size="11.5" fill="#0F766E">VS Code: Graph · Timeline</text>

  <!-- 4 Remote repository -->
  <circle cx="774" cy="490" r="22" fill="#1E3A5F"/>
  <path d="M764 498 h20 a6 6 0 0 0 0 -12 a8 8 0 0 0 -15 -2 a5.5 5.5 0 0 0 -5 14z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="804" y="489" font-size="17" font-weight="700" fill="#1F2937">Remote repo</text>
  <text x="804" y="507" font-size="12" fill="#6B7280">origin, shared online</text>
  <text x="754" y="536" font-size="13" font-style="italic" fill="#1E3A5F">"the shared family album"</text>
  <g fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="754" y="548" width="76" height="64" rx="10"/>
    <rect x="836" y="548" width="76" height="64" rx="10"/>
  </g>
  <circle cx="792" cy="573" r="15" fill="#1F2937"/>
  <path transform="translate(782.5 563.5) scale(1.1875)" fill="#FFFFFF" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.290 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.640-3.95 0-.87.31-1.590.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
  <path transform="translate(862 561) scale(1)" fill="#FC6D26" d="m23.6004 9.5927-.0337-.0862L20.3.9814a.851.851 0 0 0-.3362-.405.8748.8748 0 0 0-.9997.0539.8748.8748 0 0 0-.29.4399l-2.2055 6.748H7.5375l-2.2057-6.748a.8573.8573 0 0 0-.29-.4412.8748.8748 0 0 0-.9997-.0537.8585.8585 0 0 0-.3362.4049L.4332 9.5015l-.0325.0862a6.0657 6.0657 0 0 0 2.0119 7.0105l.0113.0087.03.0213 4.976 3.7264 2.462 1.8633 1.4995 1.1321a1.0085 1.0085 0 0 0 1.2197 0l1.4995-1.1321 2.4619-1.8633 5.006-3.7489.0125-.01a6.0682 6.0682 0 0 0 2.0094-7.003z"/>
  <g font-size="11.5" text-anchor="middle" fill="#4B5563">
    <text x="792" y="603">GitHub</text>
    <text x="874" y="603">GitLab</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 222 H375" stroke="#7C3AED" marker-end="url(#m-purple)"/>
    <path d="M377 298 H232" stroke="#7C3AED" stroke-dasharray="7 5" marker-end="url(#m-purple)"/>
    <path d="M583 222 H728" stroke="#0D9488" marker-end="url(#m-teal)"/>
    <path d="M810 446 V362" stroke="#2563EB" marker-end="url(#m-blue)"/>
    <path d="M856 360 V444" stroke="#1E3A5F" marker-end="url(#m-navy)"/>
    <path d="M736 546 H127 V362" stroke="#16A34A" marker-end="url(#m-green)"/>
  </g>

  <!-- arrow labels: bold = Git command, grey = VS Code action -->
  <g font-size="14.5" font-weight="700" font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="303" y="210" text-anchor="middle" fill="#6D28D9">git add</text>
    <text x="303" y="270" text-anchor="middle" fill="#6D28D9">git restore</text>
    <text x="303" y="287" text-anchor="middle" fill="#6D28D9" font-size="13">--staged</text>
    <text x="656" y="210" text-anchor="middle" fill="#0F766E">git commit</text>
    <text x="798" y="396" text-anchor="end" fill="#1D4ED8">git fetch</text>
    <text x="868" y="396" fill="#1E3A5F">git push</text>
    <text x="430" y="534" text-anchor="middle" fill="#15803D">git pull</text>
  </g>
  <g font-size="12" fill="#6B7280">
    <text x="303" y="242" text-anchor="middle">+ Stage Changes</text>
    <text x="303" y="318" text-anchor="middle">− Unstage Changes</text>
    <text x="656" y="242" text-anchor="middle">✓ Commit</text>
    <text x="798" y="414" text-anchor="end">Fetch (… menu)</text>
    <text x="868" y="414">Sync · Push</text>
    <text x="430" y="566" text-anchor="middle">Sync Changes · Pull  =  fetch + merge into your files</text>
  </g>

  <!-- fetch vs pull -->
  <rect x="150" y="386" width="558" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="168" y="410" font-size="14" font-weight="700" fill="#1F2937">What's the difference between fetch and pull?</text>
  <text x="690" y="410" text-anchor="end" font-size="12" fill="#6B7280">pull = fetch + merge</text>
  <g font-size="13.5" font-weight="700" font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="168" y="447" fill="#1D4ED8">git fetch</text>
    <text x="168" y="481" fill="#15803D">git pull</text>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <rect x="252" y="430" width="76" height="24" rx="12" fill="#E8EEF5"/><text x="290" y="446" fill="#1E3A5F">Remote</text>
    <rect x="356" y="430" width="86" height="24" rx="12" fill="#F0FDFA"/><text x="399" y="446" fill="#0F766E">Local repo</text>
    <rect x="470" y="430" width="88" height="24" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="4 3"/><text x="514" y="446" fill="#9CA3AF">Workspace</text>
    <rect x="252" y="464" width="76" height="24" rx="12" fill="#E8EEF5"/><text x="290" y="480" fill="#1E3A5F">Remote</text>
    <rect x="356" y="464" width="86" height="24" rx="12" fill="#F0FDFA"/><text x="399" y="480" fill="#0F766E">Local repo</text>
    <rect x="470" y="464" width="88" height="24" rx="12" fill="#EFF6FF"/><text x="514" y="480" fill="#1D4ED8">Workspace</text>
  </g>
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M332 442 H350" stroke="#2563EB" marker-end="url(#m-blue)"/>
    <path d="M446 442 H466" stroke="#D1D5DB" stroke-dasharray="3 3"/>
    <path d="M332 476 H350" stroke="#16A34A" marker-end="url(#m-green)"/>
    <path d="M446 476 H464" stroke="#16A34A" marker-end="url(#m-green)"/>
  </g>
  <text x="456" y="438" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">✕</text>
  <g font-size="11" fill="#4B5563">
    <text x="570" y="440">downloads only,</text><text x="570" y="453" fill="#6B7280">your files untouched</text>
    <text x="570" y="474">downloads and</text><text x="570" y="487" fill="#6B7280">updates your files</text>
  </g>

  <!-- footer -->
  <rect x="32" y="600" width="676" height="34" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="12.5" fill="#4B5563">
    <text x="48" y="622" font-weight="700" fill="#1F2937" font-family="Cascadia Code, Consolas, Menlo, monospace">git command</text>
    <text x="138" y="622" fill="#6B7280">· grey = VS Code action</text>
    <text x="290" y="622" fill="#CBD5E1">|</text>
    <text x="304" y="622">Tip: Sync Changes does a pull and a push in one click.</text>
  </g>
</svg>
