<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A pull request, simply put</title>
  <desc id="d">Three steps, each with a small branch drawing. Your branch: you make changes on your own copy and save them with git commit. You send them online with git push and open a pull request asking a colleague to check them. Pull request: the colleague reads the changes and clicks Approve, while the branch waits to join main. Then git merge (the Merge button) adds your changes to main, the shared version, and everyone gets them with git pull.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#EA580C"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16A34A"/></marker>
  </defs>
  <rect width="960" height="440" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">A pull request, simply put</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Ask a colleague to check your work before it joins the shared version</text>

  <!-- cards -->
  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="60" y="104" width="200" height="232" rx="14"/>
    <rect x="380" y="104" width="200" height="232" rx="14"/>
    <rect x="700" y="104" width="200" height="232" rx="14"/>
  </g>

  <!-- 1 Your branch -->
  <circle cx="96" cy="142" r="22" fill="#7C3AED"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <path d="M90 132 v20 M90 146 c0 -6 12 -6 12 -12"/>
  </g>
  <g fill="#7C3AED" stroke="#FFFFFF" stroke-width="2">
    <circle cx="90" cy="131" r="3"/><circle cx="90" cy="153" r="3"/><circle cx="102" cy="131" r="3"/>
  </g>
  <text x="126" y="141" font-size="17" font-weight="700" fill="#1F2937">Your branch</text>
  <text x="126" y="159" font-size="12" fill="#6B7280">local repo</text>
  <text x="160" y="198" text-anchor="middle" font-size="13.5" fill="#4B5563">you change your own copy,</text>
  <text x="160" y="217" text-anchor="middle" font-size="13.5" fill="#4B5563">saved with <tspan font-weight="700" fill="#6D28D9" font-family="Cascadia Code, Consolas, Menlo, monospace">git commit</tspan></text>
  <path d="M78 284 H242" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 284 C120 284 116 248 136 248 H200" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke-width="3">
    <circle cx="88" cy="284" r="7" stroke="#1E3A5F"/><circle cx="102" cy="284" r="7" stroke="#1E3A5F"/>
    <circle cx="146" cy="248" r="7" stroke="#7C3AED"/><circle cx="172" cy="248" r="7" stroke="#7C3AED"/><circle cx="198" cy="248" r="7" stroke="#7C3AED"/>
  </g>
  <text x="242" y="306" text-anchor="end" font-size="11" font-family="Cascadia Code, Consolas, Menlo, monospace" fill="#1E3A5F">main</text>

  <!-- 2 Pull request -->
  <circle cx="416" cy="142" r="22" fill="#EA580C"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M409 135 v14"/>
    <path d="M423 149 v-9 a4 4 0 0 0 -4 -4 h-5"/>
    <path d="M417 133 l-3 3 l3 3"/>
  </g>
  <g fill="#EA580C" stroke="#FFFFFF" stroke-width="2">
    <circle cx="409" cy="132" r="3"/><circle cx="409" cy="152" r="3"/><circle cx="423" cy="152" r="3"/>
  </g>
  <text x="446" y="141" font-size="17" font-weight="700" fill="#1F2937">Pull request</text>
  <text x="446" y="159" font-size="12" fill="#6B7280">a colleague checks</text>
  <text x="480" y="198" text-anchor="middle" font-size="13.5" fill="#4B5563">reads what you changed</text>
  <text x="440" y="217" text-anchor="middle" font-size="13.5" fill="#4B5563">and clicks</text>
  <rect x="478" y="203" width="74" height="20" rx="5" fill="#16A34A"/>
  <text x="515" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">✓ Approve</text>
  <path d="M398 284 H562" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
  <path d="M420 284 C440 284 436 248 456 248 H518" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <path d="M518 248 C538 248 534 284 550 284" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke-width="3">
    <circle cx="408" cy="284" r="7" stroke="#1E3A5F"/><circle cx="422" cy="284" r="7" stroke="#1E3A5F"/>
    <circle cx="466" cy="248" r="7" stroke="#7C3AED"/><circle cx="492" cy="248" r="7" stroke="#7C3AED"/><circle cx="518" cy="248" r="7" stroke="#7C3AED"/>
  </g>
  <circle cx="550" cy="284" r="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="550" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">waiting</text>

  <!-- 3 main -->
  <circle cx="736" cy="142" r="22" fill="#1E3A5F"/>
  <path d="M726 150 h20 a6 6 0 0 0 0 -12 a8 8 0 0 0 -15 -2 a5.5 5.5 0 0 0 -5 14z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="766" y="141" font-size="17" font-weight="700" fill="#1F2937">main</text>
  <text x="766" y="159" font-size="12" fill="#6B7280">shared version</text>
  <text x="800" y="198" text-anchor="middle" font-size="13.5" fill="#4B5563">your work is in main,</text>
  <text x="800" y="217" text-anchor="middle" font-size="13.5" fill="#4B5563">everyone gets it: <tspan font-weight="700" fill="#15803D" font-family="Cascadia Code, Consolas, Menlo, monospace">git pull</tspan></text>
  <path d="M718 284 H882" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
  <path d="M740 284 C760 284 756 248 776 248 H814 C834 248 830 284 846 284" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke-width="3">
    <circle cx="728" cy="284" r="7" stroke="#1E3A5F"/><circle cx="742" cy="284" r="7" stroke="#1E3A5F"/>
    <circle cx="786" cy="248" r="7" stroke="#7C3AED"/><circle cx="812" cy="248" r="7" stroke="#7C3AED"/>
  </g>
  <circle cx="848" cy="284" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M843 284 l4 4 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="848" y="310" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">merged</text>

  <!-- arrows -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M268 211 H370" stroke="#EA580C" marker-end="url(#m-orange)"/>
    <path d="M588 211 H690" stroke="#16A34A" marker-end="url(#m-green)"/>
  </g>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="320" y="197" fill="#C2410C">"please check?"</text>
    <text x="640" y="197" fill="#15803D">"approved ✓"</text>
  </g>
  <!-- git commands under the arrows -->
  <rect x="274" y="226" width="92" height="26" rx="13" fill="#E8EEF5"/>
  <rect x="594" y="226" width="92" height="26" rx="13" fill="#F0FDF4"/>
  <g font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="320" y="244" fill="#1E3A5F">git push</text>
    <text x="640" y="244" fill="#15803D">git merge</text>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="320" y="270">then open the</text>
    <text x="320" y="285">pull request</text>
    <text x="640" y="270">the Merge button</text>
    <text x="640" y="285">does it for you</text>
  </g>

  <!-- footer -->
  <rect x="60" y="362" width="840" height="50" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="480" y="393" text-anchor="middle" font-size="15" fill="#374151"><tspan font-weight="700" fill="#1F2937">Pull request</tspan> = asking <tspan font-style="italic">"Can my changes join the shared version?"</tspan></text>
</svg>
