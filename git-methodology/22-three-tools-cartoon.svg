  <ellipse cx="413" cy="369" rx="10" ry="4.5" fill="#1F2937"/>
  <rect x="382" y="284" width="42" height="52" rx="14" fill="#7C3AED"/>
  <path d="M386 296 q-8 18 -2 34" fill="none" stroke="#7C3AED" stroke-width="9" stroke-linecap="round"/>
  <circle cx="403" cy="264" r="18" fill="#FCD9B6"/>
  <path d="M385 261 a18 18 0 0 1 35 -6 q-10 -6 -21 -3 q-8 3 -14 9z" fill="#3F2A1D"/>
