  <!-- captions -->
  <text x="360" y="400" font-size="13.5" fill="#374151">Explains, drafts and edits files.</text>
  <text x="360" y="420" font-size="13.5" fill="#374151">Shows changes before applying.</text>
  <text x="360" y="450" font-size="13.5" font-style="italic" font-weight="600" fill="#B4532F">Never steals your lunch. Promise.</text>

  <!-- ============ PANEL 3: GitHub = the archive & review desk ============ -->
