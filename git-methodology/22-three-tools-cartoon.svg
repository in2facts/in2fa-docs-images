  <path d="M116 276 q18 8 26 26" fill="none" stroke="#7C3AED" stroke-width="9" stroke-linecap="round"/>
  <circle cx="144" cy="304" r="5" fill="#FCD9B6"/>
  <!-- captions -->
  <text x="50" y="400" font-size="13.5" fill="#374151">Where you open, write and save.</text>
  <text x="50" y="420" font-size="13.5" fill="#374151">Commit and sync are just buttons.</text>
  <text x="50" y="450" font-size="13.5" font-style="italic" font-weight="600" fill="#2563EB">Like a real desk, minus the crumbs.</text>

