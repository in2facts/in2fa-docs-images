<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The three tools, explained with an office</title>
  <desc id="d">A cartoon office in three scenes. VS Code is your desk: you sit at a computer with a coffee mug and say "All my files, open in one place". Claude is the helpful colleague: a cheerful orange assistant holds out a marked-up draft and says "I drafted table 2. Want to look first?", and you answer "Show me the changes first!". GitHub is the archive and review desk: a librarian with glasses guards a filing cabinet with drawers labelled by day, person and change, and says "Every version, every name. Nothing gets lost here." Bottom line: goodbye to Report_FINAL_v3_really (2).docx. You decide, Claude helps, GitHub remembers.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="600" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">The three tools, explained with an office</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">You already know how this works. It just has new names on the doors.</text>

