  <rect x="30" y="136" width="280" height="20" fill="#2563EB"/>
  <rect x="340" y="100" width="280" height="56" rx="16" fill="#D97757"/>
  <rect x="340" y="136" width="280" height="20" fill="#D97757"/>
  <rect x="650" y="100" width="280" height="56" rx="16" fill="#1F2937"/>
  <rect x="650" y="136" width="280" height="20" fill="#1F2937"/>
  <g fill="#FFFFFF">
    <text x="50" y="126" font-size="20" font-weight="700">VS Code</text>
    <text x="50" y="146" font-size="13" opacity="0.9">= your desk</text>
    <text x="360" y="126" font-size="20" font-weight="700">Claude</text>
    <text x="360" y="146" font-size="13" opacity="0.9">= the helpful colleague</text>
    <text x="670" y="126" font-size="20" font-weight="700">GitHub</text>
    <text x="670" y="146" font-size="13" opacity="0.9">= the archive &amp; review desk</text>
  </g>

  <!-- floors -->
  <g stroke="#E2E8F0" stroke-width="2">
