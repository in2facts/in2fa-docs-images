<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 564" width="960" height="564" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Undo, the office version</title>
  <desc id="d">Undo at four stages, as a letter travelling through the office, above a big safety net. 1, not committed, only you can see it: you toss a crumpled draft in the bin, "Nah, start again". Discard Changes takes the file back to the last commit; it can't be undone, so check before you toss. 2, committed, still only you: you unseal your own envelope, "Wait, one more thing!". Undo Last Commit removes the commit and keeps your edits. Nobody saw. 3, pushed, on GitHub but main is untouched: in the mailroom you send a P.S. into your branch's pigeonhole. Just fix it with edit, commit and push, and the pull request updates; or start over with a fresh branch. A P.S., not a panic email. 4, merged into main, everyone has it: the official binder gets a correction page. Revert on GitHub creates a new pull request that cancels the change; both stay on file. An erratum, not a cover-up. Below, Git is the safety net that catches a falling page: Once committed, Git keeps every version, so there's always a way back. Golden rule: never force push or rewrite main; that cuts the net.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 H16 M0 0 V16" stroke="#94A3B8" stroke-width="1.6"/>
    </pattern>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7C3AED"/></marker>
    <g id="you">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#7C3AED"/>
      <circle cx="0" cy="-104" r="15" fill="#FCD9B6"/>
      <path d="M-15 -106 a15 15 0 0 1 29 -5 q-9 -5 -17 -2 q-7 3 -12 7z" fill="#3F2A1D"/>
      <circle cx="-1" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="8" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-1 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="youL">
      <use href="#you" xlink:href="#you" transform="scale(-1 1)"/>
    </g>
    <g id="rev">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#DB2777"/>
      <circle cx="0" cy="-104" r="15" fill="#C68642"/>
      <path d="M-15 -106 a15 15 0 0 1 30 0 q-6 -8 -15 -8 q-9 0 -15 8z" fill="#1F2937"/>
      <circle cx="-6" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="3" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-6 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="564" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Undo, the office version</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">How you undo depends on how far your change has travelled</text>

  <!-- cards -->
  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="96" width="213" height="296" rx="14"/>
    <rect x="259" y="96" width="213" height="296" rx="14"/>
    <rect x="488" y="96" width="213" height="296" rx="14"/>
    <rect x="717" y="96" width="213" height="296" rx="14"/>
  </g>
  <!-- travel arrows between cards -->
  <g fill="#CBD5E1">
    <path d="M245 236 l10 8 l-10 8z"/>
    <path d="M474 236 l10 8 l-10 8z"/>
    <path d="M703 236 l10 8 l-10 8z"/>
  </g>

  <!-- ============ 1 NOT COMMITTED ============ -->
  <g transform="translate(30 96)">
    <rect width="213" height="50" rx="14" fill="#16A34A"/><rect y="30" width="213" height="20" fill="#16A34A"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">1</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Not committed</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Only you can see it</text>
    <rect x="80" y="58" width="118" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M90 81 L84 90 L102 81" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="88" y="78" width="16" height="4" fill="#FFFFFF"/>
    <text x="139" y="74" text-anchor="middle" font-size="11" fill="#1F2937">Nah, start again.</text>
    <use href="#you" xlink:href="#you" transform="translate(60 186) scale(0.8)"/>
    <path d="M71 108 q12 -10 22 -14" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <circle cx="95" cy="93" r="4" fill="#FCD9B6"/>
    <path d="M102 92 Q140 78 162 130" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2">
      <path d="M128 92 l8 -4 l7 3 l3 7 l-4 7 l-8 2 l-7 -4 l-2 -6z"/>
    </g>
    <path d="M131 94 l6 4 M137 92 l2 8" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M148 140 h40 l-5 46 h-30z" fill="#64748B"/>
    <rect x="144" y="134" width="48" height="8" rx="3" fill="#475569"/>
    <path d="M158 150 v28 M168 150 v28 M178 150 v28" stroke="#94A3B8" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1">
      <circle cx="160" cy="132" r="5"/><circle cx="172" cy="130" r="5"/>
    </g>
    <rect x="16" y="198" width="140" height="22" rx="11" fill="#DCFCE7"/>
    <text x="86" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">↺ Discard Changes</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">Back to the last commit.</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">This one can't be undone.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#15803D">Check before you toss!</text>
  </g>

  <!-- ============ 2 COMMITTED ============ -->
  <g transform="translate(259 96)">
    <rect width="213" height="50" rx="14" fill="#0D9488"/><rect y="30" width="213" height="20" fill="#0D9488"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0D9488">2</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Committed</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Still only you</text>
    <rect x="44" y="58" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M156 81 L166 92 L168 81" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="154" y="78" width="16" height="4" fill="#FFFFFF"/>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#1F2937">Wait, one more thing!</text>
    <!-- out tray -->
    <path d="M22 160 h104 l-8 22 h-88z" fill="#0D9488"/>
    <text x="74" y="176" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">MY OUT-TRAY</text>
    <!-- envelope being opened -->
    <g transform="rotate(-6 74 132)">
      <rect x="34" y="112" width="80" height="50" rx="3" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
      <rect x="44" y="100" width="58" height="34" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="50" y="107" width="34" height="3" fill="#0D9488"/><rect x="50" y="114" width="40" height="3" fill="#94A3B8"/>
      <path d="M34 112 L74 86 L114 112" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M34 162 L74 134 L114 162" fill="none" stroke="#0D9488" stroke-width="1.2"/>
      <path d="M70 92 l3 -3 l2 4 M78 90 l3 3 l-4 2" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <use href="#youL" xlink:href="#youL" transform="translate(172 186) scale(0.8)"/>
    <path d="M160 108 q-14 6 -30 14" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <circle cx="128" cy="123" r="4" fill="#FCD9B6"/>
    <rect x="16" y="198" width="140" height="22" rx="11" fill="#CCFBF1"/>
    <text x="86" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E">↺ Undo Last Commit</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">The commit disappears,</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">your edits stay.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#0F766E">Unseal it. Nobody saw.</text>
  </g>

  <!-- ============ 3 PUSHED ============ -->
  <g transform="translate(488 96)">
    <rect width="213" height="50" rx="14" fill="#EA580C"/><rect y="30" width="213" height="20" fill="#EA580C"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">3</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Pushed</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">On GitHub, main untouched</text>
    <rect x="96" y="58" width="108" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M168 81 L172 92 L182 81" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="166" y="78" width="18" height="4" fill="#FFFFFF"/>
    <text x="150" y="74" text-anchor="middle" font-size="11" fill="#1F2937">Quick fix coming!</text>
    <!-- mailroom pigeonholes -->
    <rect x="18" y="88" width="92" height="96" rx="4" fill="#B45309"/>
    <g fill="#FEF3C7">
      <rect x="24" y="94" width="38" height="24" rx="2"/><rect x="66" y="94" width="38" height="24" rx="2"/>
      <rect x="24" y="124" width="38" height="24" rx="2"/><rect x="66" y="124" width="38" height="24" rx="2" fill="#EDE9FE"/>
      <rect x="24" y="154" width="38" height="24" rx="2"/><rect x="66" y="154" width="38" height="24" rx="2"/>
    </g>
    <text x="43" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2563EB">main</text>
    <text x="85" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7C3AED">my-task</text>
    <rect x="74" y="126" width="22" height="8" rx="1" fill="#FFFFFF" stroke="#C4B5FD"/>
    <text x="43" y="140" text-anchor="middle" font-size="8" fill="#92400E">anna/…</text>
    <text x="85" y="110" text-anchor="middle" font-size="8" fill="#92400E">ben/…</text>
    <!-- P.S. envelope flying -->
    <path d="M150 128 Q128 118 108 132" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#m-purple)"/>
    <g transform="rotate(-10 132 112)">
      <rect x="118" y="102" width="30" height="20" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
      <path d="M118 103 L133 113 L148 103" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="133" y="120" text-anchor="middle" font-size="7" font-weight="700" fill="#7C3AED">P.S.</text>
    </g>
    <use href="#youL" xlink:href="#youL" transform="translate(178 186) scale(0.8)"/>
    <path d="M166 108 q-8 10 -14 18" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <circle cx="151" cy="128" r="4" fill="#FCD9B6"/>
    <rect x="16" y="198" width="140" height="22" rx="11" fill="#FFEDD5"/>
    <text x="86" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">✎ Fix, commit, push</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">The pull request updates.</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">Or start over on a new branch.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#C2410C">A P.S., not a panic email.</text>
  </g>

  <!-- ============ 4 MERGED INTO MAIN ============ -->
  <g transform="translate(717 96)">
    <rect width="213" height="50" rx="14" fill="#DB2777"/><rect y="30" width="213" height="20" fill="#DB2777"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">4</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Merged into main</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Everyone has it</text>
    <rect x="98" y="58" width="104" height="24" rx="12" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
    <path d="M166 81 L170 92 L180 81" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="164" y="78" width="18" height="4" fill="#FDF2F8"/>
    <text x="150" y="74" text-anchor="middle" font-size="11" fill="#831843">All on record.</text>
    <!-- open binder -->
    <rect x="14" y="98" width="134" height="86" rx="5" fill="#2563EB"/>
    <rect x="20" y="104" width="60" height="74" rx="2" fill="#FFFFFF"/>
    <rect x="82" y="104" width="60" height="74" rx="2" fill="#FFFFFF"/>
    <g fill="#CBD5E1"><circle cx="81" cy="120" r="3"/><circle cx="81" cy="141" r="3"/><circle cx="81" cy="162" r="3"/></g>
    <rect x="26" y="112" width="34" height="3" fill="#2563EB"/>
    <rect x="26" y="121" width="46" height="3" fill="#94A3B8"/>
    <rect x="26" y="130" width="42" height="3" fill="#DC2626"/>
    <line x1="24" y1="131.5" x2="72" y2="131.5" stroke="#DC2626" stroke-width="1.2"/>
    <rect x="26" y="139" width="40" height="3" fill="#94A3B8"/>
    <rect x="26" y="148" width="44" height="3" fill="#94A3B8"/>
    <text x="112" y="118" text-anchor="middle" font-size="8.5" font-weight="800" fill="#DB2777">REVERT</text>
    <rect x="88" y="124" width="46" height="3" fill="#94A3B8"/>
    <rect x="88" y="132" width="38" height="3" fill="#94A3B8"/>
    <rect x="88" y="140" width="42" height="3" fill="#94A3B8"/>
    <g transform="rotate(-10 112 162)">
      <rect x="92" y="154" width="42" height="16" rx="3" fill="none" stroke="#16A34A" stroke-width="1.6"/>
      <text x="113" y="165" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16A34A">ON FILE</text>
    </g>
    <use href="#rev" xlink:href="#rev" transform="translate(180 186) scale(0.8)"/>
    <path d="M168 110 q-6 14 -16 22" fill="none" stroke="#DB2777" stroke-width="7" stroke-linecap="round"/>
    <circle cx="151" cy="132" r="4" fill="#C68642"/>
    <rect x="16" y="198" width="140" height="22" rx="11" fill="#FCE7F3"/>
    <text x="86" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#BE185D">↺ Revert on GitHub</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">A new PR cancels the</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">change. Both stay on file.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#BE185D">An erratum, not a cover-up.</text>
  </g>

  <!-- ============ the safety net ============ -->
  <rect x="22" y="400" width="8" height="74" rx="3" fill="#475569"/>
  <rect x="930" y="400" width="8" height="74" rx="3" fill="#475569"/>
  <path d="M30 410 Q480 450 930 410 L930 418 Q480 492 30 418z" fill="url(#net)"/>
  <path d="M30 410 Q480 450 930 410" fill="none" stroke="#475569" stroke-width="3"/>
  <path d="M30 418 Q480 492 930 418" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- caught page -->
  <g transform="rotate(-18 480 432)">
    <rect x="462" y="410" width="34" height="42" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="467" y="418" width="22" height="3" fill="#7C3AED"/><rect x="467" y="425" width="18" height="3" fill="#94A3B8"/><rect x="467" y="432" width="22" height="3" fill="#94A3B8"/>
  </g>
  <path d="M452 404 l-6 -6 M508 404 l6 -6 M480 398 v-8" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="540" y="430" width="112" height="22" rx="11" fill="#1F2937"/>
  <text x="596" y="445" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#FFFFFF">GIT SAFETY NET</text>
  <text x="480" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Once committed, Git keeps every version: there's always a way back.</text>
  <text x="480" y="538" text-anchor="middle" font-size="13" fill="#4B5563"><tspan font-weight="700" fill="#DC2626">Golden rule:</tspan> never force push or rewrite main. That cuts the net.</text>
</svg>
