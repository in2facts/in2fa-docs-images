    <path d="M62 73 L56 84 L72 73" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="60" y="70" width="14" height="4" fill="#FFFFFF"/>
    <text x="107" y="66" text-anchor="middle" font-size="10.5" fill="#1F2937">Can you check this?</text>
    <use href="#you" xlink:href="#you" transform="translate(38 168) scale(0.8)"/>
    <!-- folder with cover note -->
    <rect x="74" y="92" width="22" height="8" rx="2" fill="#F59E0B"/>
    <rect x="74" y="98" width="70" height="54" rx="3" fill="#FCD34D"/>
    <g transform="rotate(-4 108 118)">
      <rect x="84" y="104" width="50" height="32" rx="2" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="89" y="114" font-size="7.5" font-weight="700" fill="#7C3AED">Q3 update</text>
      <rect x="89" y="119" width="38" height="2.5" fill="#94A3B8"/>
      <rect x="89" y="125" width="30" height="2.5" fill="#94A3B8"/>
      <rect x="89" y="131" width="34" height="2.5" fill="#94A3B8"/>
    </g>
    <path d="M50 106 q12 4 24 4" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <circle cx="76" cy="110" r="4" fill="#FCD9B6"/>
    <text x="12" y="188" font-size="11.5" fill="#374151">Open the PR: a title and a</text>
    <text x="12" y="203" font-size="11.5" fill="#374151">cover note on what &amp; why.</text>
    <text x="12" y="228" font-size="11.5" font-style="italic" font-weight="600" fill="#6D28D9">Not just "see attached".</text>
  </g>

  <!-- ============ 2 REVIEW ============ -->
  <g transform="translate(213 100)">
    <rect width="168" height="44" rx="14" fill="#DB2777"/><rect y="24" width="168" height="20" fill="#DB2777"/>
    <circle cx="20" cy="22" r="12" fill="#FFFFFF"/><text x="20" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#DB2777">2</text>
    <text x="38" y="28" font-size="13.5" font-weight="700" fill="#FFFFFF">Review</text>
    <use href="#rev" xlink:href="#rev" transform="translate(40 168) scale(0.8)"/>
    <!-- document -->
    <rect x="74" y="72" width="48" height="62" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="80" y="80" width="28" height="3.5" rx="1.5" fill="#7C3AED"/>
    <rect x="80" y="89" width="36" height="2.5" fill="#94A3B8"/>
    <rect x="78" y="95" width="40" height="8" rx="2" fill="#FEF08A"/>
    <rect x="80" y="97.5" width="30" height="2.5" fill="#94A3B8"/>
    <rect x="80" y="108" width="34" height="2.5" fill="#94A3B8"/>
    <rect x="80" y="115" width="26" height="2.5" fill="#94A3B8"/>
    <!-- pinned comment -->
    <path d="M118 99 h8" stroke="#DB2777" stroke-width="1.2"/>
    <rect x="124" y="88" width="38" height="22" rx="4" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.2"/>
    <text x="143" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#BE185D">Line 3:</text>
    <text x="143" y="106" text-anchor="middle" font-size="7.5" fill="#BE185D">source?</text>
    <!-- magnifier -->
    <path d="M50 106 q12 4 28 0" fill="none" stroke="#DB2777" stroke-width="7" stroke-linecap="round"/>
    <line x1="86" y1="108" x2="78" y2="104" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="96" cy="100" r="11" fill="#DBEAFE" fill-opacity="0.45" stroke="#475569" stroke-width="3"/>
    <circle cx="78" cy="105" r="4" fill="#C68642"/>
    <!-- desk -->
    <rect x="12" y="132" width="144" height="7" rx="2" fill="#334155"/>
    <rect x="18" y="139" width="132" height="29" fill="#475569"/>
    <text x="12" y="188" font-size="11.5" fill="#374151">A colleague reads it and</text>
    <text x="12" y="203" font-size="11.5" fill="#374151">comments on exact lines.</text>
    <text x="12" y="228" font-size="11.5" font-style="italic" font-weight="600" fill="#BE185D">Red pen, but friendlier.</text>
  </g>

  <!-- ============ 3 FIX & RESEND ============ -->
  <g transform="translate(396 100)">
    <rect width="168" height="44" rx="14" fill="#EA580C"/><rect y="24" width="168" height="20" fill="#EA580C"/>
    <circle cx="20" cy="22" r="12" fill="#FFFFFF"/><text x="20" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#EA580C">3</text>
    <text x="38" y="28" font-size="13.5" font-weight="700" fill="#FFFFFF">Fix &amp; resend</text>
    <!-- bubble -->
    <rect x="52" y="50" width="108" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M62 73 L56 84 L72 73" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="60" y="70" width="14" height="4" fill="#FFFFFF"/>
    <text x="106" y="66" text-anchor="middle" font-size="10.5" fill="#1F2937">Fixed. Same folder!</text>
    <use href="#you" xlink:href="#you" transform="translate(38 168) scale(0.8)"/>
    <!-- document being fixed -->
    <rect x="74" y="88" width="46" height="60" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="80" y="96" width="28" height="3.5" rx="1.5" fill="#7C3AED"/>
    <rect x="80" y="105" width="34" height="2.5" fill="#94A3B8"/>
    <rect x="78" y="111" width="38" height="8" rx="2" fill="#DCFCE7"/>
    <rect x="80" y="113.5" width="30" height="2.5" fill="#16A34A"/>
    <rect x="80" y="124" width="32" height="2.5" fill="#94A3B8"/>
    <rect x="80" y="131" width="24" height="2.5" fill="#94A3B8"/>
    <path d="M50 106 q16 -2 28 8" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <circle cx="80" cy="115" r="4" fill="#FCD9B6"/>
    <path d="M84 112 l14 -16" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <path d="M84 112 l-2 3" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <!-- no v2_final -->
    <g transform="rotate(8 136 142)">
      <rect x="114" y="130" width="44" height="24" rx="2" fill="#FDE68A"/>
      <text x="136" y="145" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">v2_final</text>
      <path d="M117 133 l38 18 M155 133 l-38 18" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    </g>
    <text x="12" y="188" font-size="11.5" fill="#374151">Fix, commit and push to</text>
    <text x="12" y="203" font-size="11.5" fill="#374151">the same branch.</text>
    <text x="12" y="228" font-size="11.5" font-style="italic" font-weight="600" fill="#C2410C">No v2_final needed.</text>
  </g>

  <!-- ============ 4 APPROVED ============ -->
  <g transform="translate(579 100)">
    <rect width="168" height="44" rx="14" fill="#16A34A"/><rect y="24" width="168" height="20" fill="#16A34A"/>
    <circle cx="20" cy="22" r="12" fill="#FFFFFF"/><text x="20" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">4</text>
    <text x="38" y="28" font-size="13.5" font-weight="700" fill="#FFFFFF">Approved</text>
    <!-- confetti -->
    <g>
      <rect x="20" y="58" width="6" height="3" fill="#FBBF24" transform="rotate(30 23 59)"/>
      <rect x="48" y="66" width="6" height="3" fill="#DB2777" transform="rotate(-20 51 67)"/>
      <rect x="84" y="56" width="6" height="3" fill="#2563EB" transform="rotate(45 87 57)"/>
      <rect x="28" y="150" width="6" height="3" fill="#7C3AED" transform="rotate(-30 31 151)"/>
      <rect x="66" y="146" width="6" height="3" fill="#16A34A" transform="rotate(20 69 147)"/>
      <circle cx="104" cy="64" r="2.5" fill="#EA580C"/>
      <circle cx="14" cy="130" r="2.5" fill="#2563EB"/>
      <circle cx="86" cy="156" r="2.5" fill="#FBBF24"/>
    </g>
    <!-- stamp -->
    <g transform="rotate(-12 58 108)">
      <rect x="12" y="92" width="94" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
      <text x="59" y="113" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#16A34A">APPROVED</text>
    </g>
    <use href="#rev" xlink:href="#rev" transform="translate(128 168) scale(0.8)"/>
    <path d="M139 104 q10 -6 10 -22" fill="none" stroke="#DB2777" stroke-width="7" stroke-linecap="round"/>
    <rect x="143" y="72" width="11" height="12" rx="4" fill="#C68642"/>
    <rect x="145" y="64" width="5" height="11" rx="2.5" fill="#C68642"/>
    <text x="12" y="188" font-size="11.5" fill="#374151">Approved: the change is</text>
    <text x="12" y="203" font-size="11.5" fill="#374151">ready to join main.</text>
    <text x="12" y="228" font-size="11.5" font-style="italic" font-weight="600" fill="#15803D">Best word in the office.</text>
  </g>

  <!-- ============ 5 MERGE ============ -->
  <g transform="translate(762 100)">
    <rect width="168" height="44" rx="14" fill="#2563EB"/><rect y="24" width="168" height="20" fill="#2563EB"/>
    <circle cx="20" cy="22" r="12" fill="#FFFFFF"/><text x="20" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">5</text>
    <text x="38" y="28" font-size="13.5" font-weight="700" fill="#FFFFFF">Merge</text>
    <!-- binder -->
    <rect x="32" y="70" width="36" height="28" rx="2" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="37" y="76" width="22" height="3" rx="1.5" fill="#7C3AED"/>
    <rect x="22" y="86" width="58" height="80" rx="5" fill="#2563EB"/>
    <rect x="31" y="100" width="40" height="18" rx="3" fill="#FFFFFF"/>
    <text x="51" y="113" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E3A8A">main</text>
    <circle cx="51" cy="148" r="6" fill="#FFFFFF"/>
    <circle cx="78" cy="88" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M73 88 l3.5 3.5 l6.5 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- team syncs -->
    <path d="M84 126 Q104 118 108 104" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#m-blue)"/>
    <rect x="98" y="72" width="62" height="24" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="129" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E3A8A">Got it!</text>
    <g>
      <path d="M92 168 a12 12 0 0 1 24 0z" fill="#16A34A"/>
      <circle cx="104" cy="146" r="9" fill="#E8B98F"/>
      <path d="M116 168 a12 12 0 0 1 24 0z" fill="#EA580C"/>
      <circle cx="128" cy="146" r="9" fill="#FCD9B6"/>
      <path d="M140 168 a12 12 0 0 1 24 0z" fill="#0D9488"/>
      <circle cx="152" cy="146" r="9" fill="#8D5524"/>
      <path d="M96 143 a8 8 0 0 1 16 0z" fill="#6B7280"/>
      <path d="M120 143 a8 8 0 0 1 16 0z" fill="#B45309"/>
      <path d="M144 143 a8 8 0 0 1 16 0z" fill="#1F2937"/>
      <g fill="#1F2937">
        <circle cx="101" cy="147" r="1.4"/><circle cx="107" cy="147" r="1.4"/>
        <circle cx="125" cy="147" r="1.4"/><circle cx="131" cy="147" r="1.4"/>
        <circle cx="149" cy="147" r="1.4"/><circle cx="155" cy="147" r="1.4"/>
      </g>
    </g>
    <text x="12" y="188" font-size="11.5" fill="#374151">Merge into main, delete the</text>
    <text x="12" y="203" font-size="11.5" fill="#374151">branch. The team syncs.</text>
    <text x="12" y="228" font-size="11.5" font-style="italic" font-weight="600" fill="#1D4ED8">Everyone's up to date.</text>
  </g>

  <!-- loop: back for another look -->
  <path d="M480 360 V376 Q480 386 470 386 H307 Q297 386 297 376 V365" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#m-orange)"/>
  <rect x="318" y="375" width="142" height="22" rx="11" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="389" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#C2410C">back for another look</text>

  <!-- easy to say yes to -->
  <g filter="url(#s)">
    <rect x="30" y="414" width="900" height="172" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <text x="54" y="444" font-size="15" font-weight="700" fill="#1F2937">What makes a pull request easy to say yes to?</text>

  <!-- small -->
  <circle cx="74" cy="484" r="20" fill="#EDE9FE"/>
  <rect x="62" y="476" width="24" height="16" rx="2" fill="#FCD34D"/>
  <rect x="62" y="473" width="10" height="5" rx="1.5" fill="#F59E0B"/>
  <text x="104" y="478" font-size="13.5" font-weight="700" fill="#1F2937">Small</text>
  <text x="104" y="496" font-size="12.5" fill="#4B5563">one task, not a week of work</text>
  <text x="104" y="514" font-size="12" font-style="italic" fill="#6D28D9">A memo, not the annual report.</text>

  <!-- explained -->
  <circle cx="292" cy="484" r="20" fill="#FCE7F3"/>
  <rect x="282" y="472" width="20" height="24" rx="2" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.2"/>
  <rect x="286" y="478" width="12" height="2" fill="#DB2777"/><rect x="286" y="483" width="10" height="2" fill="#94A3B8"/><rect x="286" y="488" width="12" height="2" fill="#94A3B8"/>
  <text x="322" y="478" font-size="13.5" font-weight="700" fill="#1F2937">Explained</text>
  <text x="322" y="496" font-size="12.5" fill="#4B5563">what, why, how to check</text>
  <text x="322" y="514" font-size="12" font-style="italic" fill="#BE185D">A cover note you'd like to get.</text>

  <!-- tidy -->
  <circle cx="510" cy="484" r="20" fill="#DCFCE7"/>
  <g fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2">
    <rect x="498" y="488" width="24" height="5" rx="1"/>
    <rect x="498" y="482" width="24" height="5" rx="1"/>
    <rect x="498" y="476" width="24" height="5" rx="1"/>
  </g>
  <text x="540" y="478" font-size="13.5" font-weight="700" fill="#1F2937">Tidy</text>
  <text x="540" y="496" font-size="12.5" fill="#4B5563">clear commits, no stray files</text>
  <text x="540" y="514" font-size="12" font-style="italic" fill="#15803D">No coffee rings, no loose pages.</text>

  <!-- kind -->
  <circle cx="728" cy="484" r="20" fill="#DBEAFE"/>
  <path d="M716 474 h24 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-14 l-6 5 v-5 h-4 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <circle cx="724" cy="481" r="1.4" fill="#2563EB"/><circle cx="732" cy="481" r="1.4" fill="#2563EB"/>
  <path d="M723 485 q5 4 10 0" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/>
  <text x="758" y="478" font-size="13.5" font-weight="700" fill="#1F2937">Kind</text>
  <text x="758" y="496" font-size="12.5" fill="#4B5563">reviewers ask, don't order</text>
  <text x="758" y="514" font-size="12" font-style="italic" fill="#1D4ED8">"Could we…?" beats "Fix this."</text>

  <line x1="54" y1="540" x2="906" y2="540" stroke="#F1F5F9" stroke-width="2"/>
  <text x="480" y="567" text-anchor="middle" font-size="12.5" fill="#6B7280"><tspan font-weight="700" fill="#D97757">Tip:</tspan> Claude can draft the cover note (the PR description) for you.</text>
</svg>
