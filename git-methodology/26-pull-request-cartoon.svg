<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 606" width="960" height="606" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A pull request, the office version</title>
  <desc id="d">A pull request as an office sign-off, in five scenes. 1, ask for sign-off: you hand over a folder with a cover note and ask "Can you check this?"; opening a pull request means a title and a note on what and why. 2, review: a colleague reads the document with a magnifying glass and pins a comment to line 3. 3, fix and resend: you fix it in the same folder, commit and push to the same branch, with no v2_final copy needed; an arrow loops back to review for another look. 4, approved: a big green approved stamp and a thumbs up. 5, merge: the document goes into the main binder and the team syncs and says "Got it!". Below, what makes a pull request easy to say yes to: small, one task not a week of work; explained, what, why and how to check; tidy, clear commits and no stray files; kind, reviewers ask rather than order. Tip: Claude can draft the cover note, the PR description, for you.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#EA580C"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563EB"/></marker>
    <g id="you">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#7C3AED"/>
      <circle cx="0" cy="-104" r="15" fill="#FCD9B6"/>
      <path d="M-15 -106 a15 15 0 0 1 29 -5 q-9 -5 -17 -2 q-7 3 -12 7z" fill="#3F2A1D"/>
      <circle cx="-1" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="8" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-1 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="rev">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#DB2777"/>
      <circle cx="0" cy="-104" r="15" fill="#C68642"/>
      <path d="M-15 -106 a15 15 0 0 1 30 0 q-6 -8 -15 -8 q-9 0 -15 8z" fill="#1F2937"/>
      <circle cx="-5" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="4" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-5 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="606" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">A pull request, the office version</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Getting a sign-off before your work goes into the official binder</text>

  <!-- cards -->
  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="100" width="168" height="260" rx="14"/>
    <rect x="213" y="100" width="168" height="260" rx="14"/>
    <rect x="396" y="100" width="168" height="260" rx="14"/>
    <rect x="579" y="100" width="168" height="260" rx="14"/>
    <rect x="762" y="100" width="168" height="260" rx="14"/>
  </g>

  <!-- ============ 1 ASK FOR SIGN-OFF ============ -->
