    <circle cx="20" cy="22" r="12" fill="#FFFFFF"/><text x="20" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">1</text>
    <text x="38" y="28" font-size="13.5" font-weight="700" fill="#FFFFFF">Ask for sign-off</text>
    <!-- bubble -->
