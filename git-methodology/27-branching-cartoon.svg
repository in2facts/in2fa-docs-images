<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How a branch works, by train</title>
  <desc id="d">A branch drawn as a railway siding. The main line carries the main train, full of smiling colleagues saying "Report still works!". 1, create: you pull a switch lever and say "Branch, please!": a side track splits off from main as an exact copy. 2, work safely: on your siding, the workshop, you commit as often as you like: new chart, fix typo, Claude's rewrite. A wagon tips over with an "Oops!", but main didn't notice. 3, merge: at a review gate a colleague waves a green flag, "Approved!", and the siding rejoins the main line, which now carries your work. Bottom: a branch costs nothing; it is a sticky note on main, not a photocopy of the whole binder.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <g id="you">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#7C3AED"/>
      <circle cx="0" cy="-104" r="15" fill="#FCD9B6"/>
      <path d="M-15 -106 a15 15 0 0 1 29 -5 q-9 -5 -17 -2 q-7 3 -12 7z" fill="#3F2A1D"/>
      <circle cx="-1" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="8" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-1 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="rev">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#334155"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#DB2777"/>
      <circle cx="0" cy="-104" r="15" fill="#C68642"/>
      <path d="M-15 -106 a15 15 0 0 1 30 0 q-6 -8 -15 -8 q-9 0 -15 8z" fill="#1F2937"/>
      <circle cx="-5" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="4" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-5 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <path id="branchPath" d="M180 170 C260 170 250 360 330 360 H650 C730 360 720 170 800 170"/>
  </defs>
  <rect width="960" height="590" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">How a branch works, by train</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Main keeps running on time. You tinker on your own side track.</text>

  <!-- workshop zone -->
  <rect x="290" y="290" width="400" height="180" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="676" y="458" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7C3AED">YOUR BRANCH · THE WORKSHOP</text>

  <!-- tracks: sleepers, then two rails -->
  <g fill="none">
    <line x1="30" y1="170" x2="930" y2="170" stroke="#B45309" stroke-width="22" stroke-dasharray="4 14"/>
    <use href="#branchPath" xlink:href="#branchPath" stroke="#C4B5FD" stroke-width="22" stroke-dasharray="4 14"/>
    <line x1="30" y1="170" x2="930" y2="170" stroke="#64748B" stroke-width="14"/>
    <line x1="30" y1="170" x2="930" y2="170" stroke="#F8FAFC" stroke-width="9"/>
    <use href="#branchPath" xlink:href="#branchPath" stroke="#7C3AED" stroke-width="14"/>
    <use href="#branchPath" xlink:href="#branchPath" stroke="#FFFFFF" stroke-width="9"/>
  </g>
  <!-- main label and commits -->
  <rect x="38" y="134" width="50" height="22" rx="11" fill="#2563EB"/>
  <text x="63" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">main</text>
  <circle cx="110" cy="170" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="150" cy="170" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- ============ 1 CREATE: the switch ============ -->
  <rect x="166" y="94" width="112" height="26" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M176 119 L168 130 L190 119" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="174" y="116" width="18" height="4" fill="#FFFFFF"/>
  <text x="222" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Branch, please!</text>
  <use href="#you" xlink:href="#you" transform="translate(146 160) scale(0.6)"/>
  <rect x="186" y="150" width="14" height="8" rx="2" fill="#475569"/>
  <line x1="193" y1="152" x2="208" y2="122" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="208" cy="122" r="5" fill="#DC2626"/>
  <path d="M154 110 q20 0 50 14" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
  <circle cx="205" cy="124" r="3" fill="#FCD9B6"/>
  <g>
    <circle cx="54" cy="226" r="14" fill="#7C3AED"/>
    <text x="54" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="76" y="232" font-size="16" font-weight="700" fill="#1F2937">Create</text>
    <text x="40" y="258" font-size="12.5" fill="#4B5563">Split off from main.</text>
    <text x="40" y="276" font-size="12.5" fill="#4B5563">An exact copy, for free.</text>
  </g>

  <!-- ============ 2 WORK SAFELY ============ -->
  <g>
    <circle cx="54" cy="336" r="14" fill="#7C3AED"/>
    <text x="54" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="76" y="342" font-size="16" font-weight="700" fill="#1F2937">Work safely</text>
    <text x="40" y="368" font-size="12.5" fill="#4B5563">Commit as often as you</text>
    <text x="40" y="386" font-size="12.5" fill="#4B5563">like. Main doesn't change,</text>
    <text x="40" y="404" font-size="12.5" fill="#4B5563">colleagues keep using it.</text>
  </g>
  <!-- commit stops on the siding -->
  <g font-size="10.5" font-weight="600" text-anchor="middle" fill="#5B21B6">
    <line x1="370" y1="324" x2="370" y2="352" stroke="#94A3B8" stroke-width="2"/>
    <rect x="326" y="302" width="88" height="22" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="370" y="317">+ new chart</text>
    <line x1="480" y1="324" x2="480" y2="352" stroke="#94A3B8" stroke-width="2"/>
    <rect x="436" y="302" width="88" height="22" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="480" y="317">+ fix typo</text>
    <line x1="590" y1="324" x2="590" y2="352" stroke="#94A3B8" stroke-width="2"/>
    <rect x="540" y="302" width="100" height="22" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="590" y="317">+ Claude rewrite</text>
  </g>
  <circle cx="370" cy="360" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="480" cy="360" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="590" cy="360" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- oops -->
  <use href="#you" xlink:href="#you" transform="translate(452 448) scale(0.55)"/>
  <path d="M461 404 q8 -8 4 -18" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
  <circle cx="464" cy="385" r="3" fill="#FCD9B6"/>
  <text x="440" y="378" font-size="13" font-weight="700" fill="#7C3AED">?</text>
  <g transform="rotate(28 528 422)">
    <rect x="502" y="408" width="52" height="24" rx="4" fill="#A78BFA"/>
    <rect x="508" y="413" width="40" height="5" rx="2" fill="#EDE9FE"/>
    <circle cx="512" cy="404" r="6" fill="#1F2937"/>
    <circle cx="544" cy="404" r="6" fill="#1F2937"/>
  </g>
  <g fill="#CBD5E1">
    <circle cx="548" cy="398" r="6"/><circle cx="558" cy="390" r="8"/><circle cx="552" cy="380" r="5"/>
  </g>
  <path d="M498 444 l-6 4 M508 448 l-2 6 M530 446 l4 6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <text x="572" y="398" font-size="15" font-weight="800" fill="#DC2626">Oops!</text>
  <text x="572" y="416" font-size="11.5" fill="#6B7280">Main didn't notice.</text>

  <!-- ============ main train ============ -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
    <line x1="436" y1="140" x2="460" y2="140"/>
    <line x1="430" y1="150" x2="460" y2="150"/>
    <line x1="440" y1="160" x2="460" y2="160"/>
  </g>
  <rect x="534" y="150" width="16" height="4" fill="#334155"/>
  <rect x="610" y="150" width="16" height="4" fill="#334155"/>
  <rect x="466" y="130" width="70" height="34" rx="6" fill="#2563EB"/>
  <rect x="542" y="130" width="70" height="34" rx="6" fill="#2563EB"/>
  <g fill="#DBEAFE">
    <rect x="474" y="137" width="22" height="14" rx="2"/><rect x="506" y="137" width="22" height="14" rx="2"/>
    <rect x="550" y="137" width="22" height="14" rx="2"/><rect x="582" y="137" width="22" height="14" rx="2"/>
  </g>
  <circle cx="485" cy="149" r="5" fill="#FCD9B6"/>
  <circle cx="517" cy="149" r="5" fill="#8D5524"/>
  <circle cx="561" cy="149" r="5" fill="#E8B98F"/>
  <circle cx="593" cy="149" r="5" fill="#C68642"/>
  <g fill="#1F2937">
    <circle cx="483.5" cy="148" r="0.9"/><circle cx="486.5" cy="148" r="0.9"/>
    <circle cx="515.5" cy="148" r="0.9"/><circle cx="518.5" cy="148" r="0.9"/>
    <circle cx="559.5" cy="148" r="0.9"/><circle cx="562.5" cy="148" r="0.9"/>
    <circle cx="591.5" cy="148" r="0.9"/><circle cx="594.5" cy="148" r="0.9"/>
  </g>
  <path d="M618 126 h66 q22 0 26 26 v12 h-92z" fill="#1D4ED8"/>
  <rect x="676" y="134" width="20" height="14" rx="3" fill="#DBEAFE"/>
  <circle cx="704" cy="157" r="4" fill="#FDE047"/>
  <text x="648" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">main</text>
  <g fill="#1F2937">
    <circle cx="480" cy="166" r="6"/><circle cx="522" cy="166" r="6"/>
    <circle cx="556" cy="166" r="6"/><circle cx="598" cy="166" r="6"/>
    <circle cx="632" cy="166" r="6"/><circle cx="666" cy="166" r="6"/><circle cx="696" cy="166" r="6"/>
  </g>
  <!-- passenger bubble -->
  <rect x="470" y="94" width="130" height="26" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <path d="M500 119 L504 130 L514 119" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="498" y="116" width="18" height="4" fill="#EFF6FF"/>
  <text x="535" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Report still works!</text>

  <!-- ============ 3 MERGE: review gate ============ -->
  <line x1="748" y1="290" x2="748" y2="238" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-96 748 240)">
    <rect x="748" y="235" width="50" height="10" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="758" y="235" width="10" height="10" fill="#DC2626"/>
    <rect x="778" y="235" width="10" height="10" fill="#DC2626"/>
    
  </g>
  <use href="#rev" xlink:href="#rev" transform="translate(674 298) scale(0.6)"/>
  <path d="M682 249 q10 -4 12 -18" fill="none" stroke="#DB2777" stroke-width="5" stroke-linecap="round"/>
  <line x1="694" y1="236" x2="700" y2="196" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M700 197 l26 6 l-22 10z" fill="#16A34A"/>
  <circle cx="694" cy="233" r="3" fill="#C68642"/>
  <rect x="580" y="206" width="84" height="24" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M654 222 L672 230 L658 229" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="622" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">Approved!</text>
  <!-- merged commit on main -->
  <circle cx="830" cy="170" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M824.5 170 l3.5 3.5 l7 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="830" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">main + your work</text>
  <g>
    <circle cx="784" cy="306" r="14" fill="#16A34A"/>
    <text x="784" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="806" y="312" font-size="16" font-weight="700" fill="#1F2937">Merge</text>
    <text x="770" y="338" font-size="12.5" fill="#4B5563">After review, your</text>
    <text x="770" y="356" font-size="12.5" fill="#4B5563">work joins main. The</text>
    <text x="770" y="374" font-size="12.5" fill="#4B5563">siding can be removed.</text>
  </g>

  <!-- ============ bottom: costs nothing ============ -->
  <g filter="url(#s)">
    <rect x="30" y="490" width="900" height="80" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <g>
    <rect x="62" y="512" width="30" height="38" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="58" y="516" width="30" height="38" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="54" y="520" width="30" height="38" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M50 516 l46 44 M96 516 l-46 44" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="rotate(-6 132 534)">
    <rect x="114" y="516" width="36" height="36" rx="2" fill="#FDE68A"/>
    <rect x="120" y="526" width="22" height="3" fill="#B45309"/>
    <rect x="120" y="533" width="16" height="3" fill="#B45309"/>
  </g>
  <circle cx="150" cy="518" r="10" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M145 518 l3.5 3.5 l6 -6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="182" y="520" font-size="15" font-weight="700" fill="#1F2937">A branch costs nothing.</text>
  <text x="182" y="541" font-size="13" fill="#4B5563">It's a sticky note on main, not a photocopy of the whole binder: Git only notes what changed.</text>
  <text x="182" y="558" font-size="12" font-style="italic" fill="#7C3AED">So make one for every task, however small.</text>
</svg>
