<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Three tools, one way of working</title>
  <desc id="d">You are at the centre. VS Code is your workbench, Claude is your AI assistant inside VS Code, and GitHub is your safe, shared archive.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#6B7280"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Three tools, one way of working</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">You stay in control: the tools do the heavy lifting</text>

  <!-- connectors -->
  <line x1="418" y1="212" x2="336" y2="205" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="377" y="194" text-anchor="middle" font-size="12" fill="#374151">edit &amp; commit</text>
  <line x1="542" y1="212" x2="624" y2="205" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="583" y="194" text-anchor="middle" font-size="12" fill="#374151">ask &amp; approve</text>
  <line x1="480" y1="278" x2="480" y2="334" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="490" y="312" font-size="12" fill="#374151">push &amp; review</text>
  <path d="M190 306 C190 400 250 435 334 435" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="196" y="398" text-anchor="end" font-size="12" fill="#2563EB" font-weight="600">sync</text>
  <text x="196" y="414" text-anchor="end" font-size="12" fill="#2563EB">push / pull</text>
  <path d="M770 306 C770 400 710 435 626 435" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="766" y="398" font-size="12" fill="#B4532F" font-weight="600">can prepare</text>
  <text x="766" y="414" font-size="12" fill="#B4532F">commits &amp; PRs</text>

  <!-- VS Code card -->
  <g filter="url(#s)">
    <rect x="50" y="110" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <path d="M64 110 h252 a14 14 0 0 1 14 14 v42 h-280 v-42 a14 14 0 0 1 14 -14z" fill="#2563EB"/>
  <rect x="70" y="124" width="30" height="24" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M78 132 l-4 4 l4 4 M92 132 l4 4 l-4 4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="112" y="144" font-size="19" font-weight="700" fill="#FFFFFF">VS Code</text>
  <text x="70" y="194" font-size="15" font-weight="700" fill="#2563EB">Your workbench</text>
  <text x="70" y="222" font-size="13.5" fill="#374151">• Open and edit your files</text>
  <text x="70" y="248" font-size="13.5" fill="#374151">• See exactly what changed</text>
  <text x="70" y="274" font-size="13.5" fill="#374151">• Commit &amp; sync in one click</text>

  <!-- Claude card -->
  <g filter="url(#s)">
    <rect x="630" y="110" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <path d="M644 110 h252 a14 14 0 0 1 14 14 v42 h-280 v-42 a14 14 0 0 1 14 -14z" fill="#D97757"/>
  <path d="M672 124 h26 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-16 l-8 6 v-6 h-2 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M685 129 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#FFFFFF"/>
  <text x="714" y="144" font-size="19" font-weight="700" fill="#FFFFFF">Claude</text>
  <text x="650" y="194" font-size="15" font-weight="700" fill="#B4532F">Your AI assistant</text>
  <text x="650" y="222" font-size="13.5" fill="#374151">• Explains, drafts, rewrites</text>
  <text x="650" y="248" font-size="13.5" fill="#374151">• Edits files, with your OK</text>
  <text x="650" y="274" font-size="13.5" fill="#374151">• Runs inside VS Code</text>

  <!-- GitHub card -->
  <g filter="url(#s)">
    <rect x="340" y="340" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>
  <path d="M354 340 h252 a14 14 0 0 1 14 14 v42 h-280 v-42 a14 14 0 0 1 14 -14z" fill="#24292F"/>
  <path d="M368 376 a8 8 0 0 1 2 -15 a11 11 0 0 1 21 -3 a8 8 0 0 1 7 13 a5 5 0 0 1 -3 5z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="408" y="374" font-size="19" font-weight="700" fill="#FFFFFF">GitHub</text>
  <text x="360" y="424" font-size="15" font-weight="700" fill="#24292F">Your safe, shared archive</text>
  <text x="360" y="452" font-size="13.5" fill="#374151">• Every version, backed up</text>
  <text x="360" y="478" font-size="13.5" fill="#374151">• Branches &amp; pull requests</text>
  <text x="360" y="504" font-size="13.5" fill="#374151">• Team review &amp; history</text>

  <!-- You -->
  <g filter="url(#s)">
    <circle cx="480" cy="215" r="62" fill="#1E3A5F"/>
  </g>
  <circle cx="480" cy="215" r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <text x="480" y="214" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">YOU</text>
  <text x="480" y="236" text-anchor="middle" font-size="12" fill="#DBEAFE">decide &amp; approve</text>
</svg>
