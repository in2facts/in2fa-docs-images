<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The life of a pull request</title>
  <desc id="d">The author opens a pull request with a title and description. A reviewer reads the changes and comments or approves. The author updates the branch if needed, which loops back to review. Once approved, the pull request is merged and the branch deleted.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#EA580C"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">The life of a pull request</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">A friendly "please check my work" before it reaches main</text>

  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="110" width="200" height="200" rx="14"/>
    <rect x="270" y="110" width="200" height="200" rx="14"/>
    <rect x="510" y="110" width="200" height="200" rx="14"/>
    <rect x="750" y="110" width="180" height="200" rx="14"/>
  </g>
  <g stroke="#9CA3AF" stroke-width="2.5">
    <line x1="233" y1="210" x2="265" y2="210" marker-end="url(#a)"/>
    <line x1="473" y1="210" x2="505" y2="210" marker-end="url(#a)"/>
    <line x1="713" y1="210" x2="745" y2="210" marker-end="url(#a)"/>
  </g>
  <!-- loop back: changes requested -->
  <path d="M610 314 C610 372 370 372 370 314" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#o)"/>
  <rect x="408" y="348" width="164" height="24" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="490" y="365" text-anchor="middle" font-size="12.5" font-weight="600" fill="#C2410C">changes requested</text>

  <g font-size="13" fill="#4B5563">
    <!-- 1 Open -->
    <rect x="30" y="110" width="200" height="8" rx="4" fill="#2563EB"/>
    <text x="50" y="146" font-size="12" font-weight="700" fill="#2563EB">AUTHOR</text>
    <text x="50" y="172" font-size="18" font-weight="700" fill="#1F2937">1 · Open</text>
    <text x="50" y="202">Give it a clear title and</text>
    <text x="50" y="222">explain what and why.</text>
    <text x="50" y="242">Pick a reviewer.</text>
    <rect x="50" y="262" width="160" height="28" rx="7" fill="#16A34A"/>
    <text x="130" y="281" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Create pull request</text>

    <!-- 2 Review -->
    <rect x="270" y="110" width="200" height="8" rx="4" fill="#EA580C"/>
    <text x="290" y="146" font-size="12" font-weight="700" fill="#C2410C">REVIEWER</text>
    <text x="290" y="172" font-size="18" font-weight="700" fill="#1F2937">2 · Review</text>
    <text x="290" y="202">Read the "Files changed"</text>
    <text x="290" y="222">tab. Comment on any line,</text>
    <text x="290" y="242">ask questions, suggest.</text>
    <rect x="290" y="258" width="160" height="36" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="300" y="281" font-size="12" font-style="italic" fill="#9A3412">"Can you add the source?"</text>

    <!-- 3 Approve -->
    <rect x="510" y="110" width="200" height="8" rx="4" fill="#16A34A"/>
    <text x="530" y="146" font-size="12" font-weight="700" fill="#15803D">REVIEWER</text>
    <text x="530" y="172" font-size="18" font-weight="700" fill="#1F2937">3 · Approve</text>
    <text x="530" y="202">Happy? Approve. Not yet?</text>
    <text x="530" y="222">Request changes. The author</text>
    <text x="530" y="242">pushes fixes to the same</text>
    <text x="530" y="262">branch, and the PR updates.</text>

    <!-- 4 Merge -->
    <rect x="750" y="110" width="180" height="8" rx="4" fill="#7C3AED"/>
    <text x="770" y="146" font-size="12" font-weight="700" fill="#6D28D9">AUTHOR</text>
    <text x="770" y="172" font-size="18" font-weight="700" fill="#1F2937">4 · Merge</text>
    <text x="770" y="202">Click Merge. The work</text>
    <text x="770" y="222">is now in main.</text>
    <text x="770" y="242">Delete the branch.</text>
    <rect x="770" y="262" width="140" height="28" rx="7" fill="#7C3AED"/>
    <text x="840" y="281" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Merge pull request</text>
  </g>

  <!-- good PR card -->
  <rect x="30" y="396" width="900" height="140" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="50" y="426" font-size="15" font-weight="700" fill="#1F2937">What makes a pull request easy to review</text>
  <g font-size="13.5" fill="#374151">
    <circle cx="58" cy="456" r="5" fill="#2563EB"/><text x="72" y="461"><tspan font-weight="700">Small:</tspan> one task, not a week of mixed work</text>
    <circle cx="58" cy="484" r="5" fill="#2563EB"/><text x="72" y="489"><tspan font-weight="700">Explained:</tspan> what changed, why, and what to check</text>
    <circle cx="58" cy="512" r="5" fill="#2563EB"/><text x="72" y="517"><tspan font-weight="700">Tidy:</tspan> clear commit messages, no unrelated files</text>
    <circle cx="500" cy="456" r="5" fill="#EA580C"/><text x="514" y="461"><tspan font-weight="700">Reviewers:</tspan> be kind, be specific, be quick</text>
    <circle cx="500" cy="484" r="5" fill="#EA580C"/><text x="514" y="489"><tspan font-weight="700">Ask, don't order:</tspan> "What if we…?"</text>
    <circle cx="500" cy="512" r="5" fill="#D97757"/><text x="514" y="517"><tspan font-weight="700">Claude</tspan> can draft the PR description for you</text>
  </g>
</svg>
