<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Your safety net: undo at every stage</title>
  <desc id="d">Four stages with an undo option each. Not saved yet: discard changes in VS Code. Committed but not pushed: undo last commit. Pushed to a branch: add a new commit or delete the branch. Merged into main: revert the pull request on GitHub.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#94A3B8"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Your safety net: undo at every stage</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Whatever went wrong, there is a way back</text>

  <!-- timeline -->
  <line x1="80" y1="128" x2="880" y2="128" stroke="#CBD5E1" stroke-width="4" marker-end="url(#a)"/>
  <g font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="140" cy="128" r="16" fill="#64748B"/><text x="140" y="133">1</text>
    <circle cx="370" cy="128" r="16" fill="#0D9488"/><text x="370" y="133">2</text>
    <circle cx="600" cy="128" r="16" fill="#7C3AED"/><text x="600" y="133">3</text>
    <circle cx="820" cy="128" r="16" fill="#1E3A5F"/><text x="820" y="133">4</text>
  </g>

  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="160" width="215" height="250" rx="14"/>
    <rect x="262" y="160" width="215" height="250" rx="14"/>
    <rect x="494" y="160" width="215" height="250" rx="14"/>
    <rect x="726" y="160" width="204" height="250" rx="14"/>
  </g>

  <g font-size="13" fill="#4B5563">
    <text x="48" y="190" font-size="12" font-weight="700" fill="#64748B">STAGE</text>
    <text x="48" y="214" font-size="17" font-weight="700" fill="#1F2937">Edited, not committed</text>
    <rect x="48" y="232" width="180" height="1" fill="#E5E7EB"/>
    <text x="48" y="258" font-size="12" font-weight="700" fill="#16A34A">UNDO</text>
    <text x="48" y="280">Source Control → right-</text>
    <text x="48" y="298">click the file → <tspan font-weight="700">Discard</tspan></text>
    <text x="48" y="316"><tspan font-weight="700">Changes</tspan>. Or ask Claude to</text>
    <text x="48" y="334">"undo your last edit".</text>
    <rect x="48" y="360" width="100" height="22" rx="11" fill="#DCFCE7"/><text x="98" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">only you see it</text>

    <text x="280" y="190" font-size="12" font-weight="700" fill="#0F766E">STAGE</text>
    <text x="280" y="214" font-size="17" font-weight="700" fill="#1F2937">Committed, not pushed</text>
    <rect x="280" y="232" width="180" height="1" fill="#E5E7EB"/>
    <text x="280" y="258" font-size="12" font-weight="700" fill="#16A34A">UNDO</text>
    <text x="280" y="280">Source Control → <tspan font-weight="700">…</tspan> menu →</text>
    <text x="280" y="298">Commit → <tspan font-weight="700">Undo Last</tspan></text>
    <text x="280" y="316"><tspan font-weight="700">Commit</tspan>. Your edits come</text>
    <text x="280" y="334">back, ready to fix.</text>
    <rect x="280" y="360" width="100" height="22" rx="11" fill="#DCFCE7"/><text x="330" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">only you see it</text>

    <text x="512" y="190" font-size="12" font-weight="700" fill="#6D28D9">STAGE</text>
    <text x="512" y="214" font-size="17" font-weight="700" fill="#1F2937">Pushed to a branch</text>
    <rect x="512" y="232" width="180" height="1" fill="#E5E7EB"/>
    <text x="512" y="258" font-size="12" font-weight="700" fill="#16A34A">UNDO</text>
    <text x="512" y="280">Just fix it and commit again:</text>
    <text x="512" y="298">the PR updates. Or <tspan font-weight="700">delete</tspan></text>
    <text x="512" y="316"><tspan font-weight="700">the branch</tspan> and start fresh.</text>
    <text x="512" y="334">main was never touched.</text>
    <rect x="512" y="360" width="118" height="22" rx="11" fill="#EDE9FE"/><text x="571" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D28D9">main still safe</text>

    <text x="744" y="190" font-size="12" font-weight="700" fill="#1E3A5F">STAGE</text>
    <text x="744" y="214" font-size="17" font-weight="700" fill="#1F2937">Merged into main</text>
    <rect x="744" y="232" width="168" height="1" fill="#E5E7EB"/>
    <text x="744" y="258" font-size="12" font-weight="700" fill="#16A34A">UNDO</text>
    <text x="744" y="280">Open the merged PR on</text>
    <text x="744" y="298">GitHub → <tspan font-weight="700">Revert</tspan>. It creates</text>
    <text x="744" y="316">a new PR that cancels the</text>
    <text x="744" y="334">change. Review &amp; merge.</text>
    <rect x="744" y="360" width="128" height="22" rx="11" fill="#DBEAFE"/><text x="808" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E3A8A">history preserved</text>
  </g>

  <rect x="30" y="432" width="900" height="64" rx="14" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="54" y="460" font-size="14" font-weight="700" fill="#92400E">Golden rule</text>
  <text x="54" y="481" font-size="13.5" fill="#78350F">Never "force push" or rewrite the history of main. If you are unsure how to undo something, stop and ask a colleague or Claude first.</text>
</svg>
