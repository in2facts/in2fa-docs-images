<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A quick tour of VS Code</title>
  <desc id="d">A simplified VS Code window with five numbered areas: the activity bar, the Source Control panel, the editor showing changes, the Claude panel, and the status bar showing the current branch and sync button.</desc>
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <g id="n"><circle r="13" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/></g>
  </defs>
  <rect width="960" height="600" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">A quick tour of VS Code</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">The five areas you'll use every day</text>

  <!-- window -->
  <g filter="url(#s)">
    <rect x="40" y="96" width="600" height="440" rx="10" fill="#FFFFFF" stroke="#D4D4D4"/>
  </g>
  <rect x="40" y="96" width="600" height="28" rx="10" fill="#DDDDDD"/>
  <rect x="40" y="114" width="600" height="10" fill="#DDDDDD"/>
  <circle cx="58" cy="110" r="5" fill="#FF5F57"/><circle cx="74" cy="110" r="5" fill="#FEBC2E"/><circle cx="90" cy="110" r="5" fill="#28C840"/>
  <text x="340" y="115" text-anchor="middle" font-size="11.5" fill="#333333">Report.md — in2fa-project — Visual Studio Code</text>

  <!-- activity bar -->
  <rect x="40" y="124" width="44" height="390" fill="#F3F3F3"/>
  <g fill="none" stroke="#8A8A8A" stroke-width="2">
    <path d="M52 140 h14 l6 6 v16 h-20z"/>
    <circle cx="61" cy="184" r="7"/><path d="M66 189 l6 6"/>
  </g>
  <rect x="40" y="214" width="3" height="32" fill="#005FB8"/>
  <g fill="none" stroke="#1F1F1F" stroke-width="2">
    <circle cx="56" cy="222" r="3.5"/><circle cx="56" cy="240" r="3.5"/><circle cx="68" cy="226" r="3.5"/>
    <path d="M56 226 v10 M68 230 C68 236 58 234 57 237"/>
  </g>
  <circle cx="72" cy="216" r="7" fill="#007ACC"/><text x="72" y="220" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">2</text>
  <path d="M51 270 h20 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-11 l-6 5 v-5 h-3 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3z" fill="none" stroke="#D97757" stroke-width="2"/>
  <path d="M61 273 l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5z" fill="#D97757"/>

  <!-- source control panel -->
  <rect x="84" y="124" width="170" height="390" fill="#F3F3F3"/>
  <text x="96" y="146" font-size="10.5" font-weight="700" fill="#616161">SOURCE CONTROL</text>
  <rect x="96" y="158" width="146" height="44" rx="3" fill="#FFFFFF" stroke="#CECECE"/>
  <text x="104" y="176" font-size="10.5" fill="#767676">Message (Ctrl+Enter</text>
  <text x="104" y="192" font-size="10.5" fill="#767676">to commit)</text>
  <rect x="96" y="210" width="146" height="26" rx="3" fill="#005FB8"/>
  <text x="169" y="227" text-anchor="middle" font-size="11.5" fill="#FFFFFF">✓ Commit</text>
  <text x="96" y="260" font-size="10.5" font-weight="700" fill="#616161">CHANGES  2</text>
  <text x="104" y="282" font-size="11.5" fill="#3B3B3B">Report.md</text><text x="230" y="282" font-size="11" font-weight="700" fill="#895503">M</text>
  <text x="104" y="302" font-size="11.5" fill="#3B3B3B">Summary.md</text><text x="231" y="302" font-size="11" font-weight="700" fill="#007100">U</text>

  <!-- editor -->
  <rect x="254" y="124" width="386" height="26" fill="#F3F3F3"/>
  <rect x="254" y="124" width="110" height="26" fill="#FFFFFF"/>
  <text x="266" y="141" font-size="11.5" fill="#333333">Report.md</text><text x="340" y="141" font-size="11" fill="#895503">M</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="262" y="174" fill="#6E7681">1</text><text x="290" y="174" fill="#0000FF"># Quarterly report</text>
    <text x="262" y="196" fill="#6E7681">2</text>
    <text x="262" y="218" fill="#6E7681">3</text><text x="290" y="218" fill="#1F1F1F">Revenue grew in all regions.</text>
    <rect x="254" y="226" width="386" height="20" fill="#FFE0E0"/><rect x="254" y="226" width="3" height="20" fill="#E51400"/>
    <text x="262" y="240" fill="#6E7681">4</text><text x="290" y="240" fill="#A31515">Costs were stable.</text>
    <rect x="254" y="248" width="386" height="20" fill="#DCF5DC"/><rect x="254" y="248" width="3" height="20" fill="#2EA043"/>
    <text x="262" y="262" fill="#6E7681">4</text><text x="290" y="262" fill="#116329">Costs fell by 4% thanks to the new</text>
    <rect x="254" y="270" width="386" height="20" fill="#DCF5DC"/><rect x="254" y="270" width="3" height="20" fill="#2EA043"/>
    <text x="262" y="284" fill="#6E7681">5</text><text x="290" y="284" fill="#116329">supplier contract.</text>
    <text x="262" y="306" fill="#6E7681">6</text>
    <text x="262" y="328" fill="#6E7681">7</text><text x="290" y="328" fill="#0000FF">## Outlook</text>
  </g>

  <!-- Claude panel inside editor area (bottom half) -->
  <rect x="254" y="350" width="386" height="164" fill="#F8F8F8"/>
  <rect x="254" y="350" width="386" height="1" fill="#E5E5E5"/>
  <text x="266" y="370" font-size="10.5" font-weight="700" fill="#B4532F">CLAUDE CODE</text>
  <rect x="266" y="380" width="250" height="34" rx="8" fill="#E8E8E8"/>
  <text x="276" y="401" font-size="11.5" fill="#1F1F1F">Update the costs sentence with Q3 data</text>
  <rect x="300" y="422" width="328" height="50" rx="8" fill="#FBEDE7"/>
  <text x="310" y="442" font-size="11.5" fill="#7A3418">I'll edit Report.md line 4. Here's the change:</text>
  <text x="310" y="461" font-size="11.5" fill="#7A3418">−1 line, +2 lines. Accept?</text>
  <rect x="266" y="482" width="362" height="24" rx="5" fill="#FFFFFF" stroke="#CECECE"/>
  <text x="276" y="498" font-size="11" fill="#767676">Ask Claude…</text>

  <!-- status bar -->
  <rect x="40" y="514" width="600" height="22" fill="#007ACC"/>
  <rect x="40" y="528" width="600" height="8" rx="0" fill="#007ACC"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5"><circle cx="54" cy="521" r="2.5"/><circle cx="54" cy="531" r="2.5"/><circle cx="62" cy="523" r="2.5"/><path d="M54 523.5 v5 M62 525.5 C62 529 55 528 54.5 529"/></g>
  <text x="70" y="530" font-size="11.5" fill="#FFFFFF">docs/q3-costs*</text>
  <text x="160" y="530" font-size="11.5" fill="#FFFFFF">⟳ 0↓ 1↑</text>

  <!-- number badges -->
  <use href="#n" x="40" y="160"/><text x="40" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <use href="#n" x="230" y="141"/><text x="230" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <use href="#n" x="640" y="230"/><text x="640" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <use href="#n" x="640" y="420"/><text x="640" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <use href="#n" x="230" y="525"/><text x="230" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>

  <!-- legend -->
  <g font-size="13" fill="#4B5563">
    <use href="#n" x="682" y="118"/><text x="682" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="704" y="123" font-size="15" font-weight="700" fill="#1F2937">Activity bar</text>
    <text x="704" y="144">Switch between files, search,</text>
    <text x="704" y="162">Source Control and Claude.</text>

    <use href="#n" x="682" y="200"/><text x="682" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="704" y="205" font-size="15" font-weight="700" fill="#1F2937">Source Control</text>
    <text x="704" y="226">Changed files, commit message</text>
    <text x="704" y="244">and the Commit button. Ctrl+Shift+G</text>

    <use href="#n" x="682" y="282"/><text x="682" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="704" y="287" font-size="15" font-weight="700" fill="#1F2937">Editor with changes</text>
    <text x="704" y="308"><tspan fill="#DC2626" font-weight="600">Red</tspan> = removed, <tspan fill="#16A34A" font-weight="600">green</tspan> = added.</text>
    <text x="704" y="326">Click a changed file to compare.</text>

    <use href="#n" x="682" y="364"/><text x="682" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
    <text x="704" y="369" font-size="15" font-weight="700" fill="#1F2937">Claude panel</text>
    <text x="704" y="390">Ask in plain language. Claude</text>
    <text x="704" y="408">shows the change before saving it.</text>

    <use href="#n" x="682" y="446"/><text x="682" y="451" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
    <text x="704" y="451" font-size="15" font-weight="700" fill="#1F2937">Status bar</text>
    <text x="704" y="472">Current branch (click to switch)</text>
    <text x="704" y="490">and the Sync button (push/pull).</text>
  </g>
  <text x="480" y="572" text-anchor="middle" font-size="13" fill="#6B7280">Tip: always glance at the branch name in the status bar before you start working.</text>
</svg>
