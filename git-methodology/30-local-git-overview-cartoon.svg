  <rect x="30" y="96" width="572" height="44" rx="14" fill="#2563EB"/><rect x="30" y="120" width="572" height="20" fill="#2563EB"/>
  <text x="50" y="124" font-size="16" font-weight="700" fill="#FFFFFF">Your office = your PC</text>
  <text x="582" y="124" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.9">everything stays inside</text>
  <!-- wall and floor -->
  <rect x="31" y="140" width="570" height="236" fill="#F8FAFC"/>
  <line x1="44" y1="376" x2="588" y2="376" stroke="#E2E8F0" stroke-width="2"/>
  <!-- window with far-away GitHub -->
  <rect x="300" y="152" width="120" height="78" rx="4" fill="#E0F2FE" stroke="#94A3B8" stroke-width="3"/>
  <line x1="360" y1="152" x2="360" y2="230" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="191" x2="420" y2="191" stroke="#94A3B8" stroke-width="2"/>
  <g fill="#FFFFFF">
    <circle cx="378" cy="176" r="8"/><circle cx="390" cy="171" r="10"/><circle cx="402" cy="177" r="7"/>
    <rect x="372" y="176" width="36" height="9" rx="4.5"/>
  </g>
  <text x="390" y="183" text-anchor="middle" font-size="6.5" font-weight="700" fill="#64748B">GitHub</text>
  <g transform="rotate(-6 360 238)">
    <rect x="310" y="228" width="100" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="360" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">not needed today</text>
  </g>
  <!-- bubble -->
  <rect x="140" y="152" width="140" height="26" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M152 177 L146 190 L166 177" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="150" y="174" width="18" height="4" fill="#FFFFFF"/>
  <text x="210" y="169" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">Everything stays right here.</text>
  <!-- you behind desk -->
  <use href="#you" xlink:href="#you" transform="translate(120 376) scale(1)"/>
  <path d="M134 296 q16 10 26 22" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
  <!-- papers on desk -->
  <g transform="rotate(-10 176 306)">
    <rect x="162" y="292" width="26" height="28" rx="2" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="166" y="299" width="16" height="3" fill="#2563EB"/><rect x="166" y="306" width="12" height="3" fill="#94A3B8"/>
  </g>
  <g transform="rotate(8 212 306)">
    <rect x="198" y="292" width="26" height="28" rx="2" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="202" y="299" width="16" height="3" fill="#16A34A"/><rect x="202" y="306" width="12" height="3" fill="#94A3B8"/>
  </g>
  <rect x="232" y="302" width="14" height="16" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="60" y="318" width="200" height="10" rx="3" fill="#A16207"/>
  <rect x="70" y="328" width="9" height="48" fill="#854D0E"/>
  <rect x="242" y="328" width="9" height="48" fill="#854D0E"/>
  <!-- envelope -->
  <path d="M300 300 L335 276 L370 300z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="300" y="300" width="70" height="46" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="314" y="284" width="22" height="30" rx="2" fill="#FFFFFF" stroke="#C4B5FD" transform="rotate(-6 325 299)"/>
  <rect x="334" y="282" width="22" height="30" rx="2" fill="#FFFFFF" stroke="#C4B5FD" transform="rotate(5 345 297)"/>
  <path d="M300 312 L335 332 L370 312 V346 H300z" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- filing cabinet -->
  <rect x="444" y="246" width="110" height="130" rx="6" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <g fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2">
    <rect x="452" y="254" width="94" height="34" rx="3"/>
    <rect x="452" y="294" width="94" height="34" rx="3"/>
    <rect x="452" y="334" width="94" height="34" rx="3"/>
  </g>
  <use href="#env" xlink:href="#env" x="460" y="264"/>
  <use href="#env" xlink:href="#env" x="460" y="304"/>
  <use href="#env" xlink:href="#env" x="460" y="344"/>
  <g font-size="10" font-weight="700" fill="#134E4A">
    <text x="488" y="275">Mon</text><text x="488" y="315">Tue</text><text x="488" y="355">Wed</text>
  </g>
  <rect x="460" y="226" width="78" height="20" rx="4" fill="#1F2937"/>
  <text x="499" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">.git (hidden)</text>
  <g transform="rotate(8 560 300)">
    <rect x="530" y="286" width="58" height="30" rx="2" fill="#FDE68A"/>
    <text x="559" y="299" text-anchor="middle" font-size="8.5" font-weight="800" fill="#B91C1C">DO NOT</text>
    <text x="559" y="310" text-anchor="middle" font-size="8.5" font-weight="800" fill="#B91C1C">DELETE</text>
  </g>
  <!-- arrows -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1F2937">
    <text x="280" y="270">add</text>
    <text x="406" y="270">commit</text>
  </g>
  <line x1="262" y1="280" x2="296" y2="290" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/>
  <line x1="374" y1="290" x2="438" y2="280" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/>
  <!-- labels -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="70" y="390" width="150" height="26" rx="13" fill="#DBEAFE"/>
    <text x="145" y="407" fill="#1E3A8A"><tspan font-weight="700">Workspace</tspan> = your desk</text>
    <rect x="252" y="390" width="168" height="26" rx="13" fill="#EDE9FE"/>
    <text x="336" y="407" fill="#5B21B6"><tspan font-weight="700">Staging</tspan> = the envelope</text>
    <rect x="432" y="390" width="156" height="26" rx="13" fill="#CCFBF1"/>
