  </g>

  <!-- ============ not included ============ -->
  <g filter="url(#s)"><rect x="618" y="96" width="312" height="338" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <rect x="618" y="96" width="312" height="44" rx="14" fill="#1F2937"/><rect x="618" y="120" width="312" height="20" fill="#1F2937"/>
  <text x="638" y="124" font-size="16" font-weight="700" fill="#FFFFFF">Not included</text>
  <text x="910" y="124" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.9">and the workaround</text>

  <!-- backup -->
  <circle cx="660" cy="182" r="24" fill="#FEE2E2"/>
  <g fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4">
    <path d="M648 190 a7 7 0 0 1 2 -13 a9 9 0 0 1 17 -2 a6 6 0 0 1 4 11 z"/>
  </g>
  <path d="M652 194 l16 -16 M668 194 l-16 -16" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="696" y="176" font-size="14" font-weight="700" fill="#1F2937">Online backup</text>
  <text x="696" y="194" font-size="12" fill="#4B5563">Laptop gone = history gone.</text>
  <text x="696" y="212" font-size="12" font-weight="700" fill="#2563EB">→ Make a backup (step 9)</text>

  <line x1="638" y1="234" x2="910" y2="234" stroke="#F1F5F9" stroke-width="2"/>
  <!-- sharing -->
  <circle cx="660" cy="276" r="24" fill="#FEE2E2"/>
  <circle cx="653" cy="270" r="6" fill="#E8B98F"/><path d="M644 288 a9 9 0 0 1 18 0z" fill="#16A34A"/>
  <circle cx="668" cy="270" r="6" fill="#8D5524"/><path d="M659 288 a9 9 0 0 1 18 0z" fill="#2563EB"/>
  <path d="M650 286 l20 -20 M670 286 l-20 -20" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <text x="696" y="270" font-size="14" font-weight="700" fill="#1F2937">Team sharing</text>
  <text x="696" y="288" font-size="12" fill="#4B5563">Colleagues can't sync your work.</text>
  <text x="696" y="306" font-size="12" font-weight="700" fill="#2563EB">→ Use a network drive (step 10)</text>

  <line x1="638" y1="328" x2="910" y2="328" stroke="#F1F5F9" stroke-width="2"/>
  <!-- review -->
  <circle cx="660" cy="370" r="24" fill="#FEE2E2"/>
  <circle cx="656" cy="366" r="8" fill="#FFFFFF" stroke="#475569" stroke-width="2.4"/>
  <line x1="662" y1="372" x2="670" y2="380" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M648 380 l20 -20 M668 380 l-20 -20" stroke="#DC2626" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <text x="696" y="364" font-size="14" font-weight="700" fill="#1F2937">Pull requests</text>
  <text x="696" y="382" font-size="12" fill="#4B5563">Nobody checks your work.</text>
  <text x="696" y="400" font-size="12" font-weight="700" fill="#2563EB">→ Review yourself (step 6)</text>

  <!-- ============ bottom ============ -->
  <g filter="url(#s)"><rect x="30" y="452" width="900" height="72" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <g transform="translate(54 470)">
    <rect x="0" y="4" width="36" height="24" rx="3" fill="#1E293B"/>
    <rect x="3" y="7" width="30" height="18" rx="1" fill="#DBEAFE"/>
    <rect x="-4" y="28" width="44" height="4" rx="2" fill="#475569"/>
    <circle cx="18" cy="16" r="5" fill="#16A34A"/>
    <path d="M15.5 16 l2 2 l3.5 -4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="112" y="483" font-size="15" font-weight="700" fill="#1F2937">No account, no cloud, no internet needed.</text>
  <text x="112" y="506" font-size="13" fill="#4B5563">Moving to GitHub later? <tspan font-weight="700" fill="#1F2937">git push</tspan> takes the whole history along. Nothing is wasted.</text>
</svg>
