<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Git on your own PC: a one-person office</title>
  <desc id="d">Local Git as a one-person office. On the left, your office: you at your desk, which is the workspace; git add puts papers in an envelope, the staging area; commit seals the envelope and files it in your own filing cabinet, the local repository, labelled .git, hidden, do not delete. Through the window, the GitHub cloud is far away with a sign saying not needed today. You say "Everything stays right here." On the right, what's not included and the workaround: online backup, because laptop gone means history gone, so make a backup (step 9); team sharing, because colleagues can't sync, so use a network drive (step 10); pull requests, because nobody checks your work, so review yourself (step 6). Bottom: no account, no cloud, no internet needed; moving to GitHub later, git push takes the whole history along.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker>
    <g id="you">
      <rect x="-13" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <rect x="3" y="-44" width="9" height="40" rx="4" fill="#1E3A8A"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <ellipse cx="8" cy="-3" rx="9" ry="4" fill="#1F2937"/>
      <rect x="-18" y="-90" width="36" height="50" rx="12" fill="#7C3AED"/>
      <circle cx="0" cy="-104" r="15" fill="#FCD9B6"/>
      <path d="M-15 -106 a15 15 0 0 1 29 -5 q-9 -5 -17 -2 q-7 3 -12 7z" fill="#3F2A1D"/>
      <circle cx="-1" cy="-104" r="1.8" fill="#1F2937"/>
      <circle cx="8" cy="-104" r="1.8" fill="#1F2937"/>
      <path d="M-1 -97 q5 4 10 0" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="env">
      <rect x="0" y="0" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.3"/>
      <path d="M0 1 L10 8 L20 1" fill="none" stroke="#0D9488" stroke-width="1.3"/>
      <circle cx="10" cy="8" r="2.6" fill="#DC2626"/>
    </g>
  </defs>
  <rect width="960" height="548" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Git on your own PC: a one-person office</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Your desk, an envelope and your own filing cabinet. No courier, no shared archive.</text>

