<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Before and after version control</title>
  <desc id="d">Left: a folder full of confusingly named copies of the same report. Right: one file with a clear history of who changed what and when.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <g id="doc">
      <path d="M0 0 h168 l12 12 v28 h-180z" fill="#FFFFFF" stroke="#D1D5DB"/>
      <rect x="8" y="10" width="14" height="18" rx="2" fill="#93C5FD"/>
    </g>
    <g id="no"><circle r="10" fill="#FEE2E2"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="yes"><circle r="10" fill="#DCFCE7"/><path d="M-4.5 0 L-1.5 3.5 L4.5 -3.5" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="520" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Why version control?</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">The same report, managed two ways</text>

  <!-- LEFT -->
  <rect x="30" y="95" width="435" height="395" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <path d="M44 95 h407 a14 14 0 0 1 14 14 v21 h-435 v-21 a14 14 0 0 1 14 -14z" fill="#DC2626"/>
  <text x="247" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Without version control</text>

  <g filter="url(#s)" font-size="12.5" fill="#374151">
    <g transform="translate(55 150) rotate(-3)"><use href="#doc"/><text x="30" y="25">Report_final.docx</text></g>
    <g transform="translate(255 158) rotate(4)"><use href="#doc"/><text x="30" y="25">Report_final_v2.docx</text></g>
    <g transform="translate(70 212) rotate(2)"><use href="#doc"/><text x="30" y="25">Report_final_v2_JS.docx</text></g>
    <g transform="translate(262 222) rotate(-4)"><use href="#doc"/><text x="30" y="25">Report_FINAL_really.docx</text></g>
    <g transform="translate(150 276) rotate(1)"><use href="#doc"/><text x="30" y="25">Report_final_v3 (1).docx</text></g>
  </g>
  <text x="90" y="300" font-size="28" font-weight="700" fill="#F87171">?</text>
  <text x="400" y="300" font-size="22" font-weight="700" fill="#F87171">?</text>
  <text x="225" y="208" font-size="20" font-weight="700" fill="#FCA5A5">?</text>

  <g font-size="14" fill="#374151">
    <use href="#no" x="62" y="370"/><text x="82" y="375">Which file is the latest?</text>
    <use href="#no" x="62" y="402"/><text x="82" y="407">Who changed what, and why?</text>
    <use href="#no" x="62" y="434"/><text x="82" y="439">Can I get last week's version back?</text>
    <use href="#no" x="62" y="466"/><text x="82" y="471">Did a colleague overwrite my work?</text>
  </g>

  <!-- RIGHT -->
  <rect x="495" y="95" width="435" height="395" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <path d="M509 95 h407 a14 14 0 0 1 14 14 v21 h-435 v-21 a14 14 0 0 1 14 -14z" fill="#16A34A"/>
  <text x="712" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">With Git + GitHub</text>

  <g filter="url(#s)"><use href="#doc" x="525" y="148"/></g>
  <text x="555" y="173" font-size="13" font-weight="700" fill="#1F2937">Report.md</text>
  <text x="718" y="166" font-size="12.5" fill="#6B7280">one file, always</text>
  <text x="718" y="182" font-size="12.5" fill="#6B7280">the latest version</text>

  <line x1="545" y1="212" x2="545" y2="322" stroke="#0D9488" stroke-width="3"/>
  <g font-size="13" fill="#374151">
    <circle cx="545" cy="212" r="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <text x="562" y="217"><tspan font-weight="600">Rewrite conclusion</tspan><tspan fill="#6B7280"> · Alain · 5 Oct</tspan></text>
    <rect x="828" y="203" width="44" height="18" rx="9" fill="#0D9488"/><text x="850" y="216" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">latest</text>
    <circle cx="545" cy="248" r="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <text x="562" y="253"><tspan font-weight="600">Fix typo in summary</tspan><tspan fill="#6B7280"> · Ben · 3 Oct</tspan></text>
    <circle cx="545" cy="284" r="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <text x="562" y="289"><tspan font-weight="600">Add Q3 figures</tspan><tspan fill="#6B7280"> · Anna · 2 Oct</tspan></text>
    <circle cx="545" cy="320" r="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <text x="562" y="325"><tspan font-weight="600">Create report outline</tspan><tspan fill="#6B7280"> · Alain · 28 Sep</tspan></text>
  </g>

  <g font-size="14" fill="#374151">
    <use href="#yes" x="527" y="370"/><text x="547" y="375">One file, always the latest version</text>
    <use href="#yes" x="527" y="402"/><text x="547" y="407">Every change: who, when and why</text>
    <use href="#yes" x="527" y="434"/><text x="547" y="439">Go back to any version in seconds</text>
    <use href="#yes" x="527" y="466"/><text x="547" y="471">Work together without overwriting</text>
  </g>
</svg>
