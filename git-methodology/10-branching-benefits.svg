<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Six benefits of branching</title>
  <desc id="d">Branching keeps the approved version safe, lets people work in parallel, makes experiments free, enables review before anything goes live, makes undo easy, and gives a clear record of every task.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="580" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Six benefits of branching</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Why every task gets its own branch</text>

  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="40" y="100" width="280" height="210" rx="14"/>
    <rect x="340" y="100" width="280" height="210" rx="14"/>
    <rect x="640" y="100" width="280" height="210" rx="14"/>
    <rect x="40" y="330" width="280" height="210" rx="14"/>
    <rect x="340" y="330" width="280" height="210" rx="14"/>
    <rect x="640" y="330" width="280" height="210" rx="14"/>
  </g>

  <g font-size="13.5" fill="#4B5563">
    <!-- 1 Safety -->
    <circle cx="86" cy="148" r="26" fill="#1E3A5F"/>
    <path d="M86 134 l12 5 v9 c0 8 -6 13 -12 15 c-6 -2 -12 -7 -12 -15 v-9z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M80 148 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="126" y="155" font-size="19" font-weight="700" fill="#1F2937">main stays safe</text>
    <text x="62" y="200">The approved version is never</text>
    <text x="62" y="222">half-finished. Colleagues and</text>
    <text x="62" y="244">reports always use a version</text>
    <text x="62" y="266">that works.</text>

    <!-- 2 Parallel -->
    <circle cx="386" cy="148" r="26" fill="#7C3AED"/>
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M372 138 h28 M372 148 h28 M372 158 h28"/></g>
    <text x="426" y="155" font-size="19" font-weight="700" fill="#1F2937">Work in parallel</text>
    <text x="362" y="200">Anna updates the sales chapter</text>
    <text x="362" y="222">while Ben fixes the appendix.</text>
    <text x="362" y="244">Nobody waits, nobody overwrites</text>
    <text x="362" y="266">anybody else.</text>

    <!-- 3 Experiment -->
    <circle cx="686" cy="148" r="26" fill="#D97757"/>
    <path d="M680 134 h12 M682 134 v10 l-9 15 h26 l-9 -15 v-10" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="726" y="155" font-size="19" font-weight="700" fill="#1F2937">Experiment freely</text>
    <text x="662" y="200">Try a new structure or let Claude</text>
    <text x="662" y="222">try a bold rewrite. Don't like it?</text>
    <text x="662" y="244">Delete the branch. Nothing else</text>
    <text x="662" y="266">is affected.</text>

    <!-- 4 Review -->
    <circle cx="86" cy="378" r="26" fill="#EA580C"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.2"><circle cx="84" cy="376" r="8"/><path d="M90 382 l7 7" stroke-linecap="round"/></g>
    <text x="126" y="385" font-size="19" font-weight="700" fill="#1F2937">Review first</text>
    <text x="62" y="430">A second pair of eyes checks the</text>
    <text x="62" y="452">work in a pull request before it</text>
    <text x="62" y="474">reaches main. Fewer mistakes,</text>
    <text x="62" y="496">shared knowledge.</text>

    <!-- 5 Undo -->
    <circle cx="386" cy="378" r="26" fill="#0D9488"/>
    <path d="M375 372 a12 12 0 1 1 1 12" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M371 366 l4 7 l7 -3" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="426" y="385" font-size="19" font-weight="700" fill="#1F2937">Easy to undo</text>
    <text x="362" y="430">Each task is one merge. If it</text>
    <text x="362" y="452">causes a problem, that whole task</text>
    <text x="362" y="474">can be reverted in one step,</text>
    <text x="362" y="496">without losing other work.</text>

    <!-- 6 Traceability -->
    <circle cx="686" cy="378" r="26" fill="#2563EB"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M674 368 h24 M674 378 h24 M674 388 h16"/></g>
    <text x="726" y="385" font-size="19" font-weight="700" fill="#1F2937">Clear record</text>
    <text x="662" y="430">Every pull request shows what</text>
    <text x="662" y="452">changed, why, who approved it</text>
    <text x="662" y="474">and when. Handy for audits and</text>
    <text x="662" y="496">handovers.</text>
  </g>
</svg>
