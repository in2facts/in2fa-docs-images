<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Back it up: three ways</title>
  <desc id="d">Why and how to back up a local Git repository. Why bother: without GitHub your laptop is the only copy; laptops get stolen, dropped and replaced, and the history goes with them. Back up before, not after. Option A, one backup file, the simplest: git bundle create with --all packs every version and branch into one file, a whole cabinet in one suitcase, on a USB drive. Option B, a backup repository, best for regular backups: a spare, bare filing cabinet on a drive; git push --all backup copies only the new commits; top it up in one command. Option C, copy the folder, fine with one rule: copy the whole folder, the hidden .git folder included, only while Git is asleep. Bottom: how often? At least every week, and before anything risky. Bonus: a spare cabinet on a network share works as a home-made GitHub for two.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker>
    <g id="cab">
      <rect x="0" y="0" width="56" height="72" rx="4" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="5" y="5" width="46" height="18" rx="2" fill="#F8FAFC" stroke="#94A3B8"/>
      <rect x="5" y="27" width="46" height="18" rx="2" fill="#F8FAFC" stroke="#94A3B8"/>
      <rect x="5" y="49" width="46" height="18" rx="2" fill="#F8FAFC" stroke="#94A3B8"/>
      <rect x="20" y="12" width="16" height="3" rx="1.5" fill="#94A3B8"/>
      <rect x="20" y="34" width="16" height="3" rx="1.5" fill="#94A3B8"/>
      <rect x="20" y="56" width="16" height="3" rx="1.5" fill="#94A3B8"/>
    </g>
    <g id="folder">
      <path d="M0 0 h26 l6 8 h38 v54 h-70z" fill="#FCD34D"/>
      <path d="M0 14 h70 v48 h-70z" fill="#FBBF24"/>
    </g>
  </defs>
  <rect width="960" height="500" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Back it up: three ways</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Without GitHub, your history lives in one place. Give it a second home.</text>

  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="96" width="213" height="296" rx="14"/>
    <rect x="259" y="96" width="213" height="296" rx="14"/>
    <rect x="488" y="96" width="213" height="296" rx="14"/>
    <rect x="717" y="96" width="213" height="296" rx="14"/>
  </g>

  <!-- ============ WHY ============ -->
  <g transform="translate(30 96)">
    <rect width="213" height="50" rx="14" fill="#DC2626"/><rect y="30" width="213" height="20" fill="#DC2626"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="31" text-anchor="middle" font-size="16" font-weight="800" fill="#DC2626">!</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Why bother?</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Your laptop is the only copy</text>
    <rect x="44" y="76" width="120" height="78" rx="6" fill="#1E293B"/>
    <rect x="50" y="82" width="108" height="66" rx="2" fill="#DBEAFE"/>
    <circle cx="88" cy="106" r="3.5" fill="#1F2937"/><circle cx="120" cy="106" r="3.5" fill="#1F2937"/>
    <path d="M90 130 q14 -10 28 0" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M84 113 q-2 6 1 8" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <path d="M140 82 l-8 16 l10 8 l-6 14 l8 12 l-4 16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M140 82 l-8 16 l10 8 l-6 14 l8 12 l-4 16" fill="none" stroke="#475569" stroke-width="0.8"/>
    <path d="M28 154 h152 l-10 12 h-132z" fill="#94A3B8"/>
    <ellipse cx="160" cy="172" rx="30" ry="6" fill="#92400E" opacity="0.55"/>
    <g transform="rotate(80 186 160)">
      <rect x="176" y="150" width="18" height="20" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <rect x="58" y="58" width="92" height="20" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="104" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">.git lives only here</text>
    <rect x="16" y="198" width="160" height="22" rx="11" fill="#FEE2E2"/>
    <text x="96" y="213" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B91C1C">no GitHub = no backup</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">Laptops get stolen, dropped</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">and replaced. History too.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#B91C1C">Back up before, not after.</text>
  </g>

  <!-- ============ A BUNDLE ============ -->
  <g transform="translate(259 96)">
    <rect width="213" height="50" rx="14" fill="#2563EB"/><rect y="30" width="213" height="20" fill="#2563EB"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">A</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">One backup file</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">The simplest</text>
    <use href="#cab" xlink:href="#cab" transform="translate(14 96) scale(0.85)"/>
    <line x1="66" y1="126" x2="84" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#m-dark)"/>
    <path d="M104 98 v-8 a4 4 0 0 1 4 -4 h14 a4 4 0 0 1 4 4 v8" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <rect x="88" y="98" width="54" height="50" rx="6" fill="#2563EB"/>
    <rect x="88" y="118" width="54" height="5" fill="#1D4ED8"/>
    <text x="115" y="112" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">sales-report</text>
    <text x="115" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">.bundle</text>
    <circle cx="96" cy="150" r="3" fill="#1F2937"/><circle cx="134" cy="150" r="3" fill="#1F2937"/>
    <line x1="146" y1="126" x2="160" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#m-dark)"/>
    <rect x="164" y="112" width="30" height="26" rx="4" fill="#475569"/>
    <rect x="194" y="118" width="10" height="14" rx="1" fill="#CBD5E1"/>
    <text x="179" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">D:</text>
    <text x="179" y="152" text-anchor="middle" font-size="9" fill="#6B7280">USB drive</text>
    <rect x="12" y="198" width="190" height="22" rx="11" fill="#1E293B"/>
    <text x="107" y="213" text-anchor="middle" font-size="10" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#4ADE80">git bundle create … --all</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">Every version and branch,</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">packed into one file.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#1D4ED8">A whole cabinet, one suitcase.</text>
  </g>

  <!-- ============ B BARE REPO ============ -->
  <g transform="translate(488 96)">
    <rect width="213" height="50" rx="14" fill="#0D9488"/><rect y="30" width="213" height="20" fill="#0D9488"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0D9488">B</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Backup repository</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Best for regular backups</text>
    <text x="46" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">yours</text>
    <use href="#cab" xlink:href="#cab" x="18" y="90"/>
    <text x="167" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E">spare</text>
    <use href="#cab" xlink:href="#cab" x="139" y="90"/>
    <rect x="131" y="162" width="72" height="16" rx="3" fill="#475569"/>
    <text x="167" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">D: or network</text>
    <path d="M78 120 Q106 96 134 120" fill="none" stroke="#0D9488" stroke-width="2.4" marker-end="url(#m-dark)"/>
    <text x="106" y="98" text-anchor="middle" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F766E">push</text>
    <g transform="translate(96 112)">
      <rect width="20" height="14" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.3"/>
      <path d="M0 1 L10 8 L20 1" fill="none" stroke="#0D9488" stroke-width="1.3"/>
      <circle cx="10" cy="8" r="2.6" fill="#DC2626"/>
    </g>
    <text x="106" y="144" text-anchor="middle" font-size="9" fill="#6B7280">only new</text>
    <text x="106" y="155" text-anchor="middle" font-size="9" fill="#6B7280">commits</text>
    <rect x="16" y="198" width="168" height="22" rx="11" fill="#1E293B"/>
    <text x="100" y="213" text-anchor="middle" font-size="10" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#4ADE80">git push --all backup</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">A spare "bare" cabinet on a</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">drive. Set up once, then push.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#0F766E">Top it up in one command.</text>
  </g>

  <!-- ============ C COPY FOLDER ============ -->
  <g transform="translate(717 96)">
    <rect width="213" height="50" rx="14" fill="#7C3AED"/><rect y="30" width="213" height="20" fill="#7C3AED"/>
    <circle cx="22" cy="25" r="13" fill="#FFFFFF"/><text x="22" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">C</text>
    <text x="42" y="22" font-size="14.5" font-weight="700" fill="#FFFFFF">Copy the folder</text>
    <text x="42" y="40" font-size="11.5" fill="#FFFFFF" opacity="0.9">Fine, with one rule</text>
    <use href="#folder" xlink:href="#folder" x="16" y="96"/>
    <rect x="34" y="122" width="34" height="14" rx="3" fill="#1F2937"/>
    <text x="51" y="132" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">.git</text>
    <line x1="92" y1="128" x2="116" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#m-dark)"/>
    <use href="#folder" xlink:href="#folder" x="122" y="96"/>
    <rect x="140" y="122" width="34" height="14" rx="3" fill="#1F2937"/>
    <text x="157" y="132" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">.git</text>
    <rect x="116" y="158" width="82" height="14" rx="3" fill="#475569"/>
    <text x="157" y="169" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">backup drive</text>
    <!-- sleeping Git -->
    <path d="M40 64 a12 12 0 1 0 12 16 a9 9 0 1 1 -12 -16z" fill="#FDE68A"/>
    <text x="62" y="70" font-size="11" font-weight="800" fill="#7C3AED">z</text>
    <text x="70" y="62" font-size="13" font-weight="800" fill="#7C3AED">z</text>
    <text x="80" y="54" font-size="15" font-weight="800" fill="#7C3AED">z</text>
    <text x="100" y="72" font-size="10" font-style="italic" fill="#6B7280">Git is idle</text>
    <rect x="16" y="198" width="168" height="22" rx="11" fill="#EDE9FE"/>
    <text x="100" y="213" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6D28D9">include the hidden .git</text>
    <text x="16" y="242" font-size="12.5" fill="#374151">Copy the whole folder when</text>
    <text x="16" y="259" font-size="12.5" fill="#374151">no Git command is running.</text>
    <text x="16" y="282" font-size="12.5" font-style="italic" font-weight="600" fill="#6D28D9">Only while Git is asleep.</text>
  </g>

  <!-- ============ bottom ============ -->
  <g filter="url(#s)"><rect x="30" y="410" width="900" height="70" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <g transform="translate(54 426)">
    <rect x="0" y="4" width="34" height="32" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="0" y="4" width="34" height="9" rx="4" fill="#2563EB"/>
    <path d="M9 0 v8 M25 0 v8" stroke="#1E3A8A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M10 24 l5 5 l9 -10" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="102" y="440" font-size="14.5" font-weight="700" fill="#1F2937">How often?</text>
  <text x="102" y="462" font-size="13" fill="#4B5563">At least every week, and before anything risky.</text>
  <line x1="470" y1="424" x2="470" y2="466" stroke="#E5E7EB" stroke-width="2"/>
  <text x="494" y="440" font-size="14.5" font-weight="700" fill="#0F766E">Bonus</text>
  <text x="494" y="462" font-size="13" fill="#4B5563">Option B on a network share = a home-made GitHub for two.</text>
</svg>
