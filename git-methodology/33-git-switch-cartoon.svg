<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What git switch -c actually does</title>
  <desc id="d">Before and after running git switch -c experiment/new-layout. Before: the Git Bash prompt shows (main); your folder holds .gitignore, chapter-2.md and report.md; inside the hidden .git folder, the history has three commits and the label main is on the latest one. After: the prompt shows (experiment/new-layout); your folder holds exactly the same files; the history is the same, with a second label, experiment/new-layout, on the same commit, marked "you are here". Then what: when you edit and commit on the branch, only your label moves forward and main stays put; git switch main shows main's files in your folder again, with your work safe on the branch; git switch experiment/new-layout brings your version back. Facts: no new files, no experiment folder because the slash is just part of the name, and it costs nothing.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker>
    <g id="env">
      <rect x="0" y="0" width="22" height="16" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.4"/>
      <path d="M0 1 L11 9 L22 1" fill="none" stroke="#0D9488" stroke-width="1.4"/>
      <circle cx="11" cy="9" r="2.8" fill="#DC2626"/>
    </g>
    <g id="envP">
      <rect x="0" y="0" width="22" height="16" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
      <path d="M0 1 L11 9 L22 1" fill="none" stroke="#7C3AED" stroke-width="1.4"/>
      <circle cx="11" cy="9" r="2.8" fill="#DC2626"/>
    </g>
    <g id="doc">
      <path d="M0 0 h9 l4 4 v12 h-13z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
      <path d="M9 0 v4 h4" fill="none" stroke="#94A3B8" stroke-width="1.1"/>
    </g>
    <g id="folderview">
      <rect x="0" y="0" width="172" height="118" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="0" y="0" width="172" height="24" rx="6" fill="#F1F5F9"/>
      <rect x="0" y="18" width="172" height="6" fill="#F1F5F9"/>
      <path d="M10 7 h7 l2 3 h10 v9 h-19z" fill="#FBBF24"/>
      <text x="36" y="17" font-size="11" font-weight="700" fill="#1F2937">sales-report</text>
      <use href="#doc" xlink:href="#doc" x="14" y="36"/>
      <text x="36" y="48" font-size="11" fill="#374151">.gitignore</text>
      <use href="#doc" xlink:href="#doc" x="14" y="62"/>
      <text x="36" y="74" font-size="11" fill="#374151">chapter-2.md</text>
      <use href="#doc" xlink:href="#doc" x="14" y="88"/>
      <text x="36" y="100" font-size="11" fill="#374151">report.md</text>
    </g>
  </defs>
  <rect width="960" height="590" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">What does <tspan font-family="Consolas, Menlo, monospace" font-size="24">git switch -c</tspan> actually do?</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">It hangs a new label in your filing cabinet. Your folder doesn't change at all.</text>

  <g filter="url(#s)" fill="#FFFFFF" stroke="#E5E7EB">
    <rect x="30" y="96" width="390" height="250" rx="14"/>
    <rect x="540" y="96" width="390" height="250" rx="14"/>
  </g>

  <!-- ============ BEFORE ============ -->
  <g transform="translate(30 96)">
    <rect width="390" height="40" rx="14" fill="#2563EB"/><rect y="20" width="390" height="20" fill="#2563EB"/>
    <text x="18" y="26" font-size="16" font-weight="700" fill="#FFFFFF">Before</text>
    <text x="372" y="26" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.9">you're on main</text>
    <rect x="16" y="52" width="358" height="28" rx="5" fill="#1E293B"/>
    <text x="26" y="71" font-size="12" font-family="Consolas, Menlo, monospace"><tspan fill="#4ADE80">you@pc</tspan> <tspan fill="#C084FC">~/sales-report</tspan> <tspan fill="#38BDF8" font-weight="700">(main)</tspan></text>
    <text x="16" y="102" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">YOUR FOLDER</text>
    <use href="#folderview" xlink:href="#folderview" x="16" y="110"/>
    <text x="206" y="102" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">INSIDE .git (HIDDEN)</text>
    <rect x="206" y="110" width="168" height="118" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="226" y1="146" x2="334" y2="146" stroke="#0D9488" stroke-width="2"/>
    <use href="#env" xlink:href="#env" x="216" y="138"/>
    <use href="#env" xlink:href="#env" x="262" y="138"/>
    <use href="#env" xlink:href="#env" x="308" y="138"/>
    <text x="227" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Mon</text>
    <text x="273" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Tue</text>
    <text x="319" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Wed</text>
    <line x1="319" y1="154" x2="319" y2="168" stroke="#2563EB" stroke-width="1.5"/>
    <path d="M296 168 h46 l6 9 l-6 9 h-46z" fill="#2563EB"/>
    <text x="316" y="181" text-anchor="middle" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">main</text>
    <text x="290" y="214" text-anchor="middle" font-size="10" font-style="italic" fill="#6B7280">one label: main</text>
  </g>

  <!-- ============ the command ============ -->
  <rect x="428" y="166" width="104" height="70" rx="8" fill="#1E293B"/>
  <g font-family="Consolas, Menlo, monospace" font-size="10" font-weight="700">
    <text x="436" y="186" fill="#FFFFFF">$ git switch -c</text>
    <text x="446" y="202" fill="#FDE68A">experiment/</text>
    <text x="446" y="216" fill="#FDE68A">new-layout</text>
  </g>
  <line x1="436" y1="252" x2="528" y2="252" stroke="#374151" stroke-width="2.5" marker-end="url(#m-dark)"/>
  <text x="480" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">press Enter</text>

  <!-- ============ AFTER ============ -->
  <g transform="translate(540 96)">
    <rect width="390" height="40" rx="14" fill="#7C3AED"/><rect y="20" width="390" height="20" fill="#7C3AED"/>
    <text x="18" y="26" font-size="16" font-weight="700" fill="#FFFFFF">After</text>
    <text x="372" y="26" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.9">you're on your branch</text>
    <rect x="16" y="52" width="358" height="28" rx="5" fill="#1E293B"/>
    <text x="26" y="71" font-size="12" font-family="Consolas, Menlo, monospace"><tspan fill="#4ADE80">you@pc</tspan> <tspan fill="#C084FC">~/sales-report</tspan> <tspan fill="#FDE68A" font-weight="700">(experiment/new-layout)</tspan></text>
    <text x="16" y="102" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">YOUR FOLDER</text>
    <use href="#folderview" xlink:href="#folderview" x="16" y="110"/>
    <rect x="122" y="114" width="62" height="16" rx="9" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="153" y="126" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">✓ same files</text>
    <text x="206" y="102" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">INSIDE .git (HIDDEN)</text>
    <rect x="206" y="110" width="168" height="118" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <line x1="226" y1="146" x2="334" y2="146" stroke="#0D9488" stroke-width="2"/>
    <use href="#env" xlink:href="#env" x="216" y="138"/>
    <use href="#env" xlink:href="#env" x="262" y="138"/>
    <use href="#env" xlink:href="#env" x="308" y="138"/>
    <text x="227" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Mon</text>
    <text x="273" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Tue</text>
    <text x="319" y="132" text-anchor="middle" font-size="9" fill="#6B7280">Wed</text>
    <line x1="319" y1="154" x2="319" y2="194" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M296 160 h46 l6 9 l-6 9 h-46z" fill="#2563EB"/>
    <text x="316" y="173" text-anchor="middle" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">main</text>
    <path d="M222 184 h140 l6 9 l-6 9 h-140z" fill="#7C3AED"/>
    <text x="290" y="197" text-anchor="middle" font-size="9.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">experiment/new-layout</text>
    <text x="290" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED">★ new label, you are here</text>
  </g>

  <!-- ============ then what ============ -->
  <g filter="url(#s)"><rect x="30" y="362" width="900" height="160" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <text x="54" y="390" font-size="15" font-weight="700" fill="#1F2937">Then what?</text>

  <!-- 1 commit -->
  <g transform="translate(54 400)">
    <line x1="10" y1="22" x2="140" y2="22" stroke="#0D9488" stroke-width="2"/>
    <use href="#env" xlink:href="#env" x="0" y="14"/>
    <use href="#env" xlink:href="#env" x="40" y="14"/>
    <use href="#env" xlink:href="#env" x="80" y="14"/>
    <use href="#envP" xlink:href="#envP" x="124" y="14"/>
    <path d="M78 36 h28 l4 6 l-4 6 h-28z" fill="#2563EB"/>
    <text x="92" y="45" text-anchor="middle" font-size="8.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">main</text>
    <path d="M118 36 h44 l4 6 l-4 6 h-44z" fill="#7C3AED"/>
    <text x="140" y="45" text-anchor="middle" font-size="8.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">experiment</text>
    <text x="0" y="74" font-size="12.5" font-weight="700" fill="#1F2937">Edit and commit</text>
    <text x="0" y="92" font-size="12" fill="#4B5563">Only your label moves on.</text>
    <text x="0" y="108" font-size="12" fill="#4B5563">Main stays put.</text>
  </g>

  <!-- 2 switch main -->
  <g transform="translate(346 400)">
    <rect x="0" y="12" width="116" height="22" rx="11" fill="#1E293B"/>
    <text x="58" y="27" text-anchor="middle" font-size="10" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#38BDF8">git switch main</text>
    <path d="M128 12 h12 l3 4 h14 v18 h-29z" fill="#FBBF24"/>
    <rect x="160" y="14" width="64" height="18" rx="9" fill="#DBEAFE"/>
    <text x="192" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">main's files</text>
    <text x="0" y="74" font-size="12.5" font-weight="700" fill="#1F2937">Back to main</text>
    <text x="0" y="92" font-size="12" fill="#4B5563">Your folder shows main's version.</text>
    <text x="0" y="108" font-size="12" fill="#4B5563">Your work waits safely on the branch.</text>
  </g>

  <!-- 3 switch back -->
  <g transform="translate(638 400)">
    <rect x="0" y="12" width="200" height="22" rx="11" fill="#1E293B"/>
    <text x="100" y="27" text-anchor="middle" font-size="10" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FDE68A">git switch experiment/new-layout</text>
    <path d="M210 12 h12 l3 4 h14 v18 h-29z" fill="#FBBF24"/>
    <text x="0" y="74" font-size="12.5" font-weight="700" fill="#1F2937">Back to your branch</text>
    <text x="0" y="92" font-size="12" fill="#4B5563">Your version reappears, exactly</text>
    <text x="0" y="108" font-size="12" fill="#4B5563">as you left it.</text>
  </g>

  <!-- facts -->
  <g font-size="12" font-weight="700">
    <rect x="30" y="538" width="168" height="30" rx="15" fill="#DCFCE7"/>
    <text x="114" y="558" text-anchor="middle" fill="#15803D">✓ No new files</text>
    <rect x="212" y="538" width="536" height="30" rx="15" fill="#EDE9FE"/>
    <text x="480" y="558" text-anchor="middle" fill="#6D28D9">✓ No "experiment" folder: the slash is just part of the label's name</text>
    <rect x="762" y="538" width="168" height="30" rx="15" fill="#DBEAFE"/>
    <text x="846" y="558" text-anchor="middle" fill="#1D4ED8">✓ Costs nothing</text>
  </g>
</svg>
