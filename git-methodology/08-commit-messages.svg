<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Writing a good commit message</title>
  <desc id="d">Two history lists side by side. Vague messages such as "update" and "stuff" tell you nothing. Clear messages with a type and a short description tell the story of the project. Below, the anatomy of a good message.</desc>
  <defs>
    <g id="no"><circle r="10" fill="#FEE2E2"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="yes"><circle r="10" fill="#DCFCE7"/><path d="M-4.5 0 L-1.5 3.5 L4.5 -3.5" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="520" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">Writing a good commit message</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Write for the colleague who reads the history six months from now</text>

  <!-- bad -->
  <rect x="30" y="96" width="435" height="230" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <path d="M44 96 h407 a14 14 0 0 1 14 14 v21 h-435 v-21 a14 14 0 0 1 14 -14z" fill="#DC2626"/>
  <text x="247" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Hard to understand</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#374151">
    <use href="#no" x="62" y="163"/><text x="84" y="168">update</text>
    <use href="#no" x="62" y="198"/><text x="84" y="203">changes</text>
    <use href="#no" x="62" y="233"/><text x="84" y="238">fix</text>
    <use href="#no" x="62" y="268"/><text x="84" y="273">stuff from meeting + other things</text>
  </g>
  <text x="50" y="308" font-size="13" fill="#6B7280">What changed? Why? Which one broke the report?</text>

  <!-- good -->
  <rect x="495" y="96" width="435" height="230" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <path d="M509 96 h407 a14 14 0 0 1 14 14 v21 h-435 v-21 a14 14 0 0 1 14 -14z" fill="#16A34A"/>
  <text x="712" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Tells the story</text>
  <g font-family="Consolas, monospace" font-size="13.5" fill="#374151">
    <use href="#yes" x="527" y="163"/><text x="549" y="168"><tspan fill="#2563EB" font-weight="700">ADD</tspan> Q3 revenue table to report</text>
    <use href="#yes" x="527" y="198"/><text x="549" y="203"><tspan fill="#7C3AED" font-weight="700">UPDATE</tspan> summary after review</text>
    <use href="#yes" x="527" y="233"/><text x="549" y="238"><tspan fill="#DC2626" font-weight="700">FIX</tspan> wrong total in table 2</text>
    <use href="#yes" x="527" y="268"/><text x="549" y="273"><tspan fill="#6B7280" font-weight="700">REMOVE</tspan> outdated 2023 appendix</text>
  </g>
  <text x="515" y="308" font-size="13" fill="#6B7280">You can scan the history and find any change.</text>

  <!-- anatomy -->
  <rect x="30" y="350" width="900" height="146" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="50" y="380" font-size="15" font-weight="700" fill="#1F2937">Anatomy of a good message</text>
  <g font-family="Consolas, monospace" font-size="22">
    <rect x="50" y="398" width="104" height="40" rx="8" fill="#EFF6FF"/><text x="62" y="426" fill="#2563EB" font-weight="700">UPDATE</text>
    <rect x="162" y="398" width="420" height="40" rx="8" fill="#F0FDF4"/><text x="174" y="426" fill="#1F2937">summary after review with Anna</text>
  </g>
  <g font-size="12.5" fill="#4B5563">
    <path d="M70 444 v12" stroke="#2563EB" stroke-width="2"/><text x="50" y="474" font-weight="700" fill="#2563EB">type</text>
    <text x="50" y="490">ADD · UPDATE · FIX · REMOVE</text>
    <path d="M372 444 v12" stroke="#16A34A" stroke-width="2"/><text x="372" y="474" text-anchor="middle" font-weight="700" fill="#16A34A">what, in a few words</text>
    <text x="372" y="490" text-anchor="middle">present tense, under ~60 characters</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="620" y="410" font-weight="700">Rules of thumb</text>
    <text x="620" y="434">• One commit = one logical change</text>
    <text x="620" y="456">• Commit when a step is finished</text>
    <text x="620" y="478">• Claude can draft the message for you</text>
  </g>
</svg>
