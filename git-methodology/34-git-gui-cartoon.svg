<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">git gui: the daily loop with buttons</title>
  <desc id="d">A simplified git gui window with numbered steps. Top left, Unstaged Changes lists report.md and chapter-2.md: changed files not in the envelope yet. Bottom left, Staged Changes (Will Commit): the envelope. Top right, the changes of the selected file report.md: the line Revenue 1.2 M removed in red and Revenue 1.35 M added in green. Bottom right, the commit area with the buttons Rescan, Stage Changed, Sign Off, Commit and Push, a Commit Message box containing UPDATE Q3 figures, and an Amend Last Commit tick box. The daily loop: 1, save your file in Word, Notepad or another program; 2, click Rescan to look at the folder again; 3, click a file and check the red and green lines; 4, click Stage Changed to put the changes in the envelope; 5, type a note; 6, click Commit to seal and file it. You can skip Sign Off; Push is only needed after setting up a backup or shared repository; never amend after sharing. Open it by right-clicking your folder and choosing Open Git GUI here, or type git gui in Git Bash. Commits made in git gui show up in git log, and the other way round.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563EB"/></marker>
    <g id="doc">
      <path d="M0 0 h8 l4 4 v11 h-12z" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
      <path d="M8 0 v4 h4" fill="none" stroke="#64748B" stroke-width="1"/>
    </g>
  </defs>
  <rect width="960" height="612" rx="18" fill="#F8FAFC"/>

  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">git gui: the daily loop with buttons</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B7280">The same check, envelope and commit as the commands. Just click instead of type.</text>

  <!-- ============ window ============ -->
  <g filter="url(#s)"><rect x="30" y="96" width="660" height="424" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/></g>
  <path d="M40 96 h640 a10 10 0 0 1 10 10 v18 h-660 v-18 a10 10 0 0 1 10 -10z" fill="#E2E8F0"/>
  <text x="46" y="115" font-size="11.5" fill="#334155">Git Gui (sales-report): C:/repos/sales-report</text>
  <g fill="#64748B"><rect x="628" y="106" width="10" height="2"/><rect x="646" y="102" width="10" height="9" fill="none" stroke="#64748B" stroke-width="1.4"/><path d="M666 102 l9 9 M675 102 l-9 9" stroke="#64748B" stroke-width="1.4"/></g>
  <rect x="31" y="124" width="658" height="20" fill="#F8FAFC"/>
  <g font-size="11" fill="#334155">
    <text x="42" y="138">Repository</text><text x="112" y="138">Edit</text><text x="146" y="138">Branch</text>
    <text x="196" y="138">Commit</text><text x="248" y="138">Merge</text><text x="294" y="138">Remote</text>
    <text x="346" y="138">Tools</text><text x="386" y="138">Help</text>
  </g>
  <line x1="31" y1="144" x2="689" y2="144" stroke="#CBD5E1"/>

  <!-- unstaged -->
  <rect x="31" y="144" width="219" height="20" fill="#FEE2E2"/>
  <text x="40" y="158" font-size="11" font-weight="700" fill="#991B1B">Unstaged Changes</text>
  <rect x="34" y="168" width="213" height="20" rx="2" fill="#DBEAFE"/>
  <use href="#doc" x="44" y="171"/>
  <text x="62" y="182" font-size="11" fill="#1F2937">report.md</text>
  <use href="#doc" x="44" y="193"/>
  <text x="62" y="204" font-size="11" fill="#1F2937">chapter-2.md</text>
  <text x="44" y="236" font-size="10" font-style="italic" fill="#9CA3AF">changed, not in the</text>
  <text x="44" y="249" font-size="10" font-style="italic" fill="#9CA3AF">envelope yet</text>
  <!-- staged -->
  <rect x="31" y="330" width="219" height="20" fill="#DCFCE7"/>
  <text x="40" y="344" font-size="11" font-weight="700" fill="#166534">Staged Changes (Will Commit)</text>
  <path d="M110 398 L140 376 L170 398z" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="110" y="398" width="60" height="40" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <path d="M110 408 L140 426 L170 408" fill="none" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="140" y="460" text-anchor="middle" font-size="10" font-style="italic" fill="#9CA3AF">the envelope: empty until</text>
  <text x="140" y="473" text-anchor="middle" font-size="10" font-style="italic" fill="#9CA3AF">you stage</text>
  <line x1="250" y1="144" x2="250" y2="519" stroke="#CBD5E1"/>
  <line x1="31" y1="330" x2="250" y2="330" stroke="#CBD5E1"/>

  <!-- diff view -->
  <rect x="251" y="144" width="438" height="20" fill="#F1F5F9"/>
  <text x="260" y="158" font-size="11" fill="#334155"><tspan font-weight="700">Modified, not staged</tspan>     File: report.md</text>
  <g font-family="Consolas, Menlo, monospace" font-size="11">
    <text x="262" y="186" fill="#9CA3AF">@@ -3,4 +3,4 @@</text>
    <text x="262" y="206" fill="#374151"> # Q3 sales</text>
    <rect x="252" y="212" width="436" height="18" fill="#FEE2E2"/>
    <text x="262" y="225" fill="#B91C1C">-Revenue: 1.2 M</text>
    <rect x="252" y="232" width="436" height="18" fill="#DCFCE7"/>
    <text x="262" y="245" fill="#15803D">+Revenue: 1.35 M</text>
    <text x="262" y="266" fill="#374151"> Region: North</text>
    <text x="262" y="286" fill="#374151"> Source: finance team</text>
  </g>
  <line x1="251" y1="380" x2="689" y2="380" stroke="#CBD5E1"/>

  <!-- commit area -->
  <g font-size="11" text-anchor="middle">
    <rect x="260" y="390" width="84" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/><text x="302" y="405" fill="#1F2937">Rescan</text>
    <rect x="260" y="416" width="84" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/><text x="302" y="431" fill="#1F2937">Stage Changed</text>
    <rect x="260" y="442" width="84" height="22" rx="3" fill="#F8FAFC" stroke="#E5E7EB"/><text x="302" y="457" fill="#9CA3AF">Sign Off</text>
    <rect x="260" y="468" width="84" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/><text x="302" y="483" fill="#1F2937">Commit</text>
    <rect x="260" y="494" width="84" height="22" rx="3" fill="#F8FAFC" stroke="#E5E7EB"/><text x="302" y="509" fill="#9CA3AF">Push</text>
  </g>
  <text x="364" y="400" font-size="11" fill="#334155">Commit Message:</text>
  <rect x="566" y="390" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="582" y="400" font-size="11" fill="#334155">Amend Last Commit</text>
  <rect x="364" y="408" width="318" height="104" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="372" y="428" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#1F2937">UPDATE Q3 figures</text>
  <rect x="496" y="418" width="1.6" height="14" fill="#1F2937"/>

  <!-- numbered callouts on the window -->
  <path d="M200 178 C240 178 236 196 256 196" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#m-blue)"/>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="355" cy="401" r="9" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/><text x="355" y="405.5" font-size="10.5">2</text>
    <circle cx="190" cy="178" r="11" fill="#0D9488" stroke="#FFFFFF" stroke-width="2"/><text x="190" y="182.5">3</text>
    <circle cx="676" cy="241" r="11" fill="#0D9488" stroke="#FFFFFF" stroke-width="2"/><text x="676" y="245.5">3</text>
    <circle cx="355" cy="427" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><text x="355" y="431.5" font-size="10.5">4</text>
    <circle cx="674" cy="420" r="11" fill="#DB2777" stroke="#FFFFFF" stroke-width="2"/><text x="674" y="424.5">5</text>
    <circle cx="355" cy="479" r="9" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><text x="355" y="483.5" font-size="10.5">6</text>
  </g>

  <!-- ============ legend: daily loop ============ -->
  <g filter="url(#s)"><rect x="706" y="96" width="224" height="424" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <rect x="706" y="96" width="224" height="40" rx="14" fill="#1F2937"/><rect x="706" y="116" width="224" height="20" fill="#1F2937"/>
  <text x="724" y="122" font-size="15" font-weight="700" fill="#FFFFFF">Your daily loop</text>

  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="728" cy="160" r="11" fill="#2563EB"/><text x="728" y="164.5">1</text>
    <circle cx="728" cy="208" r="11" fill="#EA580C"/><text x="728" y="212.5">2</text>
    <circle cx="728" cy="256" r="11" fill="#0D9488"/><text x="728" y="260.5">3</text>
    <circle cx="728" cy="304" r="11" fill="#7C3AED"/><text x="728" y="308.5">4</text>
    <circle cx="728" cy="352" r="11" fill="#DB2777"/><text x="728" y="356.5">5</text>
    <circle cx="728" cy="400" r="11" fill="#16A34A"/><text x="728" y="404.5">6</text>
  </g>
  <g font-size="13" font-weight="700" fill="#1F2937">
    <text x="748" y="158">Save your file</text>
    <text x="748" y="206">Rescan</text>
    <text x="748" y="254">Click a file</text>
    <text x="748" y="302">Stage Changed</text>
    <text x="748" y="350">Type a note</text>
    <text x="748" y="398">Commit</text>
  </g>
  <g font-size="11.5" fill="#6B7280">
    <text x="748" y="175">in Word, Notepad, anywhere</text>
    <text x="748" y="223">look at the folder again</text>
    <text x="748" y="271">check the red and green</text>
    <text x="748" y="319">into the envelope</text>
    <text x="748" y="367">what changed, and why</text>
    <text x="748" y="415">seal it and file it</text>
  </g>
  <line x1="722" y1="436" x2="914" y2="436" stroke="#F1F5F9" stroke-width="2"/>
  <text x="722" y="456" font-size="11" font-weight="700" letter-spacing="1" fill="#9CA3AF">YOU CAN SKIP</text>
  <g font-size="11.5" fill="#4B5563">
    <text x="722" y="474"><tspan font-weight="700">Sign Off:</tspan> not needed</text>
    <text x="722" y="491"><tspan font-weight="700">Push:</tspan> only after step 9 or 10</text>
    <text x="722" y="508"><tspan font-weight="700">Amend:</tspan> never after sharing</text>
  </g>

  <!-- ============ bottom ============ -->
  <g filter="url(#s)"><rect x="30" y="536" width="900" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/></g>
  <text x="54" y="561" font-size="13" fill="#374151"><tspan font-weight="700" fill="#1F2937">Open it:</tspan> right-click your project folder → <tspan font-weight="700">Open Git GUI here</tspan>, or type <tspan font-family="Consolas, Menlo, monospace" font-weight="700">git gui</tspan> in Git Bash.</text>
  <text x="54" y="583" font-size="13" fill="#374151"><tspan font-weight="700" fill="#1F2937">Same history:</tspan> commits made in git gui show up in <tspan font-family="Consolas, Menlo, monospace" font-weight="700">git log</tspan>, and the other way round. Mix as you like.</text>
</svg>
