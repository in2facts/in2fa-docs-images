  <text x="976" y="429" font-size="14" fill="#141421">Laptop</text>
  <rect x="1086" y="410" width="120" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <text x="1196" y="429" font-size="14" fill="#141421" text-anchor="end">1.250</text>
  <rect x="966" y="438" width="120" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <text x="976" y="457" font-size="14" fill="#141421">Phone</text>
  <rect x="1086" y="438" width="120" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <text x="1196" y="457" font-size="14" fill="#141421" text-anchor="end">760</text>
  <rect x="966" y="466" width="120" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <text x="976" y="485" font-size="14" fill="#141421">Tablet</text>
  <rect x="1086" y="466" width="120" height="28" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <text x="1196" y="485" font-size="14" fill="#141421" text-anchor="end">590</text>
  <rect x="966" y="410" width="240" height="84" fill="none" stroke="#4A90C2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="966" y="554" font-size="15" fill="#70706F">FILTER(A2:D9, A2:A9="North") picks the rows,</text>
  <text x="966" y="576" font-size="15" fill="#70706F">CHOOSECOLS picks columns 2 and 4</text>
