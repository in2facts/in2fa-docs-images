<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>The same table with zeros and with zeros replaced by a hyphen: without the zeros the real values stand out</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="720" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">Zeros or hyphens<tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Same data, same layer 1: only the zero section of the format code differs</text>

