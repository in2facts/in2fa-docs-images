<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>A treeview drawn with format codes: the asterisk fill *─ stretches each branch to the edge of the cell</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="760" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">A treeview with <tspan font-family="Consolas, 'Courier New', monospace">*─</tspan><tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Action 2 fills each branch cell with ─ up to its edge, whatever the column width</text>

  <!-- ============ Card 1: the treeview ============ -->
  <g transform="translate(60,160)">
    <rect x="0" y="0" width="508" height="560" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="24" y="24" width="52" height="52" fill="#141421"/>
    <text x="50" y="59" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="92" y="54" font-size="26" font-weight="700" fill="#141421">The treeview</text>
    <text x="92" y="76" font-size="16" fill="#70706F">Narrow columns A and B hold the branches</text>
    <rect x="24" y="104" width="460" height="382" fill="#FFFFFF"/>
    <rect x="24" y="104" width="460" height="30" fill="#F6F6F6"/>
    <rect x="24" y="104" width="36" height="382" fill="#F6F6F6"/>
    <text x="84.0" y="124" font-size="14" font-weight="700" fill="#70706F" text-anchor="middle">A</text>
    <text x="140.0" y="124" font-size="14" font-weight="700" fill="#70706F" text-anchor="middle">B</text>
    <text x="272.0" y="124" font-size="14" font-weight="700" fill="#70706F" text-anchor="middle">C</text>
    <text x="428.0" y="124" font-size="14" font-weight="700" fill="#70706F" text-anchor="middle">D</text>
    <path d="M24 134 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 178 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 222 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 266 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 310 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 354 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 398 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 442 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M24 486 H484" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M60 104 V486" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M108 104 V486" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M172 104 V486" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M372 104 V486" stroke="#D7D8D8" stroke-width="1"/>
    <path d="M484 104 V486" stroke="#D7D8D8" stroke-width="1"/>
    <text x="42.0" y="162" font-size="13" fill="#70706F" text-anchor="middle">1</text>
    <text x="68" y="162" font-size="17" font-weight="700" fill="#141421">Sales</text>
    <text x="474" y="162" font-size="17" font-weight="700" fill="#141421" text-anchor="end">9.800</text>
    <text x="42.0" y="206" font-size="13" fill="#70706F" text-anchor="middle">2</text>
    <path d="M70 178 V222" stroke="#141421" stroke-width="2.5"/><path d="M70 200.0 H78" stroke="#141421" stroke-width="2.5"/><path d="M78 200.0 H108" stroke="#F39454" stroke-width="2.5"/>
    <text x="116" y="206" font-size="17" font-weight="700" fill="#141421">Europe</text>
    <text x="474" y="206" font-size="17" font-weight="700" fill="#141421" text-anchor="end">5.400</text>
    <text x="42.0" y="250" font-size="13" fill="#70706F" text-anchor="middle">3</text>
    <path d="M70 222 V266" stroke="#141421" stroke-width="2.5"/>
    <path d="M118 222 V266" stroke="#141421" stroke-width="2.5"/><path d="M118 244.0 H126" stroke="#141421" stroke-width="2.5"/><path d="M126 244.0 H172" stroke="#F39454" stroke-width="2.5"/>
    <text x="180" y="250" font-size="17" font-weight="400" fill="#141421">Belgium</text>
    <text x="474" y="250" font-size="17" font-weight="400" fill="#141421" text-anchor="end">1.200</text>
    <text x="42.0" y="294" font-size="13" fill="#70706F" text-anchor="middle">4</text>
    <path d="M70 266 V310" stroke="#141421" stroke-width="2.5"/>
    <path d="M118 266 V310" stroke="#141421" stroke-width="2.5"/><path d="M118 288.0 H126" stroke="#141421" stroke-width="2.5"/><path d="M126 288.0 H172" stroke="#F39454" stroke-width="2.5"/>
    <text x="180" y="294" font-size="17" font-weight="400" fill="#141421">France</text>
    <text x="474" y="294" font-size="17" font-weight="400" fill="#141421" text-anchor="end">2.100</text>
    <text x="42.0" y="338" font-size="13" fill="#70706F" text-anchor="middle">5</text>
    <path d="M70 310 V354" stroke="#141421" stroke-width="2.5"/>
    <path d="M118 310 V332.0" stroke="#141421" stroke-width="2.5"/><path d="M118 332.0 H126" stroke="#141421" stroke-width="2.5"/><path d="M126 332.0 H172" stroke="#F39454" stroke-width="2.5"/>
    <text x="180" y="338" font-size="17" font-weight="400" fill="#141421">Germany</text>
    <text x="474" y="338" font-size="17" font-weight="400" fill="#141421" text-anchor="end">2.100</text>
    <text x="42.0" y="382" font-size="13" fill="#70706F" text-anchor="middle">6</text>
    <path d="M70 354 V376.0" stroke="#141421" stroke-width="2.5"/><path d="M70 376.0 H78" stroke="#141421" stroke-width="2.5"/><path d="M78 376.0 H108" stroke="#F39454" stroke-width="2.5"/>
    <text x="116" y="382" font-size="17" font-weight="700" fill="#141421">America</text>
    <text x="474" y="382" font-size="17" font-weight="700" fill="#141421" text-anchor="end">4.400</text>
    <text x="42.0" y="426" font-size="13" fill="#70706F" text-anchor="middle">7</text>
    <path d="M118 398 V442" stroke="#141421" stroke-width="2.5"/><path d="M118 420.0 H126" stroke="#141421" stroke-width="2.5"/><path d="M126 420.0 H172" stroke="#F39454" stroke-width="2.5"/>
    <text x="180" y="426" font-size="17" font-weight="400" fill="#141421">USA</text>
    <text x="474" y="426" font-size="17" font-weight="400" fill="#141421" text-anchor="end">3.600</text>
    <text x="42.0" y="470" font-size="13" fill="#70706F" text-anchor="middle">8</text>
    <path d="M118 442 V464.0" stroke="#141421" stroke-width="2.5"/><path d="M118 464.0 H126" stroke="#141421" stroke-width="2.5"/><path d="M126 464.0 H172" stroke="#F39454" stroke-width="2.5"/>
    <text x="180" y="470" font-size="17" font-weight="400" fill="#141421">Canada</text>
    <text x="474" y="470" font-size="17" font-weight="400" fill="#141421" text-anchor="end">800</text>
    <rect x="24" y="104" width="460" height="382" fill="none" stroke="#D7D8D8" stroke-width="2"/>
    <text x="24" y="520" font-size="15" fill="#70706F"><tspan fill="#F39454" font-weight="700">orange</tspan> = filled by the asterisk <tspan font-family="Consolas, 'Courier New', monospace">*─</tspan></text>
  </g>

  <!-- ============ Card 2: the format codes ============ -->
  <g transform="translate(608,160)">
    <rect x="0" y="0" width="732" height="560" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="24" y="24" width="52" height="52" fill="#F39454"/>
    <text x="50" y="59" font-size="28" font-weight="700" fill="#141421" text-anchor="middle">2</text>
    <text x="92" y="54" font-size="26" font-weight="700" fill="#141421">The format codes</text>
    <text x="92" y="76" font-size="16" fill="#70706F">Type any text in the cell, the format draws the branch</text>
    <rect x="24" y="120" width="96" height="44" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <path d="M34 120 V164" stroke="#141421" stroke-width="2.5"/><path d="M34 142.0 H42" stroke="#141421" stroke-width="2.5"/><path d="M42 142.0 H120" stroke="#F39454" stroke-width="2.5"/>
    <text x="144" y="140" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#141421">;;;"├"<tspan fill="#F39454" font-weight="700">*─</tspan></text>
    <text x="144" y="164" font-size="16" fill="#70706F">Branch: more items follow below</text>
    <text x="144" y="188" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#141421" xml:space="preserve">├ =UNICHAR(9500) · hex 251C   ─ =UNICHAR(9472) · hex 2500</text>
    <rect x="24" y="212" width="96" height="44" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <path d="M34 212 V234.0" stroke="#141421" stroke-width="2.5"/><path d="M34 234.0 H42" stroke="#141421" stroke-width="2.5"/><path d="M42 234.0 H120" stroke="#F39454" stroke-width="2.5"/>
    <text x="144" y="232" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#141421">;;;"└"<tspan fill="#F39454" font-weight="700">*─</tspan></text>
    <text x="144" y="256" font-size="16" fill="#70706F">Last branch: closes the level</text>
    <text x="144" y="280" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#141421" xml:space="preserve">└ =UNICHAR(9492) · hex 2514   ─ =UNICHAR(9472) · hex 2500</text>
    <rect x="24" y="304" width="96" height="44" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <path d="M34 304 V348" stroke="#141421" stroke-width="2.5"/>
    <text x="144" y="324" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#141421">;;;"│"</text>
    <text x="144" y="348" font-size="16" fill="#70706F">Trunk: continues the level above</text>
    <text x="144" y="372" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#141421" xml:space="preserve">│ =UNICHAR(9474) · hex 2502</text>

    <rect x="24" y="404" width="684" height="132" rx="8" fill="#F6F6F6"/>
    <rect x="24" y="404" width="8" height="132" fill="#F39454"/>
    <text x="48" y="434" font-size="18" font-weight="700" fill="#141421">Why the asterisk?</text>
    <text x="48" y="462" font-size="16" fill="#141421"><tspan font-family="Consolas, 'Courier New', monospace">*─</tspan> repeats the ─ until the edge of the cell,</text>
    <text x="48" y="486" font-size="16" fill="#141421">so the branch always reaches the next level,</text>
    <text x="48" y="510" font-size="16" fill="#141421">even when the column width changes.</text>
  </g>
</svg>
