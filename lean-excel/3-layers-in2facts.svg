<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" width="1400" height="730" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>The three layers of Excel: raw data, formatted data and floating objects</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="730" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">Three layers in Excel<tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Like transparent sheets stacked on top of each other</text>

  <!-- ============ Layer stack (bottom first) ============ -->
  <!-- Layer 1 - raw data -->
  <path d="M160 430 H800 L700 580 H60 Z" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
  <text x="100" y="560" font-size="16" font-weight="700" fill="#70706F" letter-spacing="1">LAYER 1 · RAW DATA</text>
  <text x="560" y="528" font-size="40" font-weight="700" fill="#141421" text-anchor="middle">12345.678</text>

  <!-- Layer 2 - formatted data -->
  <path d="M160 300 H800 L700 450 H60 Z" fill="#C9DCE7" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="430" font-size="16" font-weight="700" fill="#141421" letter-spacing="1">LAYER 2 · FORMATTED DATA</text>
  <text x="560" y="398" font-size="40" font-weight="700" fill="#141421" text-anchor="middle">12.3 KEUR</text>

  <!-- Layer 3 - objects -->
  <path d="M160 170 H800 L700 320 H60 Z" fill="#F39454" fill-opacity="0.35" stroke="#F39454" stroke-width="2"/>
  <text x="100" y="300" font-size="16" font-weight="700" fill="#141421" letter-spacing="1">LAYER 3 · OBJECTS</text>
  <!-- Chart -->
  <rect x="320" y="192" width="90" height="70" fill="#FFFFFF" stroke="#141421" stroke-width="2"/>
  <rect x="334" y="226" width="12" height="26" fill="#141421"/>
  <rect x="352" y="212" width="12" height="40" fill="#F39454"/>
  <rect x="370" y="232" width="12" height="20" fill="#70706F"/>
  <rect x="388" y="220" width="12" height="32" fill="#C9DCE7"/>
  <path d="M328 252 H404" stroke="#D7D8D8" stroke-width="2"/>
  <!-- Shape -->
  <path d="M432 206 H484 L504 227 L484 248 H432 Z" fill="#141421"/>
  <!-- Image -->
  <rect x="526" y="196" width="78" height="62" fill="#FFFFFF" stroke="#141421" stroke-width="2"/>
  <circle cx="546" cy="214" r="7" fill="#F39454"/>
  <path d="M532 252 L556 228 L570 242 L582 232 L598 252 Z" fill="#70706F"/>
  <!-- Form control -->
  <rect x="626" y="210" width="88" height="34" rx="4" fill="#FFFFFF" stroke="#141421" stroke-width="2"/>
  <rect x="636" y="218" width="18" height="18" fill="#141421"/>
  <path d="M640 227 L644 231 L651 222" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="662" y="233" font-size="14" fill="#141421">Option</text>

  <!-- ============ Connectors ============ -->
  <g stroke="#141421" stroke-width="3" fill="none">
    <path d="M760 245 H886"/>
    <path d="M753 385 H886"/>
    <path d="M753 515 H886"/>
  </g>
  <g fill="#141421">
    <circle cx="760" cy="245" r="5"/><circle cx="753" cy="385" r="5"/><circle cx="753" cy="515" r="5"/>
    <path d="M898 245 L886 237 V253 Z"/>
    <path d="M898 385 L886 377 V393 Z"/>
    <path d="M898 515 L886 507 V523 Z"/>
  </g>

  <!-- ============ Card: Layer 3 ============ -->
  <g transform="translate(900,190)">
    <rect x="0" y="0" width="440" height="110" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="20" y="20" width="44" height="44" fill="#F39454"/>
    <text x="42" y="51" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">3</text>
    <text x="84" y="42" font-size="22" font-weight="700" fill="#141421">Floats above the grid</text>
    <text x="84" y="68" font-size="16" fill="#70706F">Charts, form controls,</text>
    <text x="84" y="90" font-size="16" fill="#70706F">images, shapes, …</text>
  </g>

  <!-- ============ Card: Layer 2 ============ -->
  <g transform="translate(900,330)">
    <rect x="0" y="0" width="440" height="110" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="20" y="20" width="44" height="44" fill="#C9DCE7"/>
    <text x="42" y="51" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">2</text>
    <text x="84" y="42" font-size="22" font-weight="700" fill="#141421">The Excel grid</text>
    <text x="84" y="68" font-size="16" fill="#70706F">What the user sees</text>
    <text x="84" y="90" font-size="16" fill="#70706F">Format Cells = an illusion</text>
    <!-- Mock: cell -->
    <rect x="290" y="35" width="130" height="40" fill="#FFFFFF" stroke="#141421" stroke-width="2"/>
    <text x="410" y="61" font-size="18" fill="#141421" text-anchor="end">12.3 KEUR</text>
  </g>

  <!-- ============ Card: Layer 1 ============ -->
  <g transform="translate(900,460)">
    <rect x="0" y="0" width="440" height="110" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="20" y="20" width="44" height="44" fill="#141421"/>
    <text x="42" y="51" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="84" y="42" font-size="22" font-weight="700" fill="#141421">Formula bar</text>
    <text x="84" y="68" font-size="16" fill="#70706F">Raw, unformatted value</text>
    <text x="84" y="90" font-size="16" fill="#70706F">Formulas always use this</text>
    <!-- Mock: formula bar -->
    <rect x="270" y="35" width="150" height="40" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="271" y="36" width="34" height="38" fill="#F6F6F6"/>
    <path d="M305 35 V75" stroke="#D7D8D8" stroke-width="2"/>
    <text x="288" y="61" font-size="17" font-style="italic" fill="#70706F" text-anchor="middle">fx</text>
    <text x="314" y="61" font-size="17" fill="#141421">12345.678</text>
  </g>

  <!-- ============ Tip ============ -->
  <rect x="60" y="620" width="1280" height="70" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
  <rect x="60" y="620" width="8" height="70" fill="#F39454"/>
  <g fill="none" stroke="#141421" stroke-width="3">
    <path d="M104 670 V664 C94 658 92 646 98 638 C104 630 120 630 126 638 C132 646 130 658 120 664 V670 Z"/>
    <path d="M106 678 H118"/>
  </g>
  <text x="152" y="662" font-size="19" fill="#141421"><tspan font-weight="700">Tip</tspan> · To glue objects on layer 3 pixel-perfect to the grid, hold</text>
  <rect x="654" y="639" width="52" height="32" rx="4" fill="#141421"/>
  <text x="680" y="661" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALT</text>
  <text x="718" y="662" font-size="19" fill="#141421">while <tspan fill="#F39454" font-weight="700">resizing</tspan> or <tspan fill="#F39454" font-weight="700">moving</tspan> them</text>
</svg>
