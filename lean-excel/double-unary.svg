<text x="30" y="38" font-size="22" font-weight="700" fill="#1F2937">Double unary <tspan font-family="Consolas, 'Courier New', monospace" fill="#0F4C81">--( )</tspan>: from TRUE/FALSE to 1/0</text>
<text x="30" y="64" font-size="14" fill="#6B7280" font-family="Consolas, 'Courier New', monospace">= SUMPRODUCT( --(T_Sales[BU] = "BU1"); T_Sales[Sales] )</text>
