<text x="894.0" y="516" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF" font-family="Consolas, 'Courier New', monospace">2.160</text>
<text x="30" y="486" font-size="13.5" font-weight="700" fill="#1F2937">Why two minus signs?</text>
<text x="30" y="510" font-size="13" fill="#1F2937">The first <tspan font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#C2410C">-</tspan> forces Excel to treat the Boolean as a number (<tspan font-family="Consolas, 'Courier New', monospace" fill="#1D4ED8">TRUE</tspan> → <tspan font-family="Consolas, 'Courier New', monospace" fill="#C2410C">-1</tspan>, <tspan font-family="Consolas, 'Courier New', monospace" fill="#9CA3AF">FALSE</tspan> → <tspan font-family="Consolas, 'Courier New', monospace">0</tspan>).</text>
<text x="30" y="532" font-size="13" fill="#1F2937">The second <tspan font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">-</tspan> flips the sign back, leaving a clean <tspan font-weight="700" fill="#15803D">1/0</tspan> column.</text>
<text x="30" y="554" font-size="12" fill="#6B7280">Same result: <tspan font-family="Consolas, 'Courier New', monospace">(cond)*1</tspan> · <tspan font-family="Consolas, 'Courier New', monospace">(cond)+0</tspan> · <tspan font-family="Consolas, 'Courier New', monospace">N(cond)</tspan> (single value only)</text>
</svg>