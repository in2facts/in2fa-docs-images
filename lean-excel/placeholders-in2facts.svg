    <text x="24" y="356" font-size="24" fill="#70706F">25</text>
    <text x="190" y="356" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">000</text>
    <rect x="287" y="330" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="334.5" y="356" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#F39454" text-anchor="middle">0</text><text x="349.5" y="356" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">2</text><text x="364.5" y="356" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">5</text>
