<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>The placeholders #, 0 and ? on the same values: # hides insignificant zeroes, 0 shows them, ? replaces them by a space</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="780" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">Placeholders #, 0 and ?<tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Same values, three placeholders: the difference is what happens with insignificant zeroes</text>

  <g transform="translate(60,160)">
    <rect x="0" y="0" width="406" height="572" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="24" y="24" width="52" height="52" fill="#141421"/>
    <text x="50" y="62" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">#</text>
    <text x="92" y="54" font-size="26" font-weight="700" fill="#141421">Hash</text>
    <text x="92" y="76" font-size="16" fill="#70706F">Digit if significant</text>
    <rect x="24" y="100" width="358" height="52" rx="8" fill="#F6F6F6"/>
    <text x="40" y="133" font-size="18" fill="#141421">Insignificant zeroes are <tspan font-weight="700" fill="#141421">hidden</tspan></text>
    <text x="24" y="196" font-size="14" font-weight="700" fill="#70706F" letter-spacing="1">LAYER 1</text>
    <text x="190" y="196" font-size="14" font-weight="700" fill="#70706F" letter-spacing="1" text-anchor="middle">CODE</text>
    <text x="382" y="196" font-size="14" font-weight="700" fill="#70706F" letter-spacing="1" text-anchor="end">LAYER 2</text>
    <path d="M24 208 H382" stroke="#D7D8D8" stroke-width="2"/>
    <text x="24" y="252" font-size="24" fill="#70706F">0</text>
    <text x="190" y="252" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">###</text>
    <rect x="287" y="226" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="334.5" y="250" font-size="13" fill="#A9AAAA" text-anchor="middle">empty</text>
    <text x="24" y="304" font-size="24" fill="#70706F">7</text>
    <text x="190" y="304" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">###</text>
    <rect x="287" y="278" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="364.5" y="304" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">7</text>
    <text x="24" y="356" font-size="24" fill="#70706F">25</text>
    <text x="190" y="356" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">###</text>
    <rect x="287" y="330" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="349.5" y="356" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">2</text><text x="364.5" y="356" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">5</text>
    <text x="24" y="408" font-size="24" fill="#70706F">3,1</text>
    <text x="190" y="408" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">0,##</text>
    <rect x="287" y="382" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="334.5" y="408" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">3</text><text x="349.5" y="408" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">,</text><text x="364.5" y="408" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">1</text>
    <text x="24" y="460" font-size="24" fill="#70706F">12,25</text>
    <text x="190" y="460" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#141421" text-anchor="middle">0,##</text>
    <rect x="287" y="434" width="95" height="36" rx="4" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="304.5" y="460" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">1</text><text x="319.5" y="460" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">2</text><text x="334.5" y="460" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">,</text><text x="349.5" y="460" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">2</text><text x="364.5" y="460" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#141421" text-anchor="middle">5</text>
    <path d="M334.5 376 V474" stroke="#F39454" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="24" y="488" width="358" height="60" rx="8" fill="#F6F6F6"/>
    <rect x="24" y="488" width="8" height="60" fill="#141421"/>
    <text x="48" y="512" font-size="17" font-weight="700" fill="#141421">Use for</text>
    <text x="48" y="536" font-size="16" fill="#141421">Suppress zeroes, e.g. 1.234 instead of 1.234,00</text>
    </g>

  <g transform="translate(497,160)">
    <rect x="0" y="0" width="406" height="572" rx="12" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/>
    <rect x="24" y="24" width="52" height="52" fill="#F39454"/>
