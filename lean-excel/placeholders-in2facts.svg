    <path d="M334.5 376 V474" stroke="#F39454" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="24" y="488" width="358" height="60" rx="8" fill="#F6F6F6"/>
    <rect x="24" y="488" width="8" height="60" fill="#F39454"/>
    <text x="48" y="512" font-size="17" font-weight="700" fill="#141421">Use for</text>
    <text x="48" y="536" font-size="16" fill="#141421">A fixed number of digits: ids, codes</text>
    </g>

