    <text x="92" y="54" font-size="26" font-weight="700" fill="#141421">Zero</text>
    <text x="92" y="76" font-size="16" fill="#70706F">Digit always</text>
    <rect x="24" y="100" width="358" height="52" rx="8" fill="#F6F6F6"/>
