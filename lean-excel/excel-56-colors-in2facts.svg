    <text x="24" y="356" font-size="20" fill="#70706F">1234</text>
    <text x="112" y="356" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#141421"><tspan fill="#F39454" font-weight="700">[Blue]</tspan>#.##0</text>
