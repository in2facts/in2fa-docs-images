<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>Beyond [Red]: a number format code can use the 8 named colors or any of the 56 palette colors via [ColorN]</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="760" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">Beyond [Red]<tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Besides 8 named colors, a format code can use any of the 56 colors of the Excel palette</text>

