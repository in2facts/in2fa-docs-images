    <text x="112" y="218" font-size="14" font-weight="700" fill="#70706F" letter-spacing="1">FORMAT CODE</text>
    <text x="584" y="218" font-size="14" font-weight="700" fill="#70706F" letter-spacing="1" text-anchor="end">LAYER 2</text>
