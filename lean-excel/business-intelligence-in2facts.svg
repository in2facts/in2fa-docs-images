<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <title>Business Intelligence: facts aggregated per business and time-period dimension</title>
  <!-- in2Facts palette: Mirage #141421, Sandstone #70706F, Iron #D7D8D8, Smoke #F6F6F6, Nebula #C9DCE7, Mango #F39454 -->
  <rect width="1400" height="600" fill="#F6F6F6"/>

  <!-- Title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#141421">Business Intelligence<tspan fill="#F39454">_</tspan></text>
  <text x="60" y="118" font-size="20" fill="#70706F">Facts are aggregated per business and per time-period dimension</text>

  <!-- ============ Star: dimensions around the facts ============ -->
  <!-- Time dimension -->
  <rect x="560" y="160" width="320" height="110" rx="12" fill="#C9DCE7"/>
  <text x="720" y="214" font-size="32" font-weight="700" fill="#141421" text-anchor="middle">Dim</text>
  <text x="720" y="245" font-size="14" font-weight="700" fill="#70706F" letter-spacing="2" text-anchor="middle">TIME PERIOD</text>

  <!-- Business dimension -->
  <rect x="220" y="290" width="320" height="130" rx="12" fill="#F39454" fill-opacity="0.35" stroke="#F39454" stroke-width="2"/>
  <text x="380" y="354" font-size="32" font-weight="700" fill="#141421" text-anchor="middle">Dim</text>
  <text x="380" y="385" font-size="14" font-weight="700" fill="#141421" letter-spacing="2" text-anchor="middle">BUSINESS</text>

  <!-- Facts -->
  <rect x="560" y="290" width="320" height="130" rx="12" fill="#141421"/>
  <text x="720" y="354" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Facts</text>
  <text x="720" y="385" font-size="16" fill="#D7D8D8" text-anchor="middle">numbers to aggregate</text>

  <!-- Time label + calendar icon -->
  <g transform="translate(910,166)">
    <rect x="0" y="0" width="46" height="46" rx="4" fill="#FFFFFF" stroke="#141421" stroke-width="2.5"/>
    <rect x="1.25" y="1.25" width="43.5" height="12" fill="#F39454"/>
    <path d="M12 -5 V7 M34 -5 V7" stroke="#141421" stroke-width="3" stroke-linecap="round"/>
    <g fill="#141421">
      <rect x="8" y="20" width="7" height="6"/><rect x="20" y="20" width="7" height="6"/><rect x="32" y="20" width="7" height="6"/>
      <rect x="8" y="32" width="7" height="6"/><rect x="20" y="32" width="7" height="6"/><rect x="32" y="32" width="7" height="6" fill="#F39454"/>
    </g>
  </g>
  <text x="976" y="192" font-size="24" font-weight="700" fill="#141421">Time-period related</text>
  <text x="976" y="220" font-size="18" fill="#70706F">per Month, Quarter, Year</text>

  <!-- Business label + people icon -->
  <g transform="translate(220,446)" fill="#141421">
    <circle cx="10" cy="8" r="7"/><path d="M0 40 V26 a10 10 0 0 1 20 0 V40 Z"/>
    <circle cx="33" cy="8" r="7" fill="#F39454"/><path d="M23 40 V26 a10 10 0 0 1 20 0 V40 Z" fill="#F39454"/>
    <circle cx="56" cy="8" r="7"/><path d="M46 40 V26 a10 10 0 0 1 20 0 V40 Z"/>
  </g>
  <text x="300" y="466" font-size="24" font-weight="700" fill="#141421">Business related</text>
  <text x="300" y="494" font-size="18" fill="#70706F">per LE, BU, Product, Customer</text>

  <!-- Aggregation -->
  <path d="M720 424 V458" stroke="#141421" stroke-width="3"/>
  <circle cx="720" cy="424" r="5" fill="#141421"/>
  <path d="M720 470 L712 456 H728 Z" fill="#141421"/>
  <text x="720" y="548" font-size="84" font-weight="700" fill="#141421" text-anchor="middle">Σ</text>
  <g font-size="16" font-weight="700" fill="#141421" text-anchor="middle">
    <rect x="790" y="484" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="825" y="507">SUM</text>
    <rect x="870" y="484" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="925" y="507">AVERAGE</text>
    <rect x="990" y="484" width="90" height="34" rx="6" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="1035" y="507">COUNT</text>
    <rect x="1090" y="484" width="66" height="34" rx="6" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="2"/><text x="1123" y="507">MAX</text>
  </g>
  <text x="790" y="548" font-size="16" fill="#70706F">aggregate the facts per dimension</text>
</svg>
