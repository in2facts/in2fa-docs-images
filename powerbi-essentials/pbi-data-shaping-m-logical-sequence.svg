<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 954" width="1200" height="954" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="954" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Power Query · M language</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="318" lengthAdjust="spacing">Logical sequence</text>
  <rect x="386" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">M starts at the bottom, at the expression after "in", and works its way up through the steps it needs.</text>

  <!-- ==================== Evaluation, bottom-up ==================== -->
  <text x="60" y="190" font-size="13" font-weight="700" fill="#70706F">Query: Sales</text>
  <rect x="60" y="200" width="660" height="276" fill="#141421"/>
  <rect x="60" y="200" width="40" height="276" fill="#1E1E2E"/>
  <text x="88" y="235.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">1</text>
  <text x="114" y="235.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C9DCE7" xml:space="preserve">let</text>
  <text x="88" y="271.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">2</text>
  <text x="114" y="271.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    Source         = Excel.Workbook(File.Contents("Sales.xlsx")),</text>
  <text x="88" y="307.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">3</text>
  <text x="114" y="307.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    Navigation     = Source{[Item="Sales"]}[Data],</text>
  <text x="88" y="343.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">4</text>
  <text x="114" y="343.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    PromoteHeaders = Table.PromoteHeaders(Navigation),</text>
  <text x="88" y="379.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">5</text>
  <text x="114" y="379.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    SelectColumns  = Table.SelectColumns(PromoteHeaders, {"Date", "Amount"})</text>
  <text x="88" y="415.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">6</text>
  <text x="114" y="415.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C9DCE7" xml:space="preserve">in</text>
  <text x="88" y="451.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">7</text>
  <text x="114" y="451.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    SelectColumns</text>
  <rect x="141.8" y="255.0" width="52.2" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="141.8" y="291.0" width="83.0" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="141.8" y="327.0" width="113.8" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="141.8" y="363.0" width="106.1" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="272.7" y="291.0" width="52.2" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="434.4" y="327.0" width="83.0" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="426.7" y="363.0" width="113.8" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <rect x="141.8" y="435.0" width="106.1" height="22" rx="4" fill="none" stroke="#F39454" stroke-width="2"/>
  <path d="M194.9 434.0 C194.9 421.0 194.9 399.0 194.9 388.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M483.6 362.0 C483.6 349.0 198.7 363.0 198.7 352.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M475.9 326.0 C475.9 313.0 183.3 327.0 183.3 316.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <path d="M298.8 290.0 C298.8 277.0 167.9 291.0 167.9 280.0" fill="none" stroke="#F39454" stroke-width="2" marker-end="url(#head-mango)"/>
  <circle cx="126.80000000000001" cy="446.0" r="12" fill="#F39454"/><text x="126.80000000000001" y="451.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="126.80000000000001" cy="374.0" r="12" fill="#F39454"/><text x="126.80000000000001" y="379.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <circle cx="126.80000000000001" cy="338.0" r="12" fill="#F39454"/><text x="126.80000000000001" y="343.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <circle cx="126.80000000000001" cy="302.0" r="12" fill="#F39454"/><text x="126.80000000000001" y="307.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <circle cx="126.80000000000001" cy="266.0" r="12" fill="#F39454"/><text x="126.80000000000001" y="271.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">5</text>

  <!-- Applied steps -->
  <rect x="760" y="200" width="380" height="40" fill="#141421"/>
  <text x="776" y="226" font-size="14" font-weight="700" fill="#F6F6F6" letter-spacing="1">APPLIED STEPS</text>
  <rect x="760" y="240" width="380" height="152" fill="#FFFFFF"/>
  <text x="784" y="265" font-size="16" fill="#141421">Source</text>
  <text x="784" y="303" font-size="16" fill="#141421">Navigation</text>
  <text x="784" y="341" font-size="16" fill="#141421">PromoteHeaders</text>
  <rect x="760" y="354" width="380" height="38" fill="#C9DCE7"/><rect x="760" y="354" width="5" height="38" fill="#F39454"/>
  <text x="784" y="379" font-size="16" font-weight="700" fill="#141421">SelectColumns</text>
  <text x="760" y="418" font-size="13" fill="#70706F">The selected last step is the result of the query.</text>
  <text x="760" y="438" font-size="13" fill="#70706F">Each step name is a variable in the <tspan font-family="Consolas, 'Courier New', monospace">let</tspan> expression.</text>

  <!-- Evaluation order -->
  <text x="60" y="504" font-size="13" font-weight="700" fill="#70706F">Evaluation order</text>
  <circle cx="72" cy="534" r="12" fill="#F39454"/><text x="72" y="539" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="90" y="539" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#141421">in SelectColumns</text>
  <text x="90" y="560" font-size="13" fill="#141421">the query returns</text>
  <text x="90" y="577" font-size="13" fill="#141421">SelectColumns</text>
  <circle cx="290" cy="534" r="12" fill="#F39454"/><text x="290" y="539" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="308" y="539" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#141421">SelectColumns</text>
  <text x="308" y="560" font-size="13" fill="#141421">needs</text>
  <text x="308" y="577" font-size="13" fill="#141421">PromoteHeaders</text>
  <circle cx="508" cy="534" r="12" fill="#F39454"/><text x="508" y="539" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="526" y="539" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#141421">PromoteHeaders</text>
  <text x="526" y="560" font-size="13" fill="#141421">needs</text>
  <text x="526" y="577" font-size="13" fill="#141421">Navigation</text>
  <circle cx="726" cy="534" r="12" fill="#F39454"/><text x="726" y="539" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="744" y="539" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#141421">Navigation</text>
  <text x="744" y="560" font-size="13" fill="#141421">needs</text>
  <text x="744" y="577" font-size="13" fill="#141421">Source</text>
  <circle cx="944" cy="534" r="12" fill="#F39454"/><text x="944" y="539" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">5</text>
  <text x="962" y="539" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#141421">Source</text>
  <text x="962" y="560" font-size="13" fill="#141421">reads Sales.xlsx,</text>
  <text x="962" y="577" font-size="13" fill="#141421">then back down</text>

  <!-- ==================== Same steps, other order ==================== -->
  <text x="60" y="620" font-size="13" font-weight="700" fill="#70706F">Same steps, different order</text>
  <rect x="60" y="630" width="660" height="234" fill="#141421"/>
  <rect x="60" y="630" width="40" height="234" fill="#1E1E2E"/>
  <text x="88" y="662.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">1</text>
  <text x="114" y="662.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C9DCE7" xml:space="preserve">let</text>
  <text x="88" y="692.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">2</text>
  <text x="114" y="692.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    SelectColumns  = Table.SelectColumns(PromoteHeaders, {"Date", "Amount"}),</text>
  <text x="88" y="722.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">3</text>
  <text x="114" y="722.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    Source         = Excel.Workbook(File.Contents("Sales.xlsx")),</text>
  <text x="88" y="752.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">4</text>
  <text x="114" y="752.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    PromoteHeaders = Table.PromoteHeaders(Navigation),</text>
  <text x="88" y="782.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">5</text>
  <text x="114" y="782.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    Navigation     = Source{[Item="Sales"]}[Data]</text>
  <text x="88" y="812.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">6</text>
  <text x="114" y="812.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C9DCE7" xml:space="preserve">in</text>
  <text x="88" y="842.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#70706F" text-anchor="end">7</text>
  <text x="114" y="842.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F6F6F6" xml:space="preserve">    SelectColumns</text>
  <rect x="760" y="630" width="380" height="234" fill="#FFFFFF"/>
  <rect x="760" y="630" width="4" height="234" fill="#F39454"/>
  <circle cx="794" cy="664" r="12" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M788 664 l4 4 l7 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="818" y="670" font-size="16" font-weight="700" fill="#141421">Same result</text>
  <text x="818" y="692" font-size="13" fill="#141421">M follows the references, not the line order.</text>
  <circle cx="794" cy="730" r="12" fill="#F6F6F6" stroke="#141421" stroke-width="2"/><path d="M789.5 725.5 l9 9 m0 -9 l-9 9" stroke="#141421" stroke-width="2.5"/>
  <text x="818" y="736" font-size="16" font-weight="700" fill="#141421">But avoid it</text>
  <text x="818" y="758" font-size="13" fill="#141421">Hard to read, and Applied Steps may no</text>
  <text x="818" y="776" font-size="13" fill="#141421">longer show the steps correctly.</text>
  <line x1="780" y1="802" x2="1120" y2="802" stroke="#D7D8D8"/>
  <text x="780" y="828" font-size="13" fill="#141421"><tspan font-weight="700">Lazy evaluation:</tspan> a step that is never</text>
  <text x="780" y="846" font-size="13" fill="#141421">referenced, is never calculated.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="894" x2="1140" y2="894" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="930" font-size="20" fill="#141421">M reads <tspan font-weight="700">bottom-up</tspan>, from the result back to the source; <tspan font-weight="700">write it top-down.</tspan></text>
  <text x="1140" y="929" font-size="14" fill="#70706F" text-anchor="end">let … in</text>
</svg>
