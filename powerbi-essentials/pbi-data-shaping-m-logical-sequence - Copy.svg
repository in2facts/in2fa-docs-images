<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head-mango" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="810" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Power Query · M language</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="318" lengthAdjust="spacing">Logical sequence</text>
  <rect x="386" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">M starts at the bottom, at the expression after "in", and works its way up through the steps it needs.</text>

  <!-- ==================== Evaluation, bottom-up ==================== -->
  <text x="60" y="190" font-size="13" font-weight="700" fill="#70706F">Query: Result</text>
  <rect x="60" y="200" width="480" height="240" fill="#141421"/>
  <rect x="60" y="200" width="44" height="240" fill="#1E1E2E"/>
  <text x="90" y="240.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">1</text>
  <text x="120" y="240.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#C9DCE7" xml:space="preserve">let</text>
  <text x="90" y="276.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">2</text>
  <text x="120" y="276.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    A = 10,</text>
  <text x="524" y="276.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F39454" text-anchor="end">= 10</text>
  <text x="90" y="312.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">3</text>
  <text x="120" y="312.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    B = A * 2,</text>
  <text x="524" y="312.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F39454" text-anchor="end">= 20</text>
  <text x="90" y="348.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">4</text>
  <text x="120" y="348.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    C = B + 30</text>
  <text x="524" y="348.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F39454" text-anchor="end">= 50</text>
  <text x="90" y="384.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">5</text>
  <text x="120" y="384.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#C9DCE7" xml:space="preserve">in</text>
  <text x="90" y="420.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">6</text>
  <text x="120" y="420.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    C</text>
  <text x="524" y="420.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F39454" text-anchor="end">→ 50</text>
  <circle cx="162.1" cy="414.0" r="11" fill="none" stroke="#F39454" stroke-width="2"/>
  <circle cx="162.1" cy="342.0" r="11" fill="none" stroke="#F39454" stroke-width="2"/>
  <circle cx="199.5" cy="342.0" r="11" fill="none" stroke="#C9DCE7" stroke-width="2"/>
  <circle cx="162.1" cy="306.0" r="11" fill="none" stroke="#C9DCE7" stroke-width="2"/>
  <circle cx="199.5" cy="306.0" r="11" fill="none" stroke="#F6F6F6" stroke-width="2"/>
  <circle cx="162.1" cy="270.0" r="11" fill="none" stroke="#F6F6F6" stroke-width="2"/>
  <line x1="162.1" y1="401.0" x2="162.1" y2="357.0" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <line x1="190.1" y1="333.0" x2="172.9" y2="316.4" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <line x1="190.1" y1="297.0" x2="172.9" y2="280.4" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-mango)"/>
  <circle cx="122.07500000000002" cy="414.0" r="12" fill="#F39454"/><text x="122.07500000000002" y="419.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <circle cx="122.07500000000002" cy="342.0" r="12" fill="#F39454"/><text x="122.07500000000002" y="347.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <circle cx="122.07500000000002" cy="306.0" r="12" fill="#F39454"/><text x="122.07500000000002" y="311.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <circle cx="122.07500000000002" cy="270.0" r="12" fill="#F39454"/><text x="122.07500000000002" y="275.0" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>

  <!-- Applied steps -->
  <rect x="590" y="200" width="270" height="40" fill="#141421"/>
  <text x="606" y="226" font-size="14" font-weight="700" fill="#F6F6F6" letter-spacing="1">APPLIED STEPS</text>
  <rect x="590" y="240" width="270" height="114" fill="#FFFFFF"/>
  <text x="614" y="265" font-size="16" fill="#141421">A</text>
  <text x="614" y="303" font-size="16" fill="#141421">B</text>
  <rect x="590" y="316" width="270" height="38" fill="#C9DCE7"/><rect x="590" y="316" width="5" height="38" fill="#F39454"/>
  <text x="614" y="341" font-size="16" font-weight="700" fill="#141421">C</text>
  <text x="590" y="378" font-size="13" fill="#70706F">The selected last step is the</text>
  <text x="590" y="396" font-size="13" fill="#70706F">result of the query: C = 50.</text>

  <!-- Evaluation order -->
  <text x="900" y="190" font-size="13" font-weight="700" fill="#70706F">Evaluation order</text>
  <circle cx="912" cy="222" r="12" fill="#F39454"/><text x="912" y="227" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="932" y="227" font-size="15" font-weight="700" fill="#141421">Start at <tspan font-family="Consolas, 'Courier New', monospace">in</tspan></text>
  <text x="932" y="247" font-size="13" fill="#141421">the query returns C</text>
  <circle cx="912" cy="280" r="12" fill="#F39454"/><text x="912" y="285" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="932" y="285" font-size="15" font-weight="700" fill="#141421" font-family="Consolas, 'Courier New', monospace">C = B + 30</text>
  <text x="932" y="305" font-size="13" fill="#141421">so M first needs B</text>
  <circle cx="912" cy="338" r="12" fill="#F39454"/><text x="912" y="343" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="932" y="343" font-size="15" font-weight="700" fill="#141421" font-family="Consolas, 'Courier New', monospace">B = A * 2</text>
  <text x="932" y="363" font-size="13" fill="#141421">so M first needs A</text>
  <circle cx="912" cy="396" r="12" fill="#F39454"/><text x="912" y="401" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="932" y="401" font-size="15" font-weight="700" fill="#141421" font-family="Consolas, 'Courier New', monospace">A = 10</text>
  <text x="932" y="421" font-size="13" fill="#141421">then back down: B = 20, C = 50</text>

  <!-- ==================== Same steps, other order ==================== -->
  <text x="60" y="502" font-size="13" font-weight="700" fill="#70706F">Same steps, different order</text>
  <rect x="60" y="512" width="480" height="216" fill="#141421"/>
  <rect x="60" y="512" width="44" height="216" fill="#1E1E2E"/>
  <text x="90" y="550.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">1</text>
  <text x="120" y="550.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#C9DCE7" xml:space="preserve">let</text>
  <text x="90" y="582.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">2</text>
  <text x="120" y="582.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    C = B + 30,</text>
  <text x="90" y="614.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">3</text>
  <text x="120" y="614.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    A = 10,</text>
  <text x="90" y="646.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">4</text>
  <text x="120" y="646.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    B = A * 2</text>
  <text x="90" y="678.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">5</text>
  <text x="120" y="678.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#C9DCE7" xml:space="preserve">in</text>
  <text x="90" y="710.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#70706F" text-anchor="end">6</text>
  <text x="120" y="710.0" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#F6F6F6" xml:space="preserve">    C</text>
  <text x="524" y="710.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#F39454" text-anchor="end">→ 50</text>
  <rect x="590" y="512" width="550" height="216" fill="#FFFFFF"/>
  <rect x="590" y="512" width="4" height="216" fill="#F39454"/>
  <circle cx="624" cy="546" r="12" fill="#F6F6F6" stroke="#F39454" stroke-width="2"/><path d="M618 546 l4 4 l7 -8" fill="none" stroke="#F39454" stroke-width="2.5"/>
  <text x="648" y="552" font-size="16" font-weight="700" fill="#141421">Still returns 50</text>
  <text x="648" y="574" font-size="13" fill="#141421">M follows the references, not the order of the lines.</text>
  <circle cx="624" cy="614" r="12" fill="#F6F6F6" stroke="#141421" stroke-width="2"/><path d="M619.5 609.5 l9 9 m0 -9 l-9 9" stroke="#141421" stroke-width="2.5"/>
  <text x="648" y="620" font-size="16" font-weight="700" fill="#141421">But avoid it</text>
  <text x="648" y="642" font-size="13" fill="#141421">The code becomes hard to read, and Applied Steps may no</text>
  <text x="648" y="660" font-size="13" fill="#141421">longer show the steps and their documentation.</text>
  <line x1="610" y1="682" x2="1120" y2="682" stroke="#D7D8D8"/>
  <text x="610" y="708" font-size="13" fill="#70706F"><tspan font-weight="700" fill="#141421">Lazy evaluation:</tspan> a step that is never referenced, is never calculated.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="752" x2="1140" y2="752" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="788" font-size="20" fill="#141421">M reads <tspan font-weight="700">bottom-up</tspan>, from the result back to the source; <tspan font-weight="700">write it top-down.</tspan></text>
  <text x="1140" y="787" font-size="14" fill="#70706F" text-anchor="end">let … in</text>
</svg>
