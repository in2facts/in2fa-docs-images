<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="770" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Power Query</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="188" lengthAdjust="spacing">Data types</text>
  <rect x="256" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">The data type decides how a value is stored, compared, summed and loaded into the semantic model.</text>

  <!-- ==================== Cell values ==================== -->
  <text x="60" y="192" font-size="13" font-weight="700" fill="#70706F">What a cell can contain</text>
  <rect x="60" y="204" width="130" height="34" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="72" y="227" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#141421" text-anchor="start">East</text>
  <text x="204" y="226" font-size="14" fill="#141421">text</text>
  <rect x="60" y="246" width="130" height="34" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="178" y="269" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#141421" text-anchor="end">5</text>
  <text x="204" y="268" font-size="14" fill="#141421">number</text>
  <rect x="60" y="288" width="130" height="34" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="204" y="310" font-size="14" fill="#141421">text: empty string ""</text>
  <rect x="60" y="330" width="130" height="34" fill="#FFFFFF" stroke="#D7D8D8"/>
  <text x="178" y="353" font-family="Consolas, 'Courier New', monospace" font-size="15" font-style="italic" fill="#70706F" text-anchor="end">null</text>
  <text x="204" y="352" font-size="14" fill="#141421">nothing: no value at all</text>
  <text x="60" y="390" font-size="12" fill="#70706F">Text aligns left, numbers align right,</text>
  <text x="60" y="406" font-size="12" fill="#70706F">null is shown in italics.</text>

  <!-- ==================== Precision ==================== -->
  <rect x="60" y="432" width="310" height="160" fill="#FFFFFF"/>
  <rect x="60" y="432" width="4" height="160" fill="#F39454"/>
  <text x="80" y="460" font-size="16" font-weight="700" fill="#141421">Decimal vs fixed decimal</text>
  <text x="80" y="488" font-size="13" fill="#70706F"><tspan font-weight="700" fill="#141421">1.2 Decimal Number</tspan> · floating point</text>
  <text x="80" y="510" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421" xml:space="preserve">0.1 + 0.2 = 0.30000000000000004</text>
  <text x="80" y="540" font-size="13" fill="#70706F"><tspan font-weight="700" fill="#141421">$ Fixed decimal number</tspan> · 4 decimals</text>
  <text x="80" y="562" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421" xml:space="preserve">0.1 + 0.2 = 0.3</text>
  <text x="80" y="580" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421" xml:space="preserve">1.23456   → 1.2346</text>
  <rect x="60" y="608" width="310" height="54" fill="#141421"/>
  <text x="80" y="631" font-size="14" font-weight="700" fill="#F6F6F6"><tspan fill="#F39454" font-size="17">$</tspan> is a data type, not a currency</text>
  <text x="80" y="650" font-size="12" fill="#D7D8D8">Fixed precision of 4 decimals, for any unit of measure.</text>

  <!-- ==================== Data types ==================== -->
  <rect x="400" y="186" width="740" height="34" fill="#141421"/>
  <text x="458" y="208" font-size="13" font-weight="700" fill="#F6F6F6">Data type</text>
  <text x="672" y="208" font-size="13" font-weight="700" fill="#F6F6F6">M type</text>
  <text x="892" y="208" font-size="13" font-weight="700" fill="#F6F6F6">Example</text>
  <rect x="400" y="220" width="740" height="26" fill="#C9DCE7"/>
  <text x="412" y="238" font-size="12" font-weight="700" fill="#141421" letter-spacing="0.5">NUMBERS</text>
  <rect x="400" y="246" width="740" height="120" fill="#FFFFFF"/>
  <text x="423" y="266" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1.2</text>
  <text x="458" y="266" font-size="14" fill="#141421">Decimal Number</text>
  <text x="672" y="266" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type number</text>
  <text x="892" y="266" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">3.14159</text>
  <rect x="400" y="276" width="740" height="30" fill="#F39454" fill-opacity="0.18" stroke="#F39454" stroke-width="1.5"/>
  <text x="423" y="296" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">$</text>
  <text x="458" y="296" font-size="14" font-weight="700" fill="#141421">Fixed decimal number</text>
  <text x="672" y="296" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F39454" font-weight="700">Currency.Type</text>
  <text x="892" y="296" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">12.3457</text>
  <line x1="400" y1="306" x2="1140" y2="306" stroke="#D7D8D8"/>
  <text x="423" y="326" font-size="13" font-weight="700" fill="#141421" text-anchor="middle">1<tspan font-size="9" dy="-5">2</tspan><tspan dy="5">3</tspan></text>
  <text x="458" y="326" font-size="14" fill="#141421">Whole Number</text>
  <text x="672" y="326" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">Int64.Type</text>
  <text x="892" y="326" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">42</text>
  <line x1="400" y1="336" x2="1140" y2="336" stroke="#D7D8D8"/>
  <text x="423" y="356" font-size="16" font-weight="700" fill="#141421" text-anchor="middle">%</text>
  <text x="458" y="356" font-size="14" fill="#141421">Percentage</text>
  <text x="672" y="356" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">Percentage.Type</text>
  <text x="892" y="356" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">0.25 → 25%</text>
  <rect x="400" y="366" width="740" height="26" fill="#C9DCE7"/>
  <text x="412" y="384" font-size="12" font-weight="700" fill="#141421" letter-spacing="0.5">DATE &amp; TIME</text>
  <rect x="400" y="392" width="740" height="150" fill="#FFFFFF"/>
  <rect x="411" y="398" width="18" height="16" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><rect x="411" y="398" width="18" height="5" fill="#F39454"/><path d="M415 407 h3 M420 407 h3 M415 410.5 h3 M420 410.5 h3" stroke="#141421" stroke-width="1.6"/>
  <circle cx="429" cy="412" r="6" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><path d="M429 409 V412 H432" fill="none" stroke="#F39454" stroke-width="1.6"/>
  <text x="458" y="412" font-size="14" fill="#141421">Date/Time</text>
  <text x="672" y="412" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type datetime</text>
  <text x="892" y="412" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">2024-03-15 14:30</text>
  <line x1="400" y1="422" x2="1140" y2="422" stroke="#D7D8D8"/>
  <rect x="414" y="429" width="18" height="16" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><rect x="414" y="429" width="18" height="5" fill="#F39454"/><path d="M418 438 h3 M423 438 h3 M418 441.5 h3 M423 441.5 h3" stroke="#141421" stroke-width="1.6"/>
  <text x="458" y="442" font-size="14" fill="#141421">Date</text>
  <text x="672" y="442" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type date</text>
  <text x="892" y="442" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">2024-03-15</text>
  <line x1="400" y1="452" x2="1140" y2="452" stroke="#D7D8D8"/>
  <circle cx="423" cy="467" r="8" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><path d="M423 462 V467 H428" fill="none" stroke="#F39454" stroke-width="1.6"/>
  <text x="458" y="472" font-size="14" fill="#141421">Time</text>
  <text x="672" y="472" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type time</text>
  <text x="892" y="472" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">14:30:00</text>
  <line x1="400" y1="482" x2="1140" y2="482" stroke="#D7D8D8"/>
  <circle cx="421" cy="497" r="9" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><ellipse cx="421" cy="497" rx="3.8" ry="9" fill="none" stroke="#141421" stroke-width="1.1"/><line x1="412" y1="497" x2="430" y2="497" stroke="#141421" stroke-width="1.1"/>
  <circle cx="430" cy="502" r="5.5" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><path d="M430 499.5 V502 H432.5" fill="none" stroke="#F39454" stroke-width="1.6"/>
  <text x="458" y="502" font-size="14" fill="#141421">Date/Time/Timezone</text>
  <text x="672" y="502" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type datetimezone</text>
  <text x="892" y="502" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">2024-03-15 14:30 +01:00</text>
  <line x1="400" y1="512" x2="1140" y2="512" stroke="#D7D8D8"/>
  <circle cx="423" cy="528" r="8" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><rect x="420.5" y="516" width="5" height="3" fill="#141421"/><line x1="423" y1="528" x2="427" y2="524" stroke="#F39454" stroke-width="1.6"/>
  <text x="458" y="532" font-size="14" fill="#141421">Duration</text>
  <text x="672" y="532" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type duration</text>
  <text x="892" y="532" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">2.04:30:00 (d.hh:mm:ss)</text>
  <rect x="400" y="542" width="740" height="26" fill="#C9DCE7"/>
  <text x="412" y="560" font-size="12" font-weight="700" fill="#141421" letter-spacing="0.5">OTHER</text>
  <rect x="400" y="568" width="740" height="90" fill="#FFFFFF"/>
  <text x="423" y="589" font-size="12" font-weight="700" fill="#141421" text-anchor="middle">A<tspan font-size="9" dy="-5">B</tspan><tspan dy="5">C</tspan></text>
  <text x="458" y="588" font-size="14" fill="#141421">Text</text>
  <text x="672" y="588" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type text</text>
  <text x="892" y="588" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">"East"</text>
  <line x1="400" y1="598" x2="1140" y2="598" stroke="#D7D8D8"/>
  <path d="M413 606 l7 7 m0 -7 l-7 7" stroke="#141421" stroke-width="2"/><path d="M420 617 l4 4 l9 -10" fill="none" stroke="#F39454" stroke-width="2.2"/>
  <text x="458" y="618" font-size="14" fill="#141421">True/False</text>
  <text x="672" y="618" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type logical</text>
  <text x="892" y="618" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">true</text>
  <line x1="400" y1="628" x2="1140" y2="628" stroke="#D7D8D8"/>
  <rect x="414" y="634" width="17" height="19" fill="#FFFFFF" stroke="#141421" stroke-width="1.4"/><path d="M417 640 h11 M417 644 h11 M417 648 h7" stroke="#141421" stroke-width="1.4"/>
  <text x="458" y="648" font-size="14" fill="#141421">Binary</text>
  <text x="672" y="648" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#141421">type binary</text>
  <text x="892" y="648" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#70706F" xml:space="preserve">file contents</text>
  <text x="400" y="680" font-size="12" fill="#70706F">Set the type in Power Query with Transform › Data Type, or in M with <tspan font-family="Consolas, 'Courier New', monospace">Table.TransformColumnTypes</tspan>.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="706" x2="1140" y2="706" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="742" font-size="20" fill="#141421">Choose every data type deliberately: <tspan font-weight="700">it decides how values behave.</tspan></text>
  <text x="1140" y="741" font-size="14" fill="#70706F" text-anchor="end">$ = Currency.Type, 4 decimals</text>
</svg>
