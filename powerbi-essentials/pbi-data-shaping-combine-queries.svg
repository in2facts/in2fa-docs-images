  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="300" lengthAdjust="spacing">Combine queries</text>
  <rect x="368" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Merge adds columns next to each other, Append adds rows underneath. "as New" keeps the originals intact.</text>

