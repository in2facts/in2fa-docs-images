<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#141421"/>
    </marker>
    <marker id="head-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F39454"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Extract</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="360" lengthAdjust="spacing">Extraction explained</text>
  <rect x="428" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A connection is the door between your workbook and the outside world: it asks for the data, it never changes it.</text>

  <!-- ==================== Outside world ==================== -->
  <rect x="60" y="190" width="280" height="370" fill="none" stroke="#70706F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="60" y="190" width="280" height="38" fill="#D7D8D8"/>
  <text x="76" y="215" font-size="16" font-weight="700" fill="#141421">Outside world</text>

  <!-- Excel file -->
  <path d="M90 244 h24 l12 12 v34 h-36 z" fill="#FFFFFF" stroke="#141421" stroke-width="2" stroke-linejoin="round"/><path d="M114 244 v12 h12" fill="none" stroke="#141421" stroke-width="2" stroke-linejoin="round"/><rect x="84" y="268" width="36" height="14" fill="#F39454"/><text x="102" y="279" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">XLSX</text>
  <text x="146" y="273" font-size="15" fill="#141421">Excel workbook</text>
  <!-- CSV file -->
  <path d="M90 306 h24 l12 12 v34 h-36 z" fill="#FFFFFF" stroke="#141421" stroke-width="2" stroke-linejoin="round"/><path d="M114 306 v12 h12" fill="none" stroke="#141421" stroke-width="2" stroke-linejoin="round"/><rect x="84" y="330" width="36" height="14" fill="#F39454"/><text x="102" y="341" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">CSV</text>
  <text x="146" y="335" font-size="15" fill="#141421">Text / CSV file</text>
  <!-- Folder -->
  <path d="M88 376 h14 l5 5 h21 v30 h-40 z" fill="#E3B866" stroke="#141421" stroke-width="2" stroke-linejoin="round"/>
  <text x="146" y="397" font-size="15" fill="#141421">Folder of files</text>
  <!-- Database -->
  <path d="M90 438 v30 a18 7 0 0 0 36 0 v-30" fill="#FFFFFF" stroke="#141421" stroke-width="2"/><ellipse cx="108" cy="438" rx="18" ry="7" fill="#C9DCE7" stroke="#141421" stroke-width="2"/>
  <text x="146" y="459" font-size="15" fill="#141421">SQL database</text>
  <!-- Web -->
  <circle cx="108" cy="516" r="18" fill="#FFFFFF" stroke="#141421" stroke-width="2"/><ellipse cx="108" cy="516" rx="8" ry="18" fill="none" stroke="#141421" stroke-width="1.5"/><line x1="90" y1="516" x2="126" y2="516" stroke="#141421" stroke-width="1.5"/>
  <text x="146" y="521" font-size="15" fill="#141421">Web page</text>

  <!-- arrows: outside world ↔ connection -->
  <line x1="416" y1="292" x2="348" y2="292" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-orange)"/>
  <line x1="346" y1="322" x2="414" y2="322" stroke="#141421" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- ==================== The connection ==================== -->
  <rect x="420" y="190" width="360" height="370" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="420" y="190" width="360" height="38" fill="#141421"/>
  <text x="436" y="215" font-size="16" font-weight="700" fill="#F6F6F6">The connection</text>

  <!-- plug -->
  <line x1="590" y1="246" x2="590" y2="260" stroke="#141421" stroke-width="4" stroke-linecap="round"/>
  <line x1="610" y1="246" x2="610" y2="260" stroke="#141421" stroke-width="4" stroke-linecap="round"/>
  <rect x="576" y="258" width="48" height="34" rx="8" fill="#F39454" stroke="#141421" stroke-width="2"/>
  <path d="M600 292 v8 c0 14 -30 6 -30 20" fill="none" stroke="#141421" stroke-width="3" stroke-linecap="round"/>

  <rect x="497" y="330" width="206" height="28" rx="14" fill="#F6F6F6" stroke="#D7D8D8"/>
  <text x="600" y="349" font-size="14" font-style="italic" fill="#70706F" text-anchor="middle">cnn<tspan fill="#A9AAAA"> | </tspan>xlsx<tspan fill="#A9AAAA"> | </tspan>dimensions</text>
  <text x="600" y="382" font-size="13" fill="#70706F" text-anchor="middle">One per source, named after its type and source.</text>

  <line x1="420" y1="404" x2="780" y2="404" stroke="#D7D8D8"/>
  <!-- what it does -->
  <line x1="470" y1="434" x2="444" y2="434" stroke="#F39454" stroke-width="2.5" marker-end="url(#head-orange)"/>
  <text x="484" y="439" font-size="15" fill="#141421"><tspan font-weight="700">Asks</tspan> the source a question (query)</text>
  <line x1="444" y1="476" x2="470" y2="476" stroke="#141421" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="484" y="481" font-size="15" fill="#141421"><tspan font-weight="700">Brings</tspan> a copy of the data inside</text>
  <rect x="446" y="514" width="20" height="15" rx="2" fill="#141421"/><path d="M450 514 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#141421" stroke-width="2"/>
  <text x="484" y="526" font-size="15" fill="#141421"><tspan font-weight="700">Read only:</tspan> the source never changes</text>

  <!-- arrow: connection → workbook -->
  <line x1="784" y1="322" x2="854" y2="322" stroke="#141421" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- ==================== Your workbook ==================== -->
  <rect x="860" y="190" width="280" height="370" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="860" y="190" width="280" height="38" fill="#141421"/>
  <text x="876" y="215" font-size="16" font-weight="700" fill="#F6F6F6">Your workbook</text>

  <!-- workbook grid -->
  <rect x="970" y="244" width="60" height="48" fill="#FFFFFF" stroke="#141421" stroke-width="2"/><rect x="970" y="244" width="60" height="11" fill="#70706F"/>
  <line x1="970" y1="267" x2="1030" y2="267" stroke="#141421" stroke-width="1.5"/><line x1="970" y1="279" x2="1030" y2="279" stroke="#141421" stroke-width="1.5"/>
  <line x1="990" y1="255" x2="990" y2="292" stroke="#141421" stroke-width="1.5"/><line x1="1010" y1="255" x2="1010" y2="292" stroke="#141421" stroke-width="1.5"/>

  <!-- fan out -->
  <text x="880" y="331" font-size="13" font-style="italic" fill="#70706F">cnn<tspan fill="#A9AAAA"> | </tspan>xlsx<tspan fill="#A9AAAA"> | </tspan>dimensions</text>
  <path d="M890 338 v76 M890 362 h14 M890 388 h14 M890 414 h14" fill="none" stroke="#F39454" stroke-width="2"/>
  <text x="910" y="367" font-size="13" font-style="italic" fill="#70706F">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>geography</text>
  <text x="910" y="393" font-size="13" font-style="italic" fill="#70706F">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>manufacturer</text>
  <text x="910" y="419" font-size="13" font-style="italic" fill="#70706F">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>product</text>

  <line x1="860" y1="450" x2="1140" y2="450" stroke="#D7D8D8"/>
  <text x="876" y="480" font-size="14" fill="#141421">Like a traffic officer, the connection</text>
  <text x="876" y="500" font-size="14" fill="#141421">passes the data on to the staging</text>
  <text x="876" y="520" font-size="14" fill="#141421">queries that shape it further.</text>

  <!-- ==================== Three things to remember ==================== -->
  <rect x="60" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="86" cy="615" r="12" fill="#F39454"/><text x="86" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="108" y="620" font-size="16" font-weight="700" fill="#141421">Ask</text>
  <text x="108" y="643" font-size="13" fill="#70706F">The connection asks the source for its data.</text>

  <rect x="430" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="456" cy="615" r="12" fill="#F39454"/><text x="456" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="478" y="620" font-size="16" font-weight="700" fill="#141421">Read only</text>
  <text x="478" y="643" font-size="13" fill="#70706F">The original source is never changed.</text>

  <rect x="800" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="826" cy="615" r="12" fill="#F39454"/><text x="826" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="848" y="620" font-size="16" font-weight="700" fill="#141421">Refresh</text>
  <text x="848" y="643" font-size="13" fill="#70706F">Click Refresh to ask again for the latest data.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="686" x2="1140" y2="686" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="720" font-size="16" fill="#141421"><tspan font-weight="700">In daily life:</tspan> you phone a shop and ask for its price list. They send you a copy, and your call never changes the shop.</text>
</svg>
