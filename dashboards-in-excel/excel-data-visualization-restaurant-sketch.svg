  <text x="1024" y="506" font-size="15" fill="#141421" text-anchor="end">WHERE I WANT IT»</text>
  <circle cx="884" cy="168" r="17" fill="#FFE94D" stroke="#141421" stroke-width="2.5"/>
  <text x="884" y="176" font-size="20" fill="#141421" text-anchor="middle">3</text>
  <rect x="910" y="154" width="104" height="28" fill="#FFE94D" transform="rotate(-1 962.0 168)"/>
  <text x="962.0" y="176" font-size="23" fill="#141421" text-anchor="middle">DESIGN</text>
  <text x="265" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Drag fields to rows and values:</text>
  <text x="265" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">the register prints the summary.</text>
  <text x="676" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Charts turn numbers into pictures.</text>
  <text x="676" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Click a slicer and every chart follows.</text>
  <text x="1000" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Put any number in any cell,</text>
  <text x="1000" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">like chalk on the board.</text>

  <!-- ==================== Key message ==================== -->
  <rect x="56" y="666" width="80" height="26" fill="#FFE94D" transform="rotate(-1 96.0 679)"/>
  <text x="64" y="687" font-size="21" fill="#141421">EXCEL</text>
  <text x="150" y="686" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#141421">PivotTables ask, charts show, and Cube Formulas let you design the board.</text>
