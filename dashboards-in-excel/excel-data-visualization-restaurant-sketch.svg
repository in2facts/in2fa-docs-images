<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'Segoe Print', 'Bradley Hand', 'Marker Felt', 'Comic Sans MS', cursive">
  <defs>
    <!-- hand-drawn wobble for the line art (text stays crisp) -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="tip" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L12 7 L1 13" fill="none" stroke="#141421" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- ==================== Title ==================== -->
  <rect x="56" y="50" width="744" height="30" fill="#FFE94D" transform="rotate(-0.6 428.0 65)"/>
  <text x="64" y="76" font-size="30" fill="#141421" letter-spacing="1">DATA VISUALIZATION IN THE RESTAURANT</text>
  <text x="64" y="112" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#70706F">The manager's board turns the cash register's answers into pictures everyone understands.</text>

