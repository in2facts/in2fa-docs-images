  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="252" lengthAdjust="spacing">Queries pane</text>
  <rect x="320" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">Every query is a question asked to an external data source: the pane shows how many questions you have created.</text>

