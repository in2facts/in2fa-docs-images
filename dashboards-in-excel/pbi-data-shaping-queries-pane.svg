  <!-- ==================== Callouts ==================== -->
  <line x1="466" y1="200" x2="500" y2="200" stroke="#F39454" stroke-width="2"/>
  <circle cx="520" cy="200" r="12" fill="#F39454"/><text x="520" y="205" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="544" y="206" font-size="18" font-weight="700" fill="#141421">Queries [16] <tspan font-size="15" font-weight="400" fill="#70706F">· questions asked to external data sources</tspan></text>
  <rect x="544" y="236" width="596" height="58" fill="#FFFFFF" stroke="#D7D8D8" stroke-width="1"/>
  <rect x="544" y="236" width="4" height="58" fill="#F39454"/>
  <text x="562" y="260" font-size="14" font-weight="700" fill="#141421">Good to know</text>
  <text x="562" y="281" font-size="14" fill="#70706F">The number between brackets counts what sits directly inside: [5] are folders, [16] are queries.</text>
  <path d="M466 231 h10 v306 h-10" fill="none" stroke="#F39454" stroke-width="2"/>
  <line x1="476" y1="414" x2="500" y2="414" stroke="#F39454" stroke-width="2"/>
  <circle cx="520" cy="414" r="12" fill="#F39454"/><text x="520" y="419" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="544" y="420" font-size="18" font-weight="700" fill="#141421">Not Loaded [5]</text>
  <text x="544" y="446" font-size="15" fill="#70706F">Helper queries that only prepare the data:</text>
  <text x="544" y="466" font-size="15" fill="#70706F">connections, functions, parameters, samples and stagings.</text>
  <text x="544" y="486" font-size="15" fill="#70706F">Shown in <tspan font-style="italic">italics</tspan>: connection only, not loaded into the model.</text>
  <path d="M466 543 h10 v150 h-10" fill="none" stroke="#F39454" stroke-width="2"/>
  <line x1="476" y1="618" x2="500" y2="618" stroke="#F39454" stroke-width="2"/>
  <circle cx="520" cy="618" r="12" fill="#F39454"/><text x="520" y="623" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="544" y="624" font-size="18" font-weight="700" fill="#141421">Dimensions [3] · Facts [1]</text>
  <text x="544" y="650" font-size="15" fill="#70706F">The business tables that are loaded into the data model.</text>

  <!-- ==================== Tally ==================== -->
  <line x1="60" y1="732" x2="1140" y2="732" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="776" font-size="17" fill="#141421"><tspan font-weight="700">3</tspan> connections <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">1</tspan> function <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">1</tspan> parameter <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">1</tspan> sample <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">6</tspan> stagings <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">3</tspan> dimensions <tspan fill="#F39454" font-weight="700">+</tspan> <tspan font-weight="700">1</tspan> fact <tspan fill="#F39454" font-weight="700">=</tspan></text>
  <rect x="1010" y="754" width="130" height="32" rx="16" fill="#141421"/><text x="1075" y="776" font-size="16" font-weight="700" fill="#F6F6F6" text-anchor="middle"><tspan fill="#F39454">16</tspan> queries</text>
