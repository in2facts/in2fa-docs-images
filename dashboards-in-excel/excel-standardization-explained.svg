<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Circe, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#141421"/>
    </marker>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#141421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F6F6F6"/>

  <!-- Header -->
  <text x="60" y="56" font-size="14" font-weight="700" fill="#141421">Transform</text>
  <text x="1140" y="56" font-size="14" fill="#141421" text-anchor="end">Data shaping</text>
  <text x="60" y="112" font-size="40" font-weight="300" fill="#141421" textLength="440" lengthAdjust="spacing">Standardization explained</text>
  <rect x="508" y="106" width="22" height="6" fill="#F39454"/>
  <text x="60" y="140" font-size="16" fill="#70706F">A staging query is a recipe: a list of steps that turns messy raw data into a clean, consistent table.</text>

  <!-- ==================== RAW data ==================== -->
  <rect x="60" y="190" width="280" height="370" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="60" y="190" width="280" height="38" fill="#141421"/>
  <text x="76" y="215" font-size="16" font-weight="700" fill="#F6F6F6">RAW data <tspan font-size="13" font-weight="400" fill="#A9AAAA">· as extracted</tspan></text>

  <!-- problem cells -->
  <rect x="72" y="250" width="256" height="34" fill="#FDE5D4"/>
  <rect x="72" y="284" width="256" height="34" fill="#FDE5D4"/>
  <rect x="72" y="352" width="78" height="34" fill="#FDE5D4"/>
  <rect x="150" y="352" width="88" height="34" fill="#FDE5D4"/>
  <rect x="238" y="352" width="90" height="34" fill="#FDE5D4"/>
  <rect x="150" y="386" width="88" height="34" fill="#FDE5D4"/>
  <rect x="72" y="420" width="256" height="34" fill="#FDE5D4"/>
  <rect x="238" y="454" width="90" height="34" fill="#FDE5D4"/>
  <!-- grid -->
  <rect x="72" y="250" width="256" height="238" fill="none" stroke="#A9AAAA"/>
  <line x1="72" y1="284" x2="328" y2="284" stroke="#D7D8D8"/><line x1="72" y1="318" x2="328" y2="318" stroke="#D7D8D8"/>
  <line x1="72" y1="352" x2="328" y2="352" stroke="#D7D8D8"/><line x1="72" y1="386" x2="328" y2="386" stroke="#D7D8D8"/>
  <line x1="72" y1="420" x2="328" y2="420" stroke="#D7D8D8"/><line x1="72" y1="454" x2="328" y2="454" stroke="#D7D8D8"/>
  <line x1="150" y1="318" x2="150" y2="488" stroke="#D7D8D8"/><line x1="238" y1="318" x2="238" y2="488" stroke="#D7D8D8"/>
  <!-- values -->
  <text x="80" y="272" font-size="12" font-style="italic" fill="#70706F">Product list · export 2026</text>
  <text x="80" y="340" font-size="12" fill="#A9AAAA">Column1</text><text x="158" y="340" font-size="12" fill="#A9AAAA">Column2</text><text x="246" y="340" font-size="12" fill="#A9AAAA">Column3</text>
  <text x="80" y="374" font-size="12" fill="#141421" xml:space="preserve">  bike-01 </text><text x="158" y="374" font-size="12" fill="#141421">PRODUCT A</text><text x="246" y="374" font-size="12" fill="#141421">1.250,00</text>
  <text x="80" y="408" font-size="12" fill="#141421">bike-02</text><text x="158" y="408" font-size="12" fill="#141421">product b</text><text x="246" y="408" font-size="12" fill="#141421">980</text>
  <text x="80" y="476" font-size="12" fill="#141421">bike-03</text><text x="158" y="476" font-size="12" fill="#141421">Product C</text><text x="246" y="476" font-size="12" fill="#141421">n/a</text>

  <text x="200" y="516" font-size="13" fill="#70706F" text-anchor="middle">Junk rows, no headers, mixed case,</text>
  <text x="200" y="536" font-size="13" fill="#70706F" text-anchor="middle">extra spaces, empty rows, text numbers</text>

  <!-- arrow: raw → staging -->
  <line x1="344" y1="375" x2="414" y2="375" stroke="#141421" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- ==================== The staging query ==================== -->
  <rect x="420" y="190" width="360" height="370" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="420" y="190" width="360" height="38" fill="#141421"/>
  <text x="436" y="215" font-size="16" font-weight="700" fill="#F6F6F6">The staging query</text>

  <rect x="482" y="242" width="236" height="28" rx="14" fill="#F6F6F6" stroke="#D7D8D8"/>
  <text x="600" y="261" font-size="14" font-style="italic" fill="#70706F" text-anchor="middle">stg<tspan fill="#A9AAAA"> | </tspan>dimensions<tspan fill="#A9AAAA"> | </tspan>product</text>
  <text x="436" y="298" font-size="12" font-weight="700" fill="#70706F" letter-spacing="1">APPLIED STEPS</text>

  <rect x="436" y="308" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="321" r="8" fill="#F39454"/><text x="450" y="325" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="466" y="326" font-size="14" font-weight="700" fill="#141421">Source</text><text x="752" y="326" font-size="12" fill="#70706F" text-anchor="end">from the connection</text>
  <rect x="436" y="338" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="351" r="8" fill="#F39454"/><text x="450" y="355" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="466" y="356" font-size="14" font-weight="700" fill="#141421">Remove top rows</text><text x="752" y="356" font-size="12" fill="#70706F" text-anchor="end">drop the junk</text>
  <rect x="436" y="368" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="381" r="8" fill="#F39454"/><text x="450" y="385" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="466" y="386" font-size="14" font-weight="700" fill="#141421">Promote headers</text><text x="752" y="386" font-size="12" fill="#70706F" text-anchor="end">first row = names</text>
  <rect x="436" y="398" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="411" r="8" fill="#F39454"/><text x="450" y="415" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">4</text>
  <text x="466" y="416" font-size="14" font-weight="700" fill="#141421">Remove empty rows</text><text x="752" y="416" font-size="12" fill="#70706F" text-anchor="end">no gaps</text>
  <rect x="436" y="428" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="441" r="8" fill="#F39454"/><text x="450" y="445" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">5</text>
  <text x="466" y="446" font-size="14" font-weight="700" fill="#141421">Trim and capitalize</text><text x="752" y="446" font-size="12" fill="#70706F" text-anchor="end">clean text</text>
  <rect x="436" y="458" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="471" r="8" fill="#F39454"/><text x="450" y="475" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">6</text>
  <text x="466" y="476" font-size="14" font-weight="700" fill="#141421">Change types</text><text x="752" y="476" font-size="12" fill="#70706F" text-anchor="end">text → number</text>
  <rect x="436" y="488" width="328" height="26" fill="#F6F6F6"/><circle cx="450" cy="501" r="8" fill="#F39454"/><text x="450" y="505" font-size="10" font-weight="700" fill="#141421" text-anchor="middle">7</text>
  <text x="466" y="506" font-size="14" font-weight="700" fill="#141421">Rename columns</text><text x="752" y="506" font-size="12" fill="#70706F" text-anchor="end">business names</text>

  <text x="600" y="542" font-size="13" fill="#70706F" text-anchor="middle">Recorded once, replayed on every refresh.</text>

  <!-- arrow: staging → standardized -->
  <line x1="784" y1="375" x2="854" y2="375" stroke="#141421" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- ==================== STANDARDIZED data ==================== -->
  <rect x="860" y="190" width="280" height="370" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="860" y="190" width="280" height="38" fill="#141421"/>
  <text x="876" y="215" font-size="16" font-weight="700" fill="#F6F6F6">STANDARDIZED <tspan font-size="13" font-weight="400" fill="#A9AAAA">· clean</tspan></text>

  <rect x="872" y="250" width="256" height="136" fill="none" stroke="#A9AAAA"/>
  <rect x="872" y="250" width="256" height="34" fill="#141421"/>
  <line x1="872" y1="318" x2="1128" y2="318" stroke="#D7D8D8"/><line x1="872" y1="352" x2="1128" y2="352" stroke="#D7D8D8"/>
  <line x1="950" y1="284" x2="950" y2="386" stroke="#D7D8D8"/><line x1="1038" y1="284" x2="1038" y2="386" stroke="#D7D8D8"/>
  <text x="880" y="272" font-size="12" font-weight="700" fill="#F6F6F6"><tspan font-size="9" fill="#F39454">ABC </tspan>ID</text>
  <text x="958" y="272" font-size="12" font-weight="700" fill="#F6F6F6"><tspan font-size="9" fill="#F39454">ABC </tspan>Product</text>
  <text x="1046" y="272" font-size="12" font-weight="700" fill="#F6F6F6"><tspan font-size="9" fill="#F39454">1.2 </tspan>Price</text>
  <text x="880" y="306" font-size="12" fill="#141421">BIKE-01</text><text x="958" y="306" font-size="12" fill="#141421">Product A</text><text x="1120" y="306" font-size="12" fill="#141421" text-anchor="end">1250.00</text>
  <text x="880" y="340" font-size="12" fill="#141421">BIKE-02</text><text x="958" y="340" font-size="12" fill="#141421">Product B</text><text x="1120" y="340" font-size="12" fill="#141421" text-anchor="end">980.00</text>
  <text x="880" y="374" font-size="12" fill="#141421">BIKE-03</text><text x="958" y="374" font-size="12" fill="#141421">Product C</text><text x="1120" y="374" font-size="12" font-style="italic" fill="#A9AAAA" text-anchor="end">null</text>

  <!-- check -->
  <circle cx="1000" cy="430" r="18" fill="#F39454"/>
  <path d="M991 430 l6 6 12 -13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1000" y="476" font-size="13" fill="#70706F" text-anchor="middle">Real headers, one row per product,</text>
  <text x="1000" y="496" font-size="13" fill="#70706F" text-anchor="middle">clean text and the right data types.</text>
  <text x="1000" y="536" font-size="13" font-style="italic" fill="#70706F" text-anchor="middle">Connection only · not loaded</text>

  <!-- ==================== Three things to remember ==================== -->
  <rect x="60" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="86" cy="615" r="12" fill="#F39454"/><text x="86" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="108" y="620" font-size="16" font-weight="700" fill="#141421">Recipe</text>
  <text x="108" y="643" font-size="13" fill="#70706F">Every click is saved as a step you can review.</text>

  <rect x="430" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="456" cy="615" r="12" fill="#F39454"/><text x="456" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="478" y="620" font-size="16" font-weight="700" fill="#141421">Consistent</text>
  <text x="478" y="643" font-size="13" fill="#70706F">Same names, same types, same lay-out.</text>

  <rect x="800" y="592" width="340" height="66" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="826" cy="615" r="12" fill="#F39454"/><text x="826" y="620" font-size="14" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="848" y="620" font-size="16" font-weight="700" fill="#141421">Repeatable</text>
  <text x="848" y="643" font-size="13" fill="#70706F">New data next month? Refresh, no rework.</text>

  <!-- ==================== Key message ==================== -->
  <line x1="60" y1="686" x2="1140" y2="686" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="720" font-size="16" fill="#141421"><tspan font-weight="700">In daily life:</tspan> wash, peel and cut the vegetables. Write the steps down once, and repeat them whenever new groceries arrive.</text>
</svg>
