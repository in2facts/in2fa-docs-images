  <text x="82" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="110" y="614" font-size="18" font-weight="700" fill="#141421">Star schema <tspan font-size="15" font-weight="400" fill="#70706F">· receipts in the middle</tspan></text>
  <text x="110" y="638" font-size="13" fill="#70706F"><tspan font-weight="700" fill="#141421">Fact</tspan> = receipts, <tspan font-weight="700" fill="#141421">dimensions</tspan> = menu,</text>
  <text x="110" y="658" font-size="13" fill="#70706F">table plan and diary. 1 dish → * receipt lines.</text>
  <circle cx="457" cy="616" r="18" fill="#F39454" stroke="#141421" stroke-width="3"/>
  <text x="457" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="485" y="614" font-size="18" font-weight="700" fill="#141421">Filters flow <tspan font-size="15" font-weight="400" fill="#70706F">· from menu to receipts</tspan></text>
  <text x="485" y="638" font-size="13" fill="#70706F">Pick the desserts on the menu, and only</text>
  <text x="485" y="658" font-size="13" fill="#70706F">the dessert receipts stay on the table.</text>
  <circle cx="832" cy="616" r="18" fill="#F39454" stroke="#141421" stroke-width="3"/>
  <text x="832" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="860" y="614" font-size="18" font-weight="700" fill="#141421">Measures <tspan font-size="15" font-weight="400" fill="#70706F">· the cash register</tspan></text>
  <text x="860" y="638" font-size="13" fill="#70706F">Totals are not stored: <tspan font-weight="700" fill="#141421">DAX</tspan> calculates</text>
  <text x="860" y="658" font-size="13" fill="#70706F">them the moment you ask.</text>

  <line x1="60" y1="690" x2="1140" y2="690" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="728" font-size="16" fill="#141421"><tspan font-weight="700">Power Pivot</tspan> keeps the order book. <tspan font-weight="700">DAX</tspan> is the cash register.</text>
