  <text x="576" y="264" font-size="17" fill="#141421" text-anchor="middle">starters</text>
  <text x="576" y="302" font-size="17" fill="#141421" text-anchor="middle">mains</text>
  <text x="576" y="342" font-size="17" fill="#141421" text-anchor="middle">desserts</text>
  <text x="756" y="470" font-size="16" fill="#141421" text-anchor="middle">«ONLY THE DESSERTS»</text>
  <circle cx="538" cy="168" r="17" fill="#FFE94D" stroke="#141421" stroke-width="2.5"/>
  <text x="538" y="176" font-size="20" fill="#141421" text-anchor="middle">2</text>
  <rect x="564" y="154" width="98" height="28" fill="#FFE94D" transform="rotate(-1 613.0 168)"/>
  <text x="613.0" y="176" font-size="23" fill="#141421" text-anchor="middle">FILTER</text>
  <text x="965" y="262" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#F39454" text-anchor="middle">€ 1 250</text>
  <text x="1040" y="300" font-size="15" fill="#141421" text-anchor="start">«IN MARCH?»</text>
  <circle cx="884" cy="168" r="17" fill="#FFE94D" stroke="#141421" stroke-width="2.5"/>
  <text x="884" y="176" font-size="20" fill="#141421" text-anchor="middle">3</text>
  <rect x="910" y="154" width="150" height="28" fill="#FFE94D" transform="rotate(-1 985.0 168)"/>
  <text x="985.0" y="176" font-size="23" fill="#141421" text-anchor="middle">CALCULATE</text>
  <text x="265" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Receipts in the middle, menu, table plan</text>
  <text x="265" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">and diary around: 1 dish → * receipt lines.</text>
  <text x="676" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Pick the desserts on the menu, and only</text>
  <text x="676" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">the dessert receipts stay on the table.</text>
  <text x="1000" y="610" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">Totals are not stored: DAX</text>
  <text x="1000" y="631" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#70706F" text-anchor="middle">calculates them when you ask.</text>

  <!-- ==================== Key message ==================== -->
  <rect x="56" y="666" width="160" height="26" fill="#FFE94D" transform="rotate(-1 136.0 679)"/>
  <text x="64" y="687" font-size="21" fill="#141421">POWER PIVOT</text>
  <text x="230" y="686" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#141421">keeps the order book. DAX is the cash register.</text>
