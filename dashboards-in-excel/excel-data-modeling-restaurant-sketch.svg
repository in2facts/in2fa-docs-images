  <text x="64" y="76" font-size="30" fill="#141421" letter-spacing="1">DATA MODELING IN THE RESTAURANT</text>
  <text x="64" y="112" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#70706F">The receipts record what was sold. The menu, the table plan and the diary describe it.</text>

