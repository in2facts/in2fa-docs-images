  <rect x="99.0" y="203" width="62" height="20" fill="#FFFFFF"/>
  <text x="130" y="220" font-size="18" fill="#141421" text-anchor="middle">MENU</text>
  <rect x="325.0" y="203" width="130" height="20" fill="#FFFFFF"/>
  <text x="390" y="220" font-size="18" fill="#141421" text-anchor="middle">TABLE PLAN</text>
  <rect x="97.0" y="459" width="66" height="20" fill="#FFFFFF"/>
  <text x="130" y="476" font-size="18" fill="#141421" text-anchor="middle">DIARY</text>
  <text x="130" y="520" font-size="18" fill="#141421" text-anchor="middle">2026</text>
  <text x="318" y="406" font-size="18" fill="#141421" text-anchor="start">RECEIPTS</text>
  <text x="318" y="428" font-family="Circe, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#70706F" text-anchor="start">the fact table</text>
  <text x="188" y="300" font-size="17" font-weight="700" fill="#141421">1</text><text x="222" y="358" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421">*</text>
  <text x="314" y="300" font-size="17" font-weight="700" fill="#141421">1</text><text x="296" y="360" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421">*</text>
  <text x="188" y="494" font-size="17" font-weight="700" fill="#141421">1</text><text x="222" y="446" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141421">*</text>
  <circle cx="112" cy="168" r="17" fill="#FFE94D" stroke="#141421" stroke-width="2.5"/>
  <text x="112" y="176" font-size="20" fill="#141421" text-anchor="middle">1</text>
  <rect x="138" y="154" width="104" height="28" fill="#FFE94D" transform="rotate(-1 190.0 168)"/>
  <text x="190.0" y="176" font-size="23" fill="#141421" text-anchor="middle">RELATE</text>
