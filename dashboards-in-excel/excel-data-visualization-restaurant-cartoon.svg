  <text x="82" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">1</text>
  <text x="110" y="614" font-size="18" font-weight="700" fill="#141421">PivotTable <tspan font-size="15" font-weight="400" fill="#70706F">· ask and regroup</tspan></text>
  <text x="110" y="638" font-size="13" fill="#70706F">Drag fields to rows and values, and the</text>
  <text x="110" y="658" font-size="13" fill="#70706F">register prints the summary for you.</text>
  <circle cx="457" cy="616" r="18" fill="#F39454" stroke="#141421" stroke-width="3"/>
  <text x="457" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">2</text>
  <text x="485" y="614" font-size="18" font-weight="700" fill="#141421">PivotCharts <tspan font-size="15" font-weight="400" fill="#70706F">· see it at a glance</tspan></text>
  <text x="485" y="638" font-size="13" fill="#70706F">Charts turn the numbers into pictures.</text>
  <text x="485" y="658" font-size="13" fill="#70706F">Click a <tspan font-weight="700" fill="#141421">slicer</tspan> and every chart follows.</text>
  <circle cx="832" cy="616" r="18" fill="#F39454" stroke="#141421" stroke-width="3"/>
  <text x="832" y="623" font-size="19" font-weight="700" fill="#141421" text-anchor="middle">3</text>
  <text x="860" y="614" font-size="18" font-weight="700" fill="#141421">Cube Formulas <tspan font-size="15" font-weight="400" fill="#70706F">· your own layout</tspan></text>
  <text x="860" y="638" font-size="13" fill="#70706F">Put any number in any cell, like chalk</text>
