  <line x1="60" y1="690" x2="1140" y2="690" stroke="#D7D8D8" stroke-width="1"/>
  <text x="60" y="728" font-size="16" fill="#141421"><tspan font-weight="700">PivotTables</tspan> ask, <tspan font-weight="700">charts</tspan> show, and <tspan font-weight="700">Cube Formulas</tspan> let you design the board.</text>
